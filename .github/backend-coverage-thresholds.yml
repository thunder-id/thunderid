# Per-package thresholds for the 🛡️ Backend Integration Patch Coverage check.
#
# The check measures how much of a pull request's changed backend production Go
# was executed by the integration suite. This file decides the bar each package
# has to clear, so packages with genuinely different testability are not all held
# to one number.
#
# Resolution, per changed package. Applicable tags are the `tags` entries whose
# name is a label on the pull request.
#
#   If any tag applies, the tag layer decides on its own:
#     1. Tags that name the package win, highest value across them. Tag defaults
#        are not considered at this point.
#     2. Otherwise the highest `default` among the applicable tags applies.
#
#   The base layer is used only when no tag applies, or when the applicable tags
#   neither name the package nor set a default:
#     3. The `packages` entry below, longest matching prefix.
#     4. Otherwise `default` below.
#
# In every package map the longest matching prefix wins, so a threshold on a
# parent path is inherited by its subpackages.
#
# A package with fewer than `min_changed_lines` changed coverable lines is exempt.
# Any non-exempt package below its threshold fails the check. A package path
# listed anywhere here that does not exist also fails the check, so entries
# cannot rot unnoticed through a refactor.

# Per-package granularity shrinks denominators: without a floor, a package with
# three changed coverable lines fails a 70% bar at two of three. Calibrate this
# against real pull requests rather than treating it as settled.
min_changed_lines: 10

# Applies when nothing more specific does.
default: 70

# Applies regardless of labels, but only when the applicable tags say nothing
# about the package. A tag that sets a `default` therefore overrides these, so an
# exemption recorded here does not survive such a label.
packages:
  # The agent management provider is linked into the server binary but has no runtime consumer
  # yet: the provisioning executor gains its agent branch in a follow-up change. Linking it keeps
  # its lines reported as uncovered rather than silently dropped from the percentage, and this
  # entry stops that expected 0% from failing the check.
  # TODO: remove this entry once the provisioning executor consumes the provider.
  backend/internal/agentmgtprovider: 0
  # The static executor catalog is linked into the server binary but has no runtime consumer yet:
  # flow validation in cmd/server is still handed the live executor registry, and the catalog is
  # read only by the Control Plane build, which the integration suite does not boot. Its constants
  # are used at runtime; its accessors are covered by unit tests, including a parity test that
  # fails if the catalog drifts from the real executors.
  # TODO: remove this entry once a build the integration suite exercises reads the catalog.
  backend/internal/flow/executormeta: 0
  # The reference-writing half of the export parameterizer, and the reference syntax it writes, run
  # only when the exporter is built with export.ValueReferences. That is chosen by cmd/cpserver; the
  # integration suite boots cmd/server, which chooses export.TemplatePlaceholders, so these lines
  # cannot be reached by it. Both are covered by unit tests. The export figure is a partial bar
  # rather than 0 because the template-writing half is exercised and must stay so.
  # TODO: remove both once the integration suite exercises a Control Plane build. Tracked in #5558.
  backend/internal/system/valueref: 0
  backend/internal/system/export: 50
  # The SMTP binding's basic method runs only for a provider with credentials, which validation
  # accepts only over TLS, and the server verifies the SMTP certificate against the system roots.
  # The integration suite's mock SMTP server cannot present a trusted certificate, so these lines
  # cannot be reached by it. Both methods are covered by unit tests. The figure is a partial bar
  # rather than 0 because the method that sends no credentials is exercised and must stay so.
  backend/internal/system/outboundauth/smtpauth: 50
  # Most of the SMTP client's uncovered lines are failure paths of a live SMTP session: a refused
  # connection, a failed TLS handshake, or a server rejecting a command. Producing those needs a
  # misbehaving server rather than the integration suite's mock, and the unit tests drive each one
  # through an in-process SMTP server. The figure keeps the successful send path held to coverage.
  backend/internal/notification/client: 60
  # backend/internal/system/i18n: 0

# Thresholds grouped by pull request label. A group applies only when the pull
# request carries that label. A group may set values below `default`, which lowers
# the bar for the packages it names.
tags: {}
  # security-critical:
  #   default: 85
  #   packages:
  #     backend/internal/oauth: 90
  # data-migration:
  #   packages:
  #     backend/internal/oauth: 80
