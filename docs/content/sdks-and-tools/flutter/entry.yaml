guides:
  - id: accessing-protected-apis
    title: Accessing Protected APIs
    icon: key
    description: Use {{ProductName}} Flutter SDK access tokens to call your backend APIs
    intro: Use `ThunderIDProvider.of(context).client.getAccessToken()` to retrieve the current access token. The SDK
      automatically refreshes the token if it has expired. Pass the token as a `Bearer` credential in your HTTP requests.
    sections:
    - type: steps
      id: steps
      title: Accessing Protected APIs
      steps:
      - title: Using `http` Package
        code:
          lang: dart
          content: |2-

            Future<Map<String, dynamic>> fetchUserData(BuildContext context) async {
              final thunder = ThunderIDProvider.of(context);
              final token = await thunder.client.getAccessToken();

              final response = await http.get(
                Uri.parse('https://api.example.com/user'),
                headers: {
                  'Authorization': 'Bearer $token',
                  'Content-Type': 'application/json',
                },
              );

              if (response.statusCode == 200) {
                return jsonDecode(response.body) as Map<String, dynamic>;
              }

              throw Exception('Request failed: ${response.statusCode}');
            }
      - title: Using `dio` with an Interceptor
        description: 'Add [dio](https://pub.dev/packages/dio) to your `pubspec.yaml`:'
        code:
          lang: yaml
          content: |-
            dependencies:
              dio: ^5.4.0
      - title: Token Expiry and Refresh
        description: '`getAccessToken()` automatically refreshes the access token using the stored refresh token if
          the current token is expired. If the refresh token is also expired, it throws `IAMException` with code `IAMErrorCode.sessionExpired`.'
        code:
          lang: dart
          content: |-
            try {
              final token = await thunder.client.getAccessToken();
              // Use token...
            } on IAMException catch (e) {
              if (e.code == IAMErrorCode.sessionExpired) {
                // Session has fully expired. Sign the user out.
                await thunder.client.signOut();
                await thunder.refresh();
              }
            }
      - title: Checking Sign-In State Before Requests
        description: 'Check `thunder.isSignedIn` before making API calls in widgets to avoid unnecessary network requests:'
        code:
          lang: dart
          content: |-
            @override
            Widget build(BuildContext context) {
              final thunder = ThunderIDProvider.of(context);

              return SignedIn(
                child: FutureBuilder(
                  future: fetchUserData(context),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState == ConnectionState.waiting) {
                      return const CircularProgressIndicator();
                    }
                    if (snapshot.hasError) {
                      return Text('Error: ${snapshot.error}');
                    }
                    return Text('Hello, ${snapshot.data}');
                  },
                ),
                fallback: const AuthScreen(),
              );
            }
  - id: try-the-sample-app
    title: Try the Flutter Sample App
    icon: terminal
    description: Run the {{ProductName}} Flutter sample app to see the full authentication lifecycle end to end.
    intro: 'The SDK repository ships a sample app in [`samples/quickstart`](https://github.com/thunder-id/flutter-sdks/tree/main/samples/quickstart)
      that exercises the full authentication lifecycle end to end: sign-in, sign-up, and sign-out via the SDK''s app-native
      Flow Execution, on both iOS and Android. } />'
    sections:
    - type: steps
      id: steps
      title: Try the Flutter Sample App
      steps:
      - title: Prerequisites
        description: '- Flutter 3.16+ - A running {{ProductName}} instance - iOS 16+ or Android API 26+'
      - title: Prepare the Flutter Sample
        code:
          lang: bash
          content: |-
            cd samples/quickstart

            # 1. Copy and fill in your environment
            cp .env.example .env

            # 2. Install dependencies
            flutter pub get
      - title: Configure the Flutter Sample
        description: This sample uses app-native authentication (Flow Execution API), so only the base URL and application
          ID are required, no OAuth2 client ID or redirect URIs. | Variable | Description | |----------|-------------|
          | `THUNDERID_BASE_URL` | Base URL of your {{ProductName}} server (HTTPS) | | `THUNDERID_APP_ID` | Application
          UUID from {{ProductName}} console | | `THUNDERID_ATTESTATION_ENABLED` | `true` to send a platform attestation
          token on native flows | | `THUNDERID_CLOUD_PROJECT_NUMBER` | Google Cloud project number (Android Play Integrity)
          | `.env` is gitignored. Never commit real credentials.
      - title: Attestation via Google Play Integrity / Apple App Attest (optional)
        description: 'Set `THUNDERID_ATTESTATION_ENABLED=true` to send a platform attestation token on native sign-in/sign-up.
          The token is minted natively by the plugin, Apple App Attest on iOS, Google Play Integrity on Android. Requirements
          to test end-to-end: - **Android**: set `THUNDERID_CLOUD_PROJECT_NUMBER`, and publish the app to a Play Console
          track linked to that Cloud project (Play Integrity needs a recognized package + signature). - **iOS**: a physical
          device and the **App Attest** capability on the `Runner` target (adds the `com.apple.developer.devicecheck.appattest-environment`
          entitlement). App Attest does not work in the simulator. - **Server**: the **Team ID** and **Bundle ID** registered
          on the {{ProductName}} application''s attestation settings must match the ones the app is signed with. {{ProductName}}
          derives the expected App ID from `.` and rejects a token whose attested App ID differs. The plugin generates
          the App Attest challenge locally. {{ProductName}} does not yet bind verification to a server-issued challenge,
          so this is sufficient to exercise the flow end to end; move to a server-issued challenge once that check lands.'
      - title: Passkeys (WebAuthn)
        description: 'Passkey registration/authentication requires the server''s passkey relying party (`rp.id`) to
          be a real HTTPS domain, not `localhost`, `127.0.0.1`, or `10.0.2.2`. Each platform verifies the calling app
          is allowed to use that `rp.id` differently, and this Flutter sample packages both a native iOS runner and
          a native Android app, so both verification mechanisms apply: **iOS, Associated Domains entitlement.** `ASAuthorizationPlatformPublicKeyCredentialProvider`
          requires the app to declare a `webcredentials:` Associated Domain, backed by a hosted `apple-app-site-association`
          file. Without this, `ASAuthorizationController` fails immediately with `Error Domain=com.apple.AuthenticationServices.AuthorizationError
          Code=1004`. This sample ships `ios/Runner/Runner.entitlements` with a placeholder `webcredentials:your-thunderid-domain.example`
          entry, wired into `ios/Runner.xcodeproj` via `CODE_SIGN_ENTITLEMENTS`. To exercise passkeys end-to-end: 1.
          Replace the placeholder domain in `ios/Runner/Runner.entitlements` with the domain your {{ProductName}} server
          is actually reachable at (must serve valid HTTPS, self-signed certs and `localhost` will not work). 2. Host
          an `apple-app-site-association` file at `https:///.well-known/apple-app-site-association` declaring this app''s
          Team ID and bundle identifier (`dev.thunderid.Quickstart`) under `webcredentials.apps`. 3. Make sure the server''s
          passkey `rp.id` matches that same domain. 4. Set a `DEVELOPMENT_TEAM` and enable the **Associated Domains**
          capability for the Runner target in Xcode (Signing & Capabilities) so the entitlement is actually applied
          to the build. **Android, Digital Asset Links.** Android''s Credential Manager requires the domain to serve
          `https:///.well-known/assetlinks.json` declaring this app''s package name and signing certificate SHA-256
          fingerprint(s) under `delegate_permission/common.get_login_creds`. Without this, Credential Manager rejects
          the ceremony. This sample ships `assetlinks.json.example` with a placeholder `sha256_cert_fingerprints` entry
          for the app''s `applicationId` (`dev.thunderid.flutter_quickstart`). To exercise passkeys end-to-end: 1. Rename/copy
          `assetlinks.json.example` to `assetlinks.json` and replace `` with the SHA-256 fingerprint of the signing
          certificate for the build you''ll test with (get it via `keytool -list -v -keystore -alias ` or a Gradle `signingReport`).
          2. Host that file at `https:///.well-known/assetlinks.json` (same domain as the iOS setup above, and matching
          the server''s `rp.id`). 3. No `AndroidManifest.xml` change is required, Digital Asset Links verification is
          purely a server-hosted file requirement, no App Links intent filter needed. Exposing a local {{ProductName}}
          instance under a real, HTTPS-reachable domain (e.g. via a tunnel) is left to you, this sample only wires up
          the entitlement/template file/documentation on each platform, not the tunnel itself.'
      - title: Run
        description: 'Open the project in your IDE, or open a terminal in the project directory:'
        code:
          lang: bash
          content: |-
            # List available devices
            flutter devices

            # Launch a specific emulator
            flutter emulators --launch <emulator_id>

            # Run on a specific device
            flutter run -d <device_id>
      - title: Next Steps
        description: '- [Accessing Protected APIs](../accessing-protected-apis): Use {{ProductName}} Flutter SDK access
          tokens to call your backend APIs'

