        response_types:
          type: array
          items:
            type: string
            enum:
              - code
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        token_endpoint_auth_method:
          type: string
          enum:
            - client_secret_basic
            - client_secret_post
            - private_key_jwt
            - none
        jwks_uri:
          type: string
        jwks:
          type: object
          additionalProperties: true
        scope:
          type: string
        contacts:
          type: array
          items:
            type: string
        tos_uri:
          type: string
        policy_uri:
          type: string
        require_pushed_authorization_requests:
          type: boolean
        userinfo_signed_response_alg:
          type: string
        userinfo_encrypted_response_alg:
          type: string
        userinfo_encrypted_response_enc:
          type: string
        id_token_encrypted_response_alg:
          type: string
        id_token_encrypted_response_enc:
          type: string
      description: Language-tagged fields (e.g. `client_name#fr`) are also accepted as
        top-level properties.
    DCRRegistrationResponse:
      type: object
      required:
        - client_id
        - client_secret_expires_at
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        client_secret_expires_at:
          type: integer
          format: int64
          description: Unix timestamp when the secret expires, or 0 if it never expires.
        app_id:
          type: string
          description: Internal application ID.
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        token_endpoint_auth_method:
          type: string
        jwks_uri:
          type: string
        jwks:
          type: object
          additionalProperties: true
        scope:
          type: string
        contacts:
          type: array
          items:
            type: string
        tos_uri:
          type: string
        policy_uri:
          type: string
        require_pushed_authorization_requests:
          type: boolean
        userinfo_signed_response_alg:
          type: string
        userinfo_encrypted_response_alg:
          type: string
        userinfo_encrypted_response_enc:
          type: string
        id_token_encrypted_response_alg:
          type: string
        id_token_encrypted_response_enc:
          type: string
      description: Language-tagged variants (e.g. `client_name#fr`) are included as
        top-level properties in the response.
    BackchannelAuthRequest:
      type: object
      required:
        - scope
      properties:
        client_id:
          type: string
          description: The client identifier (required when not using HTTP Basic auth).
        client_secret:
          type: string
          description: The client secret (required for confidential clients not using HTTP
            Basic auth).
        login_hint:
          type: string
          description: A hint identifying the user to authenticate. Exactly one of
            login_hint or id_token_hint must be provided.
        id_token_hint:
          type: string
          description: A previously issued ID token identifying the user. Exactly one of
            login_hint or id_token_hint must be provided.
        login_hint_token:
          type: string
          description: Defined by the CIBA specification but not supported; requests
            including it are rejected with invalid_request. Use login_hint
            instead.
        scope:
          type: string
          description: Space-separated scopes. Must include `openid`.
        resource:
          type: string
          description: Resource indicator per RFC 8707 (absolute URI, no fragment). Only
            one value is supported; requests with multiple resource values,
            including duplicates, are rejected with invalid_target. When omitted
            from a permission-bearing request, the configured
            defaultResourceServer is used; a permission-bearing request with no
            resource and no default is rejected with invalid_target. OIDC-only
            requests use the client_id audience.
        binding_message:
          type: string
          description: Optional human-readable message shown to the user in the
            authentication notification (CIBA Core 1.0 §7.1). Limited to 256
            printable characters.
        requested_expiry:
          type: integer
          description: Requested lifetime of the auth_req_id in seconds. Clamped to the
            server maximum.
        acr_values:
          type: string
          description: Space-separated list of requested Authentication Context Class
            Reference values.
    BackchannelAuthResponse:
      type: object
      required:
        - auth_req_id
        - expires_in
        - interval
      properties:
        auth_req_id:
          type: string
          description: Unique identifier for the backchannel authentication request,
            polled at the token endpoint.
        expires_in:
          type: integer
          description: Lifetime of the auth_req_id in seconds.
        interval:
          type: integer
          description: Minimum number of seconds the client must wait between token
            endpoint polls.
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: OAuth 2.0 error code.
          example: invalid_request
        error_description:
          type: string
          description: Human-readable error description.
