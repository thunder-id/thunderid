name: 'Setup Samples Environment'
description: 'Sets up complete environment for sample app building and packaging'
author: 'The ThunderID Authors'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: 'lts/*'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: 'latest'
  download-certificates:
    description: 'Whether to download shared certificates'
    required: false
    default: 'true'
  certificate-artifact-name:
    description: 'Name of certificate artifact to download'
    required: false
    default: 'ssl-certificates'

runs:
  using: composite
  steps:
    - name: ⚙️ Set up Go Environment
      uses: ./.github/actions/setup-go

    - name: 📦 Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false
        version: ${{ inputs.pnpm-version }}

    - name: ⚙️ Set up Node.js Environment
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: 'pnpm'
        dependency-path: '.'

    - name: 📦 Install pnpm workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 📥 Download Shared Certificates
      if: inputs.download-certificates == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.certificate-artifact-name }}
        path: target/out/.cert/
