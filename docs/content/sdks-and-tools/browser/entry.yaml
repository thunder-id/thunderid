guides:
  - id: accessing-protected-apis
    title: Accessing Protected APIs
    icon: key
    description: Make authenticated HTTP requests from a browser application using the Browser SDK's built-in HTTP client.
    intro: When building applications with {{ProductName}}, you often need to call protected APIs that require authentication.
      The Browser SDK provides built-in methods for making authenticated HTTP requests with automatic token management.
    sections:
    - type: steps
      id: steps
      title: Accessing Protected APIs
      steps:
      - title: Using the Built-In HTTP Client
        description: 'The `ThunderIDBrowserClient` provides `httpRequest()` and `httpRequestAll()` methods that automatically
          attach the access token as a Bearer token to outgoing requests. ### Basic API Request'
        code:
          file: src/api.js
          lang: js
          content: |2-

            async function fetchUserData(userId) {
              const response = await auth.httpRequest({
                url: `https://localhost:8090/users/${userId}`,
                method: 'GET',
                headers: {
                  Accept: 'application/json',
                },
              })

              return response.data
            }
      - title: Using the Access Token Directly
        description: 'If you prefer to use your own HTTP client (e.g., `fetch` or `axios`), retrieve the access token
          and attach it manually:'
        code:
          file: src/api.js
          lang: js
          content: |2-

            async function fetchWithToken(url) {
              const token = await auth.getAccessToken()

              const response = await fetch(url, {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/json',
                },
              })

              return response.json()
            }
      - title: Error Handling
        description: 'Handle API errors by catching exceptions from `httpRequest()`:'
        code:
          file: src/api.js
          lang: js
          content: |2-

            async function fetchData() {
              try {
                const response = await auth.httpRequest({
                  url: 'https://localhost:8090/users',
                  method: 'GET',
                })

                return response.data
              } catch (error) {
                if (error.response?.status === 401) {
                  // Token expired or invalid — trigger re-authentication
                  await auth.signIn()
                } else {
                  console.error('API error:', error.message)
                }
              }
            }

