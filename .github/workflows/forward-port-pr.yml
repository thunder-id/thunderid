# This workflow forward-ports merged PRs from patch branches (<major>.<minor>.x) to
# newer patch branches and main.
# When a PR is opened on a patch branch, a comment is posted with a checkbox for
# each newer patch branch and main, all checked by default. Unchecking a branch
# skips the forward-port to it. Once the PR is merged, a forward-port runs for each
# checked branch. It fetches the original PR's commits from the GitHub API and
# cherry-picks them (in order) onto a new branch off the target branch, preserving
# the original commit history. It then opens a PR. The original PR author and
# everyone who approved the original PR are added as assignees on the new PR and
# @mentioned in a comment. If any cherry-pick has conflicts, the branch is still
# pushed with the conflict markers committed and the PR is opened as a draft for
# manual resolution. The forward-port branch is deleted once its PR is closed.

name: Forward-port Merged PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
    branches:
      # Patch branches whose merged PRs get forward-ported.
      - "[0-9]+.[0-9]+.x"
      # Target of forward-port PRs, listed only to delete their branches once closed.
      - "main"

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  MAIN_BRANCH: "main"
  RELEASE_GIT_USER_NAME: "thunderid-automation-bot"
  RELEASE_GIT_USER_EMAIL: "thunderid-bot@thunderid.dev"

jobs:
  resolve-targets:
    name: ☑️ Resolve Forward-port Targets
    # Forward-port PRs are skipped so a port to a newer patch branch isn't ported again.
    if: >-
      endsWith(github.event.pull_request.base.ref, '.x') &&
      !startsWith(github.event.pull_request.head.ref, 'forward-port/') &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    # Runs for the same PR are queued, so a run always sees the comment posted by the previous one.
    concurrency:
      group: forward-port-targets-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: ☑️ Post or Read Forward-port Targets
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Identifies the targets comment. Only a comment posted by this workflow is read,
            // so a reply carrying the marker can't add targets.
            const MARKER = '<!-- thunderid-forward-port-targets -->';
            const COMMENT_AUTHOR = 'github-actions[bot]';
            const PATCH_BRANCH = /^(\d+)\.(\d+)\.x$/;
            const CHECKED_TARGET = /^\s*[-*]\s+\[[xX]\]\s+`([^`]+)`/;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const mainBranch = process.env.MAIN_BRANCH;

            core.setOutput('targets', '[]');

            const version = branch => {
              const match = PATCH_BRANCH.exec(branch);
              return match ? [Number(match[1]), Number(match[2])] : null;
            };
            const compare = (a, b) => a[0] - b[0] || a[1] - b[1];

            const sourceVersion = version(pr.base.ref);
            if (!sourceVersion) {
              core.info(`${pr.base.ref} is not a patch branch. Skipping.`);
              return;
            }

            // Every patch branch newer than the source, oldest first, then main.
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: 'heads/'
            });
            const newerBranches = refs
              .map(ref => ref.ref.replace(/^refs\/heads\//, ''))
              .filter(branch => {
                const branchVersion = version(branch);
                return branchVersion && compare(branchVersion, sourceVersion) > 0;
              })
              .sort((a, b) => compare(version(a), version(b)));
            const allowedTargets = [...newerBranches, mainBranch];

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });
            const targetsComment = comments.find(comment =>
              comment.user?.login === COMMENT_AUTHOR && (comment.body || '').includes(MARKER));

            if (context.payload.action !== 'closed') {
              if (targetsComment) {
                core.info('Forward-port targets comment already exists.');
                return;
              }

              const body = [
                MARKER,
                '### 🚚 Forward-port',
                '',
                'Once this PR is merged, it will be forward-ported to the checked branches.',
                'Uncheck a branch if the change isn\'t needed there (Ex: the fix is a backport from that branch).',
                '',
                ...allowedTargets.map(branch => `- [x] \`${branch}\``)
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body
              });
              core.info(`Posted forward-port targets: ${allowedTargets.join(', ')}`);
              return;
            }

            if (!targetsComment) {
              core.info('No forward-port targets comment found. Skipping.');
              return;
            }

            const checked = targetsComment.body
              .split('\n')
              .map(line => CHECKED_TARGET.exec(line))
              .filter(Boolean)
              .map(match => match[1]);

            const ignored = checked.filter(branch => !allowedTargets.includes(branch));
            if (ignored.length > 0) {
              core.warning(`Ignoring checked branches that aren't valid targets: ${ignored.join(', ')}`);
            }

            const targets = allowedTargets.filter(branch => checked.includes(branch));
            core.info(`Forward-port targets: ${targets.join(', ') || '(none)'}`);
            core.setOutput('targets', JSON.stringify(targets));

  forward-port:
    name: 🚚 Forward-port to ${{ matrix.target }}
    needs: resolve-targets
    if: needs.resolve-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-targets.outputs.targets) }}
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - name: 📥 Checkout Target Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.THUNDER_AUTOMATION_BOT }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: 🔧 Configure Git
        run: |
          git config --local user.name "${{ env.RELEASE_GIT_USER_NAME }}"
          git config --local user.email "${{ env.RELEASE_GIT_USER_EMAIL }}"

      - name: 🍒 Cherry-pick Original PR Commits
        id: cherry_pick
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.THUNDER_AUTOMATION_BOT }}
        run: |
          set -euo pipefail

          FORWARD_BRANCH="forward-port/${SOURCE_BRANCH}/pr-${PR_NUMBER}-to-${TARGET_BRANCH}"

          # Fetch the target branch and the original PR's head ref so every commit
          # from the PR is reachable locally (even after squash/rebase merges).
          git fetch origin "${TARGET_BRANCH}"
          git fetch origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head"

          git checkout -B "${FORWARD_BRANCH}" "origin/${TARGET_BRANCH}"

          # Get the ordered list of commit SHAs from the original PR (oldest first).
          mapfile -t COMMIT_SHAS < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --paginate --jq '.[].sha')

          if [ "${#COMMIT_SHAS[@]}" -eq 0 ]; then
            echo "❌ No commits found on PR #${PR_NUMBER}. Aborting."
            exit 1
          fi

          echo "🍒 Cherry-picking ${#COMMIT_SHAS[@]} commit(s) from PR #${PR_NUMBER}"

          conflict=false
          set +e
          for sha in "${COMMIT_SHAS[@]}"; do
            echo "→ ${sha}"
            # If the commit is a merge commit (>=2 parents), replay it against
            # its first (mainline) parent so cherry-pick doesn't reject it.
            parent_count=$(git rev-list --parents -n 1 "${sha}" | awk '{print NF-1}')
            cherry_pick_args=(--allow-empty --keep-redundant-commits)
            if [ "${parent_count}" -ge 2 ]; then
              cherry_pick_args+=(-m 1)
            fi
            git cherry-pick "${cherry_pick_args[@]}" "${sha}"
            rc=$?
            if [ "${rc}" -ne 0 ]; then
              conflict=true
              echo "❗ Conflict on ${sha}. Committing conflict markers and continuing."
              git add -A
              # Complete the cherry-pick with the original commit message. If there
              # is nothing to commit after staging, skip this commit instead.
              if git diff --cached --quiet; then
                git cherry-pick --skip
              else
                GIT_EDITOR=true git cherry-pick --continue
              fi
            fi
          done
          set -e

          git push --force origin "${FORWARD_BRANCH}"

          {
            echo "forward_branch=${FORWARD_BRANCH}"
            echo "source_branch=${SOURCE_BRANCH}"
            echo "pr_number=${PR_NUMBER}"
            echo "commit_count=${#COMMIT_SHAS[@]}"
            echo "conflict=${conflict}"
          } >> "$GITHUB_OUTPUT"

      - name: 👥 Collect Assignees
        id: collect_assignees
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTOMATION_BOT_LOGIN: ${{ env.RELEASE_GIT_USER_NAME }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const botLogin = process.env.AUTOMATION_BOT_LOGIN;

            const author = context.payload.pull_request.user.login;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const approvers = new Map();
            for (const review of reviews) {
              if (review.state === 'APPROVED' && review.user && review.user.login) {
                approvers.set(review.user.login, true);
              }
            }

            const logins = [author, ...approvers.keys()]
              .filter(Boolean)
              .filter((login, index, arr) => arr.indexOf(login) === index)
              .filter(login => !login.endsWith('[bot]'))
              .filter(login => login !== botLogin);

            core.info(`Assignees: ${logins.join(', ') || '(none)'}`);
            core.setOutput('logins', JSON.stringify(logins));

      - name: 🔔 Create Forward-port PR
        id: create_pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORWARD_BRANCH: ${{ steps.cherry_pick.outputs.forward_branch }}
          SOURCE_BRANCH: ${{ steps.cherry_pick.outputs.source_branch }}
          PR_NUMBER: ${{ steps.cherry_pick.outputs.pr_number }}
          COMMIT_COUNT: ${{ steps.cherry_pick.outputs.commit_count }}
          CONFLICT: ${{ steps.cherry_pick.outputs.conflict }}
          ORIGINAL_TITLE: ${{ github.event.pull_request.title }}
          ORIGINAL_URL: ${{ github.event.pull_request.html_url }}
          ORIGINAL_BODY: ${{ github.event.pull_request.body }}
        with:
          github-token: ${{ secrets.THUNDER_AUTOMATION_BOT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = process.env.TARGET_BRANCH;
            const forwardBranch = process.env.FORWARD_BRANCH;
            const sourceBranch = process.env.SOURCE_BRANCH;
            const prNumber = process.env.PR_NUMBER;
            const commitCount = process.env.COMMIT_COUNT;
            const hasConflict = process.env.CONFLICT === 'true';
            const originalTitle = process.env.ORIGINAL_TITLE;
            const originalUrl = process.env.ORIGINAL_URL;
            const originalBody = process.env.ORIGINAL_BODY || '';
            const title = `[${sourceBranch} → ${base}] ${originalTitle} (#${prNumber})`;

            const bodyLines = [
              `Automated forward-port of #${prNumber} from \`${sourceBranch}\` to \`${base}\`.`,
              '',
              `Original PR: ${originalUrl}`,
              `Commits cherry-picked: ${commitCount}`,
              `Source branch: \`${sourceBranch}\``,
              `Target branch: \`${base}\``
            ];

            if (originalBody.trim().length > 0) {
              bodyLines.push('', '---', '', originalBody);
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: forwardBranch,
              base,
              body: bodyLines.join('\n'),
              draft: hasConflict
            });

            core.info(`Created forward-port PR: #${created.data.number} ${created.data.html_url}`);
            core.setOutput('pr_number', created.data.number);
            core.setOutput('pr_url', created.data.html_url);

      - name: 🏷️ Assign Users and Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEW_PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          ORIGINAL_PR_NUMBER: ${{ steps.cherry_pick.outputs.pr_number }}
          ASSIGNEES_JSON: ${{ steps.collect_assignees.outputs.logins }}
          CONFLICT: ${{ steps.cherry_pick.outputs.conflict }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const newPrNumber = Number(process.env.NEW_PR_NUMBER);
            const originalPrNumber = Number(process.env.ORIGINAL_PR_NUMBER);
            const assignees = JSON.parse(process.env.ASSIGNEES_JSON || '[]');
            const hasConflict = process.env.CONFLICT === 'true';

            if (assignees.length === 0) {
              core.info('No assignees to add.');
              return;
            }

            // GitHub caps assignees at 10 per issue; anything beyond is silently
            // dropped. The full list is still used for @mentions below.
            const assigneesToAdd = assignees.slice(0, 10);
            try {
              const response = await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: newPrNumber,
                assignees: assigneesToAdd
              });
              const assigned = (response.data.assignees || []).map(a => a.login);
              core.info(`Assigned: ${assigned.join(', ') || '(none)'}`);
            } catch (err) {
              core.warning(`Failed to add assignees: ${err.message}`);
            }

            const mentions = assignees.map(login => `@${login}`).join(' ');
            const bodyLines = [
              `👋 ${mentions} please review this forward-port of #${originalPrNumber} to \`${process.env.TARGET_BRANCH}\`.`
            ];

            if (hasConflict) {
              bodyLines.push(
                '',
                '> **⚠️ Merge conflicts detected during cherry-pick.**',
                '> The branch was pushed with unresolved conflict markers committed.',
                '> Please resolve the conflicts on this branch and mark the PR ready for review before merging.'
              );
            }

            const body = bodyLines.join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: newPrNumber,
              body
            });

  delete-forward-port-branch:
    name: 🧹 Delete Forward-port Branch
    if: >-
      github.event.action == 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'forward-port/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Delete Branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const headRef = process.env.HEAD_REF;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${headRef}`
              });
              core.info(`Deleted branch ${headRef}.`);
            } catch (err) {
              // The branch may already be deleted, either by hand or by a re-run.
              if (err.status === 404 || err.status === 422) {
                core.info(`Branch ${headRef} doesn't exist. Nothing to delete.`);
                return;
              }
              throw err;
            }
