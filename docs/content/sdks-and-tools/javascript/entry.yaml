    - group: Functions
      kind: function
      name: Branding
      description: The branding functions fetch the visual configuration (colors, logos, typography) defined in the
        {{ProductName}} Console and apply it to your UI.
      example: |-
        import { getBrandingPreference } from '@thunderid/javascript'

        const branding = await getBrandingPreference({
          baseUrl: 'https://localhost:8090',
          locale: 'en-US',
        })

        console.log(branding.preference?.theme?.LIGHT?.colors?.primary?.main)
    - group: Functions
      kind: function
      name: Configuration
      description: The `initialize()` method accepts a configuration object (`AuthClientConfig`) that controls how the
        SDK connects to your {{ProductName}} instance and manages authentication.
      example: |-
        import ThunderIDJavaScriptClient from '@thunderid/javascript'

        const client = new ThunderIDJavaScriptClient()

        await client.initialize({
          clientId: '<your-client-id>',
          baseUrl: 'https://localhost:8090',
        })
    - group: Functions
      kind: function
      name: Errors
      description: The SDK uses a hierarchy of typed error classes. Catch specific classes to handle different failure
        modes distinctly.
      example: |-
        Error
        └── ThunderIDError
            ├── ThunderIDAPIError
            └── ThunderIDRuntimeError
        ThunderIDAuthException  (separate — thrown by auth flow internals)
    - group: Functions
      kind: function
      name: HttpClient
      description: '`HttpClient` is an abstract base class that provides handler lifecycle management, request/response
        callbacks, and parallel request utilities. Platform SDKs extend it to add token attachment, retry logic, or
        custom transport implementations.'
      example: |-
        import { HttpClient } from '@thunderid/javascript'
        import type { HttpRequestConfig, HttpResponse } from '@thunderid/javascript'

        class FetchHttpClient extends HttpClient {
          async transport<T>(config: HttpRequestConfig): Promise<HttpResponse<T>> {
            const response = await fetch(config.url, {
              method: config.method,
              headers: config.headers as HeadersInit,
              body: config.data ? JSON.stringify(config.data) : undefined,
            })

            return {
              data: await response.json(),
              status: response.status,
              statusText: response.statusText,
              headers: Object.fromEntries(response.headers.entries()),
            }
          }
        }
    - group: Functions
      kind: function
      name: Internationalization
      description: The SDK ships with built-in translation bundles for {{ProductName}} UI components and provides utilities
        for loading, extending, and normalizing translations.
      example: |-
        import { getDefaultI18nBundles } from '@thunderid/javascript'

        const bundles = getDefaultI18nBundles()
        console.log(bundles['en-US'])   // I18nBundle
        console.log(bundles['fr-FR'])   // I18nBundle
    - group: Functions
      kind: function
      name: StorageManager
      description: '`StorageManager` is the typed storage layer used internally by `ThunderIDJavaScriptClient`. It namespaces
        all stored data under a storage key derived from the client ID and instance ID. The storage layer provides typed
        methods for each data category: configuration, OIDC provider metadata, session data, and temporary (PKCE/state)
        data. Use it directly only when building platform adapters that need fine-grained control over stored auth state.'
      example: |-
        import StorageManager from '@thunderid/javascript'

        const storage = new StorageManager<Config>('instance_0-my-client-id', store)
    - group: Functions
      kind: function
      name: Theme
      description: The theme system provides a structured way to define colors, typography, spacing, and other visual
        properties used by {{ProductName}} UI components. Use `createTheme()` to build a theme from scratch or apply
        partial overrides on top of the defaults.
      example: |-
        import { createTheme } from '@thunderid/javascript'

        const theme = createTheme({
          colors: {
            primary: {
              main: '#6200ea',
              contrastText: '#ffffff',
            },
          },
        })

        // Apply CSS variables to the document root
        Object.entries(theme.cssVariables).forEach(([key, value]) => {
          document.documentElement.style.setProperty(key, value)
        })
    - group: Functions
      kind: function
      name: ThunderIDJavaScriptClient
      description: '`ThunderIDJavaScriptClient` is the base class that all platform-specific {{ProductName}} clients
        extend. It provides OIDC discovery, PKCE, token exchange, session management, JWT decoding, and agent/OBO authentication.
        Instantiate it directly only when writing a custom platform adapter: for browser use, prefer `@thunderid/browser`;
        for React, use `@thunderid/react`.'
      example: const client = new ThunderIDJavaScriptClient(storage?, cryptoUtils?)
    - group: Functions
      kind: function
      name: Utilities
      description: The SDK exports a set of utility functions used internally by platform SDKs and available to custom
        integrations.
      example: |-
        import { arrayBufferToBase64url } from '@thunderid/javascript'

        const encoded = arrayBufferToBase64url(buffer)
    - group: User
      kind: export
      name: User Profile
      description: These functions read and update user profile data from the OIDC userinfo endpoint.
      example: |-
        import { getUserInfo } from '@thunderid/javascript'

        const user = await getUserInfo({
          url: 'https://localhost:8090/oauth2/userinfo',
          headers: {
            Authorization: `Bearer ${accessToken}`,
          },
        })

        console.log(user.email, user.displayName)
    - group: User
      kind: export
      name: User Schemas
      description: The SDK provides helpers for working with user schema data.
      example: |-
        import { flattenUserSchema } from '@thunderid/javascript'

        const flat = flattenUserSchema(schemas, userProfile)
