                contacts: ["admin@myapp.example.com", "support@myapp.example.com"]
                metadata:
                  env: "production"
                  team: "platform"
                assertion:
                  validityPeriod: 3600
                  userAttributes: ["email", "username"]
                allowedUserTypes: ["employee", "customer"]
                passkeyAllowedOrigins: ["https://myapp.example.com", "https://myapp-staging.example.com"]
                loginConsent:
                  enabled: true
                  validityPeriod: 3600
                inboundAuthConfig:
                  - type: "oauth2"
                    config:
                      clientId: "myapp_client_id"
                      clientSecret: "myapp_updated_secret"
                      redirectUris:
                        - "https://myapp.example.com/callback"
