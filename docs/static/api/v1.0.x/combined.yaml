              type: string
              description: Resident key requirement
              enum:
                - discouraged
                - preferred
                - required
              example: preferred
            userVerification:
              type: string
              description: User verification requirement
              enum:
                - required
                - preferred
                - discouraged
              example: preferred
        attestation:
          type: string
          description: Attestation conveyance preference
          enum:
            - none
            - indirect
            - direct
            - enterprise
          example: none
      required:
        - userId
        - relyingPartyId
    PasskeyRegistrationStartResponse:
      type: object
      properties:
        publicKeyCredentialCreationOptions:
          type: object
          description: PublicKeyCredentialCreationOptions as per WebAuthn standard
          properties:
            challenge:
              type: string
              description: Base64url-encoded challenge for the registration ceremony
              example: Z29yZG9uQGV4YW1wbGUuY29tMjAyMS0wMy0xMlQxMjo0NTowMFo
            rp:
              type: object
              description: Relying Party information
              properties:
                id:
                  type: string
                  description: Relying Party identifier
                  example: example.com
                name:
                  type: string
                  description: Human-readable Relying Party name
                  example: Example Corp
              required:
                - id
                - name
            user:
              type: object
              description: User information for the credential
              properties:
                id:
                  type: string
                  description: Base64url-encoded user handle
                  example: NTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDAw
                name:
                  type: string
                  description: User's username or email
                  example: gordon@example.com
                displayName:
                  type: string
                  description: User's display name
                  example: Gordon Freeman
              required:
                - id
                - name
                - displayName
            pubKeyCredParams:
              type: array
              description: Supported public key algorithms
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Type of credential
                    example: public-key
                  alg:
                    type: integer
                    description: COSE algorithm identifier
                    example: -7
              example:
                - type: public-key
                  alg: -7
                - type: public-key
                  alg: -257
            timeout:
              type: integer
              description: Time in milliseconds that the user has to respond to the prompt
              example: 60000
            excludeCredentials:
              type: array
              description: Credentials to exclude from registration
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Type of the credential
                    example: public-key
                  id:
                    type: string
                    description: Base64url-encoded credential ID
                    example: AdC-ff_z-Z1gY2s6e_2A-g
                  transports:
                    type: array
                    description: Hints about where the credential might be stored
                    items:
                      type: string
                      enum:
                        - usb
                        - nfc
                        - ble
                        - internal
                        - hybrid
            authenticatorSelection:
              type: object
              description: Criteria for authenticator selection
              properties:
                authenticatorAttachment:
                  type: string
                  enum:
                    - platform
                    - cross-platform
                  example: platform
                requireResidentKey:
                  type: boolean
                  example: false
                residentKey:
                  type: string
                  enum:
                    - discouraged
                    - preferred
                    - required
                  example: preferred
                userVerification:
                  type: string
                  enum:
                    - required
                    - preferred
                    - discouraged
                  example: preferred
            attestation:
              type: string
              description: Attestation conveyance preference
              enum:
                - none
                - indirect
                - direct
                - enterprise
              example: none
          required:
            - challenge
            - rp
            - user
            - pubKeyCredParams
          example:
            challenge: Z29yZG9uQGV4YW1wbGUuY29tMjAyMS0wMy0xMlQxMjo0NTowMFo
            rp:
              id: example.com
              name: Example Corp
            user:
              id: NTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDAw
              name: gordon@example.com
              displayName: Gordon Freeman
            pubKeyCredParams:
              - type: public-key
                alg: -7
              - type: public-key
                alg: -257
            timeout: 60000
            authenticatorSelection:
              authenticatorAttachment: platform
              requireResidentKey: false
              residentKey: preferred
              userVerification: preferred
            attestation: none
        sessionToken:
          type: string
          description: Session token for the WebAuthn registration ceremony
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - publicKeyCredentialCreationOptions
        - sessionToken
    PasskeyRegistrationFinishRequest:
      type: object
      properties:
        publicKeyCredential:
          type: object
          description: PublicKeyCredential as per the WebAuthn standard
          properties:
            id:
              type: string
              description: Base64url-encoded credential ID
              example: AdC-ff_z-Z1gY2s6e_2A-g
            rawId:
              type: string
              description: Base64url-encoded raw credential ID
              example: AdC-ff_z-Z1gY2s6e_2A-g
            type:
              type: string
              description: Type of the credential
              example: public-key
            response:
              type: object
              description: AuthenticatorAttestationResponse
              properties:
                clientDataJSON:
                  type: string
                  description: Base64url-encoded client data JSON
                  example: eyJjaGFsbGVuZ2UiOiJaMm95Wm05eVpHOXVRR1Y0WVcxd2JHVXVZMjl0TWpBeU1TMHdNeTB4TWxSeE1qbzBOVG93TUZvIiwidHlwZSI6IndlYmF1dGhuLmNyZWF0ZSIsIm9yaWdpbiI6Imh0dHBzOi8vZXhhbXBsZS5jb20ifQ
                attestationObject:
                  type: string
                  description: Base64url-encoded attestation object
                  example: o2NmbXRkbm9uZWdhdHRTdG10oGhhdXRoRGF0YVkBZ0mWDeWIDoxodDQXD2R2YFuP5K65ooYyx5lc87qDHZdjRQAAAAA
              required:
                - clientDataJSON
                - attestationObject
              example:
                clientDataJSON: eyJjaGFsbGVuZ2UiOiJaMm95Wm05eVpHOXVRR1Y0WVcxd2JHVXVZMjl0TWpBeU1TMHdNeTB4TWxSeE1qbzBOVG93TUZvIiwidHlwZSI6IndlYmF1dGhuLmNyZWF0ZSIsIm9yaWdpbiI6Imh0dHBzOi8vZXhhbXBsZS5jb20ifQ
                attestationObject: o2NmbXRkbm9uZWdhdHRTdG10oGhhdXRoRGF0YVkBZ0mWDeWIDoxodDQXD2R2YFuP5K65ooYyx5lc87qDHZdjRQAAAAA
          required:
            - id
            - type
            - response
          example:
            id: AdC-ff_z-Z1gY2s6e_2A-g
            rawId: AdC-ff_z-Z1gY2s6e_2A-g
            type: public-key
            response:
              clientDataJSON: eyJjaGFsbGVuZ2UiOiJaMm95Wm05eVpHOXVRR1Y0WVcxd2JHVXVZMjl0TWpBeU1TMHdNeTB4TWxSeE1qbzBOVG93TUZvIiwidHlwZSI6IndlYmF1dGhuLmNyZWF0ZSIsIm9yaWdpbiI6Imh0dHBzOi8vZXhhbXBsZS5jb20ifQ
              attestationObject: o2NmbXRkbm9uZWdhdHRTdG10oGhhdXRoRGF0YVkBZ0mWDeWIDoxodDQXD2R2YFuP5K65ooYyx5lc87qDHZdjRQAAAAA
        sessionToken:
          type: string
          description: Session token from the registration start response
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        skipAssertion:
          type: boolean
          description: Skip generating an assertion token in the response
          default: false
          example: false
        assertion:
          type: string
          description: Optional existing JWT assertion token to enrich with this enrollment
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - publicKeyCredential
        - sessionToken
    PasskeyRegistrationFinishResponse:
      type: object
      description: >
        Completing enrollment also authenticates the user, so the response
        returns the authenticated user and an optional assertion token (unless
        skipAssertion was set).
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the authenticated user
        type:
          type: string
          description: The type of the authenticated user
        ouId:
          type: string
          format: uuid
          description: The organization unit ID of the authenticated user
        assertion:
          type: string
          description: JWT assertion token for the authenticated user
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - id
        - type
        - ouId
    ResourceServer:
      type: object
      required:
        - id
        - name
        - identifier
        - type
        - ouId
        - delimiter
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the resource server
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          nullable: true
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute
            URI, the resource server is used in RFC 8707 resource indicator
            flows and the identifier is used as the access token audience claim
            value.
        type:
          type: string
          enum:
            - API
            - MCP
            - CUSTOM
          description: Immutable type of the resource server (metadata only). Defaults to
            CUSTOM when not provided at creation.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to
        delimiter:
          type: string
          description: Character used to separate permission hierarchy levels (immutable
            after creation)
        isReadOnly:
          type: boolean
          description: Whether the resource server is read-only (system-managed)
    CreateResourceServerRequest:
      type: object
      required:
        - name
        - ouId
        - identifier
      properties:
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute
            URI, the resource server is used in RFC 8707 resource indicator
            flows and clients can use this value in the resource parameter to
            request audience-restricted access tokens.
        type:
          type: string
          enum:
            - API
            - MCP
            - CUSTOM
          description: Optional immutable type of the resource server (metadata only).
            Defaults to CUSTOM when not provided.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to
        delimiter:
          type: string
          description: Optional delimiter character for permission hierarchy (defaults to
            ":", immutable after creation)
    UpdateResourceServerRequest:
      type: object
      required:
        - name
        - ouId
      properties:
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute
            URI, the resource server is used in RFC 8707 resource indicator
            flows.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to
    CreateResourceRequest:
      type: object
      required:
        - name
        - handle
      properties:
        name:
          type: string
          description: Display name of the resource
        handle:
          type: string
          description: Immutable and unique under resource server or parent resource.
            Identifier used for permission derivation
        description:
          type: string
          description: Optional description of the resource
        parent:
          type: string
          format: uuid
          nullable: true
          description: Parent resource ID (null for top-level resources, immutable after
            creation)
    UpdateResourceRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name of the resource (mutable)
        description:
          type: string
          description: Optional description of the resource
    CreateActionRequest:
      type: object
      required:
        - name
        - handle
      properties:
        name:
          type: string
          description: Display name of the action
        handle:
          type: string
          maxLength: 100
          description: Immutable and unique under resource server or resource. Identifier
            used for permission derivation. Maximum length is 100 characters.
        description:
          type: string
          description: Optional description of the action
        kind:
          type: string
          enum:
            - tool
            - resource
          description: >
            MCP primitive kind. Optional for all resource server types; when
            provided it must be "tool" or "resource". For type=MCP it defaults
            to "tool" when omitted. For API and CUSTOM resource servers it is
            optional and, when omitted, stays empty. Immutable after creation;
            omit on update requests (kind cannot be changed).
    UpdateActionRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name of the action
        description:
          type: string
          description: Optional description of the action
    ResourceServerListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 8
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to
            offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 5
        resourceServers:
          type: array
          items:
            $ref: "#/components/schemas/ResourceServer"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
    ResourceListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 15
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to
            offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 10
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
    ActionListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 12
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to
            offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 10
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
    Assignment:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uuid
          description: ID of the user, app, agent, or group being assigned
        type:
          type: string
          enum:
            - user
            - group
            - app
            - agent
          description: Type of entity being assigned (user, app, agent, or group)
        display:
          type: string
          readOnly: true
          description: Display name of the user or group (only included when
            include=display query parameter is used). For users, resolved from
            the schema-configured display attribute; falls back to the user ID
            if the attribute is not configured, the path does not exist, or the
            value is empty. For groups, the group name is used.
    AssignmentInput:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uuid
          description: ID of the user, app, agent, or group being assigned
        type:
          type: string
          enum:
            - user
            - group
            - app
            - agent
          description: Type of entity being assigned (user, app, agent, or group)
    ResourcePermissions:
      type: object
      required:
        - resourceServerId
        - permissions
      properties:
        resourceServerId:
          type: string
          format: uuid
          description: ID of the resource server these permissions belong to
        permissions:
          type: array
          items:
            type: string
          description: List of permission strings for this resource server
    RoleSummary:
      type: object
      required:
