        birthdate:
          type: string
        zoneinfo:
          type: string
        locale:
          type: string
        phone_number:
          type: string
        phone_number_verified:
          type: boolean
        updated_at:
          type: integer
          format: int64
      additionalProperties: true
    DCRRegistrationRequest:
      type: object
      required:
        - redirect_uris
      properties:
        ou_id:
          type: string
          description: Organization Unit ID to associate the client with.
        redirect_uris:
          type: array
          items:
            type: string
          description: Registered redirect URIs.
        grant_types:
          type: array
          items:
