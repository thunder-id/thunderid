openapi: 3.0.3

info:
  title: Connections API
  description: >-
    Configure the external services ThunderID connects to. This is a thin layer over the
    identity-provider and notification-sender services: each connection type has a strict,
    vendor-specific schema and is delegated to the underlying provider, so a configured
    connection is a real identity provider or message sender. Multiple instances per type
    are supported.
  version: "1.0"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Connections
    description: Discover available connection types and configure their instances.
  - name: Connection Metadata
    description: Describe the configurable options of each connection vendor.
  - name: Connection Sharing
    description: Record which organization units may use a connection, and resolve what one organization unit may do with it.
security:
  - OAuth2: [system]

paths:
  /connections:
    get:
      tags: [Connections]
      summary: List configured connection instances
      description: >-
        Returns a paginated list of the configured connection instances across the
        identity-provider, notification-sender, authorization PDP and HTTP endpoint connection types,
        optionally filtered by functional category. Omit the category parameter to return all instances.

        An `ouId` filter lists the connections the organization unit owns, then those shared into it, with `isOwnedByOU` telling them apart.
      parameters:
        - name: category
          in: query
          required: false
          description: Filter instances by functional category. Omit to return all instances.
          schema:
            type: string
            enum: [identity-provider, sms-provider, authorization-pdp, email-provider, http]
        - $ref: '#/components/parameters/connectionFilterQueryParam'
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: A page of the configured connection instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'
              example:
                totalResults: 3
                startIndex: 1
                count: 3
                connections:
                  - id: "a1b2c3d4-0000-0000-0000-000000000001"
                    name: "My Google"
                    ouId: "01900000-0000-7000-8000-000000000001"
                    type: "google"
                    categories: ["identity-provider"]
                    isOwnedByOU: true
                  - id: "a1b2c3d4-0000-0000-0000-000000000002"
                    name: "Corp OIDC"
                    description: "Corporate login"
                    ouId: "01900000-0000-7000-8000-000000000001"
                    type: "oidc"
                    categories: ["identity-provider"]
                    isOwnedByOU: true
                  - id: "a1b2c3d4-0000-0000-0000-000000000003"
                    name: "Twilio SMS"
                    ouId: "01900000-0000-7000-8000-000000000001"
                    type: "twilio"
                    categories: ["sms-provider"]
                    isOwnedByOU: true
                links: []
        "400":
          description: 'The category is not recognized (CON-1001), the filter is not a single `ouId eq "<id>"` expression (CON-1039), or the limit or offset is invalid.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }

  /connections/authzen-pdp:
    get:
      tags: [Connections]
      summary: List configured AuthZEN PDP connections
      responses:
        "200": { $ref: '#/components/responses/AuthZENPDPInstanceList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Connections]
      summary: Create an AuthZEN PDP connection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthZENPDPConnectionCreateRequest' }
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthZENPDPConnectionResponse' }
        "400": { $ref: '#/components/responses/AuthZENPDPBadRequest' }
        "409": { $ref: '#/components/responses/AuthZENPDPConflict' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
  /connections/authzen-pdp/{id}:
    parameters:
      - { $ref: '#/components/parameters/ConnectionID' }
    get:
      tags: [Connections]
      summary: Get an AuthZEN PDP connection
      responses:
        "200":
          description: Connection details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthZENPDPConnectionResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Connections]
      summary: Update an AuthZEN PDP connection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthZENPDPConnectionUpdateRequest' }
      responses:
        "200":
          description: Connection updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthZENPDPConnectionResponse' }
        "400": { $ref: '#/components/responses/AuthZENPDPBadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/AuthZENPDPConflict' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Connections]
      summary: Delete an AuthZEN PDP connection
      responses:
        "204": { description: Connection deleted }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/ConnectionDependencyConflict' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
  /connections/authzen-pdp/{id}/usages:
    parameters:
      - { $ref: '#/components/parameters/ConnectionID' }
    get:
      tags: [Connections]
      summary: Get AuthZEN PDP connection usages
      description: Returns the resource servers that reference this AuthZEN PDP connection.
      responses:
        "200": { $ref: '#/components/responses/ConnectionUsages' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }

  /connections/http:
    get:
      tags: [Connections]
      summary: List configured HTTP endpoint connections
      responses:
        "200": { $ref: '#/components/responses/HTTPConnectionInstanceList' }
        "400": { $ref: '#/components/responses/HTTPConnectionListBadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Connections]
      summary: Create an HTTP endpoint connection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HTTPConnectionCreateRequest' }
            example:
              name: "Risk Engine"
              ouId: "01900000-0000-7000-8000-000000000001"
              url: "https://risk.example.com/evaluate"
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPConnectionResponse' }
        "400": { $ref: '#/components/responses/HTTPConnectionBadRequest' }
        "409": { $ref: '#/components/responses/HTTPConnectionConflict' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
  /connections/http/{id}:
    parameters:
      - { $ref: '#/components/parameters/ConnectionID' }
    get:
      tags: [Connections]
      summary: Get an HTTP endpoint connection
      description: Returns the connection with every secret masked as `******`.
      responses:
        "200":
          description: Connection details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPConnectionResponse' }
        "404": { $ref: '#/components/responses/HTTPConnectionNotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Connections]
      summary: Update an HTTP endpoint connection
      description: |
        Replaces the connection. An omitted `basic` password or `bearer` token keeps its stored
        value only while the authentication `type`, its non-secret properties (such as the
        username) and the URL origin (scheme, host and port, with default ports normalized) are
        unchanged. Otherwise the credential is discarded and must be supplied again, so a
        connection cannot be pointed at another server with its stored password. Each `api_key`
        header is sent on its own: a header sent as `"******"` keeps its stored value under the
        same rule, and a header left out is removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HTTPConnectionUpdateRequest' }
      responses:
        "200":
          description: Connection updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPConnectionResponse' }
        "400": { $ref: '#/components/responses/HTTPConnectionBadRequest' }
        "404": { $ref: '#/components/responses/HTTPConnectionNotFound' }
        "409": { $ref: '#/components/responses/HTTPConnectionConflict' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Connections]
      summary: Delete an HTTP endpoint connection
      description: |
        Refused while other resources use the connection, and while its usages cannot be determined.
        Deleting a connection that does not exist succeeds.
      responses:
        "204": { description: Connection deleted }
        "400": { $ref: '#/components/responses/HTTPConnectionDeleteBadRequest' }
        "409": { $ref: '#/components/responses/HTTPConnectionDependencyConflict' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
  /connections/http/{id}/usages:
    parameters:
      - { $ref: '#/components/parameters/ConnectionID' }
    get:
      tags: [Connections]
      summary: Get HTTP endpoint connection usages
      description: Returns the resources that use this HTTP endpoint connection.
      responses:
        "200": { $ref: '#/components/responses/ConnectionUsages' }
        "404": { $ref: '#/components/responses/HTTPConnectionNotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }

