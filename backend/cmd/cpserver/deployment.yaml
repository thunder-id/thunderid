# Control Plane deployment configuration.
#
# The Control Plane is where configuration is authored and validated. It serves the management APIs
# and the administration console, and it handles no runtime traffic: no OAuth2 flows, no logins, no
# tokens. Those belong to a data plane.
#
# Sections present in cmd/server/deployment.yaml but absent here are runtime concerns this plane has
# no service for: the transient and persistent runtime datasources, passkey origins, and email.
server:
  hostname: "localhost"
  port: 8095

  security:
    # This plane issues no tokens of its own, and the management tokens it accepts come from the
    # configured issuer, so there is no revoked-token table here for a syncer to read.
    token_revocation:
      enabled: false

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

# Only the configuration and entity datasources. There are no authorization codes, sessions, consent
# records or revoked tokens on this plane, so neither runtime datasource is configured and no client
# is opened for one.
database:
  config:
    type: "sqlite"
    sqlite:
      path: "database/configdb.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  entity:
    type: "sqlite"
    sqlite:
      path: "database/entitydb.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
    preferred_key_id: "default-key"
