        all resource

        types (for example, flows that use it). Informational only — it drives
        the pre-delete

        confirmation dialog in the UI and does not gate deletion on the server.


        Each usage entry includes a `behaviorOnDelete` field describing what
        happens to the

        referencing resource if the connection is deleted:

        - `fallback`: the reference is kept as-is.

        - `cascade`: the resource is permanently deleted along with the
        connection.

        - `restrict`: the resource blocks deletion of the connection.


        When usage data is unavailable (e.g. the server has not fully
        initialised),

        `totalResults` and `summary` are `null` rather than `0`/empty. Consumers
        must treat

        `null` as "unknown" and `0` as "confirmed empty".
