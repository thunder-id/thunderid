resource_type: resource_server
id: decl-rs-4
name: Declarative Repeated Handle Resource Server
description: A declarative test resource server that repeats a resource handle under different parents
identifier: https://localhost:8090/decl-rs-4
ouId: decl-ou-1
delimiter: ":"
resources:
  - name: Team Lead
    handle: lead
    parent: "app:team:member"
  - name: App
    handle: app
  - name: Project
    handle: project
    parent: app
  - name: Project Member
    handle: member
    parent: project
    actions:
      - name: Read
        handle: read
  - name: Team
    handle: team
    parent: app
  - name: Team Member
    handle: member
    parent: "app:team"
    actions:
      - name: Write
        handle: write
