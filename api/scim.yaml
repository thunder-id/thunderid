                  version: 'W/"6c2ab918e0f3"'
        '400':
          description: Bad Request (e.g., missing PatchOp schema URN, unsupported path or operation)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid-patch-path:
                  summary: Unsupported PATCH path
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidPath"
                    detail: "The PATCH operation path is missing, unsupported, or malformed"
                invalid-patch-op:
                  summary: Unsupported PATCH op
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidValue"
                    detail: 'The "op" must be one of "add", "remove", or "replace"'
        '401':
          description: Unauthorized
        '404':
          description: Group not found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "404"
                detail: "The group with the specified id does not exist"
        '412':
          description: Precondition Failed (ETag mismatch)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "412"
                detail: "The If-Match header does not match the current version of the resource"
        '500':
          description: Internal Server Error
    delete:
      tags:
        - SCIM Provisioning
      summary: Delete Group
      description: Deletes a group by ID (RFC 7644 §3.6). Supports optimistic concurrency via `If-Match`.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the group.
          schema:
            type: string
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        - name: If-Match
          in: header
          required: false
          description: ETag value from a previous GET. If provided, the delete is rejected with 412 if the resource has changed.
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '404':
          description: Group not found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "404"
                detail: "The group with the specified id does not exist"
        '412':
          description: Precondition Failed (ETag mismatch)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "412"
                detail: "The If-Match header does not match the current version of the resource"
        '500':
          description: Internal Server Error

  /.search:
    post:
      tags:
        - SCIM Provisioning
      summary: Bulk Search (Not Implemented)
      description: Returns 501 Not Implemented per the SCIM specification. Root-level search is currently unsupported.
      responses:
        '501':
          description: Not Implemented
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "501"
                scimType: "notImplemented"
                detail: "This SCIM operation is not supported"

  /Bulk:
    post:
      tags:
        - SCIM Provisioning
      summary: Bulk Operations (Not Implemented)
      description: Returns 501 Not Implemented per the SCIM specification. Bulk operations are currently unsupported.
      responses:
        '501':
          description: Not Implemented
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "501"
                scimType: "notImplemented"
                detail: "This SCIM operation is not supported"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SupportedFeature:
      type: object
      description: A simple supported/unsupported capability flag.
      properties:
        supported:
          type: boolean

    BulkConfig:
      type: object
      description: Bulk operation capability flags.
      properties:
        supported:
          type: boolean
        maxOperations:
          type: integer
        maxPayloadSize:
          type: integer

    FilterConfig:
      type: object
      description: Filter capability flags.
      properties:
        supported:
          type: boolean
        maxResults:
          type: integer

    PaginationConfig:
      type: object
      description: Pagination capability flags (RFC 9865).
      properties:
        cursor:
          type: boolean
        index:
          type: boolean
        defaultPaginationMethod:
          type: string
          enum: [cursor, index]
        defaultPageSize:
          type: integer
        maxPageSize:
          type: integer

    AuthenticationScheme:
      type: object
      description: A supported authentication mechanism.
      properties:
        type:
          type: string
          example: "oauthbearertoken"
        name:
          type: string
          example: "OAuth Bearer Token"
        description:
          type: string
          example: "Authentication using an OAuth 2.0 Bearer Token"

    ServiceProviderConfig:
      type: object
      description: SCIM Service Provider Configuration (RFC 7643 §5)
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig"]
        patch:
          $ref: '#/components/schemas/SupportedFeature'
        bulk:
          $ref: '#/components/schemas/BulkConfig'
        filter:
          $ref: '#/components/schemas/FilterConfig'
        changePassword:
          $ref: '#/components/schemas/SupportedFeature'
        sort:
          $ref: '#/components/schemas/SupportedFeature'
        etag:
          $ref: '#/components/schemas/SupportedFeature'
        pagination:
          $ref: '#/components/schemas/PaginationConfig'
        authenticationSchemes:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationScheme'
        meta:
          $ref: '#/components/schemas/Meta'

    SchemaAttribute:
      type: object
      description: A single attribute definition within a SCIM Schema resource (RFC 7643 §7).
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, integer, decimal, boolean, complex]
        multiValued:
          type: boolean
        description:
          type: string
        required:
          type: boolean
        caseExact:
          type: boolean
        mutability:
          type: string
          enum: [readWrite, readOnly, immutable, writeOnly]
        returned:
          type: string
          enum: [always, never, default]
        uniqueness:
          type: string
          enum: [none, server, global]
        canonicalValues:
          type: array
          items:
            type: string
        subAttributes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaAttribute'

    Schema:
      type: object
      description: A single SCIM Schema resource (RFC 7643 §7).
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          description: The schema URN.
        name:
          type: string
        description:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaAttribute'
        meta:
          $ref: '#/components/schemas/Meta'

    SchemaListResponse:
      type: object
      description: SCIM ListResponse envelope for Schema resources (RFC 7644 §3.4.2)
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/Schema'

    ResourceTypeSchemaExtension:
      type: object
      description: A schema extension entry within a ResourceType resource (RFC 7643 §6).
      properties:
        schema:
          type: string
        required:
          type: boolean

    ResourceType:
      type: object
      description: A single SCIM ResourceType resource (RFC 7643 §6).
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        endpoint:
          type: string
        schema:
          type: string
          description: The primary schema URN for this resource type.
        schemaExtensions:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTypeSchemaExtension'
        meta:
          $ref: '#/components/schemas/Meta'

    ResourceTypeListResponse:
      type: object
      description: SCIM ListResponse envelope for ResourceType resources (RFC 7644 §3.4.2)
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceType'

    ErrorResponse:
      type: object
      description: SCIM Error Response (RFC 7644 §3.12). This is the standard SCIM wire error shape; ThunderID-internal error codes are never sent to SCIM clients.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:Error"]
        status:
          type: string
          description: HTTP status code as a string.
        scimType:
          type: string
          description: SCIM error type keyword (e.g., invalidSyntax, invalidValue, invalidPath, mutability, invalidFilter, uniqueness, notImplemented). Omitted for errors with no standard SCIM error type (e.g., 401, 404, 412, 500).
        detail:
          type: string
          description: Human-readable description of the error.

    UserRequest:
      type: object
      description: |
        SCIM User create/replace request body. Besides `schemas`, top-level SCIM core fields (`userName`, `name`, `emails`, `phoneNumbers`, etc.) are mapped to their ThunderID attribute equivalents. The object keyed by the ThunderID extension URN (e.g. `urn:thunderid:params:scim:schemas:employee:2.0:User`) is mapped 1:1 to ThunderID attribute names for the target user type.
      required:
        - schemas
      additionalProperties: true
      properties:
        schemas:
          type: array
          items:
            type: string
          description: Must include the SCIM Core User schema URN (when core fields are present) and exactly one ThunderID extension URN, unless the server has exactly one configured user type.
          example:
            - "urn:ietf:params:scim:schemas:core:2.0:User"
            - "urn:thunderid:params:scim:schemas:employee:2.0:User"
        userName:
          type: string
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
            middleName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
              primary:
                type: boolean
        phoneNumbers:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
              primary:
                type: boolean

    UserResponse:
      type: object
      description: |
        SCIM User resource response. Includes `id`, `schemas`, `meta`, mapped SCIM core fields at the top level, and the full set of stored ThunderID attributes (including the ones already mapped to core fields, and minus any credential fields) nested under the ThunderID extension URN key.
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        userName:
          type: string
        name:
          type: object
        emails:
          type: array
          items:
            type: object
        phoneNumbers:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: true

    UserListResponse:
      type: object
      description: SCIM ListResponse envelope for User resources (RFC 7644 §3.4.2)
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'

    GroupRequest:
      type: object
      description: SCIM Group create/replace request body
      required:
        - schemas
        - displayName
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        displayName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'

    GroupResponse:
      type: object
      description: SCIM Group resource response
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        displayName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        meta:
          $ref: '#/components/schemas/Meta'

    GroupListResponse:
      type: object
      description: SCIM ListResponse envelope for Group resources (RFC 7644 §3.4.2)
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/GroupResponse'

    GroupMember:
      type: object
      properties:
        value:
          type: string
          description: The unique ID of the member resource.
        display:
          type: string
          description: The display name of the member (read-only, set by the server).
        type:
          type: string
          enum: [User, Group]
          description: The resource type of the member.
          example: User

    PatchRequest:
      type: object
      description: SCIM PATCH request body (RFC 7644 §3.5.2)
      required:
        - schemas
        - Operations
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        Operations:
          type: array
          items:
            type: object
            required:
              - op
            properties:
              op:
                type: string
                enum: [add, remove, replace]
              path:
                type: string
                description: Attribute path to target (e.g., "members", "displayName", "members[value eq \"<id>\"]").
              value:
                description: Value for add/replace operations.

    SearchRequest:
      type: object
      description: SCIM Search request body (RFC 7644 §3.4.3)
      required:
        - schemas
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:SearchRequest"]
        filter:
          type: string
          description: SCIM filter expression using only "eq" comparisons optionally joined by "and" (e.g. 'userName eq "alice"').
        attributes:
          type: array
          items:
            type: string
          description: Attribute names to return; all other attributes are omitted. Mutually exclusive with `excludedAttributes`.
        excludedAttributes:
          type: array
          items:
            type: string
          description: Attribute names to omit from the response. Mutually exclusive with `attributes`.
        startIndex:
          type: integer
          default: 1
        count:
          type: integer
          default: 30

    Meta:
      type: object
      description: SCIM resource metadata
      properties:
        resourceType:
          type: string
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
        version:
          type: string
          description: ETag value for the resource.
