# Control Plane deployment configuration.
#
# The Control Plane is where configuration is authored, versioned, and promoted between environments.
# It serves the management APIs and the Control Plane console, and it holds no runtime traffic: no
# OAuth2 flows, no logins, no tokens. Those are the Data Plane's (see ../dpserver/deployment.yaml).
#
# It also holds no secrets at rest. A credential captured here is forwarded to the Data Plane that
# needs it, and what stays behind is a "kv:NAME" reference. That is why there is no secret_provider
# section below: nothing on this side resolves one.
server:
  mode: "cp"
  hostname: "localhost"
  port: 8095

  # Each tenant is one organization's environment, identified as "<org>:<env>" (for example
  # "org1:dev"). The identifier is taken from a claim in the caller's token rather than from the
  # request, so a caller cannot address a tenant it has no token for.
  deployment_id_source: "token"
  deployment_id_claim: "deploymentId"
  # The tenant that owns the Control Plane's own resources, as opposed to any customer's.
  system_deployment_id: "root"

  security:
    # Permissions this plane's management APIs require, prefixed. A token from the trusted issuer
    # carries "tenant_instance:system" rather than a bare "system", because the scope names the
    # instance it grants against, so the permissions checked here have to match it.
    #
    # Every system permission takes the prefix: tenant_instance:system, tenant_instance:system:ou,
    # tenant_instance:system:user, and so on. Leaving it unset keeps the unprefixed names.
    system_permission_prefix: "tenant_instance"

    # The identity provider whose tokens are accepted for the management APIs. Set these to your own
    # before serving anything real.
    trusted_issuer:
      issuer: ""
      jwks_url: ""
      audience: "thunderid-cp"

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

# The channel every Data Plane dials in on. The Data Plane always dials out, so the Control Plane
# needs no route to it and holds no credential for its management API.
#
# Each Data Plane authenticates with a token this server issued and holds encrypted, so no token is
# configured here. channel.server.auth_token exists as a shared fallback for a deployment that issues
# none; leaving it unset is what you want.
channel:
  server:
    enabled: true
    path: "/cp/connect"
    read_limit_bytes: 8388608
    rpc_timeout_seconds: 120

# Promoting a version towards production is a release decision, so it is the one environment action
# gated on a scope. Every other action, including applying and reverting, is open to any member of the
# organization. Set this when the authorization server issuing your tokens names the scope
# differently; it defaults to system:promote.
promotion:
  scope: "system:promote"

database:
  config:
    type: "sqlite"
    sqlite:
      path: "database/configdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_transient:
    type: "sqlite"
    sqlite:
      path: "database/runtime-transient.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  entity:
    type: "sqlite"
    sqlite:
      path: "database/entitydb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_persistent:
    type: "sqlite"
    sqlite:
      path: "database/runtime-persistent.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  # The environment manager's own datasource: environments and the captured versions promotion
  # compares against. Only a Control Plane has one. Leave it unset to serve without promotion.
  environment:
    type: "sqlite"
    sqlite:
      path: "database/environmentdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
  preferred_key_id: "default-key"
