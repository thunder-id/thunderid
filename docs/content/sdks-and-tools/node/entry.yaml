    intro: Task-focused walkthroughs maintained alongside the SDK.

guides:
  - id: accessing-protected-apis
    title: Accessing Protected APIs
    icon: key
    description: Use the access token to call downstream APIs from a Node.js server-side application
    intro: This guide shows how to retrieve the user's access token from the {{ProductName}} Node.js SDK and use it
      to call protected downstream APIs.
    sections:
    - type: steps
      id: steps
      title: Accessing Protected APIs
      steps:
      - title: Prerequisites
        description: '- Complete the [Handling Authentication](../handling-authentication) guide to set up the client
          and session management. - The user must be signed in before you retrieve an access token.'
      - title: Retrieve the Access Token
        description: Use the `getAccessToken` method to retrieve the access token for the current user session.
        code:
          file: src/services/userService.ts
          lang: ts
          content: |2-

            export async function fetchUserProfile(sessionId: string) {
              const accessToken = await auth.getAccessToken(sessionId)

              const response = await fetch('https://localhost:8090/users/<user_id>', {
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  'Content-Type': 'application/json',
                },
              })

              if (!response.ok) {
                throw new Error(`API request failed: ${response.status}`)
              }

              return response.json()
            }
      - title: Call a Protected API from a Route
        description: Use the service function in a route handler that already requires authentication.
        code:
          file: src/routes/profile.ts
          lang: ts
          content: |2-

            app.get('/profile', requireAuth, async (req, res) => {
              const sessionId = req.cookies[CookieConfig.SESSION_COOKIE_NAME]

              try {
                const profile = await fetchUserProfile(sessionId)
                res.render('profile', { profile })
              } catch (error) {
                res.status(500).render('error', { message: 'Failed to load profile.' })
              }
            })
      - title: Send Multiple Requests in Parallel
        description: Use `Promise.all` to send multiple authenticated requests concurrently.
        code:
          file: src/services/dashboardService.ts
          lang: ts
          content: |2-

            export async function fetchDashboardData(sessionId: string) {
              const accessToken = await auth.getAccessToken(sessionId)

              const headers = {
                Authorization: `Bearer ${accessToken}`,
                'Content-Type': 'application/json',
              }

              const [profile, organizations] = await Promise.all([
                fetch('https://localhost:8090/users/<user_id>', { headers }).then(r => r.json()),
                fetch('https://localhost:8090/organizations', { headers }).then(r => r.json()),
              ])

              return { organizations, profile }
            }
      - title: Handle Token Expiry
        description: 'The SDK refreshes the access token automatically when `isSignedIn` is called (for example, in
          your authentication middleware). This means that by the time a route handler executes, the access token is
          already up to date. If you call `getAccessToken` outside a middleware-protected route, verify the session
          first:'
        code:
          lang: ts
          content: |-
            const signedIn = await auth.isSignedIn(sessionId)

            if (!signedIn) {
              throw new Error('User is not signed in.')
            }

            const accessToken = await auth.getAccessToken(sessionId)
      - title: Use the Token Exchange Flow
        description: For advanced scenarios such as impersonation or delegated access, use `exchangeToken` to get a
          token with a different scope or for a different subject.
        code:
          lang: ts
          content: |2-

            const newTokens = await auth.exchangeToken(
              {
                attachToken: false,
                data: {
                  client_id: '<your-client-id>',
                  grant_type: 'account_switch',
                  scope: 'openid profile',
                  token: currentAccessToken,
                },
                id: 'account-switch',
                returnResponse: true,
                returnsSession: true,
                signInRequired: true,
              },
              sessionId,
            )
      - title: Revoke an Access Token
        description: To revoke the access token when the user signs out or when you want to invalidate a session immediately,
          call `revokeAccessToken`.
        code:
          lang: ts
          content: await auth.revokeAccessToken(sessionId)
      - title: Next Steps
        description: '- [Protecting Routes](../protecting-routes): Restrict access to routes based on authentication
          state - [`ThunderIDNodeClient`](../../apis/clients/thunderid-node-client): Base client class reference'
  - id: handling-authentication
    title: Handling Authentication
    icon: shield
    description: Set up sign-in and sign-out flows in a Node.js application using the {{ProductName}} Node.js SDK
    intro: This guide explains how to implement authentication in a Node.js server-side application using the {{ProductName}}
      Node.js SDK. You will set up the client, redirect users to the identity provider for sign-in, handle the OAuth
      2.0 callback, and implement sign-out.
    sections:
    - type: steps
      id: steps
      title: Handling Authentication
      steps:
      - title: Prerequisites
        description: '- Node.js 18 or later - An application registered in {{ProductName}} with the callback URL configured
          (for example, `http://localhost:3000/callback`) - The `@thunderid/node` package installed'
      - title: 1. Initialize the Client
        description: Create a shared authentication client instance and initialize it with your application's configuration.
        code:
          file: src/auth.ts
          lang: ts
          content: |2-

            // auth is an instance of your framework client (e.g. from @thunderid/express)
            // initialized with this configuration
            const config: ThunderIDNodeConfig = {
              clientId: '<your-client-id>',
              serverOrigin: 'https://localhost:8090',
              afterSignInUrl: 'http://localhost:3000/callback',
              afterSignOutUrl: 'http://localhost:3000',
              scope: ['openid', 'profile'],
            }

            export default config
      - title: 2. Start the Sign-In Flow
        description: When the user navigates to the sign-in route, generate a session identifier, store it in a cookie,
          and redirect the user to the identity provider's authorization endpoint.
        code:
          file: src/routes/sign-in.ts
          lang: ts
          content: |2-
              CookieConfig,
              generateSessionId,
              getSessionCookieOptions,
            } from '@thunderid/node'

            app.get('/sign-in', async (req, res) => {
              let sessionId = req.cookies[CookieConfig.SESSION_COOKIE_NAME]

              if (!sessionId) {
                sessionId = generateSessionId()
                res.cookie(
                  CookieConfig.SESSION_COOKIE_NAME,
                  sessionId,
                  getSessionCookieOptions({ maxAge: 3600 }),
                )
              }

              await auth.signIn(
                (authUrl) => res.redirect(authUrl),
                sessionId,
              )
            })
      - title: 3. Handle the Callback
        description: After the user authenticates at the identity provider, the browser redirects to the callback URL
          with the authorization code, session state, and state parameter. Exchange these values for tokens.
        code:
          file: src/routes/callback.ts
          lang: ts
          content: |2-

            app.get('/callback', async (req, res) => {
              const sessionId = req.cookies[CookieConfig.SESSION_COOKIE_NAME]

              if (!sessionId) {
                return res.redirect('/sign-in')
              }

              const { code, session_state, state } = req.query

              await auth.signIn(
                (authUrl) => res.redirect(authUrl),
                sessionId,
                code as string,
                session_state as string,
                state as string,
              )

              // Refresh the cookie with the full session expiry time
              res.cookie(
                CookieConfig.SESSION_COOKIE_NAME,
                sessionId,
                getSessionCookieOptions({ maxAge: 3600 }),
              )

              res.redirect('/dashboard')
            })
      - title: 4. Implement Sign-Out
        description: To sign a user out, clear the session data and redirect the user to the identity provider's end
          session endpoint.
        code:
          file: src/routes/sign-out.ts
          lang: ts
          content: |2-

            app.get('/sign-out', async (req, res) => {
              const sessionId = req.cookies[CookieConfig.SESSION_COOKIE_NAME]

              if (!sessionId) {
                return res.redirect('/')
              }

              const signOutUrl = await auth.signOut(sessionId)

              res.clearCookie(CookieConfig.SESSION_COOKIE_NAME)
              res.redirect(signOutUrl)
            })
      - title: Next Steps
        description: '- [Protecting Routes](../protecting-routes): Restrict access to routes based on authentication
          state - [Accessing Protected APIs](../accessing-protected-apis): Use the access token to call downstream APIs'
  - id: protecting-routes
    title: Protecting Routes
    icon: shield
    description: Restrict access to routes based on authentication state using the {{ProductName}} Node.js SDK
    intro: This guide shows how to restrict access to routes in a Node.js server-side application based on authentication
      state. You will create reusable middleware that checks whether the current user has an active session before allowing
      access to protected resources.
    sections:
    - type: steps
      id: steps
      title: Protecting Routes
      steps:
      - title: Prerequisites
        description: '- Complete the [Handling Authentication](../handling-authentication) guide to set up the authentication
          client and session cookie.'
      - title: How It Works
        description: The `isSignedIn` method checks whether the user's session exists and is still valid. If the access
          token has expired but a refresh token exists, the SDK automatically refreshes the token before returning the
          result. Use this method in a middleware function to gate access to protected routes.
      - title: Create an Authentication Middleware
        code:
          file: src/middleware/requireAuth.ts
          lang: ts
          content: |2-

            export async function requireAuth(
              req: Request,
              res: Response,
              next: NextFunction,
            ): Promise<void> {
              const sessionId = req.cookies[CookieConfig.SESSION_COOKIE_NAME]

              if (!sessionId) {
                res.redirect('/sign-in')
                return
              }

              const signedIn = await auth.isSignedIn(sessionId)

              if (!signedIn) {
                res.redirect('/sign-in')
                return
              }

              next()
            }
      - title: Apply Middleware to Routes
        description: '### Protect Individual Routes Apply the middleware to specific routes that require authentication.'
        code:
          file: src/routes/dashboard.ts
          lang: ts
          content: |2-

            app.get('/dashboard', requireAuth, (req, res) => {
              res.render('dashboard')
            })

            app.get('/profile', requireAuth, async (req, res) => {
              const sessionId = req.cookies[CookieConfig.SESSION_COOKIE_NAME]
              const user = await auth.getUser(sessionId)
              res.render('profile', { user })
            })
      - title: Attach User Data to the Request
        description: Extend the request object to carry user information, so protected route handlers can access it
          without fetching it again.
        code:
          file: src/middleware/requireAuth.ts
          lang: ts
          content: |2-

            declare global {
              namespace Express {
                interface Request {
                  user?: User
                }
              }
            }

            export async function requireAuth(
              req: Request,
              res: Response,
              next: NextFunction,
            ): Promise<void> {
              const sessionId = req.cookies[CookieConfig.SESSION_COOKIE_NAME]

              if (!sessionId) {
                res.redirect('/sign-in')
                return
              }

              const signedIn = await auth.isSignedIn(sessionId)

              if (!signedIn) {
                res.redirect('/sign-in')
                return
              }

              req.user = await auth.getUser(sessionId)

              next()
            }
      - title: Handle Token Refresh Failures
        description: 'The `isSignedIn` method attempts to refresh an expired access token automatically. If the refresh
          fails (for example, the refresh token has also expired), it returns `false`. The middleware handles this by
          redirecting to the sign-in route. To distinguish an expired session from a network failure, you can catch
          errors explicitly:'
        code:
          file: src/middleware/requireAuth.ts
          lang: ts
          content: |-
            export async function requireAuth(
              req: Request,
              res: Response,
              next: NextFunction,
            ): Promise<void> {
              const sessionId = req.cookies[CookieConfig.SESSION_COOKIE_NAME]

              if (!sessionId) {
                res.redirect('/sign-in')
                return
              }

              try {
                const signedIn = await auth.isSignedIn(sessionId)

                if (!signedIn) {
                  res.clearCookie(CookieConfig.SESSION_COOKIE_NAME)
                  res.redirect('/sign-in')
                  return
                }
              } catch (error) {
                res.status(500).send('Authentication check failed.')
                return
              }

              next()
            }
      - title: Next Steps
        description: '- [Accessing Protected APIs](../accessing-protected-apis): Use the access token to call downstream
          services'

