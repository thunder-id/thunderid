openapi: 3.0.3
info:
  title: Group Management API
  version: "1.0"
  description: Create and manage groups for organizing users. Groups can be assigned roles and permissions and are used as the primary unit for access control delegation.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Groups
    description: CRUD operations for groups, member assignment, and role assignment.
  - name: groups-by-path
    description: Create and list groups within an organization unit identified by its handle path.

security:
  - OAuth2: [system]

paths:
  /groups:
    get:
      tags:
        - Groups
      summary: List groups
      description: |
        Retrieve a list of groups. An `ouId` filter lists the groups the organization unit owns.
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
        - $ref: '#/components/parameters/groupFilterQueryParam'
        - $ref: '#/components/parameters/groupProjectIdQueryParam'
        - $ref: '#/components/parameters/includeGroupQueryParam'
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                groups:
                  - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Sports"
                    description: "Sports group"
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                  - id: "257e528f-eb24-48b6-884d-20460e190957"
                    name: "Managers"
                    description: "Manager group"
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                links:
                  - href: "groups?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "GRP-1001"
                    message:
                      key: "error.groupservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.groupservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "GRP-1011"
                    message:
                      key: "error.groupservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.groupservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "GRP-1012"
                    message:
                      key: "error.groupservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.groupservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
                invalid-filter:
                  summary: Invalid filter parameter
                  value:
                    code: "GRP-1018"
                    message:
                      key: "error.groupservice.invalid_filter_parameter"
                      defaultValue: "Invalid filter parameter"
                    description:
                      key: "error.groupservice.invalid_filter_parameter_description"
                      defaultValue: "The filter must be a single ouId eq expression with a quoted organization unit ID"
        "500":
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

    post:
      tags:
        - Groups
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
            example:
              name: "Sports"
              description: "Sports group"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
              members:
                - type: "user"
                  id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                - type: "user"
                  id: "9f1e47d3-0347-4464-9f02-e0bfae02e896"
                - type: "group"
                  id: "6b1e7b8d-7e19-41eb-8fa2-c0ee5bb67a94"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Sports"
                description: "Sports group"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "GRP-1001"
                    message:
                      key: "error.groupservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.groupservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-member-type:
                  summary: Invalid member type
                  value:
                    code: "GRP-1014"
                    message:
                      key: "error.groupservice.invalid_member_type"
                      defaultValue: "Invalid member type"
                    description:
                      key: "error.groupservice.invalid_member_type_description"
                      defaultValue: "The member type must be 'user', 'group', or 'app'"
                personal-agent-not-assignable:
                  summary: Personal agent cannot be added to groups
                  value:
                    code: "GRP-1025"
                    message:
                      key: "error.groupservice.personal_agent_not_assignable"
                      defaultValue: "Personal agent cannot be added to groups"
                    description:
                      key: "error.groupservice.personal_agent_not_assignable_description"
                      defaultValue: "A personal agent acts only on behalf of its owner, so it cannot be a member of a group"
                invalid-member-id:
                  summary: Invalid user or app member ID
                  value:
                    code: "GRP-1007"
                    message:
                      key: "error.groupservice.invalid_member_id"
                      defaultValue: "Invalid member ID"
                    description:
                      key: "error.groupservice.invalid_member_id_description"
                      defaultValue: "One or more user or app member IDs in the request do not exist or do not match the claimed type"
                invalid-group-member-id:
                  summary: Invalid group member ID
                  value:
                    code: "GRP-1008"
                    message:
                      key: "error.groupservice.invalid_group_member_id"
                      defaultValue: "Invalid group member ID"
                    description:
                      key: "error.groupservice.invalid_group_member_id_description"
                      defaultValue: "One or more group member IDs in the request do not exist"
                member-ou-mismatch:
                  summary: Member not available in the group's organization unit
                  value:
                    code: "GRP-1019"
                    message:
                      key: "error.groupservice.member_ou_mismatch"
                      defaultValue: "Member not available in the group's organization unit"
                    description:
                      key: "error.groupservice.member_ou_mismatch_description"
                      defaultValue: "One or more members are neither owned by the group's organization unit nor shared with it"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "GRP-1005"
                    message:
                      key: "error.groupservice.invalid_ou_id"
                      defaultValue: "Invalid OU ID"
                    description:
                      key: "error.groupservice.invalid_ou_id_description"
                      defaultValue: "Organization unit does not exists"
                invalid-project:
                  summary: The project does not exist
                  value:
                    code: "GRP-1021"
                    message:
                      key: "error.groupservice.invalid_project"
                      defaultValue: "Invalid project"
                    description:
                      key: "error.groupservice.invalid_project_description"
                      defaultValue: "No project exists with the given project ID"
                ou-not-in-project:
                  summary: The organization unit is outside the project
                  value:
                    code: "GRP-1022"
                    message:
                      key: "error.groupservice.ou_not_in_project"
                      defaultValue: "Organization unit not in project"
                    description:
                      key: "error.groupservice.ou_not_in_project_description"
                      defaultValue: "A group in a project must be in the system organization unit or in an organization unit of the project"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "GRP-1004"
                message:
                  key: "error.groupservice.group_name_conflict"
                  defaultValue: "Group name conflict"
                description:
                  key: "error.groupservice.group_name_conflict_description"
                  defaultValue: "A group with the same name exists under the same parent"
        "500":
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

  /groups/{id}:
    get:
      tags:
        - Groups
      summary: Get a group by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/includeGroupQueryParam'
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Sports"
                description: "Sports group"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "GRP-1002"
                message:
                  key: "error.groupservice.missing_group_id"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.groupservice.missing_group_id_description"
                  defaultValue: "Group ID is required"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "GRP-1003"
                message:
                  key: "error.groupservice.group_not_found"
                  defaultValue: "Group not found"
                description:
                  key: "error.groupservice.group_not_found_description"
                  defaultValue: "The group with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

    put:
      tags:
        - Groups
      summary: Update a group by id
      description: |
        Updates a group's name, description, and organization unit. A group can be moved to another
        organization unit only when it has no members, no other group contains it, and it is assigned
        no roles.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
            example:
              name: "Activities"
              description: "Activities group"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Activities"
                description: "Activities group"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-group-id:
                  summary: Missing group ID
                  value:
                    code: "GRP-1002"
                    message:
                      key: "error.groupservice.missing_group_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.groupservice.missing_group_id_description"
                      defaultValue: "Group ID is required"
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "GRP-1001"
                    message:
                      key: "error.groupservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.groupservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "GRP-1005"
                    message:
                      key: "error.groupservice.invalid_ou_id"
                      defaultValue: "Invalid OU ID"
                    description:
                      key: "error.groupservice.invalid_ou_id_description"
                      defaultValue: "Organization unit does not exists"
                invalid-project:
                  summary: The project does not exist
                  value:
                    code: "GRP-1021"
                    message:
                      key: "error.groupservice.invalid_project"
                      defaultValue: "Invalid project"
                    description:
                      key: "error.groupservice.invalid_project_description"
                      defaultValue: "No project exists with the given project ID"
                ou-not-in-project:
                  summary: The organization unit is outside the project
                  value:
                    code: "GRP-1022"
                    message:
                      key: "error.groupservice.ou_not_in_project"
                      defaultValue: "Organization unit not in project"
                    description:
                      key: "error.groupservice.ou_not_in_project_description"
                      defaultValue: "A group in a project must be in the system organization unit or in an organization unit of the project"
                group-ou-change-not-allowed:
                  summary: Group has members, belongs to other groups, or is assigned roles
                  value:
                    code: "GRP-1020"
                    message:
                      key: "error.groupservice.group_ou_change_not_allowed"
                      defaultValue: "Cannot change the group's organization unit"
                    description:
                      key: "error.groupservice.group_ou_change_not_allowed_description"
                      defaultValue: "The group has members, belongs to other groups, or is assigned roles. Remove its members, its memberships in other groups and its role assignments before moving it"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "GRP-1003"
                message:
                  key: "error.groupservice.group_not_found"
                  defaultValue: "Group not found"
                description:
                  key: "error.groupservice.group_not_found_description"
                  defaultValue: "The group with the specified id does not exist"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "GRP-1004"
                message:
                  key: "error.groupservice.group_name_conflict"
                  defaultValue: "Group name conflict"
                description:
                  key: "error.groupservice.group_name_conflict_description"
                  defaultValue: "A group with the same name exists under the same parent"
        "500":
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

    delete:
      tags:
        - Groups
      summary: Delete a group by id
      description: |
        Deletes a group using its ID. Its role assignments and its memberships in other groups are
        automatically removed by cascade. Before anything is removed, the server revokes the tokens
        that hold scopes the group's roles granted its members, and refuses a group whose members
        are nested too deep to reach with `GRP-1017`, and one whose members times scopes exceed
        `oauth.revocation.criteria.max_entries_per_change` with `RVS-1001`. Once the role assignments
        and memberships are removed, the server revokes what was issued while that ran, then deletes
        the group. If any step fails, the group is left in place and the delete can be retried; tokens
        already revoked stay revoked. When the step that failed is the one after the role assignments
        were removed, a token issued while they were being removed stays valid until it expires.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Group deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-group-id:
                  summary: Missing group ID
                  value:
                    code: "GRP-1002"
                    message:
                      key: "error.groupservice.missing_group_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.groupservice.missing_group_id_description"
                      defaultValue: "Group ID is required"
                group-nesting-too-deep:
                  summary: Members nested too deep to revoke
                  value:
                    code: "GRP-1017"
                    message:
                      key: "error.groupservice.group_nesting_too_deep"
                      defaultValue: "Group nesting is too deep"
                    description:
                      key: "error.groupservice.group_nesting_too_deep_description"
                      defaultValue: "The group's members are nested more than 32 levels deep, which cannot be expanded"
                revocation-entry-limit:
                  summary: Too many members and scopes to revoke in one change
                  value:
                    code: "RVS-1001"
                    message:
                      key: "error.revocationservice.entry_limit_exceeded"
                      defaultValue: "Too many revocation entries"
                    description:
                      key: "error.revocationservice.entry_limit_exceeded_description"
                      defaultValue: "The change would record 11000 revocation entries, more than the 10000 allowed for one change"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "GRP-1003"
                message:
                  key: "error.groupservice.group_not_found"
                  defaultValue: "Group not found"
                description:
                  key: "error.groupservice.group_not_found_description"
                  defaultValue: "The group with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

  /groups/{id}/members:
    get:
      tags:
        - Groups
      summary: List members in group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
        - $ref: '#/components/parameters/includeQueryParam'
      responses:
        "200":
          description: List of members in the group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                members:
                  - type: "user"
                    id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                  - type: "group"
                    id: "8c2f8e9e-8f2a-4f5b-9c3d-4e5f6a7b8c9d"
                links:
                  - href: "groups/3fa85f64-5717-4562-b3fc-2c963f66afa6/members?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "GRP-1011"
                    message:
                      key: "error.groupservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.groupservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "GRP-1012"
                    message:
                      key: "error.groupservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.groupservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "GRP-1003"
                message:
                  key: "error.groupservice.group_not_found"
                  defaultValue: "Group not found"
                description:
                  key: "error.groupservice.group_not_found_description"
                  defaultValue: "The group with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

  /groups/{id}/members/add:
    post:
      tags:
        - Groups
      summary: Add members to a group
      description: |
        Adds members to a group. Every member must be owned by the group's organization unit or shared
        with it. Only users and applications can be shared.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembersRequest'
            example:
              members:
                - type: "user"
                  id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                - type: "user"
                  id: "9f1e47d3-0347-4464-9f02-e0bfae02e896"
      responses:
        "200":
          description: Members added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Engineering"
                description: "Engineering group"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "GRP-1001"
                    message:
                      key: "error.groupservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.groupservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                empty-members:
                  summary: Empty members list
                  value:
                    code: "GRP-1013"
                    message:
                      key: "error.groupservice.empty_members_list"
                      defaultValue: "Empty members list"
                    description:
                      key: "error.groupservice.empty_members_list_description"
                      defaultValue: "The members list cannot be empty"
                invalid-member-type:
                  summary: Invalid member type
                  value:
                    code: "GRP-1014"
                    message:
                      key: "error.groupservice.invalid_member_type"
                      defaultValue: "Invalid member type"
                    description:
                      key: "error.groupservice.invalid_member_type_description"
                      defaultValue: "The member type must be 'user', 'group', or 'app'"
                personal-agent-not-assignable:
                  summary: Personal agent cannot be added to groups
                  value:
                    code: "GRP-1025"
                    message:
                      key: "error.groupservice.personal_agent_not_assignable"
                      defaultValue: "Personal agent cannot be added to groups"
                    description:
                      key: "error.groupservice.personal_agent_not_assignable_description"
                      defaultValue: "A personal agent acts only on behalf of its owner, so it cannot be a member of a group"
                invalid-member-id:
                  summary: Invalid user or app member ID
                  value:
                    code: "GRP-1007"
                    message:
                      key: "error.groupservice.invalid_member_id"
                      defaultValue: "Invalid member ID"
                    description:
                      key: "error.groupservice.invalid_member_id_description"
                      defaultValue: "One or more user or app member IDs in the request do not exist or do not match the claimed type"
                invalid-group-member-id:
                  summary: Invalid group member ID
                  value:
                    code: "GRP-1008"
                    message:
                      key: "error.groupservice.invalid_group_member_id"
                      defaultValue: "Invalid group member ID"
                    description:
                      key: "error.groupservice.invalid_group_member_id_description"
                      defaultValue: "One or more group member IDs in the request do not exist"
                member-ou-mismatch:
                  summary: Member not available in the group's organization unit
                  value:
                    code: "GRP-1019"
                    message:
                      key: "error.groupservice.member_ou_mismatch"
                      defaultValue: "Member not available in the group's organization unit"
                    description:
                      key: "error.groupservice.member_ou_mismatch_description"
                      defaultValue: "One or more members are neither owned by the group's organization unit nor shared with it"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SAZ-4030"
                message:
                  key: "error.sysauthz.grant_not_permitted"
                  defaultValue: "Insufficient privileges to grant these permissions"
                description:
                  key: "error.sysauthz.grant_not_permitted_description"
                  defaultValue: "The operation would grant permissions that the caller does not hold"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "GRP-1003"
                message:
                  key: "error.groupservice.group_not_found"
                  defaultValue: "Group not found"
                description:
                  key: "error.groupservice.group_not_found_description"
                  defaultValue: "The group with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

  /groups/{id}/members/remove:
    post:
      tags:
        - Groups
      summary: Remove members from a group
      parameters:
        - in: path
          name: id
          required: true
