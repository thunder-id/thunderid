server:
  hostname: "0.0.0.0" # bind address — must stay 0.0.0.0 so kubelet's pod-IP health checks can
                       # reach it; this is separate from public_url below
  port: __SERVER_PORT__
  public_url: "__PUBLIC_URL__"
  security:
    # file:// reference, not an inline value: the server resolves this by reading the file's
    # content at every boot. The referenced path is exactly where the seed-direct-auth-secret
    # init container writes the operator-generated secret.
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

tls:
  min_version: "__TLS_MIN_VERSION__"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

# database: below is a static sqlite default (the image's own built-in behavior). When
# spec.config.database is set, reconcileConfigMap replaces everything under it wholesale with the
# rendered scopes (see staticSQLiteDatabaseSection in database_config.go) — so a postgres-configured
# instance's actual rendered ConfigMap has postgres content here instead of what's shown below.
database:
  config:
    type: "sqlite"
    sqlite:
      path: "repository/database/configdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600
  runtime_transient:
    type: "sqlite"
    sqlite:
      path: "repository/database/runtime_transient.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600
  entity:
    type: "sqlite"
    sqlite:
      path: "repository/database/entitydb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600
  runtime_persistent:
    type: "sqlite"
    sqlite:
      path: "repository/database/runtime_persistent.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
  preferred_key_id: "__JWT_PREFERRED_KEY_ID__"

passkey:
  allowed_origins:
    - "__PUBLIC_URL__"
    - "__PASSKEY_EXTRA_ORIGINS__" # replaced whole-line by reconcileConfigMap with 0+ additional "- \"origin\"" lines, or removed if spec.config.passkey.extraAllowedOrigins is unset

__EMAIL_BLOCK__: placeholder # replaced whole-line by reconcileConfigMap with the email: section, or removed if spec.config.email is unset
