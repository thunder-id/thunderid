        - organization-units-by-path
      summary: List groups in organization unit by handle path
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
          style: simple
          explode: false
          description: |
            Hierarchical path of organization unit handles separated by forward slashes.
            Examples:
            - `engineering` - Lists groups in the "engineering" OU
            - `engineering/frontend` - Lists groups in "engineering/frontend"
          example: "engineering/frontend"
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: List of groups in the organization unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                groups:
                  - id: "c2a4f62d-7c79-46f2-b2de-8e8cb4f1c456"
                    name: "Developers"
                  - id: "8a8e4fa2-2e55-478d-bf0f-4a2ddaf9ee7d"
                    name: "Architects"
                links:
                  - href: "organization-units/tree/engineering/frontend/groups?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "OU-1010"
                    message:
                      key: "error.ouservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.ouservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "OU-1011"
                    message:
                      key: "error.ouservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.ouservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
        "404":
          description: Organization unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1003"
                message:
                  key: "error.ouservice.organization_unit_not_found"
                  defaultValue: "Organization unit not found"
                description:
                  key: "error.ouservice.organization_unit_not_found_description"
                  defaultValue: "The organization unit with the specified id does not exist"
        "500":
          description: Internal server error

  /organization-units/tree/{path}/roles:
    get:
      tags:
        - organization-units-by-path
      summary: List roles in organization unit by handle path
      description: |
        Lists the roles the organization unit owns, followed by the roles shared with it. Each
        listed role's `isOwnedByOU` field says which of the two it is.
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
          style: simple
          explode: false
          description: |
            Hierarchical path of organization unit handles separated by forward slashes.
            Examples:
            - `engineering` - Lists roles in the "engineering" OU
            - `engineering/frontend` - Lists roles in "engineering/frontend"
          example: "engineering/frontend"
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
