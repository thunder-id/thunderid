---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: thunderidresources.apps.thunderid.io
spec:
  group: apps.thunderid.io
  names:
    kind: ThunderIDResource
    listKind: ThunderIDResourceList
    plural: thunderidresources
    singular: thunderidresource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels['thunderid\.io/instance']
      name: Instance
      type: string
    - jsonPath: .spec.resource_type
      name: Type
      type: string
    - jsonPath: .status.synced
      name: Synced
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "ThunderIDResource is the generic ThunderID resource kind — its
          spec is ThunderID's own\nexported bootstrap document, pasted in essentially
          as-is. Paste a document like:\n\n\tresource_type: application\n\tid: 01900000-0000-7000-8000-000000000060\n\touId:
          01900000-0000-7000-8000-000000000001\n\tname: Console\n\t...\n\ndirectly
          under spec (dropping the id: line — the operator generates that itself).
          The\noperator reads spec.resource_type to know which ConfigMap this belongs
          in, and forwards it to\nThunderID along with everything else — ThunderID's
          own bootstrap loader needs that same field\nto identify which resource kind
          a given YAML block in resources.yaml represents. Every other\nkey, including
          ones this operator has never heard of, passes through completely untouched
          —\nincluding a `{{.VAR}}` token in any field, resolved by ThunderID's own
          live resources.yaml\nloader at boot against whatever Secret the EnvironmentValues
          labeled thunderid.io/instance=<the\nowning ThunderIDInstance> provides."
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            description: ThunderIDResourceStatus defines the observed state of ThunderIDResource.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                type: string
              lastSyncTime:
                format: date-time
                type: string
              phase:
                type: string
              synced:
                type: boolean
              syncedInstance:
                description: |-
                  SyncedInstance is the ThunderIDInstance name (thunderid.io/instance label value) last
                  successfully synced to — not necessarily the current label value. Mirrors
                  SyncedResourceType's reasoning: lets the controller detect the object being moved to a
                  different instance (and remove the stale entry from the old instance's ConfigMap, not just
                  stop writing to it) and know which instance to clean up on deletion even if the label has
                  since been changed or points at an instance that's gone.
                type: string
              syncedResourceType:
                description: |-
                  SyncedResourceType is the spec.resource_type value last successfully synced to a ConfigMap —
                  not necessarily the current spec.resource_type. Lets the controller detect a resource_type
                  change (and rebuild the old type's ConfigMap to remove the stale entry, not just the new
                  type's) and know which ConfigMap to clean up on deletion even if spec.resource_type has
                  since been edited to something invalid or unknown.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
