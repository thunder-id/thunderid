          example: 1
        count:
          type: integer
          description: Number of elements in the returned page.
          example: 3
        types:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - ouId
            properties:
              id:
                type: string
                format: uuid
                description: The unique identifier of the agent type
              name:
                type: string
                description: The agent type this schema defines
              ouId:
                type: string
                format: uuid
                description: The root organization unit ID associated with this agent type
                  schema
              ouHandle:
                type: string
                readOnly: true
                description: Human-readable handle of the organization unit (only included when
                  include=display query parameter is used).
              allowSelfRegistration:
                type: boolean
                description: Indicates whether agents of this type can perform self-registration
                  flows
                default: false
              systemAttributes:
                type: object
                description: System-level metadata for the agent type
                properties:
                  display:
                    type: string
                    description: The schema attribute to use as the human-readable display name for
                      agents of this type
                additionalProperties: false
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
    CreateAgentTypeRequest:
      type: object
      required:
        - name
        - ouId
        - schema
      properties:
        name:
          type: string
          enum:
            - default
          description: >
            The agent type this schema will define. Must be `default` — agent
