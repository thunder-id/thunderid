    AttributeConfiguration:
      type: object
      description: External-to-local attribute mapping configuration for the connection.
      required:
        - userTypeResolution
      properties:
        userTypeResolution:
          $ref: "#/components/schemas/UserTypeResolution"
        userTypeAttributeMappings:
          type: array
          description: Per-user-type attribute mapping profiles.
          items:
            $ref: "#/components/schemas/UserTypeAttributeMapping"
        accountLinking:
          $ref: "#/components/schemas/AccountLinking"
    AccountLinking:
      type: object
      description: >
        Configures how an incoming federated identity is resolved to an existing
        local user when the subject identifier does not resolve one. All
        configured attributes that have a value are combined into a single
        lookup filter.
      properties:
        attributes:
          type: array
          description: External attribute names used together to resolve the local user.
          items:
            type: string
          example:
            - email
    UserTypeResolution:
      type: object
      description: Resolves which local user type an incoming federated identity maps to.
      required:
        - default
      properties:
        default:
          type: string
          description: >
            Fallback local user type, used when claim-driven resolution is not
            configured or the external attribute's value does not match a
            mapping.
          example: Person
        externalAttribute:
          type: string
          description: External claim whose value selects the local user type.
          example: user_type
        valueMapping:
          type: object
          description: Maps an external attribute value to a local user type.
          additionalProperties:
            type: string
          example:
            staff: Employee
    UserTypeAttributeMapping:
      type: object
      required:
        - userType
      description: Attribute mapping profile for a single local user type.
      properties:
        userType:
          type: string
          description: Local user type this profile applies to.
          example: Person
        attributes:
          type: array
          description: External-to-local attribute mappings for this user type.
          items:
            $ref: "#/components/schemas/AttributeMapping"
    AttributeMapping:
      type: object
      required:
        - externalAttribute
        - localAttribute
      description: Maps a single external IDP attribute to a local user attribute.
      properties:
        externalAttribute:
          type: string
          description: >
            External claim name emitted by the IDP. May be a dot-notation path
            into a nested claim (e.g. "address.email"). A literal name
            containing dots is matched first.
          example: given_name
        localAttribute:
          type: string
          description: Target local attribute name. Must exist in the user type's schema.
          example: firstName
