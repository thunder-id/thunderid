openapi: 3.0.3
info:
  title: Gateway API
  version: "1.0"
  description: |
    Registers the data planes this control plane administers.

    A registration records three things: the id the data plane knows itself by, where it answers,
    and the management token it is configured with. Registering records where a data plane is and
    how to authenticate to it; it does not contact the data plane.

    The management token is **write-only**. It is held encrypted and is never returned by any
    response, because a read that returned it would hand every operator of this control plane the
    credentials to every data plane it administers.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Gateways
    description: The data planes this control plane administers.

security:
  - OAuth2: [system]

paths:
  /gateways:
    get:
      tags: [Gateways]
      summary: List the registered gateways
      description: Returns every gateway this deployment administers, oldest first. No management token is included.
      responses:
        "200":
          description: The registered gateways
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gateway'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Gateways]
      summary: Register a data plane
      description: |
        Records a data plane this control plane administers.

        The data plane is not contacted. A wrong `key`, a wrong `dataPlaneId` or an unreachable
        `baseUrl` are all found when something first calls that data plane, not here.

        How many gateways a deployment may hold is bounded by `server.max_gateways`, which is one
        unless a deployment raises it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "production"
              dataPlaneId: "production-dp"
              baseUrl: "https://dp.example.com:8090"
              key: "the data plane's management token"
      responses:
        "201":
          description: The registered gateway. The management token is not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /gateways/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The gateway's id.
    get:
      tags: [Gateways]
      summary: Get a gateway
      responses:
        "200":
          description: The gateway. The management token is not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Gateways]
      summary: Remove a gateway
      description: |
        Removes the registration. The data plane itself is untouched and keeps running with whatever
        configuration it already holds.
      responses:
        "204":
          description: The gateway was removed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

components:
  responses:
    BadRequest:
      description: The request was malformed, or a required field was missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidBody:
              summary: The body is not one JSON object
              value:
                code: "GTW-1007"
                message:
                  key: "error.gatewayservice.invalid_request_body"
                  defaultValue: "The request body is not valid JSON"
            connectionRequired:
              summary: A field needed to reach the data plane is missing
              value:
                code: "GTW-1005"
                message:
                  key: "error.gatewayservice.connection_required"
                  defaultValue: "A base URL, data plane ID and management token are required to reach the gateway"
    Unauthorized:
      description: No valid credentials were presented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No gateway of that id is registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "GTW-1002"
            message:
              key: "error.gatewayservice.gateway_not_found"
              defaultValue: "Gateway not found"
    Conflict:
      description: The registration conflicts with one that already exists, or with the configured bound
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            nameTaken:
              summary: The name is already registered
              value:
                code: "GTW-1004"
                message:
                  key: "error.gatewayservice.name_taken"
                  defaultValue: "A gateway with this name is already registered"
            dataPlaneAlreadyRegistered:
              summary: One data plane registers once
              value:
                code: "GTW-1008"
                message:
                  key: "error.gateway.data_plane_already_registered"
                  defaultValue: "Data plane already registered"
            limitReached:
              summary: The deployment already holds as many gateways as it allows
              value:
                code: "GTW-1006"
                message:
                  key: "error.gatewayservice.limit_reached"
                  defaultValue: "This deployment already administers as many gateways as it is configured to allow"

  schemas:
    RegisterRequest:
      type: object
      required: [name, dataPlaneId, baseUrl, key]
      properties:
        name:
          type: string
          description: A label for this gateway, unique within the deployment.
          example: "production"
        dataPlaneId:
          type: string
          description: |
            The id the data plane knows itself by, which is its `server.identifier` and the value it
            scopes every stored resource under.

            Identity rather than address: a data plane moves between hostnames, ports and ingresses,
            and keying on `baseUrl` instead would let one be registered twice under its internal and
            external names. **One data plane registers once**, so this is unique within the deployment.
          example: "production-dp"
        baseUrl:
          type: string
          description: Where the data plane answers.
          example: "https://dp.example.com:8090"
        key:
          type: string
          format: password
          description: |
            The data plane's management token, as configured there under
            `server.security.management_token`. Held encrypted and never returned by any response.
        caCertificate:
          type: string
          description: |
            A PEM certificate to trust when calling this data plane, in addition to the system roots.

            For a data plane serving a certificate no public authority signed, which is what a local
            or on-premise deployment usually has. Leave empty for a data plane behind an ingress with
            a publicly-issued certificate: it verifies against the system roots with nothing here.
    Gateway:
      type: object
      description: A registered data plane. Carries no `key` property, so no response can disclose one.
      properties:
        id:
          type: string
        name:
          type: string
        dataPlaneId:
          type: string
        baseUrl:
          type: string
        caCertificate:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'
    I18nMessage:
      type: object
      properties:
        key:
          type: string
        defaultValue:
          type: string

  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            system: Manage this deployment
