guides:
  - id: embedded-sign-in
    title: Embedded Sign-In
    icon: pen
    description: Drive the Express embedded sign-in flow with handleFlow() for JSON-based multi-step authentication.
    intro: Use embedded sign-in when your application needs to advance the sign-in flow through JSON requests. Use it
      when you do not want to rely on a browser redirect for every interaction.
    sections:
    - type: steps
      id: steps
      title: Embedded Sign-In
      steps:
      - title: Prerequisites
        description: '- `express` - `cookie-parser` - `express.json()` - `mode: ''embedded''` in your Express SDK configuration'
      - title: Middleware and Route Setup
        code:
          file: index.js
          lang: js
          content: |-
            const express = require('express');
            const cookieParser = require('cookie-parser');
            const {thunderID, handleFlow, handleSignIn, handleSignOut} = require('@thunderid/express');

            const app = express();

            app.use(cookieParser());
            app.use(express.json());
            app.use(
              thunderID({
                baseUrl: 'https://localhost:8090',
                clientId: '<your-client-id>',
                clientSecret: '<your-client-secret>',
                mode: 'embedded',
                afterSignInUrl: 'http://localhost:3000/login',
                afterSignOutUrl: 'http://localhost:3000/logout',
              }),
            );

            app.post('/flow/sign-in', handleFlow());
            app.get('/login', handleSignIn());
            app.get('/logout', handleSignOut());
      - title: Request Lifecycle
        description: '### Start the Flow Send the first request without an `executionId`:'
        code:
          lang: json
          content: |-
            {
              "applicationId": "app-id",
              "flowType": "SIGN_IN"
            }
      - title: Response Lifecycle
        description: '### Continue rendering UI If the flow still needs more steps, `handleFlow()` returns:'
        code:
          lang: json
          content: |-
            {
              "authId": "...",
              "challengeToken": "...",
              "components": [],
              "executionId": "...",
              "flowStatus": "..."
            }
      - title: How `GET /login` and `POST /flow/sign-in` Work Together
        description: '- `POST /flow/sign-in` advances the embedded interaction and eventually returns a redirect URL
          - `GET /login` completes the OAuth callback after the embedded flow returns the authorization code redirect
          Both routes are required for the embedded sign-in flow shown in the current SDK source.'
      - title: Failure Cases
        description: '`handleFlow()` returns `500` JSON responses when: - the SDK is not initialized because `thunderID()`
          was not mounted first - `baseUrl` is missing from the config - flow execution fails at runtime'
      - title: Related APIs
        description: '- [`handleFlow()`](../../apis/middleware/handle-flow) - [`handleSignIn()`](../../apis/middleware/handle-sign-in)
          - [`ExpressClientConfig`](../../apis/configuration/express-client-config)'
  - id: redirect-flow
    title: Redirect Flow
    icon: exchange
    description: Build the standard Express sign-in and protected-route flow using redirect-based OAuth 2.0 PKCE.
    intro: Use the redirect flow when you want the SDK to drive a standard OAuth 2.0 authorization-code redirect cycle
      for your Express application.
    sections:
    - type: steps
      id: steps
      title: Redirect Flow
      steps:
      - title: Prerequisites
        description: '- `express` - `cookie-parser` - an application configured in {{ProductName}} - a redirect route
          such as `http://localhost:3000/login`'
      - title: Middleware Order
        description: 'Mount middleware in this order: 1. `cookie-parser()` 2. `express.json()` if you also need JSON
          request parsing 3. `thunderID(config)` 4. Route handlers that use `handleSignIn()`, `handleSignOut()`, or
          `protect()`'
      - title: Example
        code:
          file: index.js
          lang: js
          content: |-
            const express = require('express');
            const cookieParser = require('cookie-parser');
            const {thunderID, handleSignIn, handleSignOut, protect} = require('@thunderid/express');

            const app = express();
            const port = 3000;

            app.use(cookieParser());
            app.use(express.json());
            app.use(
              thunderID({
                baseUrl: 'https://localhost:8090',
                clientId: '<your-client-id>',
                clientSecret: '<your-client-secret>',
                afterSignInUrl: 'http://localhost:3000/login',
                afterSignOutUrl: 'http://localhost:3000/logout',
              }),
            );

            app.get('/', (_req, res) => {
              res.send('<a href="/protected">Go to protected page</a>');
            });

            app.get('/login', handleSignIn());
            app.get('/logout', handleSignOut());

            app.get(
              '/protected',
              protect((res) => res.redirect('/login')),
              (_req, res) => {
                res.send('You are signed in and can access this protected route.');
              },
            );

            app.get('/me', protect(), async (req, res) => {
              const user = await req.thunderIDAuth.getUserFromRequest(req);
              res.json(user);
            });

            app.listen(port, () => {
              console.log(`Server running on http://localhost:${port}`);
            });
      - title: Flow Lifecycle
        description: 1. The user opens a protected route. 2. `protect()` checks the session cookie and current sign-in
          state. 3. If the request is unauthenticated, your `onUnauthenticated` callback can redirect to `/login`. 4.
          `handleSignIn()` starts the redirect flow. 5. {{ProductName}} redirects back to the configured sign-in callback
          route. 6. `handleSignIn()` exchanges the authorization code for tokens and sets the session cookie. 7. Protected
          routes can now continue and route handlers can read the signed-in user.
      - title: Access the Current User
        description: After `thunderID()` runs, the initialized client is available on `req.thunderIDAuth`.
        code:
          file: index.js
          lang: js
          content: |-
            app.get('/me', protect(), async (req, res) => {
              const user = await req.thunderIDAuth.getUserFromRequest(req);
              res.json(user);
            });
      - title: Related APIs
        description: '- [`thunderID()`](../../apis/middleware/thunderid) - [`handleSignIn()`](../../apis/middleware/handle-sign-in)
          - [`handleSignOut()`](../../apis/middleware/handle-sign-out) - [`protect()`](../../apis/middleware/protect)'

