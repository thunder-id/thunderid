resource_type: resource_server
id: decl-rs-4
name: Declarative Nested Resource Server
description: A declarative test resource server reusing a sub-resource handle under different parents
identifier: https://localhost:8090/decl-rs-4
ouId: decl-ou-1
delimiter: ":"
resources:
  - name: App
    handle: app
  - name: Project
    handle: project
    parent: app
  - name: Team
    handle: team
    parent: app
  - name: Member
    handle: member
    parent: app:project
    actions:
      - name: Read
        handle: read
  - name: Member
    handle: member
    parent: app:team
    actions:
      - name: Read
        handle: read
