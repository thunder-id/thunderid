        description: { type: string }
        type: { type: string, example: "vonage" }
        apiKey: { type: string }
        apiSecret: { type: string, description: "Masked as \"******\".", example: "******" }
        senderId: { type: string }

    SMSGatewayConnectionUpdateRequest:
      type: object
      required: [name, url]
      properties:
        name: { type: string, example: "Prod SMS Gateway" }
        description: { type: string }
        url: { type: string, description: "The HTTP endpoint to call to send an SMS.", example: "https://sms.example.com/send" }
        httpMethod: { type: string, enum: [GET, POST], example: "POST" }
        httpHeaders:
          type: string
          description: |
            Comma-separated `Key: value` pairs sent with every request, including any credential
            header the gateway requires. Header values are stored and returned in plain text.
          example: "Authorization: Bearer token"
        contentType: { type: string, enum: [JSON, FORM], example: "JSON" }
    SMSGatewayConnectionCreateRequest:
      $ref: '#/components/schemas/SMSGatewayConnectionUpdateRequest'
    SMSGatewayConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "sms-gateway" }
        url: { type: string }
        httpMethod: { type: string }
        httpHeaders: { type: string }
        contentType: { type: string }

    SMTPConnectionUpdateRequest:
      type: object
      required: [name, host, port, fromAddress]
      properties:
        name: { type: string, example: "Corp SMTP" }
        description: { type: string }
        host: { type: string, description: "Hostname of the SMTP server.", example: "smtp.example.com" }
        port: { type: integer, minimum: 1, maximum: 65535, example: 587 }
        fromAddress: { type: string, format: email, description: "Address used in the From header and the SMTP envelope.", example: "noreply@example.com" }
        fromName:
          type: string
          description: |
            Display name shown beside `fromAddress` in the From header, so a recipient sees
            `Acme Support <noreply@example.com>`. Optional: without it the From header carries
            the bare address. It must not contain a line break. The SMTP envelope sender is
            always the bare `fromAddress`, whether or not a name is set.
          example: "Acme Support"
        tls:
          type: string
          enum: [none, starttls, implicit]
          default: starttls
          description: |
            How the connection to the SMTP server is secured. Defaults to `starttls` when
            omitted. `implicit` dials TLS directly (SMTPS, usually port 465). `none` sends in
            the clear and cannot carry credentials, so it cannot be combined with an
            `authentication` method other than `none`.
          example: "starttls"
        authentication:
          allOf:
            - $ref: '#/components/schemas/OutboundAuthentication'
          description: |
            How ThunderID authenticates to the SMTP server. Omit it to send no credentials.
            Call `GET /connections/meta?vendor=email-smtp` for the methods this deployment supports
            and the fields each one takes.
    SMTPConnectionCreateRequest:
      $ref: '#/components/schemas/SMTPConnectionUpdateRequest'
    SMTPConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "email-smtp" }
        host: { type: string }
        port: { type: integer, example: 587 }
        fromAddress: { type: string, format: email }
        fromName: { type: string, example: "Acme Support" }
        tls: { type: string, enum: [none, starttls, implicit] }
        authentication: { $ref: '#/components/schemas/OutboundAuthentication' }

    OutboundAuthentication:
      type: object
      description: |
        How ThunderID authenticates itself on an outbound call. The `type` selects the method
        and `properties` carries that method's fields, so a new method needs no change to this
        schema. Call `GET /connections/meta?vendor={vendor}` to discover the methods a vendor
        supports and the fields each one takes.

        A field the method marks as a credential is write-only: it is stored encrypted, returned
        masked as `"******"`, and may be omitted on update to keep the stored value. Changing
        `type`, or setting it to `none`, discards the previous method's stored credentials.
      required: [type]
      properties:
        type:
          type: string
          description: "The authentication method. `none` sends no credentials."
          example: "basic"
        properties:
          type: object
          additionalProperties: { type: string }
          description: "The selected method's field values, keyed by field name."
          example:
            username: "mailer"
            password: "<smtp_password>"

    ConnectionMetaResponse:
      type: object
      description: "Server-driven description of a connection vendor's configurable options."
      properties:
        vendor: { type: string, example: "email-smtp" }
        authentication:
          type: object
          properties:
            methods:
              type: array
              description: |
                The outbound authentication methods this vendor supports, in the order a console
                should offer them. Empty when the vendor has no configurable choice, such as a
                provider whose credentials are a fixed vendor contract.
              items: { $ref: '#/components/schemas/OutboundAuthMethod' }

    OutboundAuthMethod:
      type: object
      properties:
        type: { type: string, example: "basic" }
        displayName:
          type: string
          description: "Label for the method. Either plain text or an i18n template pattern."
          example: "{{t(connections:outboundAuth.method.basic)}}"
        properties:
          type: array
          description: "The method's fields, in the order a console should render them."
          items: { $ref: '#/components/schemas/OutboundAuthField' }

    OutboundAuthField:
      type: object
      description: |
        One field of an authentication method, described with the same vocabulary as an entity
        type's property schema so a console can reuse its schema-driven form renderer.
      properties:
        name: { type: string, example: "password" }
        type: { type: string, enum: [string], example: "string" }
        required: { type: boolean, example: true }
        credential:
          type: boolean
          description: "A secret: stored encrypted, returned masked, omit on update to keep it."
          example: true
        enum:
          type: array
          items: { type: string }
          description: "When present, the value must be one of these choices."
        regex:
          type: string
          description: "When present, the pattern the value must match."
        displayName:
          type: string
          description: "Label for the field. Either plain text or an i18n template pattern."
          example: "{{t(connections:outboundAuth.field.password)}}"

    AttributeConfiguration:
      type: object
      description: External-to-local attribute mapping configuration for the connection.
      required:
        - userTypeResolution
      properties:
        userTypeResolution:
          $ref: '#/components/schemas/UserTypeResolution'
        userTypeAttributeMappings:
          type: array
          description: Per-user-type attribute mapping profiles.
          items:
            $ref: '#/components/schemas/UserTypeAttributeMapping'
        accountLinking:
          $ref: '#/components/schemas/AccountLinking'
        authorizationMapping:
          $ref: '#/components/schemas/AuthorizationMapping'

    AccountLinking:
      type: object
      description: >
        Configures how an incoming federated identity is resolved to an existing local user when the
        subject identifier does not resolve one. All configured attributes that have a value are
        combined into a single lookup filter.
      properties:
        attributes:
          type: array
          description: External attribute names used together to resolve the local user.
          items:
            type: string
          example:
            - "email"

    UserTypeResolution:
      type: object
      description: Resolves which local user type an incoming federated identity maps to.
      required:
        - default
      properties:
        default:
          type: string
          description: >
            Fallback local user type, used when claim-driven resolution is not configured or the
            external attribute's value does not match a mapping.
          example: "Person"
        externalAttribute:
          type: string
          description: External claim whose value selects the local user type.
          example: "user_type"
        valueMapping:
          type: object
          description: Maps an external attribute value to a local user type.
          additionalProperties:
            type: string
          example:
            staff: "Employee"

    UserTypeAttributeMapping:
      type: object
      required:
        - userType
      description: Attribute mapping profile for a single local user type.
      properties:
        userType:
          type: string
          description: Local user type this profile applies to.
          example: "Person"
        attributes:
          type: array
          description: External-to-local attribute mappings for this user type.
          items:
            $ref: '#/components/schemas/AttributeMapping'

    AttributeMapping:
      type: object
      required:
        - externalAttribute
        - localAttribute
      description: Maps a single external IDP attribute to a local user attribute.
      properties:
        externalAttribute:
          type: string
          description: >
            External claim name emitted by the IDP. May be a dot-notation path into a nested
            claim (e.g. "address.email"). A literal name containing dots is matched first.
          example: "given_name"
        localAttribute:
          type: string
          description: Target local attribute name. Must exist in the user type's schema.
          example: "firstName"

    AuthorizationMapping:
      type: object
      description: >
        A connection's authorization mapping configuration, evaluated at federated sign-in, token
        exchange, and ID-JAG consumption: explicit value-to-target rules, direct name-based lookups,
        or both together, in which case their resolved targets union.
      properties:
        rules:
          type: array
          description: >
            Maps values of external claims to local roles, groups, or permissions. A claim value
            satisfying no rule confers nothing, even where it matches the name of a local role or group.
          items:
            $ref: '#/components/schemas/AuthorizationRuleMapping'
        direct:
          type: array
          description: >
            Feeds every value of an external claim directly onto local roles, groups, or permissions
            of one target type, using each value as the name (or permission string) to look up,
            rather than an explicit per-value rule table. A value with no unambiguous match confers
            nothing.
          items:
            $ref: '#/components/schemas/AuthorizationDirectMapping'

    AuthorizationRuleMapping:
      type: object
      required:
        - claim
        - values
      description: >
        Maps values of a single external claim to local roles, groups, or permissions. The result is
        the union of every matching rule's targets; a value satisfying no rule confers nothing.
      properties:
        claim:
          type: string
          description: Source claim. May be a dot-notation path into a nested claim (e.g. "address.country").
          example: "groups"
        valueType:
          type: string
          description: >
            How the claim's value(s) are interpreted. Defaults to "string" (a single scalar value)
            when omitted. "array", or "string" combined with delimiter, is multi-valued and requires
            the includes/not_includes operators; every other combination is single-valued and
            requires a different operator.
          enum: [string, number, boolean, array]
          default: "string"
          example: "array"
        delimiter:
          type: string
          description: >
            Splits a single string claim value into multiple tokens, making it multi-valued. Only
            valid when valueType is "string" or omitted.
          example: " "
        values:
          type: array
          description: At least one rule. Every matching rule's targets are unioned together.
          minItems: 1
          items:
            $ref: '#/components/schemas/AuthorizationRule'

    AuthorizationRule:
      type: object
      required:
        - operator
        - value
        - targets
      description: Grants targets when the owning mapping's claim value(s) satisfy operator against value.
      properties:
        operator:
          type: string
          description: >
            equals/not_equals and the ordering operators (greater_than, less_than,
            greater_than_or_equal, less_than_or_equal) are scalar comparisons and require the owning
            mapping to be single-valued; the ordering operators additionally require valueType
            "number". includes/not_includes test set membership and require the owning mapping to be
            multi-valued.
          enum:
            - equals
            - not_equals
            - greater_than
            - less_than
            - greater_than_or_equal
            - less_than_or_equal
            - includes
            - not_includes
          example: "equals"
        value:
          type: string
          description: >
            Value compared against the claim, always given as a string regardless of valueType (e.g.
            "true" for boolean, "5" for number).
          example: "engineering"
        targets:
          type: array
          description: Roles, groups, or permissions granted when this rule matches.
          minItems: 1
          items:
            $ref: '#/components/schemas/AuthorizationTarget'

    AuthorizationTarget:
      type: object
      required:
        - type
      description: >
        A single local role, group, or permission a matching rule confers. The referenced role,
        group, or permission must already exist; the connection is rejected otherwise.
      properties:
        type:
          type: string
          enum: [role, group, permission]
          example: "role"
        id:
          type: string
          description: Role or group id. Required when type is "role" or "group".
        resourceServerId:
          type: string
          description: >
            Resource server id the permission belongs to. Required when type is "permission"; a
            permission is only meaningful on one resource server.
        permission:
          type: string
          description: Permission handle on resourceServerId. Required when type is "permission".
          example: "read"

    AuthorizationDirectMapping:
      type: object
      required:
        - claim
        - targetType
      description: >
        Feeds every value of a single external claim directly onto local roles, groups, or
        permissions of targetType, using each value as the name (or permission string) to look up. A
        value with no unambiguous match (none, or more than one, since role and group names are only
        unique within an organization unit) confers nothing.
      properties:
        claim:
          type: string
          description: >
            Source claim. May be a dot-notation path into a nested claim (e.g. "address.country"). A
            list claim (a JSON array) is split into its elements automatically; a single value,
            including a number or boolean, is used as its own one-element token.
          example: "groups"
        delimiter:
          type: string
          description: Splits a single string claim value into multiple tokens. Not needed for a list claim.
          example: " "
        targetType:
          type: string
          enum: [role, group, permission]
          description: >
            What every claim value resolves to. A value is matched by exact name against existing
            roles or groups (regardless of organization unit); for "permission" it is validated
            directly against resourceServerId's defined permissions, since a permission is a string
            rather than a separately named entity.
          example: "group"
        resourceServerId:
          type: string
          description: >
            Resource server id claim values are validated against. Required when targetType is
            "permission"; not allowed otherwise.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "IDP-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      required: [key, defaultValue]
      properties:
        key: { type: string }
        defaultValue: { type: string }
