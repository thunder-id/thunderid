handle: "magic-link"
displayName: "Magic Link Sign-In Email"
channel: "email"
content:
  subject: "{{ t(notification:template.sign_in_title) }}"
  body: |
    <!DOCTYPE html>
    <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #181818;">
      <h2>{{ t(notification:template.sign_in_title) }}</h2>
      <p>{{ t(notification:template.sign_in_instructions) }}</p>
      <p><a href="{{ctx(magicLink)}}" style="display: inline-block; padding: 10px 20px;
        background-color: #3a87ed; color: #fff; text-decoration: none;
        border-radius: 4px;">{{ t(notification:template.sign_in) }}</a></p>
      <p>{{ t(notification:template.link_expiry_prefix) }} {{ctx(expiryTime)}}.</p>
      <p>{{ t(notification:template.fallback_link_instructions) }}</p>
      <p style="word-break: break-all;"><a href="{{ctx(magicLink)}}">{{ctx(magicLink)}}</a></p>
      <p>{{ t(notification:template.unrequested_email_disclaimer) }}</p>
    </body>
    </html>
