openapi: 3.0.3
info:
  title: OrganizationUnit Management API
  version: "1.0"
  description: Create and manage the organizational hierarchy. Organization units can be nested and are used to scope applications, users, groups, and policies.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Organization Units
    description: Create and manage organization units including member, group, and role assignments.
  - name: organization-units-by-path
    description: Create, retrieve, update, delete, and list organization units using their hierarchical handle path.

security:
  - OAuth2: [system]

paths:
  /organization-units:
    get:
      tags:
        - Organization Units
      summary: List root organization units
      description: |
        Lists the root organization units. With `projectId`, lists the top organization units of the
        project instead: its root organization units, and any organization unit whose parent is not in the
        project. The other organization units of the project are listed under their parent. A project that
        does not exist has no organization units. A caller who may list only some organization units gets
        every organization unit of the project it may list, at any level, as the list without `projectId`
        does.

        On the Data Plane, listing the root organization units requires the `system` permission. A token
        holding `org` or `org:ou` reaches only the organization unit it names, and lists that unit's children
        with `GET /organization-units/{id}/ous` instead.

        With `projectId` and `placement=true`, lists where a resource of the project can be placed: the
        system organization unit first, marked `isSystem`, then the project's top organization units. The
        system organization unit counts towards `totalResults` and is listed without its children, which
        belong to other projects too. A caller who may not list it gets the project's organization units
        alone. A project that does not exist has none. Combining `placement` with `filter` fails with `OU-1028`.

        With `within`, the placement listing keeps only the organization units in that organization unit's
        subtree, such as the ones a user type or an agent type allows. Within the system organization unit,
        that is the system organization unit and the project's organization units placed directly under it.
        Within an organization unit of the project, it is that organization unit alone, listed with its
        children under it. Within any other organization unit, it is empty.
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
        - $ref: '#/components/parameters/ouFilterParam'
        - in: query
          name: projectId
          required: false
          description: ID of the project whose organization units are listed.
          schema:
            type: string
            maxLength: 36
        - in: query
          name: placement
          required: false
          description: |
            With `projectId`, lists the organization units a resource of the project can be placed in: the
            system organization unit, then the project's top organization units.
          schema:
            type: boolean
        - in: query
          name: within
          required: false
          description: |
            With `placement=true`, keeps only the placements in the subtree of this organization unit, for
            example the organization unit of the user type or agent type being placed.
          schema:
            type: string
      responses:
        "200":
          description: List of root organization units, or of the top organization units of a project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                organizationUnits:
                  - id: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
                    handle: "engineering"
                    name: "Engineering"
                    description: "Engineering Unit"
                    projectId: "019a3000-0000-7000-8000-0000000000a1"
                    logoUrl: "https://example.com/logos/engineering.png"
                  - id: "b7c40de6-95cd-4c45-8725-9c7cb5b9cafd"
                    handle: "sales"
                    name: "Sales"
                    description: "Sales Unit"
                    logoUrl: "https://example.com/logos/sales.png"
                links:
                  - href: "organization-units?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "OU-1010"
                    message:
                      key: "error.ouservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.ouservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "OU-1011"
                    message:
                      key: "error.ouservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.ouservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
                invalid-filter:
                  summary: Invalid filter parameter
                  value:
                    code: "OU-1014"
                    message:
                      key: "error.ouservice.invalid_filter"
                      defaultValue: "Invalid filter parameter"
                    description:
                      key: "error.ouservice.invalid_filter_description"
                      defaultValue: "The filter parameter is invalid. Use format: attribute (eq|gt|lt) \"value\""
                placement-with-filter:
                  summary: Placement listing with a filter
                  value:
                    code: "OU-1028"
                    message:
                      key: "error.ouservice.placement_with_filter"
                      defaultValue: "Filter not supported with placement"
                    description:
                      key: "error.ouservice.placement_with_filter_description"
                      defaultValue: "The placement listing cannot be filtered. Remove the filter parameter or the placement parameter"
        "403":
          description: |
            The caller may not list the root organization units. On a data plane, only the `system`
            permission lists them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
                  defaultValue: "Unauthorized"
                description:
                  key: "error.unauthorized_description"
                  defaultValue: "The caller is not authorized to perform this operation"
        "500":
          description: Internal server error

    post:
      tags:
        - Organization Units
      summary: Create a new organization unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationUnitRequest'
            examples:
              root-ou:
                summary: Root organization unit
                value:
                  handle: "engineering"
                  name: "Engineering"
                  description: "Engineering Unit"
                  parent: null
                  projectId: "019a3000-0000-7000-8000-0000000000a1"
              nested-ou:
                summary: Nested organization unit
                value:
                  handle: "frontend"
                  name: "Frontend Team"
                  description: "Handles UI/UX work"
                  parent: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
                  projectId: "019a3000-0000-7000-8000-0000000000a1"
      responses:
        "201":
          description: Organization unit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnit'
              examples:
                root-ou:
                  summary: Root organization unit
                  value:
                    id: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
                    handle: "engineering"
                    name: "Engineering"
                    description: "Engineering Unit"
                    parent: null
                    projectId: "019a3000-0000-7000-8000-0000000000a1"
                nested-ou:
                  summary: Nested organization unit
                  value:
                    id: "4d4cb83a-9bb8-4fd7-970e-36b65f9c8ea4"
                    handle: "frontend"
                    name: "Frontend Team"
                    description: "Handles UI/UX work"
                    parent: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
                    projectId: "019a3000-0000-7000-8000-0000000000a1"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request:
                  summary: Invalid request format
                  value:
                    code: "OU-1001"
                    message:
                      key: "error.ouservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.ouservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed, contains invalid data, or required fields are missing/empty"
                parent-not-found:
                  summary: Parent organization unit not found
                  value:
                    code: "OU-1005"
                    message:
                      key: "error.ouservice.parent_organization_unit_not_found"
                      defaultValue: "Parent organization unit not found"
                    description:
                      key: "error.ouservice.parent_organization_unit_not_found_description"
                      defaultValue: "Parent organization unit not found"
                circular-dependency:
                  summary: Circular dependency detected
                  value:
                    code: "OU-1007"
                    message:
                      key: "error.ouservice.circular_dependency_detected"
                      defaultValue: "Circular dependency detected"
                    description:
                      key: "error.ouservice.circular_dependency_detected_description"
                      defaultValue: "Setting this parent would create a circular dependency"
                project-required:
                  summary: Project required on the Control Plane
                  value:
                    code: "OU-1023"
                    message:
                      key: "error.ouservice.project_required"
                      defaultValue: "Project required"
                    description:
                      key: "error.ouservice.project_required_description"
                      defaultValue: "An organization unit must belong to a project. Set projectId to the project it belongs to"
                invalid-project:
                  summary: Project does not exist
                  value:
                    code: "OU-1022"
                    message:
                      key: "error.ouservice.invalid_project"
                      defaultValue: "Invalid project"
                    description:
                      key: "error.ouservice.invalid_project_description"
                      defaultValue: "No project exists with the given project ID"
                parent-in-another-project:
                  summary: Parent in another project
                  value:
                    code: "OU-1024"
                    message:
                      key: "error.ouservice.parent_in_another_project"
                      defaultValue: "Parent in another project"
                    description:
                      key: "error.ouservice.parent_in_another_project_description"
                      defaultValue: "An organization unit must be in the same project as its parent, unless its parent is the system organization unit"
                system-ou-in-project:
                  summary: System organization unit in a project
                  value:
                    code: "OU-1025"
                    message:
                      key: "error.ouservice.system_ou_in_project"
                      defaultValue: "System organization unit in a project"
                    description:
                      key: "error.ouservice.system_ou_in_project_description"
                      defaultValue: "The system organization unit is shared by every project and cannot belong to one"
        "403":
          description: |
            The caller may not create an organization unit under the parent. On a data plane, no token
            creates a root organization unit, whatever its permissions: only an import with the
            management API key does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
                  defaultValue: "Unauthorized"
                description:
                  key: "error.unauthorized_description"
                  defaultValue: "The caller is not authorized to perform this operation"
        "409":
          description: 'Conflict: Organization unit already exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Organization unit name conflict
                  value:
                    code: "OU-1004"
                    message:
                      key: "error.ouservice.organization_unit_name_conflict"
                      defaultValue: "Organization unit name conflict"
                    description:
                      key: "error.ouservice.organization_unit_name_conflict_description"
                      defaultValue: "An organization unit with the same name exists under the same parent"
                handle-conflict:
                  summary: Organization unit handle conflict
                  value:
                    code: "OU-1008"
                    message:
                      key: "error.ouservice.organization_unit_handle_conflict"
                      defaultValue: "Organization unit handle conflict"
                    description:
                      key: "error.ouservice.organization_unit_handle_conflict_description"
                      defaultValue: "An organization unit with the same handle already exists under the same parent"
        "500":
          description: Internal server error

  /organization-units/{id}:
    get:
      tags:
        - Organization Units
      summary: Get an organization unit by id
      description: |
        On the Data Plane, a token holding `org` or `org:ou` without `system` reads the organization unit it
        names and that unit's direct children. Any other organization unit is refused with `403`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization unit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnit'
              example:
                id: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
                handle: "engineering"
                name: "Engineering Team"
                description: "Engineering unit that handles all engineering tasks"
                parent: null
        "403":
          description: |
            The caller may not read the organization unit. On a data plane, a token holding `org` or
            `org:ou` without `system` reads only the organization unit it names and its direct children.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
                  defaultValue: "Unauthorized"
                description:
                  key: "error.unauthorized_description"
                  defaultValue: "The caller is not authorized to perform this operation"
        "404":
          description: Organization unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1003"
                message:
                  key: "error.ouservice.organization_unit_not_found"
                  defaultValue: "Organization unit not found"
                description:
                  key: "error.ouservice.organization_unit_not_found_description"
                  defaultValue: "The organization unit with the specified id does not exist"
        "500":
          description: Internal server error

    put:
      tags:
        - Organization Units
      summary: Update an organization unit by id
      description: |
        On the Data Plane, a token holding `org` or `org:ou` without `system` updates only the direct
        children of the organization unit it names. Its own unit and any other organization unit are refused
        with `403`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationUnitRequest'
            example:
              handle: "engineering"
              name: "Engineering Team"
              description: "Engineering unit that handles all engineering tasks"
              parent: null
              projectId: "019a3000-0000-7000-8000-0000000000a1"
      responses:
        "200":
          description: Organization unit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnit'
              example:
                id: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
                handle: "engineering"
                name: "Engineering Team"
                description: "Engineering unit that handles all engineering tasks"
                parent: null
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request:
                  summary: Invalid request format
                  value:
                    code: "OU-1001"
                    message:
                      key: "error.ouservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.ouservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed, contains invalid data, or required fields are missing/empty"
                parent-not-found:
                  summary: Parent organization unit not found
                  value:
                    code: "OU-1005"
                    message:
                      key: "error.ouservice.parent_organization_unit_not_found"
                      defaultValue: "Parent organization unit not found"
                    description:
                      key: "error.ouservice.parent_organization_unit_not_found_description"
                      defaultValue: "Parent organization unit not found"
                circular-dependency:
                  summary: Circular dependency detected
                  value:
                    code: "OU-1007"
                    message:
                      key: "error.ouservice.circular_dependency_detected"
                      defaultValue: "Circular dependency detected"
                    description:
                      key: "error.ouservice.circular_dependency_detected_description"
                      defaultValue: "Setting this parent would create a circular dependency"
                invalid-project:
                  summary: Project does not exist
                  value:
                    code: "OU-1022"
                    message:
                      key: "error.ouservice.invalid_project"
                      defaultValue: "Invalid project"
                    description:
                      key: "error.ouservice.invalid_project_description"
                      defaultValue: "No project exists with the given project ID"
                parent-in-another-project:
                  summary: Parent in another project
                  value:
                    code: "OU-1024"
                    message:
                      key: "error.ouservice.parent_in_another_project"
                      defaultValue: "Parent in another project"
                    description:
                      key: "error.ouservice.parent_in_another_project_description"
                      defaultValue: "An organization unit must be in the same project as its parent, unless its parent is the system organization unit"
                system-ou-in-project:
                  summary: System organization unit in a project
                  value:
                    code: "OU-1025"
                    message:
                      key: "error.ouservice.system_ou_in_project"
                      defaultValue: "System organization unit in a project"
                    description:
                      key: "error.ouservice.system_ou_in_project_description"
                      defaultValue: "The system organization unit is shared by every project and cannot belong to one"
                declarative-descendant:
                  summary: Project move reaches a declarative descendant
                  value:
                    code: "OU-1012"
                    message:
                      key: "error.ouservice.cannot_modify_declarative_resource"
                      defaultValue: "Cannot modify declarative resource"
                    description:
                      key: "error.ouservice.cannot_modify_declarative_resource_description"
                      defaultValue: "The organization unit is declarative and cannot be modified or deleted"
                project-move-with-resources:
                  summary: Project move while the organization units hold resources
                  value:
                    code: "OU-1027"
                    message:
                      key: "error.ouservice.project_move_with_resources"
                      defaultValue: "Organization unit holds resources"
                    description:
                      key: "error.ouservice.project_move_with_resources_description"
                      defaultValue: "An organization unit can move to another project only while it and the organization units beneath it hold no resources"
        "403":
          description: |
            The caller may not update the organization unit. Moving it also needs the permission to
            create an organization unit beneath its new parent, or at the root for a move to the root.
            On a data plane, no token moves an organization
            unit to the root, whatever its permissions: only an import with the management API key
            does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
                  defaultValue: "Unauthorized"
                description:
                  key: "error.unauthorized_description"
                  defaultValue: "The caller is not authorized to perform this operation"
        "404":
          description: Organization unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1003"
                message:
                  key: "error.ouservice.organization_unit_not_found"
                  defaultValue: "Organization unit not found"
                description:
                  key: "error.ouservice.organization_unit_not_found_description"
                  defaultValue: "The organization unit with the specified id does not exist"
        "409":
          description: 'Conflict: Organization unit already exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Organization unit name conflict
                  value:
                    code: "OU-1004"
                    message:
                      key: "error.ouservice.organization_unit_name_conflict"
                      defaultValue: "Organization unit name conflict"
                    description:
                      key: "error.ouservice.organization_unit_name_conflict_description"
                      defaultValue: "An organization unit with the same name exists under the same parent"
                handle-conflict:
                  summary: Organization unit handle conflict
                  value:
                    code: "OU-1008"
                    message:
                      key: "error.ouservice.organization_unit_handle_conflict"
                      defaultValue: "Organization unit handle conflict"
                    description:
                      key: "error.ouservice.organization_unit_handle_conflict_description"
                      defaultValue: "An organization unit with the same handle already exists under the same parent"
        "500":
          description: Internal server error

    delete:
      tags:
        - Organization Units
      summary: Delete an organization unit by id
      description: |
        On the Data Plane, a token holding `org` or `org:ou` without `system` deletes only the direct
        children of the organization unit it names. Its own unit and any other organization unit are refused
        with `403`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Organization unit deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                has-children:
                  summary: Organization unit has children
                  value:
                    code: "OU-1006"
                    message:
                      key: "error.ouservice.organization_unit_has_children"
                      defaultValue: "Organization unit has children"
                    description:
                      key: "error.ouservice.organization_unit_has_children_description"
                      defaultValue: "Cannot delete an organization unit while other resources, such as child organization units, users, groups, roles or applications, belong to it or refer to it"
                system-ou:
                  summary: The system organization unit
                  value:
                    code: "OU-1021"
                    message:
                      key: "error.ouservice.cannot_delete_system_ou"
                      defaultValue: "System organization unit cannot be deleted"
                    description:
                      key: "error.ouservice.cannot_delete_system_ou_description"
                      defaultValue: "The deployment configuration names this organization unit in server.system_ou_id"
        "403":
          description: |
            The caller may not delete the organization unit. On a data plane, a token holding `org` or
            `org:ou` without `system` deletes only the direct children of the organization unit it names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
                  defaultValue: "Unauthorized"
                description:
                  key: "error.unauthorized_description"
                  defaultValue: "The caller is not authorized to perform this operation"
        "404":
          description: Organization unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1003"
                message:
                  key: "error.ouservice.organization_unit_not_found"
                  defaultValue: "Organization unit not found"
                description:
                  key: "error.ouservice.organization_unit_not_found_description"
                  defaultValue: "The organization unit with the specified id does not exist"
        "500":
          description: Internal server error

  /organization-units/{id}/ous:
    get:
      tags:
        - Organization Units
      summary: List child organization units
      description: |
        On the Data Plane, a token holding `org` or `org:ou` without `system` lists the children of the
        organization unit it names only. The children of any other organization unit are refused with `403`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
        - $ref: '#/components/parameters/ouFilterParam'
      responses:
        "200":
          description: List of child organization units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                organizationUnits:
                  - id: "6b59f277-fd79-40b1-afca-dce75d3709f7"
                    name: "Frontend Team"
                    handle: "frontend"
                    description: "Handles UI/UX work"
                    logoUrl: "https://example.com/logos/frontend.png"
                  - id: "2a8f9e1c-4d7b-4c8a-9f3e-1b2c3d4e5f6g"
                    name: "Backend Team"
                    handle: "backend"
                    description: "Handles server-side development"
                    logoUrl: null
                links:
                  - href: "organization-units/afc77cfd-620b-4cf0-a31c-7377b0ea8902/ous?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "OU-1010"
                    message:
                      key: "error.ouservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.ouservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "OU-1011"
                    message:
                      key: "error.ouservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.ouservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
                invalid-filter:
                  summary: Invalid filter parameter
                  value:
                    code: "OU-1014"
                    message:
                      key: "error.ouservice.invalid_filter"
                      defaultValue: "Invalid filter parameter"
                    description:
                      key: "error.ouservice.invalid_filter_description"
                      defaultValue: "The filter parameter is invalid. Use format: attribute (eq|gt|lt) \"value\""
        "403":
          description: |
            The caller may not list the children of the organization unit. On a data plane, a token
            holding `org` or `org:ou` without `system` lists only the children of the organization unit it
            names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
