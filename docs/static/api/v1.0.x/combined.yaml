  /users/{id}/usages:
    get:
      tags:
        - Users
      summary: Get user usages
      description: >
        Returns the resources that reference this user, aggregated across all
        resource types.

        For example, agents that list this user as their owner. This endpoint is
        informational

        only — it drives the pre-delete confirmation dialog in the UI and does
        not gate deletion

        on the server.


        Each usage entry includes a `behaviorOnDelete` field describing what
        happens to the

        referencing resource if the user is deleted:

        - `fallback`: the reference is kept as-is.

        - `cascade`: the resource is permanently deleted along with the user.


        When usage data is unavailable (e.g. the server has not fully
        initialised),

        `totalResults` and `summary` are `null` rather than `0`/empty. Consumers
        must treat

        `null` as "unknown" and `0` as "confirmed empty".
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the user
          example: 9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3
      responses:
        "200":
          description: Resources that reference this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceUsagesResponse"
              example:
                totalResults: 2
                count: 2
                summary:
                  agent: 2
                usages:
                  - resourceType: agent
                    id: a1b2c3d4-0000-0000-0000-000000000001
                    displayName: Support Agent
                    behaviorOnDelete: fallback
                  - resourceType: agent
                    id: a1b2c3d4-0000-0000-0000-000000000002
                    displayName: Billing Agent
                    behaviorOnDelete: fallback
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: USR-1003
                message:
                  key: error.userservice.user_not_found
                  defaultValue: User not found
                description:
                  key: error.userservice.user_not_found_description
                  defaultValue: The user with the specified id does not exist
        "500":
