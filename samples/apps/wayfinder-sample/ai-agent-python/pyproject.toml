[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wayfinder-concierge-python"
version = "0.1.0"
description = "Python Wayfinder Concierge sample using the ThunderID SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "thunderid>=0.1.0,<0.2",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "langchain==1.4.6",
    "langchain-google-genai==4.4.2",
    "langgraph==1.2.16",
    "langchain-mcp-adapters==0.3.2",
    "PyJWT[crypto]>=2.10.1,<3",
]

[project.scripts]
wayfinder-agent = "wayfinder_agent.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/wayfinder_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
