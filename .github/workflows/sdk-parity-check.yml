# Gates every pull request in a ThunderID SDK repository on an explicit cross-SDK parity decision,
# so a capability that ships in one SDK is never silently forgotten in the others.
#
# Specification: docs-internals/sdk-development/spec.md, in this repository
# Tracking issue: https://github.com/thunder-id/thunderid/issues/5305
#
# Every pull request must carry exactly one of:
#
#   parity/prs-raised      the ports exist in the other SDKs, or are recorded as not applying there
#   parity/prs-not-needed  nothing here reaches another SDK
#
# Until one is present the check fails. A label is the only thing that clears it: there is no path
# based exemption, because "this looked like a docs change" is exactly how a gap gets through.
# Applying or removing a label re-runs the check, so it clears without a push.
#
# Alongside the gate, the check posts one comment carrying a checklist of the sibling repositories
# and ticks the boxes itself as port links appear in the pull request body or in replies on the
# thread. Contributors cannot edit that comment, external ones especially, so nobody is asked to
# maintain it by hand.
#
# This workflow is called by a thin caller in each SDK repository, which owns the triggers. It
# reads the calling repository from the event, so the caller passes nothing and the sibling list
# cannot drift between repositories. It lives here, next to the specification it enforces, rather
# than four times over in the SDK repositories.
#
# `pull_request_target` in the caller, rather than `pull_request`, is deliberate: the check has to
# label and comment on pull requests opened from forks, where the `pull_request` token is read
# only. Nothing from the contributor's branch is checked out or executed here, so the elevated
# token is never handed to untrusted code. Keep it that way.
#
# Uses:
#   OS: ubuntu-latest

name: SDK Parity Check

on:
  workflow_call:
    inputs:
      siblings:
        description: >
          Optional override for the repositories a change here may need to be ported to, one per
          line as "owner/repo: description". Defaults to the other ThunderID SDK repositories.
        required: false
        type: string
        default: ""
      automation_authors:
        description: >
          Accounts whose pull requests record the parity decision automatically, one per line or
          comma separated. Any login ending in "[bot]" is treated this way without being listed.
        required: false
        type: string
        default: "thunder-automation-bot"

jobs:
  parity:
    name: 🏷️ Parity Decision
    # Comments on plain issues are out of scope; only pull request threads carry a parity decision.
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: ⏭️ Skip for the merge queue
        if: github.event_name == 'merge_group'
        run: echo "The parity decision was already enforced on the pull request; nothing to do here."

      - name: 🏷️ Check the parity label and refresh the port checklist
        if: github.event_name != 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIBLINGS_OVERRIDE: ${{ inputs.siblings }}
          AUTOMATION_AUTHORS: ${{ inputs.automation_authors }}
        with:
          script: |
            // Identifies this check's own comment so it is updated in place rather than posted
            // again on every push, label change, or reply.
            const MARKER = '<!-- thunderid-parity-check -->';

            const RAISED_LABEL = 'parity/prs-raised';
            const NOT_NEEDED_LABEL = 'parity/prs-not-needed';
            const SPEC = 'https://github.com/thunder-id/thunderid/blob/main/docs-internals/sdk-development/spec.md';
            const UNACCOUNTED_HEADING = 'Still unaccounted for:';
            // Only a pull request event can set the check's status, so only those runs record
            // what it was set to. A comment run carries the previous value through untouched,
            // which is what lets it tell "the check is red and my reply just fixed that" from
            // "the check is already green".
            const GATE_RED = '<!-- thunderid-parity-gate:red -->';
            const GATE_GREEN = '<!-- thunderid-parity-gate:green -->';

            // Every ThunderID SDK repository. The one the check is running in drops out below, so
            // this list is identical in all four and there is no per repository input to keep in
            // step.
            const SDK_REPOSITORIES = [
              ['thunder-id/javascript-sdks', 'JavaScript (React, Vue, Nuxt, Next.js, Express, React Router, TanStack Router, Browser, Node)'],
              ['thunder-id/ios-sdks', 'iOS'],
              ['thunder-id/android-sdks', 'Android'],
              ['thunder-id/flutter-sdks', 'Flutter'],
            ];

            const override = (process.env.SIBLINGS_OVERRIDE || '').trim();
            const siblings = (override
              ? override.split('\n').map(line => {
                  const [repo, ...rest] = line.trim().split(':');
                  return [repo.trim(), rest.join(':').trim()];
                })
              : SDK_REPOSITORIES
            )
              // Matched on the repository name rather than `owner/repo`, so the check still
              // excludes itself when it runs in a fork, where the owner differs.
              .filter(([repo]) => repo && repo.split('/')[1] !== context.repo.repo)
              .map(([repo, description]) => ({ repo, description }));

            // `pull_request_target` carries the pull request under `pull_request`, `issue_comment`
            // carries it under `issue`. Both expose the number, body and labels this check reads.
            const target = context.payload.pull_request || context.payload.issue;
            if (!target) {
              core.setFailed('Could not find the pull request in the event payload.');
              return;
            }

            // Editing our own comment fires `issue_comment: edited` again. Bail out before we
            // rewrite it and loop.
            const triggeringComment = context.payload.comment;
            if (triggeringComment && (triggeringComment.body || '').includes(MARKER)) {
              core.info('Triggered by this check\'s own comment; nothing to do.');
              return;
            }

            // `issue_comment` fires on merged and closed pull requests as well, where there is no
            // decision left to ask for.
            const isOpen = (target.state || 'open') === 'open';

            const labels = (target.labels || []).map(label => label.name);
            const hasRaised = labels.includes(RAISED_LABEL);
            const hasNotNeeded = labels.includes(NOT_NEEDED_LABEL);

            // A dependency bump raised by automation is the mechanism the specification asks
            // for: the pins follow a native release, so the change has already been made and
            // reviewed in the SDK it came from. There is nothing to port and nobody to ask,
            // and a checklist comment on every one of them trains people to ignore the check.
            //
            // The decision is still recorded rather than skipped, which is what the
            // specification actually requires: the label goes on, it survives the merge, and a
            // merged pull request that never made the decision is still queryable. The
            // judgement is a person's, made once when they put an account on this list, rather
            // than per pull request.
            //
            // Author based, never path based. Which files a change touches cannot be trusted to
            // say whether it reaches the other SDKs; who raised it can, because a machine
            // account raises exactly one kind of change.
            const automationAuthors = (process.env.AUTOMATION_AUTHORS || '')
              .split(/[\n,]/)
              .map(entry => entry.trim().toLowerCase())
              .filter(Boolean);
            const author = ((target.user || {}).login || '').toLowerCase();
            const isAutomation = author.endsWith('[bot]') || automationAuthors.includes(author);

            if (isAutomation && isOpen) {
              if (!hasRaised && !hasNotNeeded) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: target.number,
                  labels: [NOT_NEEDED_LABEL],
                });
                core.info(`Raised by ${author}; recorded ${NOT_NEEDED_LABEL} automatically.`);
              } else {
                core.info(`Raised by ${author}; a parity label is already present.`);
              }
              // Clear a checklist this check left on an earlier run, from before the account
              // was recognised as automation. Leaving it would keep asking a question that is
              // already answered, and it is this check's own comment to withdraw.
              const priorComments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number,
                per_page: 100,
              });
              const stranded = priorComments.find(c => c.body && c.body.includes(MARKER));
              if (stranded) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: stranded.id,
                });
                core.info('Removed the parity checklist left on an automation pull request.');
              }

              // No checklist comment: there is no question outstanding for anyone to answer.
              return;
            }


            // Paginated: a long thread puts later replies, and possibly this check's own
            // comment, past the first page, which would lose port links and post a duplicate.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: target.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(MARKER));
            // Read before the comment is rewritten below. A thread with no comment yet has never
            // had a passing check, so it counts as red.
            const gateWasRed = !existing || !existing.body.includes(GATE_GREEN);

            // Everywhere a port link could have been written: the pull request description and
            // every reply on the thread, minus this check's own comment.
            const haystack = [
              target.body || '',
              ...comments
                .filter(comment => comment.id !== (existing && existing.id))
                .map(comment => comment.body || ''),
            ].join('\n');

            const escapeForRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            // Recognises both link styles GitHub renders: the full URL and the owner/repo#123
            // shorthand. Issues count as well as pull requests, since a recorded deferral is a
            // recorded deferral, and the kind is carried through so the checklist links back to
            // the thing that was actually written.
            const findPorts = (repo) => {
              const escaped = escapeForRegExp(repo);
              const patterns = [
                [new RegExp(`https?://github\\.com/${escaped}/(pull|issues)/(\\d+)`, 'g'), true],
                [new RegExp(`(?:^|[^\\w/-])${escaped}#(\\d+)`, 'g'), false],
              ];
              const byNumber = new Map();
              for (const [pattern, carriesKind] of patterns) {
                for (const match of haystack.matchAll(pattern)) {
                  // The shorthand does not say which it is. Either path redirects to the other on
                  // GitHub, so an unqualified reference is rendered as an issue link.
                  const kind = carriesKind ? match[1] : 'issues';
                  const number = Number(carriesKind ? match[2] : match[1]);
                  if (!byNumber.has(number)) byNumber.set(number, kind);
                }
              }
              return [...byNumber.entries()]
                .map(([number, kind]) => ({ number, kind }))
                .sort((a, b) => a.number - b.number);
            };

            // A sibling a change does not reach is accounted for by saying so in the thread.
            // Free prose cannot be recognised, so one of these phrases on a line naming the
            // repository is what marks it, and the check's own comment says as much.
            const NOT_APPLICABLE = /\b(n\/a|not applicable|not needed|no change needed|does not apply|doesn't apply)\b/i;
            const findNotApplicable = (repo) => {
              const name = escapeForRegExp(repo.split('/')[1]);
              const mentions = new RegExp(`(?:^|[^\\w/-])(?:[\\w.-]+/)?${name}\\b`, 'i');
              const line = haystack
                .split('\n')
                .map(entry => entry.trim())
                .find(entry => mentions.test(entry) && NOT_APPLICABLE.test(entry));
              return line || null;
            };

            const ports = siblings.map(sibling => {
              const links = findPorts(sibling.repo);
              return {
                ...sibling,
                links,
                notApplicable: links.length ? null : findNotApplicable(sibling.repo),
              };
            });
            const accountedFor = ports.filter(port => port.links.length || port.notApplicable);
            const unaccounted = ports.filter(port => !port.links.length && !port.notApplicable);

            const checklist = ports
              .map(({ repo, description, links, notApplicable }) => {
                const box = links.length || notApplicable ? 'x' : ' ';
                const rendered = links.length
                  ? links.map(({ number, kind }) => `[#${number}](https://github.com/${repo}/${kind}/${number})`).join(', ')
                  : notApplicable ? 'does not apply' : '';
                return `- [${box}] \`${repo}\`, ${description}${rendered ? ` => ${rendered}` : ''}`;
              })
              .join('\n');

            const howToDecide = [
              '| Label | What it asserts |',
              '| --- | --- |',
              `| \`${RAISED_LABEL}\` | The ports exist in every other SDK this change reaches, or are recorded as not applying there. |`,
              `| \`${NOT_NEEDED_LABEL}\` | Nothing to port: a fix, refactor, docs, CI, dependency bump, release, or a change specific to this platform. |`,
            ].join('\n');

            // A block to copy, one line per repository still open, rather than a description of
            // what to write. The placeholder deliberately carries none of the phrases that mark a
            // repository as not applicable: pasting this back unfilled must leave the answer
            // incomplete rather than quietly accounting for everything.
            const isCommentRun = context.eventName === 'issue_comment';
            const missing = unaccounted.map(port => `\`${port.repo}\``).join(', ');

            const PLACEHOLDER = '<paste the port link here>';
            const replyTemplate = unaccounted
              .map(({ repo }) => `- ${repo}: ${PLACEHOLDER}`)
              .join('\n');

            // Raised to an alert, because this is the one thing on the comment the author has to
            // act on and it sits below a checklist that looks like the actionable part.
            const howToReply = !unaccounted.length ? '' : [
              '[!IMPORTANT]',
              '**Reply to this comment with this block**, filled in. The boxes above tick',
              'themselves when you post it.',
              '',
              '```',
              replyTemplate,
              '```',
              '',
              `A link can be a pull request or a tracked issue, written in full or as \`${siblings[0].repo}#123\`.`,
              'Where the change does not reach an SDK, replace the placeholder with `N/A` and a short',
              `reason, as in \`- ${siblings[0].repo}: N/A, the capability has no equivalent there\`.`,
            ]
              // Flattened first: the template is itself several lines, and every one of them has
              // to carry the quote marker or the alert ends early.
              .join('\n')
              .split('\n')
              .map(line => (line ? `> ${line}` : '>'))
              .join('\n');

            const detected = accountedFor.length
              ? `${accountedFor.length} of ${ports.length} sibling SDKs accounted for.`
              : 'No sibling SDKs accounted for on this thread yet.';

            const unaccountedFor = `The contract is in the [SDK development specification](${SPEC}).`;

            let failure = null;
            let body = null;

            if (hasRaised && hasNotNeeded) {
              failure = `This pull request carries both ${RAISED_LABEL} and ${NOT_NEEDED_LABEL}. Remove one.`;
              body = [
                MARKER,
                '### 🔀 Cross-SDK feature parity',
                '',
                `This pull request carries **both** \`${RAISED_LABEL}\` and \`${NOT_NEEDED_LABEL}\`. Remove whichever does not apply, because the parity decision has to be unambiguous.`,
                '',
                howToDecide,
              ].join('\n');
            } else if (!hasRaised && !hasNotNeeded) {
              failure = `This pull request must carry exactly one of ${RAISED_LABEL} or ${NOT_NEEDED_LABEL}.`;
              body = [
                MARKER,
                '### 🔀 Cross-SDK feature parity',
                '',
                'Does this change need to ship in the other ThunderID SDKs too? This check stays red until one of these labels answers that:',
                '',
                howToDecide,
                '',
                '#### Ports (DO NOT EDIT)',
                '',
                checklist,
                '',
                detected,
                '',
                howToReply,
                '',
                unaccountedFor,
              ].join('\n');
            } else if (hasRaised) {
              // The label asserts the capability reaches the other SDKs, so every one of them
              // needs a disposition before this passes: a linked pull request, a linked tracked
              // issue where the port is deferred, or a line saying it does not apply there. A
              // partial answer is how a gap gets missed, so it fails like no answer at all.
              if (unaccounted.length) {
                failure = `Labelled ${RAISED_LABEL}, but ${unaccounted.map(port => port.repo).join(', ')} ${unaccounted.length === 1 ? 'is' : 'are'} unaccounted for.`;
              }
              body = [
                MARKER,
                '### 🔀 Cross-SDK feature parity, ports raised',
                '',
                `This pull request is labelled \`${RAISED_LABEL}\`, so the capability it introduces is expected in the other ThunderID SDKs as well.`,
                '',
                '#### Ports (DO NOT EDIT)',
                '',
                checklist,
                '',
                detected,
                // What this says about the check has to match what the check actually says, and
                // a comment run changes neither: it cannot set the status, so a thread can be
                // complete under a red check, or incomplete under a green one where a reply
                // carrying a port link was edited away.
                // Only a comment run can disagree with the check: it sets no status, so the
                // thread can be complete under a red check, or incomplete under a green one
                // where the reply carrying a port link was edited away. A pull request run is
                // setting the status as it writes this, so it speaks for it directly.
                unaccounted.length
                  ? isCommentRun && !gateWasRed
                    ? `\n${UNACCOUNTED_HEADING} ${missing}. The check last passed and still shows green. It goes red the next time it runs, unless each one has a linked pull request, a linked tracked issue, or a line saying it does not apply.\n`
                    : `\n${UNACCOUNTED_HEADING} ${missing}. This check stays red until each one has a linked pull request, a linked tracked issue, or a line saying it does not apply.\n`
                  : isCommentRun && gateWasRed
                    ? '\nEvery sibling SDK is accounted for. The check cannot turn itself green from a reply: re-run it, push to the branch, or re-apply the label, and it will clear.\n'
                    : '\nEvery sibling SDK is accounted for.\n',
                howToReply,
                '',
                unaccountedFor,
              ].join('\n');
            } else {
              body = [
                MARKER,
                '### 🔀 Cross-SDK feature parity, no ports needed',
                '',
                `This pull request is labelled \`${NOT_NEEDED_LABEL}\`: nothing here has to ship in the other ThunderID SDKs. If that changes, swap the label for \`${RAISED_LABEL}\`.`,
              ].join('\n');
            }

            // A comment run cannot change the status, so it must not claim to: it carries the
            // marker the last pull request run left behind.
            const gateMarker = context.eventName === 'issue_comment'
              ? (gateWasRed ? GATE_RED : GATE_GREEN)
              : (failure ? GATE_RED : GATE_GREEN);
            body = `${body}\n${gateMarker}`;

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                core.info('Comment already up to date.');
              }
            } else if ((hasRaised || failure) && isOpen) {
              // A pull request that opens straight into `prs-not-needed` has nothing to ask for,
              // so stay quiet rather than commenting only to say there is nothing to do. Every
              // other state, the both-labels conflict included, needs its explanation or the red
              // check has nothing pointing at the fix.
              //
              // An open pull request that predates this check still owes the same decision, so
              // introducing the checklist there, including from a comment on the thread, is the
              // point. A closed or merged one owes nothing, and `issue_comment` fires on those
              // too, so the checklist would be landing on settled history.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number,
                body,
              });
            }

            // A comment event is not part of the pull request's check suite, so failing here would
            // surface a red run detached from the pull request. Replies refresh the checklist
            // only; the label gate is enforced on pull request events.
            if (failure && context.eventName === 'issue_comment') {
              core.info(`Checklist refreshed. The label gate is still unsatisfied: ${failure}`);
            } else if (failure) {
              core.setFailed(failure);
            } else {
              core.info(`Parity decision recorded: ${hasRaised ? RAISED_LABEL : NOT_NEEDED_LABEL}`);
            }
