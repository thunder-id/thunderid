          description: User type deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: USRS-1004
                message:
                  key: error.entitytypeservice.invalid_user_type_request
                  defaultValue: Invalid user type request
