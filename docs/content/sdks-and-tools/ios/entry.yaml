# SDKs & tools registry entry. Schema: docs/src/types/ecosystem.ts
# Metadata for one entry. Its pages, when it has any, sit beside this file or
# under another content tree; `docs:` below says where.
id: ios
name: iOS
icon: IOSLogo
category: mobile
type: sdk
origin: official
status: ga
package:
  name: ThunderID
  manager: pod
description: Native Swift SDK with hosted login and secure token storage.
docs:
  overview: /docs/next/sdks-and-tools/ios/overview
  quickstart: /docs/next/getting-started/connect-your-application/ios
links:
  github: https://github.com/thunder-id/ios-sdks
apiReference:
  source: manual

sections:
  - type: api
    id: api
    title: API reference
    intro: Every export is fully typed. The signatures and props below come from the package's own reference documentation,
      so what is listed here is what the installed version ships.
    kindTones:
      component: primary
      function: accent
    exports:
    - group: Components
      kind: component
      name: SignIn
      description: 'The `SignIn` component renders a full app-native sign-in form. It drives the Flow Execution API
        loop automatically: initiating the flow, presenting the server-defined inputs and actions on each step, and
        completing when the user is authenticated. `SignIn` requires `.thunderIDProvider(config:)` in its ancestor view
        hierarchy.'
      rowsLabel: Parameters
      rows:
      - name: applicationId
        type: String
        tag: required
        description: The Application ID from your {{ProductName}} application settings. Identifies which sign-in flow
          to execute.
      - name: onComplete
        type: (() -> Void)?
        tag: optional
        description: Called when authentication completes successfully.
      - name: onError
        type: ((String) -> Void)?
        tag: optional
        description: Called with an error message when a flow step fails.
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        struct AuthView: View {
            var body: some View {
                SignIn(applicationId: "<your-application-id>")
                    .padding()
            }
        }
    - group: Components
      kind: component
      name: SignInButton
      description: The `SignInButton` component renders a pre-styled button that you can use to trigger your sign-in
        flow. It reads loading state from `ThunderIDState` and disables itself automatically while an operation is in
        progress. `SignInButton` requires `.thunderIDProvider(config:)` in its ancestor view hierarchy.
      rowsLabel: Parameters
      rows:
      - name: onTap
        type: (() -> Void)?
        tag: optional
        description: Called when the button is tapped. Use this to present a sign-in sheet or navigate to an auth view.
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        struct LandingView: View {
            var body: some View {
                SignInButton()
            }
        }
    - group: Components
      kind: component
      name: SignOutButton
      description: The `SignOutButton` component renders a pre-styled button that calls `ThunderIDClient.signOut()`,
        then calls `ThunderIDState.refresh()` to update the reactive auth state. It disables itself automatically while
        the sign-out operation is in progress. `SignOutButton` requires `.thunderIDProvider(config:)` in its ancestor
        view hierarchy.
      rowsLabel: Parameters
      rows:
      - name: onSignOutComplete
        type: (() -> Void)?
        tag: optional
        description: Called after sign-out completes and `ThunderIDState` has been refreshed.
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        struct HomeView: View {
            var body: some View {
                VStack {
                    Text("You are signed in.")
                    SignOutButton()
                }
            }
        }
    - group: Components
      kind: component
      name: SignUp
      description: 'The `SignUp` component renders a full app-native registration form. It drives the Flow Execution
        API registration loop automatically: initiating the flow, presenting the server-defined inputs and actions on
        each step, and completing when the user is registered and authenticated. `SignUp` requires `.thunderIDProvider(config:)`
        in its ancestor view hierarchy.'
      rowsLabel: Parameters
      rows:
      - name: applicationId
        type: String
        tag: required
        description: The Application ID from your {{ProductName}} application settings. Identifies which registration
          flow to execute.
      - name: onComplete
        type: (() -> Void)?
        tag: optional
        description: Called when registration completes successfully.
      - name: onError
        type: ((String) -> Void)?
        tag: optional
        description: Called with an error message when a flow step fails.
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        struct AuthView: View {
            @State private var showSignUp = false

            var body: some View {
                if showSignUp {
                    SignUp(applicationId: "<your-application-id>")
                        .padding()
                } else {
                    SignIn(applicationId: "<your-application-id>")
                        .padding()
                }
            }
        }
    - group: Components
      kind: component
      name: SignedIn
      description: The `SignedIn` component conditionally renders its content only when the user is authenticated. It
        reads the current sign-in state from `ThunderIDState` and displays protected UI for signed-in users, while rendering
        optional fallback content (or nothing) when the user is not authenticated. `SignedIn` requires `.thunderIDProvider(config:)`
        in its ancestor view hierarchy.
      rowsLabel: Parameters
      rows:
      - name: content
        type: '@ViewBuilder () -> Content'
        tag: required
        description: The view to render when the user is authenticated.
      - name: fallback
        type: '@ViewBuilder () -> Fallback'
        tag: optional
        description: The view to render when the user is not authenticated. Defaults to `EmptyView`.
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        struct ContentView: View {
            var body: some View {
                SignedIn {
                    Text("You are signed in.")
                }
            }
        }
    - group: Components
      kind: component
      name: SignedOut
      description: The `SignedOut` component conditionally renders its content only when the user is **not** authenticated.
        It reads the current sign-in state from `ThunderIDState` and displays content for unauthenticated users, while
        rendering optional fallback content (or nothing) when the user is signed in. `SignedOut` requires `.thunderIDProvider(config:)`
        in its ancestor view hierarchy.
      rowsLabel: Parameters
      rows:
      - name: content
        type: '@ViewBuilder () -> Content'
        tag: required
        description: The view to render when the user is not authenticated.
      - name: fallback
        type: '@ViewBuilder () -> Fallback'
        tag: optional
        description: The view to render when the user is authenticated. Defaults to `EmptyView`.
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        struct ContentView: View {
            var body: some View {
                SignedOut {
                    Text("Please sign in to continue.")
                }
            }
        }
    - group: Components
      kind: component
      name: UserProfile
      description: The `UserProfile` component renders an editable profile form. It loads the user's current profile
        from `/scim2/Me` when it appears, presents editable fields for `displayName` and `phoneNumbers`, and saves changes
        via `ThunderIDClient.updateUserProfile`. `UserProfile` requires `.thunderIDProvider(config:)` in its ancestor
        view hierarchy.
      rowsLabel: Parameters
      rows:
      - name: onSaved
        type: (() -> Void)?
        tag: optional
        description: Called after a successful profile save.
      - name: onError
        type: (() -> Void)?
        tag: optional
        description: Called when a load or save operation fails.
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        struct ProfileSheet: View {
            @Environment(\.dismiss) var dismiss

            var body: some View {
                UserProfile {
                    dismiss()
                }
                .padding()
            }
        }
    - group: Components
      kind: component
      name: ChangeCredential
      description: 'The `ChangeCredential` view lets a signed-in user set a new value for one of their own credentials.
        It validates against the user type schema (`GET /users/me/meta`) and posts the change via `ThunderIDClient.updateUserCredentials`.
        Defaults to `password`; set `attribute` for another credential, such as a PIN. Requires `.thunderIDProvider(config:)`
        in the view hierarchy. Collects only a new value and its confirmation, not the current one, since the
        write path doesn''t verify it today.'
      rowsLabel: Parameters
      rows:
      - name: attribute
        type: String
        tag: optional
        description: 'The credential attribute this instance manages, any attribute the user type schema declares `credential:
          true` for. Defaults to `"password"`.'
      - name: onSuccess
        type: (() -> Void)?
        tag: optional
        description: Called after the credential has been changed successfully.
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        struct SecuritySection: View {
            var body: some View {
                VStack(alignment: .leading) {
                    Text("Security")
                    ChangeCredential()
                }
            }
        }
    - group: Functions
      kind: function
      name: Configuration
      description: '`ThunderIDConfig` is the configuration struct passed to `ThunderIDClient.initialize(config:storage:)`
        and to the `.thunderIDProvider(config:)` view modifier.'
      rowsLabel: Parameters
      rows:
      - name: baseUrl
        type: String
        description: '**Required.** Your {{ProductName}} instance URL. Must use HTTPS (e.g., `https://localhost:8090`).'
      - name: clientId
        type: String?
        description: The Client ID from your {{ProductName}} application. Required for redirect-based authentication
          and token operations.
      - name: scopes
        type: '[String]'
        description: OAuth 2.0 scopes to request. Include `"profile"` and `"email"` to receive user identity claims.
      - name: afterSignInUrl
        type: String?
        description: The redirect URI to return to after sign-in. Must match an **Allowed Redirect URI** registered
          in the console.
      - name: afterSignOutUrl
        type: String?
        description: The redirect URI to return to after sign-out. Must match an **Allowed Post-Logout Redirect URI**
          in the console.
      - name: signInUrl
        type: String?
        description: Override the sign-in URL. Defaults to the {{ProductName}} hosted sign-in page.
      - name: signUpUrl
        type: String?
        description: Override the sign-up URL.
      - name: clientSecret
        type: String?
        description: Client secret for confidential clients. Do not include this in a shipped iOS app.
      - name: signInOptions
        type: '[String: Any]'
        description: Additional query parameters appended to the authorization URL on sign-in.
      - name: signOutOptions
        type: '[String: Any]'
        description: Additional parameters sent with the sign-out request.
      - name: signUpOptions
        type: '[String: Any]'
        description: Additional parameters sent with the sign-up request.
      - name: applicationId
        type: String?
        description: The Application ID used for app-native (embedded) sign-in flows via the Flow Execution API.
      - name: organizationHandle
        type: String?
        description: The organization handle for multi-tenant deployments.
      - name: tokenValidation
        type: TokenValidationConfig
        description: Controls ID token validation behavior.
      - name: storage
        type: StorageAdapter?
        description: Custom token storage backend. Defaults to `KeychainStorageAdapter`.
      - name: instanceId
        type: Int?
        description: Identifies the SDK instance when running multiple instances in one process.
      example: |-
        import ThunderID

        let config = ThunderIDConfig(
            baseUrl: "https://localhost:8090",
            clientId: "<your-client-id>",
            scopes: ["openid", "profile", "email"],
            afterSignInUrl: "io.thunderid.b2c://callback",
            afterSignOutUrl: "io.thunderid.b2c://logout",
            applicationId: "<your-application-id>"
        )
    - group: Functions
      kind: function
      name: ThunderIDClient
      description: '`ThunderIDClient` is the core authentication client in the `ThunderID` package. It manages the full
        authentication lifecycle: initialization, sign-in (both app-native and redirect-based), session, token management,
        and user profile operations. When you use the `ThunderIDSwiftUI` package, a `ThunderIDClient` instance is created
        and managed automatically. You can access it via `ThunderIDState.client` from any view.'
      example: |-
        import ThunderID

        let client = ThunderIDClient()

        try await client.initialize(config: ThunderIDConfig(
            baseUrl: "https://localhost:8090",
            clientId: "<your-client-id>",
            scopes: ["openid", "profile", "email"],
            afterSignInUrl: "io.thunderid.b2c://callback",
            afterSignOutUrl: "io.thunderid.b2c://logout"
        ))
    - group: Functions
      kind: function
      name: ThunderIDState
      description: '`ThunderIDState` is the reactive authentication state object provided by the `ThunderIDSwiftUI`
        package. It is an `ObservableObject` that holds the current user, loading state, and initialization status,
        and exposes the underlying `ThunderIDClient` for direct API calls. `ThunderIDState` is injected into the SwiftUI
        environment by the `.thunderIDProvider(config:)` modifier. Any view in the hierarchy can read it using `@EnvironmentObject`.'
      example: |-
        import SwiftUI
        import ThunderIDSwiftUI

        @main
        struct MyApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                        .thunderIDProvider(config: ThunderIDConfig(
                            baseUrl: "https://localhost:8090",
                            clientId: "<your-client-id>",
                            afterSignInUrl: "io.thunderid.b2c://callback",
                            afterSignOutUrl: "io.thunderid.b2c://logout"
                        ))
                }
            }
        }

