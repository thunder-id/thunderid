# Control Plane configuration for the tests in tests/integration/controlplane.
#
# It starts from backend/cmd/cpserver/deployment.yaml. The differences are what the suite needs:
# management tokens come from the suite's own trusted issuer, since a Control Plane issues none, and
# the management API key is the one tests/integration/resources/deployment.yaml configures.
server:
  hostname: "localhost"
  port: 8095

  security:
    token_revocation:
      enabled: false
    # The SHA-256 digest of "integration-management-api-key"; the key itself is never configured.
    management_api_key_hash: "4955d93012fc5e2ee07b527f13ffe55de32900c410cc198f4d7a9971bb3a9a2d"
    # The identity provider the suite starts on TrustedIssuerPort (testutils/control_plane.go).
    trusted_issuer:
      issuer: "http://localhost:8091"
      jwks_url: "http://localhost:8091/jwks"
      audience: "thunderid-control-plane"

gateway:
  max_gateways: 5

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

database:
  config:
    type: "sqlite"
    sqlite:
      path: "database/configdb.db"
      options: "_pragma=busy_timeout(60000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
  entity:
    type: "sqlite"
    sqlite:
      path: "database/entitydb.db"
      options: "_pragma=busy_timeout(60000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
  preferred_key_id: "default-key"
