id: android
name: Android
icon: AndroidLogo
category: mobile
type: sdk
origin: official
status: ga
package:
  name: io.thunderid:android
  manager: gradle
description: Native Kotlin SDK with hosted login and secure token storage.
docs:
  overview: /docs/next/sdks-and-tools/android/overview
  quickstart: /docs/next/getting-started/connect-your-application/android
links:
  github: https://github.com/thunder-id/android-sdks
apiReference:
  source: manual

sections:
  - type: api
    id: api
    title: API reference
    intro: Every export is fully typed. The signatures and props below come from the package's own reference documentation,
      so what is listed here is what the installed version ships.
    kindTones:
      component: primary
      function: accent
    exports:
    - group: Components
      kind: component
      name: SignIn
      description: 'The `SignIn` composable renders a full app-native sign-in form. It drives the Flow Execution API
        loop automatically: initiating the flow, presenting the server-defined inputs and actions on each step, and
        completing when the user is authenticated. `SignIn` requires `ThunderIDProvider` in its ancestor composable
        hierarchy.'
      rowsLabel: Parameters
      rows:
      - name: applicationId
        type: String
        tag: required
        description: The Application ID from your {{ProductName}} application settings. Identifies which sign-in flow
          to execute.
      - name: modifier
        type: Modifier
        tag: optional
        description: Compose modifier applied to the form container.
      - name: onComplete
        type: (() -> Unit)?
        tag: optional
        description: Called when authentication completes successfully.
      - name: onError
        type: ((String) -> Unit)?
        tag: optional
        description: Called with an error message when a flow step fails.
      example: |-
        import dev.thunderid.compose.components.presentation.auth.SignIn

        @Composable
        fun AuthView(applicationId: String) {
            SignIn(
                applicationId = applicationId,
                modifier = Modifier.fillMaxWidth().padding(16.dp)
            )
        }
    - group: Components
      kind: component
      name: SignInButton
      description: The `SignInButton` composable renders a pre-styled button that calls an `onClick` lambda when tapped.
        It does not initiate the sign-in flow itself. Your `onClick` handler opens the sign-in UI (e.g., showing a `SignIn`
        form or launching the redirect URL). `SignInButton` requires `ThunderIDProvider` in its ancestor composable
        hierarchy.
      rowsLabel: Parameters
      rows:
      - name: onClick
        type: () -> Unit
        tag: required
        description: Called when the button is tapped.
      - name: modifier
        type: Modifier
        tag: optional
        description: Compose modifier.
      example: |-
        import dev.thunderid.compose.components.actions.SignInButton

        @Composable
        fun LandingView() {
            var showSignIn by remember { mutableStateOf(false) }

            SignInButton(onClick = { showSignIn = true })

            if (showSignIn) {
                SignIn(applicationId = "<your-application-id>")
            }
        }
    - group: Components
      kind: component
      name: SignOutButton
      description: The `SignOutButton` composable renders a pre-styled button that calls `ThunderIDClient.signOut()`,
        then calls `ThunderIDState.refresh()` to update the reactive auth state. It disables itself automatically while
        the sign-out operation is in progress. `SignOutButton` requires `ThunderIDProvider` in its ancestor composable
        hierarchy.
      rowsLabel: Parameters
      rows:
      - name: modifier
        type: Modifier
        tag: optional
        description: Compose modifier applied to the button.
      - name: onSignOutComplete
        type: (() -> Unit)?
        tag: optional
        description: Called after sign-out completes and `ThunderIDState` has been refreshed.
      example: |-
        import dev.thunderid.compose.components.actions.SignOutButton

        @Composable
        fun HomeView() {
            Column {
                Text("You are signed in.")
                SignOutButton()
            }
        }
    - group: Components
      kind: component
      name: SignUp
      description: 'The `SignUp` composable renders a full app-native registration form. It drives the Flow Execution
        API loop automatically: initiating the registration flow, presenting the server-defined inputs and actions on
        each step, and completing when the user is registered and authenticated. `SignUp` requires `ThunderIDProvider`
        in its ancestor composable hierarchy.'
      rowsLabel: Parameters
      rows:
      - name: modifier
        type: Modifier
        tag: optional
        description: Compose modifier applied to the form container.
      - name: onComplete
        type: (() -> Unit)?
        tag: optional
        description: Called when registration completes successfully.
      - name: onError
        type: ((String) -> Unit)?
        tag: optional
        description: Called with an error message when a flow step fails.
      example: |-
        import dev.thunderid.compose.components.presentation.auth.SignUp

        @Composable
        fun RegisterView() {
            SignUp(modifier = Modifier.fillMaxWidth().padding(16.dp))
        }
    - group: Components
      kind: component
      name: SignedIn
      description: The `SignedIn` composable conditionally renders its content only when the user is authenticated.
        It reads the current sign-in state from `LocalThunderID` and displays protected UI for signed-in users, while
        rendering optional fallback content (or nothing) when the user is not authenticated. `SignedIn` requires `ThunderIDProvider`
        in its ancestor composable hierarchy.
      rowsLabel: Parameters
      rows:
      - name: fallback
        type: (@Composable () -> Unit)?
        tag: optional
        description: The composable to render when the user is not authenticated. Defaults to nothing.
      - name: content
        type: '@Composable () -> Unit'
        tag: required
        description: The composable to render when the user is authenticated.
      example: |-
        import dev.thunderid.compose.components.guards.SignedIn

        @Composable
        fun ContentView() {
            SignedIn {
                Text("You are signed in.")
            }
        }
    - group: Components
      kind: component
      name: SignedOut
      description: The `SignedOut` composable conditionally renders its content only when the user is **not** authenticated.
        It is the counterpart to `SignedIn`. `SignedOut` requires `ThunderIDProvider` in its ancestor composable hierarchy.
      rowsLabel: Parameters
      rows:
      - name: fallback
        type: (@Composable () -> Unit)?
        tag: optional
        description: The composable to render when the user is authenticated. Defaults to nothing.
      - name: content
        type: '@Composable () -> Unit'
        tag: required
        description: The composable to render when the user is not authenticated.
      example: |-
        import dev.thunderid.compose.components.guards.SignedOut

        @Composable
        fun ContentView() {
            SignedOut {
                Text("Please sign in to continue.")
            }
        }
    - group: Components
      kind: component
      name: UserProfile
      description: The `UserProfile` composable renders an editable profile form. It loads the user's current profile
        from `/scim2/Me` when it first composes, presents editable fields for `displayName` and `phoneNumbers`, and
        saves changes via `ThunderIDClient.updateUserProfile`. `UserProfile` requires `ThunderIDProvider` in its ancestor
        composable hierarchy.
      rowsLabel: Parameters
      rows:
      - name: modifier
        type: Modifier
        tag: optional
        description: Compose modifier applied to the form container.
      - name: onSaved
        type: (() -> Unit)?
        tag: optional
        description: Called after a successful profile save.
      - name: onError
        type: (() -> Unit)?
        tag: optional
        description: Called when a load or save operation fails.
      example: |-
        import dev.thunderid.compose.components.presentation.user.UserProfile

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun ProfileSheet(onDismiss: () -> Unit) {
            ModalBottomSheet(onDismissRequest = onDismiss) {
                UserProfile(
                    modifier = Modifier.fillMaxWidth().padding(24.dp),
                    onSaved = onDismiss
                )
            }
        }
    - group: Functions
      kind: function
      name: Configuration
      description: '`ThunderIDConfig` is the configuration data class passed to `ThunderIDClient.initialize(config,
        storage)` and to the `ThunderIDProvider` composable.'
      rowsLabel: Parameters
      rows:
      - name: baseUrl
        type: String
        description: '**Required.** Your {{ProductName}} instance URL. Must use HTTPS (e.g., `https://localhost:8090`).'
      - name: clientId
        type: String?
        description: The Client ID from your {{ProductName}} application. Required for redirect-based authentication
          and token operations.
      - name: scopes
        type: List
        description: OAuth 2.0 scopes to request. Include `"profile"` and `"email"` to receive user identity claims.
      - name: afterSignInUrl
        type: String?
        description: The redirect URI to return to after sign-in. Must match an **Allowed Redirect URI** registered
          in the console.
      - name: afterSignOutUrl
        type: String?
        description: The redirect URI to return to after sign-out. Must match an **Allowed Post-Logout Redirect URI**
          in the console.
      - name: signInUrl
        type: String?
        description: Override the sign-in URL. Defaults to the {{ProductName}} hosted sign-in page.
      - name: signUpUrl
        type: String?
        description: Override the sign-up URL.
      - name: clientSecret
        type: String?
        description: Client secret for confidential clients. Do not include this in a shipped Android app.
      - name: signInOptions
        type: Map
        description: Additional query parameters appended to the authorization URL on sign-in.
      - name: signOutOptions
        type: Map
        description: Additional parameters sent with the sign-out request.
      - name: signUpOptions
        type: Map
        description: Additional parameters sent with the sign-up request.
      - name: applicationId
        type: String?
        description: The Application ID used for app-native (embedded) sign-in flows via the Flow Execution API.
      - name: organizationHandle
        type: String?
        description: The organization handle for multi-tenant deployments.
      - name: tokenValidation
        type: TokenValidationConfig
        description: Controls ID token validation behavior.
      - name: storage
        type: StorageAdapter?
        description: Custom token storage backend. Defaults to `EncryptedStorageAdapter`.
      - name: instanceId
        type: Int?
        description: Identifies the SDK instance when running multiple instances in one process.
      example: |-
        import dev.thunderid.android.ThunderIDConfig

        val config = ThunderIDConfig(
            baseUrl = "https://localhost:8090",
            clientId = "<your-client-id>",
            scopes = listOf("openid", "profile", "email"),
            afterSignInUrl = "dev.thunderid.app://callback",
            afterSignOutUrl = "dev.thunderid.app://logout",
            applicationId = "<your-application-id>"
        )
    - group: Functions
      kind: function
      name: ThunderIDClient
      description: '`ThunderIDClient` is the core authentication client in the `dev.thunderid:android` library. It manages
        the full authentication lifecycle: initialization, sign-in (both app-native and redirect-based), session, token
        management, and user profile operations. When you use the `dev.thunderid:compose` library, a `ThunderIDClient`
        instance is created and managed automatically. You can access it via `LocalThunderID.current.client` from any
        composable.'
      example: |-
        import dev.thunderid.android.ThunderIDClient
        import dev.thunderid.android.ThunderIDConfig

        val client = ThunderIDClient()

        client.initialize(
            config = ThunderIDConfig(
                baseUrl = "https://localhost:8090",
                clientId = "<your-client-id>",
                scopes = listOf("openid", "profile", "email"),
                afterSignInUrl = "dev.thunderid.app://callback",
                afterSignOutUrl = "dev.thunderid.app://logout"
            )
        )
    - group: Functions
      kind: function
      name: ThunderIDState
      description: '`ThunderIDState` is the reactive authentication state class provided by the `dev.thunderid:compose`
        library. It holds the current user, loading state, and initialization status, and exposes the underlying `ThunderIDClient`
        for direct API calls. `ThunderIDState` is provided via `LocalThunderID`, a `CompositionLocal` injected by `ThunderIDProvider`.
        Any composable in the hierarchy can read it using `LocalThunderID.current`.'
      example: |-
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import dev.thunderid.android.ThunderIDConfig
        import dev.thunderid.compose.ThunderIDProvider

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    ThunderIDProvider(
                        config = ThunderIDConfig(
                            baseUrl = "https://localhost:8090",
                            clientId = "<your-client-id>",
                            afterSignInUrl = "dev.thunderid.app://callback",
                            afterSignOutUrl = "dev.thunderid.app://logout"
                        )
                    ) {
                        AppContent()
                    }
                }
            }
        }

