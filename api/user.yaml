                    totalResults: 2
                    startIndex: 1
                    count: 2
                    organizationUnits:
                      - id: "7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c5d"
                        handle: "acme-ou-1"
                        name: "Acme OU 1"
                      - id: "9e8d7c6b-5a4f-4e3d-2c1b-0a9f8e7d6c5b"
