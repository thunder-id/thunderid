# The Control Plane resource server. The Control Plane issues no tokens: an operator signs into the
# Control Plane console through a separate identity provider, which issues a token for this resource
# server. Import this file into that identity provider, not into the Control Plane or a Data Plane.
# Set identifier to the Control Plane's URL, the "resource" the console requests a token for.
#
# The Control Plane enforces the system root and the child permissions declared here on its own APIs.
# The System resource server in the Data Plane's bootstrap bundle is a different one: it is the Data
# Plane's representation, which the Control Plane console builds roles on and publishes to Data Planes.
resource_type: resource_server
id: 01900000-0000-7000-8000-000000000021
name: Control Plane
description: Control Plane resource server
identifier: https://localhost:8095
ouHandle: default
delimiter: ":"
resources:
  - name: System
    handle: system
    description: System resource
  - name: Organization Units
    handle: ou
    parent: system
    description: Organization unit management
    actions:
      - name: View
        handle: view
      - name: Create
        handle: create
      - name: Update
        handle: update
      - name: Delete
        handle: delete
