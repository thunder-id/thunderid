# This workflow will re-run or cancel the PR Builder when the trigger-pr-builder label is added or removed
# Uses:
#   OS: ubuntu-latest

name: 🏷️ PR Builder Trigger

# Uses pull_request_target so the token can re-run and cancel runs for fork PRs.
# PR code is never checked out or run.
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  actions: write

# Other labels get a group of their own, so they don't replace a pending trigger label event.
concurrency:
  group: ${{ github.event.label.name == 'trigger-pr-builder' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  trigger:
    name: 🏷️ Start or Stop PR Builder
    if: github.event.label.name == 'trigger-pr-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTION: ${{ github.event.action }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: 🏷️ Re-run or Cancel the Latest PR Builder Run
        run: |
          runs_url="repos/$GH_REPO/actions/workflows/pr-builder.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100"
          # Another PR can share the head commit. Runs from forks don't list their pull
          # request, so the head branch and repository are matched as well.
          # The run for a just opened or pushed PR may not be registered yet.
          for _ in $(seq 12); do
            run_id=$(gh api "$runs_url" | jq -r --arg ref "$HEAD_REF" --arg repo "$HEAD_REPO" --argjson pr "$PR_NUMBER" '
              [.workflow_runs[]
                | select(.head_branch == $ref and .head_repository.full_name == $repo)
                | select((.pull_requests | length) == 0 or any(.pull_requests[]; .number == $pr))][0].id // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::notice::No PR Builder run found for $HEAD_SHA."
            exit 0
          fi

          if [ "$ACTION" = "unlabeled" ]; then
            if [ "$(gh run view "$run_id" --json status -q .status)" != "completed" ]; then
              gh run cancel "$run_id"
              echo "Cancelled PR Builder run $run_id."
            fi
            exit 0
          fi

          # A run started by the last push may still be finishing its skipped jobs. A PR
          # opened with the label already builds, so it's left alone.
          while :; do
            run=$(gh run view "$run_id" --json status,jobs)
            build=$(jq -r '.jobs[] | select(.name == "🛠️ Build Product") | .status' <<< "$run")
            if [ "$build" = "queued" ] || [ "$build" = "in_progress" ]; then
              echo "PR Builder run $run_id is already building."
              exit 0
            fi
            [ "$(jq -r .status <<< "$run")" = "completed" ] && break
            sleep 10
          done
          gh run rerun "$run_id"
          echo "Re-ran PR Builder run $run_id."
