  /organization-units/tree/{path}:
    get:
      tags:
        - organization-units-by-path
      summary: Get an organization unit by hierarchical handle path
      description: |
        The path resolves to the last organization unit it names, and the request is authorized as the
        matching request by id. On the Data Plane, a token holding `org` or `org:ou` without `system` is
        refused with `403` for a path that names no organization unit, as it is for one out of its reach, so a
        path reveals nothing about the organization units outside its reach.
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
          style: simple
          explode: false
          description: |
            Hierarchical path of organization unit handles separated by forward slashes.
            Examples:
            - `engineering` - Gets the root OU with handle "engineering"
            - `engineering/frontend` - Gets the "frontend" OU under "engineering"
            - `engineering/frontend/ui` - Gets the "ui" OU under "engineering/frontend"
          example: "engineering/frontend"
      responses:
        "200":
          description: Organization unit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnit'
              examples:
                single-level:
                  summary: Single level handle
                  value:
                    id: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
                    name: "Engineering"
                    handle: "engineering"
                    description: "Engineering unit"
                    parent: null
                multi-level:
                  summary: Multi-level handle path
                  value:
                    id: "6b59f277-fd79-40b1-afca-dce75d3709f7"
                    name: "Frontend Team"
                    handle: "frontend"
                    description: "Handles UI/UX work"
                    parent: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
        "403":
          description: |
            The caller may not read the organization unit. On a data plane, a token holding `org` or
            `org:ou` without `system` reads only the organization unit it names and its direct children, and
            is refused for a path that names no organization unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
                  defaultValue: "Unauthorized"
                description:
                  key: "error.unauthorized_description"
                  defaultValue: "The caller is not authorized to perform this operation"
        "404":
          description: Organization unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1003"
                message:
                  key: "error.ouservice.organization_unit_not_found"
                  defaultValue: "Organization unit not found"
                description:
                  key: "error.ouservice.organization_unit_not_found_description"
                  defaultValue: "The organization unit with the specified id does not exist"
        "500":
          description: Internal server error

    put:
      tags:
        - organization-units-by-path
      summary: Update an organization unit by hierarchical handle path
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
          style: simple
          explode: false
          description: |
            Hierarchical path of organization unit handles separated by forward slashes.
            Examples:
            - `engineering` - Updates the root OU with handle "engineering"
            - `engineering/frontend` - Updates the "frontend" OU under "engineering"
            - `engineering/frontend/ui` - Updates the "ui" OU under "engineering/frontend"
          example: "engineering/frontend"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationUnitByHandleRequest'
            examples:
              single-level:
                summary: Update single level OU
                value:
                  name: "Engineering Division"
                  handle: "engineering"
                  description: "Main engineering division"
              multi-level:
                summary: Update nested OU
                value:
                  name: "Frontend Development"
                  handle: "frontend"
                  description: "Frontend development team with expanded scope"
      responses:
        "200":
          description: Organization unit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnit'
              examples:
                single-level:
                  summary: Updated single level OU
                  value:
                    id: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
                    name: "Engineering Division"
                    handle: "engineering"
                    description: "Main engineering division"
                    parent: null
                multi-level:
                  summary: Updated nested OU
                  value:
                    id: "6b59f277-fd79-40b1-afca-dce75d3709f7"
                    name: "Frontend Development"
                    handle: "frontend"
                    description: "Frontend development team with expanded scope"
                    parent: "afc77cfd-620b-4cf0-a31c-7377b0ea8902"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1001"
                message:
                  key: "error.ouservice.invalid_request_format"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.ouservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed, contains invalid data, or required fields are missing/empty"
        "403":
          description: |
            The caller may not update the organization unit. Moving it also needs the permission to
            create an organization unit beneath its new parent, or at the root for a move to the root.
            On a data plane, no token moves an organization
            unit to the root, whatever its permissions: only an import with the management API key
            does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
                  defaultValue: "Unauthorized"
                description:
                  key: "error.unauthorized_description"
                  defaultValue: "The caller is not authorized to perform this operation"
        "404":
          description: Organization unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1003"
                message:
                  key: "error.ouservice.organization_unit_not_found"
                  defaultValue: "Organization unit not found"
                description:
                  key: "error.ouservice.organization_unit_not_found_description"
                  defaultValue: "The organization unit with the specified id does not exist"
        "409":
          description: 'Conflict: Organization unit already exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Organization unit name conflict
                  value:
                    code: "OU-1004"
                    message:
                      key: "error.ouservice.organization_unit_name_conflict"
                      defaultValue: "Organization unit name conflict"
                    description:
                      key: "error.ouservice.organization_unit_name_conflict_description"
                      defaultValue: "An organization unit with the same name exists under the same parent"
                handle-conflict:
                  summary: Organization unit handle conflict
                  value:
                    code: "OU-1008"
                    message:
                      key: "error.ouservice.organization_unit_handle_conflict"
                      defaultValue: "Organization unit handle conflict"
                    description:
                      key: "error.ouservice.organization_unit_handle_conflict_description"
                      defaultValue: "An organization unit with the same handle already exists under the same parent"
        "500":
          description: Internal server error

    delete:
      tags:
        - organization-units-by-path
      summary: Delete an organization unit by hierarchical handle path
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
          style: simple
          explode: false
          description: |
            Hierarchical path of organization unit handles separated by forward slashes.
            Examples:
            - `engineering` - Deletes the root OU with handle "engineering"
            - `engineering/frontend` - Deletes the "frontend" OU under "engineering"
            - `engineering/frontend/ui` - Deletes the "ui" OU under "engineering/frontend"
          example: "engineering/frontend"
      responses:
        "204":
          description: Organization unit deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                has-children:
                  summary: Organization unit has children
                  value:
                    code: "OU-1006"
                    message:
                      key: "error.ouservice.organization_unit_has_children"
                      defaultValue: "Organization unit has children"
                    description:
                      key: "error.ouservice.organization_unit_has_children_description"
                      defaultValue: "Cannot delete an organization unit while other resources, such as child organization units, users, groups, roles or applications, belong to it or refer to it"
                system-ou:
                  summary: The system organization unit
                  value:
                    code: "OU-1021"
                    message:
                      key: "error.ouservice.cannot_delete_system_ou"
                      defaultValue: "System organization unit cannot be deleted"
                    description:
                      key: "error.ouservice.cannot_delete_system_ou_description"
                      defaultValue: "The deployment configuration names this organization unit in server.system_ou_id"
        "403":
          description: |
            The caller may not delete the organization unit. On a data plane, a token holding `org` or
            `org:ou` without `system` deletes only the direct children of the organization unit it names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-4030"
                message:
                  key: "error.unauthorized"
                  defaultValue: "Unauthorized"
                description:
                  key: "error.unauthorized_description"
                  defaultValue: "The caller is not authorized to perform this operation"
        "404":
          description: Organization unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1003"
                message:
                  key: "error.ouservice.organization_unit_not_found"
                  defaultValue: "Organization unit not found"
                description:
                  key: "error.ouservice.organization_unit_not_found_description"
                  defaultValue: "The organization unit with the specified id does not exist"
        "500":
          description: Internal server error

