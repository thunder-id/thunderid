                                - name
                                type: object
                              port:
                                type: string
                              sslmode:
                                enum:
                                - require
                                - verify-full
                                - verify-ca
                                - disable
                                type: string
                              username:
                                type: string
                            type: object
                          sqlite:
                            description: Set when type is "sqlite" (or unset).
                            properties:
                              connMaxLifetime:
                                format: int32
                                type: integer
                              maxIdleConns:
                                format: int32
                                type: integer
                              maxOpenConns:
                                format: int32
                                type: integer
                              options:
                                type: string
                              path:
                                type: string
                            type: object
                          type:
                            enum:
                            - sqlite
                            - postgres
                            type: string
                        type: object
                      runtimePersistent:
