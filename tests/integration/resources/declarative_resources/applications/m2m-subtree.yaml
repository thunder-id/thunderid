resource_type: application
id: decl-m2m-subtree
name: M2M Service (Subtree)
description: Backend service usable on behalf of the owner's whole subtree
ouId: decl-m2m-root
type: fullstack
template: web
url: https://example.com
# Everything beneath the owning organization unit, at any depth. Unlike allOus this stays inside
# the owner's own tree, so it needs no cross-tree permission.
sharingPolicies:
  - targetOuScope:
      allChildren: true
inboundAuthConfig:
  - type: "oauth2"
    config:
      clientId: "decl-m2m-subtree-client"
      clientSecret: "decl-m2m-subtree-secret"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            # Opt in to the organization unit claims so the token states which organization it was
            # issued for. On an /ou/{ouId} request these resolve to the accessing OU, not the owner.
            attributes:
              - ouId
              - ouName
              - ouHandle
