components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs

  parameters:
    ConnectionID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    limitQueryParam:
      in: query
      name: limit
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30

    offsetQueryParam:
      in: query
      name: offset
      required: false
      description: Number of records to skip for pagination.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    InstanceList:
      description: Configured connection instances
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectionInstanceSummary'
    AuthZENPDPInstanceList:
      description: Configured AuthZEN PDP connections
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectionInstanceSummary'
          example:
            - id: "05d6e254-a3ca-49dd-89b7-2cf78fee6b23"
              name: "Production PDP"
              description: "Production AuthZEN PDP connection"
    ConnectionUsages:
      description: Resources that reference this connection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConnectionUsagesResponse' }
          example:
            totalResults: 1
            count: 1
            summary:
              flow: 1
            usages:
              - resourceType: flow
                id: "f1b2c3d4-0000-0000-0000-000000000001"
                displayName: "Login Flow"
                behaviorOnDelete: restrict
    AuthZENPDPBadRequest:
      description: Invalid AuthZEN PDP connection request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid-request-format:
              summary: Invalid request format
              value:
                code: "CON-1007"
                message:
                  key: "error.connectionservice.invalid_request_format"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.connectionservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed or contains invalid data"
            invalid-authzen-pdp-endpoint:
              summary: Invalid AuthZEN PDP endpoint
              value:
                code: "CON-1006"
                message:
                  key: "error.connectionservice.invalid_authzen_pdp_endpoint"
                  defaultValue: "Invalid AuthZEN PDP endpoint"
                description:
                  key: "error.connectionservice.invalid_authzen_pdp_endpoint_description"
                  defaultValue: "The single and batch evaluation endpoints must be absolute URLs."
    AuthZENPDPConflict:
      description: An AuthZEN PDP connection with the same name already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1008"
            message:
              key: "error.connectionservice.authzen_pdp_already_exists"
              defaultValue: "An AuthZEN PDP connection with the same name already exists"
            description:
              key: "error.connectionservice.authzen_pdp_already_exists_description"
              defaultValue: "Choose a different name for the AuthZEN PDP connection"
    ConnectionDependencyConflict:
      description: The connection cannot be deleted because it is still in use
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1005"
            message:
              key: "error.connectionservice.connection_has_blocking_dependencies"
              defaultValue: "Connection cannot be deleted"
            description:
              key: "error.connectionservice.connection_has_blocking_dependencies_description"
              defaultValue: "The connection cannot be deleted because other resources depend on it. Remove or reassign them first."
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid-request-format:
              summary: Invalid request format
              value:
                code: "IDP-1001"
                message:
                  key: "error.idpservice.invalid_request_format"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.idpservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed or contains invalid data"
    NotFound:
      description: Connection not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1004"
            message:
              key: "error.connectionservice.connection_not_found"
              defaultValue: "Connection not found"
            description:
              key: "error.connectionservice.connection_not_found_description"
              defaultValue: "No connection exists for the supplied identifier"
    Conflict:
      description: A connection with the same name already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "AUTH-4010"
            message:
              key: "error.unauthorized"
              defaultValue: "Unauthorized"
            description:
              key: "error.unauthorized_description"
              defaultValue: "Authentication is required to access this resource"
    Forbidden:
      description: Insufficient permissions to perform this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "AUTH-4030"
            message:
              key: "error.forbidden"
              defaultValue: "Forbidden"
            description:
              key: "error.forbidden_description"
              defaultValue: "You do not have sufficient permissions to access this resource"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "SSE-5000"
            message:
              key: "error.internal_server_error"
              defaultValue: "Internal server error"
            description:
              key: "error.internal_server_error_description"
              defaultValue: "An unexpected error occurred while processing the request"

  schemas:
    ConnectionListResponse:
      type: object
      required: [totalResults, startIndex, count, connections, links]
      properties:
        totalResults:
          type: integer
          description: Number of instances that match the listing operation.
          example: 3
        startIndex:
          type: integer
          description: Index of the first element of the page, which is equal to offset + 1.
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page.
          example: 3
        connections:
          type: array
          items: { $ref: '#/components/schemas/ConnectionInstance' }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }

    Link:
      type: object
      properties:
        href: { type: string, example: "/connections?offset=30&limit=30" }
        rel: { type: string, example: "next" }

    ConnectionInstance:
      type: object
      required: [id, name, type, categories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "My Google" }
        description: { type: string }
        type:
          type: string
          description: >-
            Lowercase vendor identifier. `sms-gateway` denotes a generic HTTP webhook SMS sender.
          enum: [google, github, oidc, oauth, twilio, vonage, sms-gateway, authzen-pdp, email-smtp]
          example: "google"
        categories:
          type: array
          minItems: 1
          items:
            type: string
            enum: [identity-provider, sms-provider, authorization-pdp, email-provider]
          example: ["identity-provider"]

    ConnectionInstanceSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "My Google" }
        description: { type: string }

    ConnectionUsage:
      type: object
      description: A single resource that references the connection.
      required:
        - resourceType
        - id
        - displayName
        - behaviorOnDelete
      properties:
        resourceType:
          type: string
          description: Type of the referencing resource.
          enum: [flow]
          example: flow
        id:
          type: string
          format: uuid
          description: Identifier of the referencing resource.
          example: "f1b2c3d4-0000-0000-0000-000000000001"
        displayName:
          type: string
          description: Human-readable name of the referencing resource.
          example: "Login Flow"
        behaviorOnDelete:
          type: string
          description: |
            What happens to this resource when the connection is deleted.
            - `fallback`: the reference is kept as-is.
            - `cascade`: the resource is permanently deleted.
            - `restrict`: the resource blocks deletion of the connection.
          enum: [fallback, cascade, restrict]
          example: restrict

    ConnectionUsagesSummary:
      type: object
      nullable: true
      description: |
        Per-resource-type count of usages, keyed by resource type
        (e.g. `flow`). Null when the counts could not be determined.
      additionalProperties:
        type: integer
      example:
        flow: 1

    ConnectionUsagesResponse:
      type: object
      description: |
        Resources that reference a connection, aggregated across all resource types.
        Drives pre-delete confirmation dialogs; informational only.
      properties:
        totalResults:
          type: integer
          nullable: true
          description: |
            Total number of resources that reference the connection.
            Null when usage data is unavailable; 0 means confirmed empty.
          example: 1
        count:
          type: integer
          description: Number of results returned.
          example: 1
        summary:
          $ref: '#/components/schemas/ConnectionUsagesSummary'
        usages:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionUsage'

