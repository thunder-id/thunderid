# SDKs & tools registry entry. Schema: docs/src/types/ecosystem.ts
# Metadata for one entry. Its pages, when it has any, sit beside this file or
# under another content tree; `docs:` below says where.
id: flutter
name: Flutter
icon: FlutterLogo
category: mobile
type: sdk
origin: official
status: ga
package:
  name: thunderid_flutter
  manager: pub
description: Cross-platform authentication for Flutter apps.
docs:
  overview: /docs/next/sdks-and-tools/flutter/overview
  quickstart: /docs/next/getting-started/connect-your-application/flutter
links:
  github: https://github.com/thunder-id/flutter-sdks
apiReference:
  source: manual

sections:
  - type: api
    id: api
    title: API reference
    intro: Every export is fully typed. The signatures and props below come from the package's own reference documentation,
      so what is listed here is what the installed version ships.
    kindTones:
      component: primary
      function: accent
    exports:
    - group: Components
      kind: component
      name: SignIn
      description: '`SignIn` is a pre-built Flutter widget that drives the full sign-in loop using the {{ProductName}}
        Flow Execution API. It renders the appropriate input form for each authentication step (username/password, TOTP,
        email OTP, etc.) and automatically advances through the flow until completion. ```dart import ''package:thunderid_flutter/thunderid_flutter.dart'';
        SignIn( applicationId: '''', onComplete: () { // Refresh state after sign-in ThunderIDProvider.of(context).refresh();
        }, onError: (error) => print(''Sign in failed: $error''), ) ```'
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        SignIn(
          applicationId: '<your-application-id>',
          onComplete: () {
            // Refresh state after sign-in
            ThunderIDProvider.of(context).refresh();
          },
          onError: (error) => print('Sign in failed: $error'),
        )
    - group: Components
      kind: component
      name: SignInButton
      description: '`SignInButton` is a pre-styled `ElevatedButton` widget that triggers your sign-in flow when tapped.
        ```dart import ''package:thunderid_flutter/thunderid_flutter.dart''; SignInButton( onTap: () { // Navigate to
        your sign-in screen Navigator.of(context).push( MaterialPageRoute(builder: (_) => const AuthScreen()), ); },
        ) ```'
      rowsLabel: Parameters
      rows:
      - name: onTap
        type: VoidCallback
        tag: required
        description: Called when the button is tapped. Implement your navigation or sign-in logic here.
      - name: label
        type: String?
        description: Override the button label. Defaults to the localized `"Sign In"` string.
      - name: style
        type: ButtonStyle?
        description: Override the `ElevatedButton` style.
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        SignInButton(
          onTap: () {
            // Navigate to your sign-in screen
            Navigator.of(context).push(
              MaterialPageRoute(builder: (_) => const AuthScreen()),
            );
          },
        )
    - group: Components
      kind: component
      name: SignOutButton
      description: '`SignOutButton` is a pre-styled `OutlinedButton` widget that calls `signOut()` on tap and notifies
        the parent `ThunderIDProvider` to refresh auth state. ```dart import ''package:thunderid_flutter/thunderid_flutter.dart'';
        SignOutButton( onSignOutComplete: () { // Optional: navigate or show a confirmation after sign-out }, ) ```'
      rowsLabel: Parameters
      rows:
      - name: onSignOutComplete
        type: VoidCallback?
        description: Called after sign-out completes and the provider state is refreshed.
      - name: label
        type: String?
        description: Override the button label. Defaults to the localized `"Sign Out"` string.
      - name: style
        type: ButtonStyle?
        description: Override the `OutlinedButton` style.
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        SignOutButton(
          onSignOutComplete: () {
            // Optional: navigate or show a confirmation after sign-out
          },
        )
    - group: Components
      kind: component
      name: SignUp
      description: '`SignUp` is a pre-built Flutter widget that drives the full registration flow using the {{ProductName}}
        Flow Execution API. It renders each registration step as it arrives and advances through the flow until the
        account is created and the user is signed in. ```dart import ''package:thunderid_flutter/thunderid_flutter.dart'';
        SignUp( applicationId: '''', onComplete: () { ThunderIDProvider.of(context).refresh(); }, onError: (error) =>
        print(''Sign up failed: $error''), ) ```'
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        SignUp(
          applicationId: '<your-application-id>',
          onComplete: () {
            ThunderIDProvider.of(context).refresh();
          },
          onError: (error) => print('Sign up failed: $error'),
        )
    - group: Components
      kind: component
      name: SignedIn
      description: '`SignedIn` is a guard widget that renders its `child` only when the user is authenticated. When
        the user is not signed in it renders `fallback` instead (or nothing, if no fallback is provided). This widget
        re-renders automatically whenever the auth state in the parent `ThunderIDProvider` changes.'
      rowsLabel: Parameters
      rows:
      - name: child
        type: Widget
        tag: required
        description: Rendered when `ThunderIDProvider.of(context).isSignedIn` is `true`.
      - name: fallback
        type: Widget?
        description: Rendered when the user is not signed in. Defaults to `const SizedBox.shrink()` if omitted.
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        SignedIn(
          child: const HomeScreen(),
          fallback: const AuthScreen(),
        )
    - group: Components
      kind: component
      name: SignedOut
      description: '`SignedOut` is a guard widget that renders its `child` only when the user is **not** authenticated.
        When the user is signed in it renders `fallback` instead (or nothing, if no fallback is provided). This widget
        re-renders automatically whenever the auth state in the parent `ThunderIDProvider` changes.'
      rowsLabel: Parameters
      rows:
      - name: child
        type: Widget
        tag: required
        description: Rendered when `ThunderIDProvider.of(context).isSignedIn` is `false`.
      - name: fallback
        type: Widget?
        description: Rendered when the user is signed in. Defaults to `const SizedBox.shrink()` if omitted.
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        SignedOut(
          child: const AuthScreen(),
          fallback: const HomeScreen(),
        )
    - group: Components
      kind: component
      name: UserProfile
      description: '`UserProfile` is a pre-built form widget for viewing and editing the authenticated user''s profile.
        It loads the user''s profile from `/scim2/Me` on mount, renders editable fields, and saves changes via `updateUserProfile`.
        ```dart import ''package:thunderid_flutter/thunderid_flutter.dart''; UserProfile( onSaved: (updatedUser) { ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text(''Profile updated'')), ); }, onError: (error) { ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text(''Failed to update: $error'')), ); }, ) ```'
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        UserProfile(
          onSaved: (updatedUser) {
            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(content: Text('Profile updated')),
            );
          },
          onError: (error) {
            ScaffoldMessenger.of(context).showSnackBar(
              SnackBar(content: Text('Failed to update: $error')),
            );
          },
        )
    - group: Functions
      kind: function
      name: Configuration
      description: '`ThunderIDConfig` is the configuration class passed to `ThunderIDProvider` and to `ThunderIDClient.initialize()`.'
      rowsLabel: Parameters
      rows:
      - name: baseUrl
        type: String
        description: '**Required.** Your {{ProductName}} instance URL. Must use HTTPS (e.g., `https://localhost:8090`).'
      - name: clientId
        type: String?
        description: The Client ID from your {{ProductName}} application. Required for redirect-based authentication
          and token operations.
      - name: scopes
        type: List
        description: OAuth 2.0 scopes to request. Include `'profile'` and `'email'` to receive user identity claims.
      - name: afterSignInUrl
        type: String?
        description: The redirect URI to return to after sign-in. Must match an **Allowed Redirect URI** registered
          in the console.
      - name: afterSignOutUrl
        type: String?
        description: The redirect URI to return to after sign-out. Must match an **Allowed Post-Logout Redirect URI**
          in the console.
      - name: signInUrl
        type: String?
        description: Override the sign-in URL. Defaults to the {{ProductName}} hosted sign-in page.
      - name: signUpUrl
        type: String?
        description: Override the sign-up URL.
      - name: applicationId
        type: String?
        description: The Application ID used for app-native (embedded) sign-in flows via the Flow Execution API.
      - name: organizationHandle
        type: String?
        description: The organization handle for multi-tenant deployments.
      - name: tokenValidation
        type: TokenValidationConfig?
        description: Controls ID token validation behavior.
      - name: preferences
        type: ThunderIDPreferences?
        description: UI theme and localization preferences.
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        final config = ThunderIDConfig(
          baseUrl: 'https://localhost:8090',
          clientId: '<your-client-id>',
          scopes: const ['openid', 'profile', 'email'],
          afterSignInUrl: 'dev.thunderid.app://callback',
          afterSignOutUrl: 'dev.thunderid.app://logout',
          applicationId: '<your-application-id>',
        );
    - group: Functions
      kind: function
      name: ThunderIDClient
      description: '`ThunderIDClient` is the core authentication client in the `thunderid_flutter` package. It manages
        the full authentication lifecycle: initialization, sign-in (both app-native and redirect-based), session, token
        management, and user profile operations. All protocol operations are delegated to the native {{ProductName}}
        iOS and Android SDKs via Flutter platform channels. When you use `ThunderIDProvider`, a `ThunderIDClient` instance
        is created and managed automatically. Access it via `ThunderIDProvider.of(context).client` from any widget.'
      example: |-
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        // Access via ThunderIDProvider (recommended)
        final thunder = ThunderIDProvider.of(context);
        final token = await thunder.client.getAccessToken();

        // Or create directly (advanced)
        final client = ThunderIDClient();
        await client.initialize(
          config: ThunderIDConfig(
            baseUrl: 'https://localhost:8090',
            clientId: '<your-client-id>',
            scopes: const ['openid', 'profile', 'email'],
          ),
        );
    - group: Functions
      kind: function
      name: ThunderIDState
      description: '`ThunderIDState` is the reactive authentication state object provided by `ThunderIDProvider`. It
        holds the current user, loading state, and initialization status, and exposes the underlying `ThunderIDClient`
        for direct API calls. Access `ThunderIDState` from any widget using `ThunderIDProvider.of(context)`.'
      example: |-
        import 'package:flutter/material.dart';
        import 'package:thunderid_flutter/thunderid_flutter.dart';

        void main() {
          runApp(
            ThunderIDProvider(
              config: ThunderIDConfig(
                baseUrl: 'https://localhost:8090',
                clientId: '<your-client-id>',
                afterSignInUrl: 'dev.thunderid.app://callback',
                afterSignOutUrl: 'dev.thunderid.app://logout',
              ),
              child: const MyApp(),
            ),
          );
        }

