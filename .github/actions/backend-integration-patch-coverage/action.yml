name: Backend Integration Patch Coverage
description: >-
  Measures how much of a pull request's changed backend production Go was actually
  executed by the integration test suite, and enforces a threshold. Deliberately
  separate from the combined Patch Coverage Gate: this check loads the SQLite,
  PostgreSQL, and Redis integration profiles and nothing else, so backend unit
  coverage and frontend coverage cannot raise or lower the result.
inputs:
  base-ref:
    description: 'Git ref or SHA the diff is compared against'
    required: true
  threshold-config:
    description: >-
      Path to the per-package threshold config. Thresholds are grouped by pull
      request label and inherited down the package tree; see the file itself for
      the resolution rules.
    required: false
    default: '.github/backend-coverage-thresholds.yml'
  pr-labels:
    description: >-
      The pull request's labels, as a JSON array or a comma-separated list. Labels
      select which threshold groups apply. Empty means no group applies, so
      thresholds come from the base `packages` map and then the global default.
      That is also the merge-queue case.
    required: false
    default: ''
  artifact-pattern:
    description: 'Pattern matching the integration coverage artifacts to download'
    required: false
    default: 'integration-coverage-*'

runs:
  using: "composite"
  steps:
    # Only the integration artifacts are downloaded. Pulling the unit or frontend
    # reports into this workspace would make it possible for a later change to
    # feed them in by accident, which is the exact failure mode of the combined
    # gate that this check exists to avoid.
    # Left unmerged (the default) so each artifact lands in its own directory:
    # the database name is read back from the directory name to label the report.
    - name: 📥 Download Integration Coverage Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: coverage-artifacts

    - name: 🛡️ Measure Backend Integration Patch Coverage
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        THRESHOLD_CONFIG: ${{ inputs.threshold-config }}
        PR_LABELS: ${{ inputs.pr-labels }}
      run: bash "${{ github.action_path }}/compute-integration-patch-coverage.sh"
