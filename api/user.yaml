      summary: List the organization units the caller can access
      description: |
        Lists the organization units the signed-in user can access: the one the user lives in and
        every one the user is shared into, directly or through a reshare.

        `current` is the organization unit the list is relative to: the one the caller's token was
        issued for, or the user's own when the token names none. It is returned whatever the scope
        or page, because the units a scope selects may not include it.
      security:
        - OAuth2: []
      parameters:
        - in: query
          name: scope
          required: false
          description: |
            Narrows the list, relative to `current`. When omitted, every accessible organization unit
            is listed.
            - `siblings`: `current` and the accessible units that share its parent. The parent itself
              is not listed. When `current` is a top-level unit, its siblings are the other accessible
              top-level units.
          schema:
            type: string
            enum: [siblings]
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: Organization units the caller can access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessibleOrganizationUnitListResponse'
              examples:
                every-unit:
                  summary: No scope; the user lives in the Customers unit, signed in for Acme OU 1
                  value:
                    current: "7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c5d"
                    totalResults: 3
                    startIndex: 1
