  /connections/meta:
    get:
      tags: [Connection Metadata]
      summary: Describe the configurable options of connection vendors
      description: >-
        Returns the server-driven description of what each connection vendor can be configured
        with, so a console can render options it was not built against. Without a `vendor`
        filter every registered vendor is described; with one, the list holds that vendor alone.
        Only authentication is described today: which methods a vendor supports and which fields
        each one takes. A vendor whose credentials are a fixed contract, such as Twilio, reports
        no methods.
      parameters:
        - name: vendor
          in: query
          required: false
          description: >-
            Limits the result to one connection vendor, as it appears in the /connections/{vendor}
            path. An unregistered vendor is rejected.
          schema:
            type: string
            enum: [google, github, oidc, oauth, twilio, vonage, sms-gateway, email-smtp, authzen-pdp, http]
          example: "email-smtp"
      responses:
        "200":
          description: The configurable options of the described vendors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionMetaResponse'
              example:
                vendors:
                  - vendor: "email-smtp"
                    authentication:
                      methods:
                        - type: "none"
                          displayName: "{{t(system:outboundauth.method.none)}}"
                          fields: []
                        - type: "basic"
                          displayName: "{{t(system:outboundauth.method.basic)}}"
                          fields:
                            - key: "username"
                              type: "string"
                              required: true
                              displayName: "{{t(system:outboundauth.field.username)}}"
                            - key: "password"
                              type: "string"
                              required: true
                              credential: true
                              displayName: "{{t(system:outboundauth.field.password)}}"
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }

  /connections/google/{id}/sharing-policies:
    parameters:
      - { $ref: '#/components/parameters/ConnectionID' }
    post:
      tags: [Connection Sharing]
      summary: Create a sharing policy for a Google connection
      description: Records one organization unit's decision about which other organization units may use this connection.
      requestBody:
        $ref: '#/components/requestBodies/ConnectionSharingPolicyCreate'
      responses:
        "201": { $ref: '#/components/responses/ConnectionSharingPolicyCreated' }
        "400": { $ref: '#/components/responses/ConnectionSharingPolicyCreateBadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/ConnectionSharingPolicyConflict' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [Connection Sharing]
      summary: List sharing policies of a Google connection
      description: Returns the connection's sharing policies, declared ones included.
      parameters:
        - { $ref: '#/components/parameters/limitQueryParam' }
        - { $ref: '#/components/parameters/offsetQueryParam' }
      responses:
        "200": { $ref: '#/components/responses/ConnectionSharingPolicyList' }
        "400": { $ref: '#/components/responses/ConnectionSharingPolicyListBadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
  /connections/google/{id}/sharing-policies/{policyId}:
    parameters:
      - { $ref: '#/components/parameters/ConnectionID' }
      - { $ref: '#/components/parameters/connectionSharingPolicyIdPathParam' }
    get:
      tags: [Connection Sharing]
      summary: Get a sharing policy of a Google connection
      responses:
        "200": { $ref: '#/components/responses/ConnectionSharingPolicyReturned' }
        "404": { $ref: '#/components/responses/ConnectionSharingPolicyNotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Connection Sharing]
      summary: Replace a sharing policy of a Google connection
      description: Replaces the policy's sections.
      requestBody:
        $ref: '#/components/requestBodies/ConnectionSharingPolicyUpdate'
      responses:
        "200": { $ref: '#/components/responses/ConnectionSharingPolicyReturned' }
        "400": { $ref: '#/components/responses/ConnectionSharingPolicyUpdateBadRequest' }
        "404": { $ref: '#/components/responses/ConnectionSharingPolicyNotFound' }
        "409": { $ref: '#/components/responses/ConnectionSharingPolicyConflict' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Connection Sharing]
      summary: Delete a sharing policy of a Google connection
      description: Removes the policy and the policies its sharees issued.
      responses:
        "204": { description: Sharing policy deleted, or the connection holds no policy under that id }
        "400": { $ref: '#/components/responses/ConnectionSharingPolicyDeleteBadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalServerError' }
