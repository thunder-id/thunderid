server:
  hostname: "0.0.0.0"
  port: {{ .Values.configuration.server.port }}
  http_only: {{ .Values.configuration.server.httpOnly }}
  public_url: {{ .Values.configuration.server.publicUrl | quote }}
  {{- if .Values.configuration.server.identifier }}
  identifier: {{ .Values.configuration.server.identifier | quote }}
  {{- end }}
  {{- if or .Values.configuration.server.security .Values.setup.enabled }}
  security:
    {{- with .Values.configuration.server.security }}
    {{- if .jwksCacheTtl }}
    jwks_cache_ttl: {{ .jwksCacheTtl }}
    {{- end }}
    {{- if .trustedIssuer }}
    trusted_issuer:
      issuer: {{ .trustedIssuer.issuer | quote }}
      jwks_url: {{ .trustedIssuer.jwksUrl | quote }}
      audience: {{ .trustedIssuer.audience | quote }}
      {{- if .trustedIssuer.requiredClaims }}
      required_claims:
        {{- range .trustedIssuer.requiredClaims }}
        - claim: {{ .claim | quote }}
          value: {{ .value | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- if and .Values.configuration.server.security .Values.configuration.server.security.directAuthSecret }}
    direct_auth_secret: {{ .Values.configuration.server.security.directAuthSecret | quote }}
    {{- else if .Values.setup.enabled }}
    # The setup job generates the secret into config/secrets/direct_auth_secret on a shared volume;
    # the server reads it from there at load time via this file:// reference.
    direct_auth_secret: "file://config/secrets/direct_auth_secret"
    {{- end }}
  {{- end }}

gate_client:
  # hostname/port/scheme default to the server's public URL. Required only when Gate is hosted separately.
  {{- if .Values.configuration.gateClient.hostname }}
  hostname: {{ .Values.configuration.gateClient.hostname | quote }}
  {{- end }}
  {{- if .Values.configuration.gateClient.port }}
  port: {{ .Values.configuration.gateClient.port }}
  {{- end }}
  {{- if .Values.configuration.gateClient.scheme }}
  scheme: {{ .Values.configuration.gateClient.scheme | quote }}
  {{- end }}
  {{- if .Values.configuration.gateClient.path }}
  path: {{ .Values.configuration.gateClient.path | quote }}
  {{- end }}
  {{- if .Values.configuration.gateClient.loginPath }}
  login_path: {{ .Values.configuration.gateClient.loginPath | quote }}
  {{- end }}
  {{- if .Values.configuration.gateClient.errorPath }}
  error_path: {{ .Values.configuration.gateClient.errorPath | quote }}
  {{- end }}

tls:
  min_version: {{ .Values.configuration.tls.minVersion | quote }}
  cert_file: {{ .Values.configuration.tls.certFile | quote }}
  key_file: {{ .Values.configuration.tls.keyFile | quote }}

crypto:
  encryption:
    key: {{ .Values.configuration.crypto.encryption.key | quote }}
  password_hashing:
    algorithm: {{ .Values.configuration.crypto.passwordHashing.algorithm | quote }}
    pbkdf2:
      salt_size: {{ .Values.configuration.crypto.passwordHashing.pbkdf2.salt_size }}
      iterations: {{ .Values.configuration.crypto.passwordHashing.pbkdf2.iterations }}
      key_size: {{ .Values.configuration.crypto.passwordHashing.pbkdf2.key_size }}
    argon2id:
      salt_size: {{ .Values.configuration.crypto.passwordHashing.argon2id.salt_size }}
      iterations: {{ .Values.configuration.crypto.passwordHashing.argon2id.iterations }}
      key_size: {{ .Values.configuration.crypto.passwordHashing.argon2id.key_size }}
      memory: {{ .Values.configuration.crypto.passwordHashing.argon2id.memory }}
      parallelism: {{ .Values.configuration.crypto.passwordHashing.argon2id.parallelism }}
    sha256:
      salt_size: {{ .Values.configuration.crypto.passwordHashing.sha256.salt_size }}
  keys:
  {{- range .Values.configuration.crypto.keys }}
    - id: {{ .id | quote }}
      cert_file: {{ .certFile | quote }}
      key_file: {{ .keyFile | quote }}
  {{- end }}

attribute_cache:
  encryption:
    enabled: {{ .Values.configuration.attributeCache.encryption.enabled }}

database:
  config:
    type: {{ .Values.configuration.database.config.type | quote }}
    {{- if eq .Values.configuration.database.config.type "sqlite" }}
    sqlite:
      path: {{ .Values.configuration.database.config.sqlite.path | quote }}
      options: {{ .Values.configuration.database.config.sqlite.options | quote }}
      max_open_conns: {{ .Values.configuration.database.config.sqlite.max_open_conns }}
      max_idle_conns: {{ .Values.configuration.database.config.sqlite.max_idle_conns }}
      conn_max_lifetime: {{ .Values.configuration.database.config.sqlite.conn_max_lifetime }}
      max_retries: {{ .Values.configuration.database.config.sqlite.max_retries }}
      min_retry_backoff_ms: {{ .Values.configuration.database.config.sqlite.min_retry_backoff_ms }}
      max_retry_backoff_ms: {{ .Values.configuration.database.config.sqlite.max_retry_backoff_ms }}
    {{- else }}
    postgres:
      hostname: {{ .Values.configuration.database.config.postgres.hostname | quote }}
      port: {{ .Values.configuration.database.config.postgres.port }}
      name: {{ .Values.configuration.database.config.postgres.name | quote }}
      username: {{ .Values.configuration.database.config.postgres.username | quote }}
      password: {{ "{{.DB_CONFIG_PASSWORD}}" | quote }}
      sslmode: {{ .Values.configuration.database.config.postgres.sslmode | quote }}
      max_open_conns: {{ .Values.configuration.database.config.postgres.max_open_conns }}
      max_idle_conns: {{ .Values.configuration.database.config.postgres.max_idle_conns }}
      conn_max_lifetime: {{ .Values.configuration.database.config.postgres.conn_max_lifetime }}
      max_retries: {{ .Values.configuration.database.config.postgres.max_retries }}
      min_retry_backoff_ms: {{ .Values.configuration.database.config.postgres.min_retry_backoff_ms }}
      max_retry_backoff_ms: {{ .Values.configuration.database.config.postgres.max_retry_backoff_ms }}
    {{- end }}
  runtime_transient:
    type: {{ .Values.configuration.database.runtime_transient.type | quote }}
    {{- if eq .Values.configuration.database.runtime_transient.type "sqlite" }}
    sqlite:
      path: {{ .Values.configuration.database.runtime_transient.sqlite.path | quote }}
      options: {{ .Values.configuration.database.runtime_transient.sqlite.options | quote }}
      max_open_conns: {{ .Values.configuration.database.runtime_transient.sqlite.max_open_conns }}
      max_idle_conns: {{ .Values.configuration.database.runtime_transient.sqlite.max_idle_conns }}
      conn_max_lifetime: {{ .Values.configuration.database.runtime_transient.sqlite.conn_max_lifetime }}
      max_retries: {{ .Values.configuration.database.runtime_transient.sqlite.max_retries }}
      min_retry_backoff_ms: {{ .Values.configuration.database.runtime_transient.sqlite.min_retry_backoff_ms }}
      max_retry_backoff_ms: {{ .Values.configuration.database.runtime_transient.sqlite.max_retry_backoff_ms }}
    {{- else if eq .Values.configuration.database.runtime_transient.type "redis" }}
    redis:
      address: {{ .Values.configuration.database.runtime_transient.redis.address | quote }}
      username: {{ .Values.configuration.database.runtime_transient.redis.username | quote }}
      password: {{ "{{.DB_RUNTIME_TRANSIENT_REDIS_PASSWORD}}" | quote }}
      db: {{ .Values.configuration.database.runtime_transient.redis.db }}
      key_prefix: {{ .Values.configuration.database.runtime_transient.redis.key_prefix | quote }}
    {{- else }}
    postgres:
      hostname: {{ .Values.configuration.database.runtime_transient.postgres.hostname | quote }}
      port: {{ .Values.configuration.database.runtime_transient.postgres.port }}
      name: {{ .Values.configuration.database.runtime_transient.postgres.name | quote }}
      username: {{ .Values.configuration.database.runtime_transient.postgres.username | quote }}
      password: {{ "{{.DB_RUNTIME_TRANSIENT_PASSWORD}}" | quote }}
      sslmode: {{ .Values.configuration.database.runtime_transient.postgres.sslmode | quote }}
      max_open_conns: {{ .Values.configuration.database.runtime_transient.postgres.max_open_conns }}
      max_idle_conns: {{ .Values.configuration.database.runtime_transient.postgres.max_idle_conns }}
      conn_max_lifetime: {{ .Values.configuration.database.runtime_transient.postgres.conn_max_lifetime }}
      max_retries: {{ .Values.configuration.database.runtime_transient.postgres.max_retries }}
      min_retry_backoff_ms: {{ .Values.configuration.database.runtime_transient.postgres.min_retry_backoff_ms }}
      max_retry_backoff_ms: {{ .Values.configuration.database.runtime_transient.postgres.max_retry_backoff_ms }}
    {{- end }}
  entity:
    type: {{ .Values.configuration.database.entity.type | quote }}
    {{- if eq .Values.configuration.database.entity.type "sqlite" }}
    sqlite:
      path: {{ .Values.configuration.database.entity.sqlite.path | quote }}
      options: {{ .Values.configuration.database.entity.sqlite.options | quote }}
      max_open_conns: {{ .Values.configuration.database.entity.sqlite.max_open_conns }}
      max_idle_conns: {{ .Values.configuration.database.entity.sqlite.max_idle_conns }}
      conn_max_lifetime: {{ .Values.configuration.database.entity.sqlite.conn_max_lifetime }}
      max_retries: {{ .Values.configuration.database.entity.sqlite.max_retries }}
      min_retry_backoff_ms: {{ .Values.configuration.database.entity.sqlite.min_retry_backoff_ms }}
      max_retry_backoff_ms: {{ .Values.configuration.database.entity.sqlite.max_retry_backoff_ms }}
    {{- else }}
    postgres:
      hostname: {{ .Values.configuration.database.entity.postgres.hostname | quote }}
      port: {{ .Values.configuration.database.entity.postgres.port }}
      name: {{ .Values.configuration.database.entity.postgres.name | quote }}
      username: {{ .Values.configuration.database.entity.postgres.username | quote }}
      password: {{ "{{.DB_ENTITY_PASSWORD}}" | quote }}
      sslmode: {{ .Values.configuration.database.entity.postgres.sslmode | quote }}
      max_open_conns: {{ .Values.configuration.database.entity.postgres.max_open_conns }}
      max_idle_conns: {{ .Values.configuration.database.entity.postgres.max_idle_conns }}
      conn_max_lifetime: {{ .Values.configuration.database.entity.postgres.conn_max_lifetime }}
      max_retries: {{ .Values.configuration.database.entity.postgres.max_retries }}
      min_retry_backoff_ms: {{ .Values.configuration.database.entity.postgres.min_retry_backoff_ms }}
      max_retry_backoff_ms: {{ .Values.configuration.database.entity.postgres.max_retry_backoff_ms }}
    {{- end }}
  runtime_persistent:
    type: {{ .Values.configuration.database.runtime_persistent.type | quote }}
    {{- if eq .Values.configuration.database.runtime_persistent.type "sqlite" }}
    sqlite:
      path: {{ .Values.configuration.database.runtime_persistent.sqlite.path | quote }}
      options: {{ .Values.configuration.database.runtime_persistent.sqlite.options | quote }}
      max_open_conns: {{ .Values.configuration.database.runtime_persistent.sqlite.max_open_conns }}
      max_idle_conns: {{ .Values.configuration.database.runtime_persistent.sqlite.max_idle_conns }}
      conn_max_lifetime: {{ .Values.configuration.database.runtime_persistent.sqlite.conn_max_lifetime }}
      max_retries: {{ .Values.configuration.database.runtime_persistent.sqlite.max_retries }}
      min_retry_backoff_ms: {{ .Values.configuration.database.runtime_persistent.sqlite.min_retry_backoff_ms }}
      max_retry_backoff_ms: {{ .Values.configuration.database.runtime_persistent.sqlite.max_retry_backoff_ms }}
    {{- else }}
    postgres:
      hostname: {{ .Values.configuration.database.runtime_persistent.postgres.hostname | quote }}
      port: {{ .Values.configuration.database.runtime_persistent.postgres.port }}
      name: {{ .Values.configuration.database.runtime_persistent.postgres.name | quote }}
      username: {{ .Values.configuration.database.runtime_persistent.postgres.username | quote }}
      password: {{ "{{.DB_RUNTIME_PERSISTENT_PASSWORD}}" | quote }}
      sslmode: {{ .Values.configuration.database.runtime_persistent.postgres.sslmode | quote }}
      max_open_conns: {{ .Values.configuration.database.runtime_persistent.postgres.max_open_conns }}
      max_idle_conns: {{ .Values.configuration.database.runtime_persistent.postgres.max_idle_conns }}
      conn_max_lifetime: {{ .Values.configuration.database.runtime_persistent.postgres.conn_max_lifetime }}
      max_retries: {{ .Values.configuration.database.runtime_persistent.postgres.max_retries }}
      min_retry_backoff_ms: {{ .Values.configuration.database.runtime_persistent.postgres.min_retry_backoff_ms }}
      max_retry_backoff_ms: {{ .Values.configuration.database.runtime_persistent.postgres.max_retry_backoff_ms }}
    {{- end }}

cache:
  disabled: {{ .Values.configuration.cache.disabled }}
  type: {{ .Values.configuration.cache.type | quote }}
  size: {{ .Values.configuration.cache.size }}
  ttl: {{ .Values.configuration.cache.ttl }}
  eviction_policy: {{ .Values.configuration.cache.evictionPolicy | quote }}
  cleanup_interval: {{ .Values.configuration.cache.cleanupInterval }}
  {{- if eq .Values.configuration.cache.type "redis" }}
  redis:
    address: {{ .Values.configuration.cache.redis.address | quote }}
    username: {{ .Values.configuration.cache.redis.username | quote }}
    password: {{ "{{.CACHE_REDIS_PASSWORD}}" | quote }}
    db: {{ .Values.configuration.cache.redis.db }}
    key_prefix: {{ .Values.configuration.cache.redis.keyPrefix | quote }}
  {{- end }}

jwt:
  issuer: {{ .Values.configuration.jwt.issuer | quote }}
  validity_period: {{ .Values.configuration.jwt.validityPeriod }}
  audience: {{ .Values.configuration.jwt.audience | quote }}
  preferred_key_id: {{ .Values.configuration.jwt.preferredKeyId | quote }}

oauth:
  refresh_token:
    renew_on_grant: {{ .Values.configuration.oauth.refreshToken.renewOnGrant }}
    revoke_previous_on_renew: {{ .Values.configuration.oauth.refreshToken.revokePreviousOnRenew }}
    validity_period: {{ .Values.configuration.oauth.refreshToken.validityPeriod }}
  authorization_code:
    validity_period: {{ .Values.configuration.oauth.authorizationCode.validityPeriod }}
  authorization_request:
    validity_period: {{ .Values.configuration.oauth.authorizationRequest.validityPeriod }}
  dcr:
    enabled: {{ .Values.configuration.oauth.dcr.enabled }}
    insecure: {{ .Values.configuration.oauth.dcr.insecure }}
  send_server_errors_to_client: {{ .Values.configuration.oauth.sendServerErrorsToClient }}
  allowed_auth_methods:
  {{- range .Values.configuration.oauth.allowedAuthMethods }}
    - {{ . | quote }}
  {{- end }}
  allowed_response_types:
  {{- range .Values.configuration.oauth.allowedResponseTypes }}
    - {{ . | quote }}
  {{- end }}
  allowed_grant_types:
  {{- range .Values.configuration.oauth.allowedGrantTypes }}
    - {{ . | quote }}
  {{- end }}

flow:
  max_version_history: {{ .Values.configuration.flow.maxVersionHistory }}
  auto_infer_registration: {{ .Values.configuration.flow.autoInferRegistration }}
{{- if .Values.configuration.flow.store }}
  store: {{ include "thunderid.validateStoreMode" (dict "value" .Values.configuration.flow.store "field" "configuration.flow.store") | quote }}
{{- end }}
{{- if .Values.configuration.flow.executors }}
  executors:
  {{- range .Values.configuration.flow.executors }}
    - {{ . | quote }}
  {{- end }}
{{- end }}
{{- if .Values.configuration.flow.interceptors }}
  interceptors:
  {{- range .Values.configuration.flow.interceptors }}
    - {{ . | quote }}
  {{- end }}
{{- end }}

passkey:
  allowed_origins:
  {{- range .Values.configuration.passkey.allowedOrigins }}
    - {{ . | quote }}
  {{- end }}

openid4vp:
  client_id_scheme: {{ .Values.configuration.openid4vp.clientIdScheme | quote }}
  signing_key_id: {{ .Values.configuration.openid4vp.signingKeyId | quote }}
  ephemeral_key_id: {{ .Values.configuration.openid4vp.ephemeralKeyId | quote }}
  response_enc_values:
  {{- range .Values.configuration.openid4vp.responseEncValues }}
    - {{ . | quote }}
  {{- end }}
  request_validity_seconds: {{ .Values.configuration.openid4vp.requestValiditySeconds }}
  state_ttl_seconds: {{ .Values.configuration.openid4vp.stateTtlSeconds }}
  leeway_seconds: {{ .Values.configuration.openid4vp.leewaySeconds }}
  key_binding_max_age_seconds: {{ .Values.configuration.openid4vp.keyBindingMaxAgeSeconds }}
  result_token_validity_seconds: {{ .Values.configuration.openid4vp.resultTokenValiditySeconds }}
  enforce_key_binding: {{ .Values.configuration.openid4vp.enforceKeyBinding }}
  registration_cert_file: {{ .Values.configuration.openid4vp.registrationCertFile | quote }}
  {{- if .Values.configuration.openid4vp.store }}
  store: {{ include "thunderid.validateStoreMode" (dict "value" .Values.configuration.openid4vp.store "field" "configuration.openid4vp.store") | quote }}
  {{- end }}
  trusted_anchors:
  {{- range .Values.configuration.openid4vp.trustedAnchors }}
    - name: {{ .name | quote }}
      cert_file: {{ .certFile | quote }}
  {{- end }}

openid4vci:
  signing_key_id: {{ .Values.configuration.openid4vci.signingKeyId | quote }}
  nonce_ttl_seconds: {{ .Values.configuration.openid4vci.nonceTtlSeconds }}
  proof_max_age_seconds: {{ .Values.configuration.openid4vci.proofMaxAgeSeconds }}
  credential_validity_seconds: {{ .Values.configuration.openid4vci.credentialValiditySeconds | int64 }}
  batch_size: {{ .Values.configuration.openid4vci.batchSize }}
  enforce_scope: {{ .Values.configuration.openid4vci.enforceScope }}
  {{- if .Values.configuration.openid4vci.store }}
  store: {{ include "thunderid.validateStoreMode" (dict "value" .Values.configuration.openid4vci.store "field" "configuration.openid4vci.store") | quote }}
  {{- end }}

{{- $email := default dict .Values.configuration.email }}
{{- $smtp := default dict $email.smtp }}
{{- if $smtp.host }}

email:
  smtp:
    host: {{ $smtp.host | quote }}
    port: {{ required "configuration.email.smtp.port is required when configuration.email.smtp.host is set." $smtp.port }}
    from_address: {{ required "configuration.email.smtp.fromAddress is required when configuration.email.smtp.host is set." $smtp.fromAddress | quote }}
    {{- if hasKey $smtp "enableStartTls" }}
    enable_start_tls: {{ $smtp.enableStartTls }}
    {{- end }}
    {{- if hasKey $smtp "enableAuthentication" }}
    enable_authentication: {{ $smtp.enableAuthentication }}
    {{- end }}
    {{- if $smtp.username }}
    username: {{ $smtp.username | quote }}
    {{- end }}
    {{- if or $smtp.password (default dict $smtp.passwordRef).key }}
    password: {{ "{{.SMTP_PASSWORD}}" | quote }}
    {{- end }}
{{- end }}

{{- $log := default dict .Values.configuration.log }}
{{- $logOutput := default dict $log.output }}
{{- $logConsole := default dict $logOutput.console }}
{{- $logFile := default dict $logOutput.file }}
{{- $logAccess := default dict $log.access }}
{{- $logRotation := default dict $logFile.rotation }}
{{- $logSizeRotation := default dict $logRotation.size }}
{{- $logTimeRotation := default dict $logRotation.time }}
{{- if or $log.level (hasKey $logConsole "enabled") $logFile $logAccess.excludePaths }}

log:
  {{- if $log.level }}
  level: {{ $log.level | quote }}
  {{- end }}
  {{- if or (hasKey $logConsole "enabled") $logFile }}
  output:
    {{- if hasKey $logConsole "enabled" }}
    console:
      enabled: {{ $logConsole.enabled }}
    {{- end }}
    {{- if $logFile }}
    file:
      {{- if hasKey $logFile "enabled" }}
      enabled: {{ $logFile.enabled }}
      {{- end }}
      {{- if $logFile.path }}
      path: {{ $logFile.path | quote }}
      {{- end }}
      {{- if $logFile.fileName }}
      file_name: {{ $logFile.fileName | quote }}
      {{- end }}
      {{- if $logFile.format }}
      format: {{ $logFile.format | quote }}
      {{- end }}
      {{- if $logRotation }}
      rotation:
        {{- if hasKey $logSizeRotation "enabled" }}
        size:
          enabled: {{ $logSizeRotation.enabled }}
          {{- if $logSizeRotation.maxSizeMb }}
          max_size_mb: {{ $logSizeRotation.maxSizeMb }}
          {{- end }}
        {{- end }}
        {{- if hasKey $logTimeRotation "enabled" }}
        time:
          enabled: {{ $logTimeRotation.enabled }}
          {{- if $logTimeRotation.intervalDays }}
          interval_days: {{ $logTimeRotation.intervalDays }}
          {{- end }}
        {{- end }}
        {{- if hasKey $logRotation "maxBackups" }}
        max_backups: {{ $logRotation.maxBackups }}
        {{- end }}
        {{- if hasKey $logRotation "maxAgeDays" }}
        max_age_days: {{ $logRotation.maxAgeDays }}
        {{- end }}
        {{- if hasKey $logRotation "compress" }}
        compress: {{ $logRotation.compress }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if $logAccess.excludePaths }}
  access:
    exclude_paths:
    {{- range $logAccess.excludePaths }}
      - {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}

{{- $stores := default dict .Values.configuration.stores }}
{{- range $section := (list "user" "group" "role" "theme" "layout" "translation" "agent" "user_type" "organization_unit" "identity_provider" "application" "server_config" "resource") }}
{{- $mode := index $stores $section }}
{{- if $mode }}

{{ $section }}:
  store: {{ include "thunderid.validateStoreMode" (dict "value" $mode "field" (printf "configuration.stores.%s" $section)) | quote }}
{{- end }}
{{- end }}

declarative_resources:
  enabled: {{ .Values.declarativeResources.enabled }}
