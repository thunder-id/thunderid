            details:
              type: object
              description: Why the status applies. Absent for `ACTIVE`.
              properties:
                reason:
                  type: string
                  enum: [FAILED_ATTEMPTS, ADMINISTRATIVE_SUSPENSION]
                since:
                  type: string
                  format: date-time
                operatorNote:
                  type: string
