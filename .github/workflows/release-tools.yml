# Entrypoint workflow for releasing tools.

name: 🔧 Release Tools

# Tools are versioned on their own, apart from the product: npx thunderid installs whichever product
# release the manifest offers, so one line of the CLI serves every product line. Tools release from
# main only, on one of two channels:
#
#   stable  publishes a patch, minor or major under the 'latest' dist-tag.
#   next    publishes a prerelease under the 'next' dist-tag (1.1.0-next.0, then -next.1, ...).
#           The bump picks which release the prereleases lead up to; once a next line is open,
#           every next release advances it. A CLI with a prerelease version installs product
#           prereleases too, so `npx thunderid@next` is how milestones are tried.

on:
  workflow_dispatch:
    inputs:
      npx:
        description: 'Release npx tool'
        required: false
        type: boolean
        default: false
      channel:
        description: 'stable publishes to latest; next publishes a prerelease to next'
        required: true
        type: choice
        options:
          - stable
          - next
        default: stable
      bump:
        description: 'Release to publish (stable), or to lead up to when opening a next line'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  # IMPORTANT: DO NOT REMOVE. `id-token` is required for OIDC publishing.
  id-token: write

env:
  RELEASE_GIT_USER_NAME: "thunderid-automation-bot"
  RELEASE_GIT_USER_EMAIL: "thunderid-bot@thunderid.dev"
  NODE_VERSION: "lts/*"
  PNPM_VERSION: "latest"

jobs:
  release-npx-thunderid:
    name: ⚡ Release thunderid (npx-thunderid)
    if: github.event.inputs.npx == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.THUNDER_AUTOMATION_BOT }}

      - name: 🔀 Resolve Release Channel
        id: channel
        env:
          BRANCH: ${{ github.ref_name }}
          CHANNEL: ${{ github.event.inputs.channel }}
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" != "main" ]; then
            echo "❌ Tools release from main only, not '$BRANCH'."
            exit 1
          fi
          CURRENT=$(node -p "require('./tools/npx/package.json').version")
          case "$CHANNEL" in
            stable)
              DIST_TAG=latest
              PREID=""
              ;;
            next)
              DIST_TAG=next
              PREID=next
              if [[ "$CURRENT" == *-next.* ]]; then
                BUMP=prerelease
              else
                BUMP="pre$BUMP"
              fi
              ;;
            *)
              echo "❌ Unknown channel '$CHANNEL'."
              exit 1
              ;;
          esac
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "preid=$PREID" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "✅ $CURRENT gets a $BUMP bump, published under the '$DIST_TAG' dist-tag."

      - name: 🚀 Release
        uses: ./.github/actions/release-npm
        with:
          package-dir: tools/npx
          tag-convention: 'tool/{name}/v{version}'
          bump-type: ${{ steps.channel.outputs.bump }}
          preid: ${{ steps.channel.outputs.preid }}
          dist-tag: ${{ steps.channel.outputs.dist-tag }}
          git-user-name: ${{ env.RELEASE_GIT_USER_NAME }}
          git-user-email: ${{ env.RELEASE_GIT_USER_EMAIL }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
