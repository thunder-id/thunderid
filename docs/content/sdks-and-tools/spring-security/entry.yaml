            variant: primary
            external: true
          - label: Ask the community
            href: https://github.com/thunder-id/thunderid/discussions
            variant: secondary
            external: true
      - title: Something wrong in Spring Security?
        body: >-
          The library itself is maintained by the Spring team. Bugs and feature requests belong on their
          tracker, not ours.
        ctas:
          - label: Spring Security issues
            href: https://github.com/spring-projects/spring-security/issues
            variant: secondary
            external: true

