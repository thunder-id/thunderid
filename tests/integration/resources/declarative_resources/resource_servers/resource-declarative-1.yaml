resource_type: resource_server
id: decl-rs-1
name: Declarative Resource Server
description: A declarative test resource server
identifier: https://localhost:8090/decl-rs-1
ouId: decl-ou-1
delimiter: ":"
resources:
  - name: Test Resource
    handle: test-resource
    description: A test resource
    actions:
      - name: Read
        handle: read
      - name: Write
        handle: write
# Roles in organization units created by the tests reference this resource server's permissions, and
# a resource server's permissions are usable only where it is shared.
sharingPolicies:
  - id: decl-rs-1-policy-1
    targets:
      - scope: allOus
