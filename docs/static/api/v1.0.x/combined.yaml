          default: false
        systemAttributes:
          $ref: "#/components/schemas/AgentType/properties/systemAttributes"
        schema:
          type: object
          description: JSON Schema definition for the agent type
          additionalProperties:
            $ref: "#/components/schemas/AgentType/properties/schema/additionalProperties"
    UpdateAgentTypeRequest:
      type: object
      required:
        - name
        - ouId
        - schema
      properties:
        name:
          type: string
          enum:
            - default
          description: >
            The agent type this schema defines. Must remain `default` — renaming
            is rejected.
        ouId:
          type: string
          format: uuid
          description: The root organization unit ID where this agent type schema is
            applicable
        allowSelfRegistration:
          type: boolean
          description: Whether the agent type supports self-initiated registration
          default: false
        systemAttributes:
          $ref: "#/components/schemas/AgentType/properties/systemAttributes"
