components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs

  parameters:
    ConnectionID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    connectionFilterQueryParam:
      in: query
      name: filter
      required: false
      description: 'Filter connections by organization unit with `ouId eq "<id>"`, the only supported expression. It lists the connections the unit owns, then those shared into it.'
      schema:
        type: string
      examples:
        organization-unit:
          summary: Connections owned by or shared into an organization unit
          value: 'ouId eq "01900000-0000-7000-8000-000000000001"'

    limitQueryParam:
      in: query
      name: limit
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30

    offsetQueryParam:
      in: query
      name: offset
      required: false
      description: Number of records to skip for pagination.
      schema:
        type: integer
        minimum: 0
        default: 0

    connectionSharingPolicyIdPathParam:
      in: path
      name: policyId
      required: true
      description: Sharing policy ID
      schema:
        type: string
      example: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"

  requestBodies:
    ConnectionSharingPolicyCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectionSharingPolicyRequest'
          examples:
            allChildUnits:
              summary: Every organization unit beneath the issuer
              value:
                childUnits:
                  mode: all
            allChildUnitsWithExclusion:
              summary: Every organization unit beneath the issuer except one branch
              value:
                childUnits:
                  mode: all
                  excludedOuIds: ["acme-trial-customers"]
            selectedChildUnits:
              summary: Named children, one at a time
              value:
                childUnits:
                  mode: selected
                  units:
                    - ouId: "acme-customer-a"
                      reach: unit
                    - ouId: "acme-customer-b"
                      reach: unit
            childAndItsSubtree:
              summary: One direct child and everything beneath it
              value:
                childUnits:
                  mode: selected
                  units:
                    - ouId: "acme-customer-a"
                      reach: subtree
            selectedRoots:
              summary: Named roots of other trees, owner only
              value:
                otherTreeRoots:
                  mode: selected
                  units:
                    - ouId: "partner-root"
            reshare:
              summary: A reshare issued by a sharee
              value:
                initiatingOuId: "acme-customer-a"
                childUnits:
                  mode: selected
                  units:
                    - ouId: "acme-customer-a-eu"
                      reach: unit
    ConnectionSharingPolicyUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectionSharingPolicyUpdateRequest'
          examples:
            addAnExclusion:
              summary: Exclude one organization unit from every child unit
              value:
                version: 1
                childUnits:
                  mode: all
                  excludedOuIds: ["acme-trial-customers"]
            widenANamedUnit:
              summary: Carry the connection on beneath a named child
              value:
                version: 1
                childUnits:
                  mode: selected
                  units:
                    - ouId: "acme-customer-a"
                      reach: subtree

  responses:
    ConnectionSharingPolicyCreated:
      description: Sharing policy created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectionSharingPolicy'
          example:
            id: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
            initiatingOuId: "acme-root"
            stage: share
            isReadOnly: false
            version: 1
            childUnits:
              mode: all
              excludedOuIds: ["acme-trial-customers"]
    ConnectionSharingPolicyReturned:
      description: Sharing policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectionSharingPolicy'
          example:
            id: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
            initiatingOuId: "acme-root"
            stage: share
            isReadOnly: false
            version: 1
            childUnits:
              mode: all
              excludedOuIds: ["acme-trial-customers"]
    ConnectionSharingPolicyList:
      description: Sharing policies
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectionSharingPolicyListResponse'
          example:
            totalResults: 2
            startIndex: 1
            count: 2
            policies:
              # The owner's decision: two named customers, each reached and stopped at, which
              # leaves each free to carry the connection on itself.
              - id: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
                initiatingOuId: "acme-root"
                stage: share
                isReadOnly: false
                version: 2
                childUnits:
                  mode: selected
                  units:
                    - ouId: "acme-customer-a"
                      reach: unit
                    - ouId: "acme-customer-b"
                      reach: unit
              # One of those customers carrying the connection one hop further, which is why
              # this one names the policy that reached it.
              - id: "0195a2c0-7b41-7c66-8f03-9d1e6a2b4c57"
                initiatingOuId: "acme-customer-a"
                stage: reshare
                parentPolicyId: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
                isReadOnly: false
                version: 1
                childUnits:
                  mode: selected
                  units:
                    - ouId: "acme-customer-a-eu"
                      reach: unit
            links: []
    ConnectionOverlayRules:
      description: Resolved overlay
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectionResolvedOverlay'
          examples:
            reached:
              summary: An organization unit a policy reached
              value:
                ouId: "acme-customer-a"
                isOwnedByOU: false
                visible: true
                policyIds: ["0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"]
                rules: {}
            owner:
              summary: The organization unit that owns the connection
              value:
                ouId: "acme-root"
                isOwnedByOU: true
                visible: true
                policyIds: []
                rules: {}

    ConnectionSharingPolicyCreateBadRequest:
      description: The policy is not one the issuing organization unit may write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noSection:
              summary: No section stated
              value:
                code: "CON-1031"
                message:
                  key: "error.connectionservice.invalid_sharing_policy"
                  defaultValue: "Invalid sharing policy"
                description:
                  key: "error.sharingservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed, reaches no organization unit, or states a section with fields its mode does not take: the policy reaches no organization unit"
            fieldTheModeDoesNotTake:
              summary: A section carrying a field its mode does not take
              value:
                code: "CON-1031"
                message:
                  key: "error.connectionservice.invalid_sharing_policy"
                  defaultValue: "Invalid sharing policy"
                description:
                  key: "error.sharingservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed, reaches no organization unit, or states a section with fields its mode does not take: childUnits with mode all takes no units"
            unitNamedTwice:
              summary: An organization unit named twice, or one the issuer may not name
              value:
                code: "CON-1031"
                message:
                  key: "error.connectionservice.invalid_sharing_policy"
                  defaultValue: "Invalid sharing policy"
                description:
                  key: "error.sharingservice.invalid_target_ou_description"
                  defaultValue: "The target organization unit does not satisfy the policy's constraints: acme-customer-a is named more than once"
            deploymentWideReach:
              summary: A reach this endpoint may not create
              value:
                code: "CON-1038"
                message:
                  key: "error.connectionservice.deployment_wide_sharing_not_allowed"
                  defaultValue: "Deployment-wide sharing is not allowed"
                description:
                  key: "error.connectionservice.deployment_wide_sharing_not_allowed_description"
                  defaultValue: "A policy reaching all organization units or the roots of all other trees can only be created from a declarative resource file or an import"

    ConnectionSharingPolicyListBadRequest:
      description: The page the listing asked for is not one it can return.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidPage:
              summary: A limit or offset outside its bounds, or not a number at all
              description: A limit or offset outside its bounds, or not a number.
              value:
                code: "CON-1002"
                message:
                  key: "error.connectionservice.invalid_limit_parameter"
                  defaultValue: "Invalid limit parameter"
                description:
                  key: "error.connectionservice.invalid_limit_parameter_description"
                  defaultValue: "The limit parameter must be a positive integer"

    ConnectionSharingPolicyUpdateBadRequest:
      description: The replacement is not one this policy may become.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noSection:
              summary: No section stated
              value:
                code: "CON-1031"
                message:
                  key: "error.connectionservice.invalid_sharing_policy"
                  defaultValue: "Invalid sharing policy"
                description:
                  key: "error.sharingservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed, reaches no organization unit, or states a section with fields its mode does not take: the policy reaches no organization unit"
            fieldTheModeDoesNotTake:
              summary: A section carrying a field its mode does not take
              value:
                code: "CON-1031"
                message:
                  key: "error.connectionservice.invalid_sharing_policy"
                  defaultValue: "Invalid sharing policy"
                description:
                  key: "error.sharingservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed, reaches no organization unit, or states a section with fields its mode does not take: childUnits with mode all takes no units"
            unitNamedTwice:
              summary: An organization unit named twice, or one the issuer may not name
              value:
                code: "CON-1031"
                message:
                  key: "error.connectionservice.invalid_sharing_policy"
                  defaultValue: "Invalid sharing policy"
                description:
                  key: "error.sharingservice.invalid_target_ou_description"
                  defaultValue: "The target organization unit does not satisfy the policy's constraints: acme-customer-a is named more than once"
            sectionKindChange:
              summary: An edit that turns a section naming units into one reaching a whole group, or the reverse
              value:
                code: "CON-1031"
                message:
                  key: "error.connectionservice.invalid_sharing_policy"
                  defaultValue: "Invalid sharing policy"
                description:
                  key: "error.sharingservice.scope_family_change_description"
                  defaultValue: "A section naming organization units individually cannot become one reaching a whole family, or the reverse; delete the policy and issue the one you want instead"
            declaredPolicy:
              summary: An edit aimed at a policy a resource file declares
              value:
                code: "CON-1035"
                message:
                  key: "error.connectionservice.sharing_policy_declared"
                  defaultValue: "Sharing policy is declared"
                description:
                  key: "error.connectionservice.sharing_policy_declared_description"
                  defaultValue: "The sharing policy is declared in a resource file and cannot be changed through the API"

    ConnectionSharingPolicyDeleteBadRequest:
      description: The policy exists but is not this endpoint's to remove.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            declaredPolicy:
              summary: A delete aimed at a policy a resource file declares
              value:
                code: "CON-1035"
                message:
                  key: "error.connectionservice.sharing_policy_declared"
                  defaultValue: "Sharing policy is declared"
                description:
                  key: "error.connectionservice.sharing_policy_declared_description"
                  defaultValue: "The sharing policy is declared in a resource file and cannot be changed through the API"

    ConnectionOverlayRulesBadRequest:
      description: The request does not say which organization unit to resolve for.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingOuId:
              summary: The ouId query parameter is absent or empty
              value:
                code: "CON-1037"
                message:
                  key: "error.connectionservice.missing_ou_id_parameter"
                  defaultValue: "Missing required parameter"
                description:
                  key: "error.connectionservice.missing_ou_id_parameter_description"
                  defaultValue: "The 'ouId' query parameter is required"

    ConnectionOverlayNotResolvable:
      description: No such connection, or no policy reaches the organization unit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notShared:
              summary: An organization unit no policy reaches
              value:
                code: "CON-1036"
                message:
                  key: "error.connectionservice.connection_not_shared_to_ou"
                  defaultValue: "Connection is not shared to the organization unit"
                description:
                  key: "error.connectionservice.connection_not_shared_to_ou_description"
                  defaultValue: "No sharing policy reaches the specified organization unit, so the connection is not available there"
            noSuchConnection:
              summary: No such connection
              value:
                code: "CON-1004"
                message:
                  key: "error.connectionservice.connection_not_found"
                  defaultValue: "Connection not found"
                description:
                  key: "error.connectionservice.connection_not_found_description"
                  defaultValue: "No connection exists for the supplied identifier"

    ConnectionSharingPolicyNotFound:
      description: No such connection, or no such sharing policy on this connection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            connectionNotFound:
              summary: No connection with the specified id
              value:
                code: "CON-1004"
                message:
                  key: "error.connectionservice.connection_not_found"
                  defaultValue: "Connection not found"
                description:
                  key: "error.connectionservice.connection_not_found_description"
                  defaultValue: "No connection exists for the supplied identifier"
            policyNotFound:
              summary: The connection holds no policy with the specified id
              value:
                code: "CON-1032"
                message:
                  key: "error.connectionservice.sharing_policy_not_found"
                  defaultValue: "Sharing policy not found"
                description:
                  key: "error.connectionservice.sharing_policy_not_found_description"
                  defaultValue: "The connection has no sharing policy with the specified id"

    ConnectionSharingPolicyConflict:
      description: The organization unit already holds a policy for this connection, or the policy is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            alreadyExists:
              summary: A second policy for the same organization unit
              value:
                code: "CON-1033"
                message:
                  key: "error.connectionservice.sharing_policy_exists"
                  defaultValue: "Sharing policy already exists"
                description:
                  key: "error.connectionservice.sharing_policy_exists_description"
                  defaultValue: "This organization unit already has a sharing policy for the connection; edit it instead"
            staleVersion:
              summary: An edit against a stale version
              value:
                code: "CON-1034"
                message:
                  key: "error.connectionservice.sharing_policy_version_mismatch"
                  defaultValue: "Sharing policy version mismatch"
                description:
                  key: "error.connectionservice.sharing_policy_version_mismatch_description"
                  defaultValue: "The sharing policy changed since it was read; read it again and retry the edit"

    InstanceList:
      description: Configured connection instances
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectionInstanceSummary'
    AuthZENPDPInstanceList:
      description: Configured AuthZEN PDP connections
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectionInstanceSummary'
          example:
            - id: "05d6e254-a3ca-49dd-89b7-2cf78fee6b23"
              name: "Production PDP"
              description: "Production AuthZEN PDP connection"
    ConnectionUsages:
      description: Resources that reference this connection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConnectionUsagesResponse' }
          example:
            totalResults: 1
            count: 1
            summary:
              flow: 1
            usages:
              - resourceType: flow
                id: "f1b2c3d4-0000-0000-0000-000000000001"
                displayName: "Login Flow"
                behaviorOnDelete: restrict
    AuthZENPDPBadRequest:
      description: Invalid AuthZEN PDP connection request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid-request-format:
              summary: Invalid request format
              value:
                code: "CON-1007"
                message:
                  key: "error.connectionservice.invalid_request_format"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.connectionservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed or contains invalid data"
            invalid-authzen-pdp-endpoint:
              summary: Invalid AuthZEN PDP endpoint
              value:
                code: "CON-1006"
                message:
                  key: "error.connectionservice.invalid_authzen_pdp_endpoint"
                  defaultValue: "Invalid AuthZEN PDP endpoint"
                description:
                  key: "error.connectionservice.invalid_authzen_pdp_endpoint_description"
                  defaultValue: "The single and batch evaluation endpoints must be absolute URLs."
            authentication-required-for-endpoint-change:
              summary: Fresh authentication is required after changing a PDP endpoint
              value:
                code: "CON-1014"
                message:
                  key: "error.connectionservice.authzen_pdp_authentication_required_for_endpoint_change"
                  defaultValue: "Authentication must be updated"
                description:
                  key: "error.connectionservice.authzen_pdp_authentication_required_for_endpoint_change_description"
                  defaultValue: "Enter fresh credentials when changing an AuthZEN PDP endpoint."
    AuthZENPDPConflict:
      description: An AuthZEN PDP connection with the same name already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1008"
            message:
              key: "error.connectionservice.authzen_pdp_already_exists"
              defaultValue: "An AuthZEN PDP connection with the same name already exists"
            description:
              key: "error.connectionservice.authzen_pdp_already_exists_description"
              defaultValue: "Choose a different name for the AuthZEN PDP connection"
    HTTPConnectionInstanceList:
      description: Configured HTTP endpoint connections
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectionInstanceSummary'
          example:
            - id: "0199d1f4-6a1e-7c3b-9f2a-1b2c3d4e5f60"
              name: "Risk Engine"
              description: "Sign-in risk evaluation"
    HTTPConnectionBadRequest:
      description: Invalid HTTP endpoint connection request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid-request-format:
              summary: Invalid request format
              value:
                code: "CON-1007"
                message:
                  key: "error.connectionservice.invalid_request_format"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.connectionservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed or contains invalid data"
            invalid-name:
              summary: Invalid name
              value:
                code: "CON-1017"
                message:
                  key: "error.connectionservice.invalid_http_connection_name"
                  defaultValue: "Invalid HTTP connection name"
                description:
                  key: "error.connectionservice.invalid_http_connection_name_description"
                  defaultValue: "The HTTP connection name is required and must be at most 255 characters"
            invalid-description:
              summary: Invalid description
              value:
                code: "CON-1022"
                message:
                  key: "error.connectionservice.invalid_http_connection_description"
                  defaultValue: "Invalid HTTP connection description"
                description:
                  key: "error.connectionservice.invalid_http_connection_description_description"
                  defaultValue: "The HTTP connection description must be at most 500 characters"
            invalid-url:
              summary: Invalid URL
              value:
                code: "CON-1018"
                message:
                  key: "error.connectionservice.invalid_http_connection_url"
                  defaultValue: "Invalid HTTP connection URL"
                description:
                  key: "error.connectionservice.invalid_http_connection_url_description"
                  defaultValue: "The URL must be an absolute http or https URL with a valid host and port and no user name or password, and must use https when the connection sends credentials"
            invalid-timeout:
              summary: Invalid timeout
              value:
                code: "CON-1019"
                message:
                  key: "error.connectionservice.invalid_http_connection_timeout"
                  defaultValue: "Invalid HTTP connection timeout"
                description:
                  key: "error.connectionservice.invalid_http_connection_timeout_description"
                  defaultValue: "The timeout must be between 1 and 20000 milliseconds"
            invalid-headers:
              summary: Invalid headers
              value:
                code: "CON-1020"
                message:
                  key: "error.connectionservice.invalid_http_connection_headers"
                  defaultValue: "Invalid HTTP connection headers"
                description:
                  key: "error.connectionservice.invalid_http_connection_headers_description"
                  defaultValue: "Each header needs a valid name that is not repeated and a value without line breaks. Credentials go in authentication, so names that carry them, such as Authorization or X-Api-Key, headers the HTTP client manages, such as Host or Content-Type, and headers the authentication sets cannot be set."
            invalid-authentication:
              summary: Invalid authentication
              value:
                code: "CON-1021"
                message:
                  key: "error.connectionservice.invalid_http_connection_authentication"
                  defaultValue: "Invalid HTTP connection authentication"
                description:
                  key: "error.connectionservice.invalid_http_connection_authentication_description"
                  defaultValue: "The authentication must give every field its method requires, and a password or token cannot be ******: omit it to keep the stored one. A changed method, username or URL origin needs each secret again."
            masked-secret:
              summary: Password or token sent as the mask
              value:
                code: "CON-1021"
                message:
                  key: "error.connectionservice.invalid_http_connection_authentication"
                  defaultValue: "Invalid HTTP connection authentication"
                description:
                  key: "error.connectionservice.invalid_http_connection_authentication_description"
                  defaultValue: "The authentication must give every field its method requires, and a password or token cannot be ******: omit it to keep the stored one. A changed method, username or URL origin needs each secret again."
            invalid-authentication-type:
              summary: Unsupported authentication type
              value:
                code: "CON-1012"
                message:
                  key: "error.connectionservice.invalid_authentication_type"
                  defaultValue: "Invalid authentication type"
                description:
                  key: "error.connectionservice.invalid_authentication_type_description"
                  defaultValue: "The authentication type must name a method this deployment supports"
            declarative-create:
              summary: Create refused while HTTP connections are declarative (POST)
              value:
                code: "DCR-1001"
                message:
                  key: "error.declarative_resource.create_operation_not_allowed"
                  defaultValue: "Declarative resource create operation is not allowed"
                description:
                  key: "error.declarative_resource.create_operation_not_allowed_description"
                  defaultValue: "Creating declarative resources is not permitted"
            declarative-update:
              summary: Update of a declarative connection (PUT)
              value:
                code: "DCR-1002"
                message:
                  key: "error.declarative_resource.update_operation_not_allowed"
                  defaultValue: "Declarative resource update operation is not allowed"
                description:
                  key: "error.declarative_resource.update_operation_not_allowed_description"
                  defaultValue: "Updating declarative resources is not permitted"
    HTTPConnectionDeleteBadRequest:
      description: The HTTP endpoint connection is declarative and cannot be deleted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "DCR-1003"
            message:
              key: "error.declarative_resource.delete_operation_not_allowed"
              defaultValue: "Declarative resource delete operation is not allowed"
            description:
              key: "error.declarative_resource.delete_operation_not_allowed_description"
              defaultValue: "Deleting declarative resources is not permitted"
    HTTPConnectionListBadRequest:
      description: The HTTP endpoint connections exceed the composite-mode record limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1027"
            message:
              key: "error.connectionservice.http_connection_result_limit_exceeded"
              defaultValue: "Result limit exceeded in composite mode"
            description:
              key: "error.connectionservice.http_connection_result_limit_exceeded_description"
              defaultValue: "The total number of HTTP connections exceeds the maximum limit in composite mode"
    HTTPConnectionConflict:
      description: An HTTP endpoint connection with the same name already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1016"
            message:
              key: "error.connectionservice.http_connection_already_exists"
              defaultValue: "An HTTP connection with the same name already exists"
            description:
              key: "error.connectionservice.http_connection_already_exists_description"
              defaultValue: "Choose a different name for the HTTP connection"
    HTTPConnectionNotFound:
      description: HTTP endpoint connection not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1015"
            message:
              key: "error.connectionservice.http_connection_not_found"
              defaultValue: "HTTP connection not found"
            description:
              key: "error.connectionservice.http_connection_not_found_description"
              defaultValue: "No HTTP connection exists for the supplied identifier"
    HTTPConnectionDependencyConflict:
      description: The HTTP endpoint connection cannot be deleted because other resources use it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1026"
            message:
              key: "error.connectionservice.http_connection_has_blocking_dependencies"
              defaultValue: "HTTP connection cannot be deleted"
            description:
              key: "error.connectionservice.http_connection_has_blocking_dependencies_description"
              defaultValue: "The HTTP connection cannot be deleted because 1 flow(s) depend on it. Remove or reassign them first."
    ConnectionDependencyConflict:
      description: The connection cannot be deleted because it is still in use
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1005"
            message:
              key: "error.connectionservice.connection_has_blocking_dependencies"
              defaultValue: "Connection cannot be deleted"
            description:
              key: "error.connectionservice.connection_has_blocking_dependencies_description"
              defaultValue: "The connection cannot be deleted because other resources depend on it. Remove or reassign them first."
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid-request-format:
              summary: Invalid request format
              value:
                code: "IDP-1001"
                message:
                  key: "error.idpservice.invalid_request_format"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.idpservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed or contains invalid data"
            organization-unit-required:
              summary: No organization unit given on create
              description: >-
                Every connection is created in an organization unit. The code depends on the kind of connection:
                `IDP-1016` for an identity provider, `MNS-1020` for an SMS or email connection, `CON-1025` for an
                AuthZEN PDP connection and `CON-1030` for an HTTP connection. An organization unit that does not
                exist is `IDP-1014`, `MNS-1018`, `CON-1023` or `CON-1028`, and an attempt to change it on update is
                `IDP-1015`, `MNS-1019`, `CON-1024` or `CON-1029`.
              value:
                code: "CON-1025"
                message:
                  key: "error.connectionservice.connection_ou_required"
                  defaultValue: "Organization unit required"
                description:
                  key: "error.connectionservice.connection_ou_required_description"
                  defaultValue: "A connection needs an organization unit. Give its ouId in the request"
    NotFound:
      description: Connection not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "CON-1004"
            message:
              key: "error.connectionservice.connection_not_found"
              defaultValue: "Connection not found"
            description:
              key: "error.connectionservice.connection_not_found_description"
              defaultValue: "No connection exists for the supplied identifier"
    Conflict:
      description: A connection with the same name already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "AUTH-4010"
            message:
              key: "error.unauthorized"
              defaultValue: "Unauthorized"
            description:
              key: "error.unauthorized_description"
              defaultValue: "Authentication is required to access this resource"
    Forbidden:
      description: Insufficient permissions to perform this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "AUTH-4030"
            message:
              key: "error.forbidden"
              defaultValue: "Forbidden"
            description:
              key: "error.forbidden_description"
              defaultValue: "You do not have sufficient permissions to access this resource"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: "SSE-5000"
            message:
              key: "error.internal_server_error"
              defaultValue: "Internal server error"
            description:
              key: "error.internal_server_error_description"
              defaultValue: "An unexpected error occurred while processing the request"

  schemas:
    ConnectionListResponse:
      type: object
      required: [totalResults, startIndex, count, connections, links]
      properties:
        totalResults:
          type: integer
          description: Number of instances that match the listing operation.
          example: 3
        startIndex:
          type: integer
          description: Index of the first element of the page, which is equal to offset + 1.
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page.
          example: 3
        connections:
          type: array
          items: { $ref: '#/components/schemas/ConnectionInstance' }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }

    Link:
      type: object
      properties:
        href: { type: string, example: "/connections?offset=30&limit=30" }
        rel: { type: string, example: "next" }

    ConnectionInstance:
      type: object
      required: [id, name, ouId, type, categories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "My Google" }
        description: { type: string }
        ouId:
          type: string
          description: >-
            ID of the organization unit that owns the connection. Every kind of connection has one.
          example: "01900000-0000-7000-8000-000000000001"
        type:
          type: string
          description: >-
            Lowercase vendor identifier. `sms-gateway` denotes a generic HTTP webhook SMS sender.
          enum: [google, github, oidc, oauth, twilio, vonage, sms-gateway, authzen-pdp, email-smtp, http]
          example: "google"
        categories:
          type: array
          minItems: 1
          items:
            type: string
            enum: [identity-provider, sms-provider, authorization-pdp, email-provider, http]
          example: ["identity-provider"]
        isOwnedByOU:
          type: boolean
          description: 'Whether the listed organization unit owns the connection rather than being shared it. Without an `ouId` filter, every listed connection is owned.'
          example: true

    ConnectionInstanceSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "My Google" }
        description: { type: string }

    ConnectionUsage:
      type: object
      description: A single resource that references the connection.
      required:
        - resourceType
        - id
        - displayName
        - behaviorOnDelete
      properties:
        resourceType:
          type: string
          description: Type of the referencing resource.
          enum: [flow]
          example: flow
        id:
          type: string
          format: uuid
          description: Identifier of the referencing resource.
          example: "f1b2c3d4-0000-0000-0000-000000000001"
        displayName:
          type: string
          description: Human-readable name of the referencing resource.
          example: "Login Flow"
        behaviorOnDelete:
          type: string
          description: |
            What happens to this resource when the connection is deleted.
            - `fallback`: the reference is kept as-is.
            - `cascade`: the resource is permanently deleted.
            - `restrict`: the resource blocks deletion of the connection.
          enum: [fallback, cascade, restrict]
          example: restrict

    ConnectionUsagesSummary:
      type: object
      nullable: true
      description: |
        Per-resource-type count of usages, keyed by resource type
        (e.g. `flow`). Null when the counts could not be determined.
      additionalProperties:
        type: integer
      example:
        flow: 1

    ConnectionUsagesResponse:
      type: object
      description: |
        Resources that reference a connection, aggregated across all resource types.
        Drives pre-delete confirmation dialogs; informational only.
      properties:
        totalResults:
          type: integer
          nullable: true
          description: |
            Total number of resources that reference the connection.
            Null when usage data is unavailable; 0 means confirmed empty.
          example: 1
        count:
          type: integer
          description: Number of results returned.
          example: 1
        summary:
          $ref: '#/components/schemas/ConnectionUsagesSummary'
        usages:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionUsage'

    GoogleConnectionUpdateRequest:
      type: object
      required: [name, clientId, redirectUri]
      properties:
        name: { type: string, example: "My Google" }
        description: { type: string }
        ouId:
          type: string
          description: >-
            ID of the organization unit that owns the connection. Required when the connection is created (IDP-1016), and
            the organization unit has to exist (IDP-1014). It cannot be changed afterwards: on an update, leave it out
            to keep the owner, or give the one the connection has (IDP-1015).
          example: "01900000-0000-7000-8000-000000000001"
        clientId: { type: string }
        clientSecret: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        redirectUri: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        jwksEndpoint: { type: string }
        issuer: { type: string }
        tokenExchangeEnabled: { type: boolean }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }
    GoogleConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/GoogleConnectionUpdateRequest'
        - type: object
          required: [ouId, clientSecret]
    GoogleConnectionResponse:
      type: object
      required: [ouId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ouId:
          type: string
          description: >-
            ID of the organization unit that owns the connection.
          example: "01900000-0000-7000-8000-000000000001"
        type: { type: string, example: "google" }
        clientId: { type: string }
        clientSecret: { type: string, description: "Masked as \"******\".", example: "******" }
        redirectUri: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        jwksEndpoint: { type: string }
        issuer: { type: string }
        tokenExchangeEnabled: { type: boolean }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }

    GitHubConnectionUpdateRequest:
      type: object
      required: [name, clientId, redirectUri]
      properties:
