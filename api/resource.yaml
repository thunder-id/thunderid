openapi: 3.0.3
info:
  title: Resource Server Management API
  version: "1.0"
  description: |
    Resource servers in ThunderID define the permission namespace for a protected API or service; resources and actions nested within them form the permission strings used in role assignments.
    Resources can be nested hierarchically, and permissions are derived from the handle-based path structure.
    Resource Server identifier is optional and if provided, must be unique within the system.
    Resource, and Action handles are unique under it's parent and are immutable after creation and used directly for permission derivation.
    Resource parent hierarchy is immutable after creation.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Resource Servers
    description: Register and manage resource servers that define OAuth2 permission scopes.
  - name: Resources
    description: Manage hierarchical resources within a resource server.
  - name: Actions
    description: Define actions on resources; actions map directly to OAuth2 scopes used in permission grants.
  - name: Permissions
    description: Preview and retrieve derived permissions based on the resource handle hierarchy.
  - name: Sharing Policies
    description: Share a resource server with other organization units, and resolve what each of them may do with it.

security:
  - OAuth2: [system]

paths:
  /resource-servers:
    get:
      tags:
        - Resource Servers
      summary: List resource servers
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
        - in: query
          name: ouId
          required: false
          description: |
            Answer as the given organization unit sees this resource server: its own resources and
            actions if it owns the server, or the subset a sharing policy left it if it was shared
            one. A deployment-wide caller may name any organization unit; any other caller may only
            name one it already has standing over, and naming another returns not found.

            Omitted, the answer follows the caller's own standing: a deployment-wide token sees
            every resource server, and a narrower token sees the ones its own organization unit
            owns or was shared.

            This is the only resource-server endpoint taking the parameter. The nested resource
            and action reads are always answered from the caller's own standing.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of resource servers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServerListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                resourceServers:
                  - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Booking System"
                    description: "Handles all booking operations"
                    identifier: "https://api.example.com/booking"
                    type: "API"
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    delimiter: ":"
                  - id: "257e528f-eb24-48b6-884d-20460e190957"
                    name: "Property Management"
                    description: "Property and facility management"
                    identifier: "https://api.example.com/property"
                    type: "CUSTOM"
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    delimiter: ":"
                links:
                  - href: "resource-servers?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "RES-1011"
                    message:
                      key: "error.resourceservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.resourceservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "RES-1012"
                    message:
                      key: "error.resourceservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.resourceservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
                result-limit-exceeded:
                  summary: Result limit exceeded in composite mode
                  value:
                    code: "RES-1021"
                    message:
                      key: "error.resourceservice.result_limit_exceeded_in_composite_mode"
                      defaultValue: "Result limit exceeded in composite mode"
                    description:
                      key: "error.resourceservice.result_limit_exceeded_in_composite_mode_description"
                      defaultValue: "The total number of records exceeds the maximum limit in composite mode"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    post:
      tags:
        - Resource Servers
      summary: Create a new resource server
      description: Creates a new resource server with the specified details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceServerRequest'
            example:
              name: "Booking System"
              description: "Handles all booking operations"
              identifier: "https://api.example.com/booking"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
      responses:
        "201":
          description: Resource server created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System"
                description: "Handles all booking operations"
                identifier: "https://api.example.com/booking"
                type: "CUSTOM"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "RES-1001"
                    message:
                      key: "error.resourceservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "RES-1010"
                    message:
                      key: "error.resourceservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.resourceservice.organization_unit_not_found_description"
                      defaultValue: "The specified organization unit does not exist"
                invalid-delimiter:
                  summary: Invalid delimiter
                  value:
                    code: "RES-1015"
                    message:
                      key: "error.resourceservice.invalid_delimiter"
                      defaultValue: "Invalid delimiter"
                    description:
                      key: "error.resourceservice.invalid_delimiter_description"
                      defaultValue: "Delimiter must be a single character from: a-z A-Z 0-9 . _ : - /"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Name conflict
                  value:
                    code: "RES-1004"
                    message:
                      key: "error.resourceservice.name_conflict"
                      defaultValue: "Name conflict"
                    description:
                      key: "error.resourceservice.name_conflict_description"
                      defaultValue: "A resource server with the same name already exists"
                identifier-conflict:
                  summary: Identifier conflict
                  value:
                    code: "RES-1013"
                    message:
                      key: "error.resourceservice.identifier_conflict"
                      defaultValue: "Identifier conflict"
                    description:
                      key: "error.resourceservice.identifier_conflict_description"
                      defaultValue: "A resource server with the same identifier already exists"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /resource-servers/{id}:
    get:
      tags:
        - Resource Servers
      summary: Get resource server details
      description: |
        Returns resource server metadata.

        `ouId` answers the question on one organization unit's behalf rather than the caller's. It
        narrows and never widens: a caller with no standing over that unit, and a unit that neither
        owns the resource server nor was reached by a sharing policy, both get 404. Omitting it
        answers as the caller.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: ouId
          required: false
          description: Answer as this organization unit sees the resource server.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resource server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System"
                description: "Handles all booking operations"
                identifier: "https://api.example.com/booking"
                type: "API"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1002"
                message:
                  key: "error.resourceservice.missing_id"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.resourceservice.missing_id_description"
                  defaultValue: "Resource server ID is required"
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1003"
                message:
                  key: "error.resourceservice.resource_server_not_found"
                  defaultValue: "Resource server not found"
                description:
                  key: "error.resourceservice.resource_server_not_found_description"
                  defaultValue: "The resource server with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    put:
      tags:
        - Resource Servers
      summary: Update resource server
      description: Updates resource server name, description, identifier, and organization unit.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceServerRequest'
            example:
              name: "Booking System Updated"
              description: "Updated description for booking operations"
              identifier: "https://api.example.com/booking/v2"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
      responses:
        "200":
          description: Resource server updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System Updated"
                description: "Updated description for booking operations"
                identifier: "https://api.example.com/booking/v2"
                type: "API"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-id:
                  summary: Missing resource server ID
                  value:
                    code: "RES-1002"
                    message:
                      key: "error.resourceservice.missing_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.missing_id_description"
                      defaultValue: "Resource server ID is required"
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "RES-1001"
                    message:
                      key: "error.resourceservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "RES-1010"
                    message:
                      key: "error.resourceservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.resourceservice.organization_unit_not_found_description"
                      defaultValue: "The specified organization unit does not exist"
                immutable-resource-server:
                  summary: Cannot modify declarative resource server
                  value:
                    code: "RES-1018"
                    message:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server"
                      defaultValue: "Cannot modify declarative resource server"
                    description:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server_description"
                      defaultValue: "Resource server is defined in declarative configuration and cannot be modified"
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1003"
                message:
                  key: "error.resourceservice.resource_server_not_found"
                  defaultValue: "Resource server not found"
                description:
                  key: "error.resourceservice.resource_server_not_found_description"
                  defaultValue: "The resource server with the specified id does not exist"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Name conflict
                  value:
                    code: "RES-1004"
                    message:
                      key: "error.resourceservice.name_conflict"
                      defaultValue: "Name conflict"
                    description:
                      key: "error.resourceservice.name_conflict_description"
                      defaultValue: "A resource server with the same name already exists"
                identifier-conflict:
                  summary: Identifier conflict
                  value:
                    code: "RES-1013"
                    message:
                      key: "error.resourceservice.identifier_conflict"
                      defaultValue: "Identifier conflict"
                    description:
                      key: "error.resourceservice.identifier_conflict_description"
                      defaultValue: "A resource server with the same identifier already exists"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    delete:
      tags:
        - Resource Servers
      summary: Delete a resource server by id
      description: Deletes a resource server. Cannot delete if it has resources or actions.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Resource server deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-id:
                  summary: Missing resource server ID
                  value:
                    code: "RES-1002"
                    message:
                      key: "error.resourceservice.missing_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.missing_id_description"
                      defaultValue: "Resource server ID is required"
                cannot-delete:
                  summary: Cannot delete resource server
                  value:
                    code: "RES-1006"
                    message:
                      key: "error.resourceservice.cannot_delete"
                      defaultValue: "Cannot delete resource server"
                    description:
                      key: "error.resourceservice.cannot_delete_description"
                      defaultValue: "Cannot delete resource server that has resources or actions"
                immutable-resource-server:
                  summary: Cannot delete declarative resource server
                  value:
                    code: "RES-1018"
                    message:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server"
                      defaultValue: "Cannot modify declarative resource server"
                    description:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server_description"
                      defaultValue: "Resource server is defined in declarative configuration and cannot be modified"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /resource-servers/{rsId}/resources:
    get:
      tags:
        - Resources
      summary: List resources in resource server
      description: |
        Returns a paginated list of resources. Use the parentId parameter to filter:
        - No parentId: returns only top-level resources (where parent is null)
        - parentId={uuid}: returns direct children of specified parent
      parameters:
        - in: path
          name: rsId
          required: true
          schema:
            type: string
            format: uuid
          description: Resource server ID
        - in: query
          name: parentId
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Parent resource ID to filter children.
            - Omit parameter: returns only top-level resources (parent is null)
            - UUID: returns direct children of that parent
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
              examples:
                top-level-only:
                  summary: Top-level resources (no parentId specified)
                  value:
                    totalResults: 3
                    startIndex: 1
                    count: 2
                    resources:
                      - id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                        name: "Reservations"
                        description: "Reservation management"
                        handle: "reservations"
                        permission: "reservations"
                      - id: "6b1e7b8d-7e19-41eb-8fa2-c0ee5bb67a94"
                        name: "Payments"
                        description: "Payment processing"
                        handle: "payments"
                        permission: "payments"
                    links:
                      - href: "resource-servers/3fa85f64-5717-4562-b3fc-2c963f66afa6/resources?offset=2&limit=2"
                        rel: "next"
                children-of-parent:
                  summary: Children of specific parent
                  value:
                    totalResults: 2
                    startIndex: 1
                    count: 2
                    resources:
                      - id: "8b5c2f9f-6d7a-4c71-a343-3c1bbf76fg4d"
                        name: "Online Booking"
                        description: "Online booking subsystem"
                        handle: "online-booking"
                        parent: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                        permission: "reservations:online-booking"
                      - id: "7c4d5e6f-8f3a-4e93-c565-5e3ddf98hi6f"
                        name: "Phone Booking"
                        description: "Phone-based booking"
                        handle: "phone-booking"
                        parent: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                        permission: "reservations:phone-booking"
                    links: []
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "RES-1011"
                    message:
                      key: "error.resourceservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.resourceservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "RES-1012"
                    message:
                      key: "error.resourceservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.resourceservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
                result-limit-exceeded:
                  summary: Result limit exceeded in composite mode
                  value:
                    code: "RES-1021"
                    message:
                      key: "error.resourceservice.result_limit_exceeded_in_composite_mode"
                      defaultValue: "Result limit exceeded in composite mode"
                    description:
                      key: "error.resourceservice.result_limit_exceeded_in_composite_mode_description"
                      defaultValue: "The total number of records exceeds the maximum limit in composite mode"
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1003"
                message:
                  key: "error.resourceservice.resource_server_not_found"
                  defaultValue: "Resource server not found"
                description:
                  key: "error.resourceservice.resource_server_not_found_description"
                  defaultValue: "The resource server with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    post:
      tags:
        - Resources
      summary: Create a new resource
      description: |
        Creates a new resource within the resource server. Handle is immutable and used for permissions. Parent is immutable after creation.
        - Set parent to null for top-level resources
        - Set parent to UUID for nested resources
      parameters:
        - in: path
          name: rsId
          required: true
          schema:
            type: string
            format: uuid
          description: Resource server ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
            examples:
              top-level-resource:
                summary: Top-level resource
                value:
                  name: "Reservations"
                  description: "Reservation management"
                  handle: "reservations"
                  parent: null
              nested-resource:
                summary: Nested resource
                value:
                  name: "Online Booking"
                  description: "Online booking subsystem"
                  handle: "online-booking"
                  parent: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
              examples:
                top-level-resource:
                  summary: Top-level resource created
                  value:
                    id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                    name: "Reservations"
                    description: "Reservation management"
                    handle: "reservations"
                    permission: "reservations"
                nested-resource:
                  summary: Nested resource created
                  value:
                    id: "8b5c2f9f-6d7a-4c71-a343-3c1bbf76fg4d"
                    name: "Online Booking"
                    description: "Online booking subsystem"
                    handle: "online-booking"
                    parent: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                    permission: "reservations:online-booking"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "RES-1001"
                    message:
                      key: "error.resourceservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                parent-not-found:
                  summary: Parent resource not found
                  value:
                    code: "RES-1005"
                    message:
                      key: "error.resourceservice.parent_resource_not_found"
                      defaultValue: "Parent resource not found"
                    description:
                      key: "error.resourceservice.parent_resource_not_found_description"
                      defaultValue: "The specified parent resource does not exist"
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1003"
                message:
                  key: "error.resourceservice.resource_server_not_found"
                  defaultValue: "Resource server not found"
                description:
                  key: "error.resourceservice.resource_server_not_found_description"
                  defaultValue: "The resource server with the specified id does not exist"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1014"
                message:
                  key: "error.resourceservice.handle_conflict"
                  defaultValue: "Handle conflict"
