              example:
                totalResults: 3
                startIndex: 1
                count: 2
                roles:
                  - id: "d4b1e6b0-9c3a-4f8a-9a3e-2f6a3b1c4d5e"
                    name: "OU Admin"
                    description: "Administers this organization unit"
                    isReadOnly: false
                    isOwnedByOU: true
                  - id: "f1a2b3c4-5d6e-4f7a-8b9c-0d1e2f3a4b5c"
                    name: "Viewer"
                    description: "Read-only access, shared from the parent organization unit"
                    isReadOnly: true
                    isOwnedByOU: false
                links:
                  - href: "organization-units/tree/engineering/frontend/roles?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "OU-1010"
                    message:
                      key: "error.ouservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.ouservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "OU-1011"
                    message:
                      key: "error.ouservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.ouservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Organization unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "OU-1003"
                message:
                  key: "error.ouservice.organization_unit_not_found"
                  defaultValue: "Organization unit not found"
                description:
                  key: "error.ouservice.organization_unit_not_found_description"
                  defaultValue: "The organization unit with the specified id does not exist"
        "500":
          description: Internal server error

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs

  parameters:
    limitQueryParam:
      in: query
      name: limit
      required: false
      description: |
        Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        default: 30
    offsetQueryParam:
      in: query
      name: offset
      required: false
      description: |
        Number of records to skip for pagination.
      schema:
        type: integer
        default: 0
    includeQueryParam:
      in: query
      name: include
      required: false
      description: |
        Specifies additional information to include in the response.
        Supported values: `display` - includes a display name for each user,
        resolved from the schema-configured display attribute. Falls back to
        the user ID when no display attribute is configured or the value
        cannot be resolved.
      schema:
        type: string
        enum:
          - display
    ouFilterParam:
      in: query
      name: filter
      required: false
      description: |
        Filter organization units by attribute values.
        Format: `attribute operator "value"`. Join multiple conditions with `AND` or `OR`; `AND` takes precedence over `OR`.
        Filterable attributes: `name`, `handle`, `description`, `createdAt`, `updatedAt`.
        Supported operators:
        - `eq` - Equals. Case-insensitive for `name`, `handle`, and `description`.
        - `sw` - Starts with. Case-insensitive.
        - `gt` - Greater than. Use with `createdAt` or `updatedAt` in ISO 8601 format.
        - `lt` - Less than. Use with `createdAt` or `updatedAt` in ISO 8601 format.
        Examples:
        - `name eq "Engineering"` - Organization units named "Engineering"
        - `handle sw "eng"` - Organization units whose handle starts with "eng"
        - `createdAt gt "2026-01-01T00:00:00Z"` - Organization units created after 1 January 2026
        - `name eq "Engineering" OR name eq "Sales"` - Organization units named "Engineering" or "Sales"
      schema:
        type: string
      examples:
        name-filter:
          summary: Filter by name
          value: 'name eq "Engineering"'
        handle-prefix-filter:
          summary: Filter by handle prefix
          value: 'handle sw "eng"'
        created-at-filter:
          summary: Filter by creation timestamp
          value: 'createdAt gt "2026-01-01T00:00:00Z"'
        combined-filter:
          summary: Combine conditions with OR
          value: 'name eq "Engineering" OR name eq "Sales"'

  responses:
    Forbidden:
      description: The caller may not perform the operation in the organization unit of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "SSE-4030"
            message:
              key: "error.unauthorized"
              defaultValue: "Unauthorized"
            description:
              key: "error.unauthorized_description"
              defaultValue: "The caller is not authorized to perform this operation"
  schemas:
    OrganizationUnitBasic:
      type: object
      required: [id, handle, name, isReadOnly, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        name:
          type: string
        description:
          type: string
        projectId:
          type: string
          maxLength: 36
          description: "ID of the project the organization unit belongs to. The system organization unit belongs to none."
        parent:
          type: string
          format: uuid
          readOnly: true
          description: "ID of the parent organization unit. Omitted for a root organization unit. In a placement listing, a project's organization unit placed under the system organization unit names it here."
        logoUrl:
          type: string
          format: uri
          description: "Logo URL for the organization unit"
        isReadOnly:
          type: boolean
          readOnly: true
          description: "Whether the organization unit is immutable by clients."
        isSystem:
          type: boolean
          readOnly: true
          description: "Marks the system organization unit in a placement listing (`placement=true`)."
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: "Creation timestamp in UTC."
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: "Last update timestamp in UTC."

    OrganizationUnit:
      type: object
      required: [id, handle, name, isReadOnly, createdAt, updatedAt]
      properties:
        isReadOnly:
          type: boolean
          readOnly: true
          description: |
            Whether the organization unit is read only: declared in a resource file, or deployed by a control
            plane, which only a later deploy from the control plane changes.
          example: false
        id:
          type: string
          format: uuid
        handle:
          type: string
        name:
          type: string
        description:
          type: string
        parent:
          type: string
          format: uuid
          nullable: true
        projectId:
          type: string
          maxLength: 36
          description: "ID of the project the organization unit belongs to. The system organization unit belongs to none."
        themeId:
          type: string
          format: uuid
          description: "Theme configuration ID for the organization unit"
        layoutId:
          type: string
          format: uuid
          description: "Layout configuration ID for the organization unit"
        authFlowId:
          type: string
          format: uuid
          description: "Default authentication flow ID for the organization unit"
        registrationFlowId:
          type: string
          format: uuid
          description: "Default Registration flow ID for the organization unit"
        isRegistrationFlowEnabled:
          type: boolean
          description: "Whether the registration flow is enabled for the organization unit"
        recoveryFlowId:
          type: string
          format: uuid
          description: "Default Recovery flow ID for the organization unit"
        isRecoveryFlowEnabled:
          type: boolean
          description: "Whether the recovery flow is enabled for the organization unit"
        signOutFlowId:
          type: string
          format: uuid
          description: "Default Sign-out flow ID for the organization unit"
        logoUrl:
          type: string
          format: uri
          description: "Logo URL for the organization unit"
        tosUri:
          type: string
          format: uri
          description: "Terms of Service URI"
        policyUri:
          type: string
          format: uri
          description: "Privacy Policy URI"
        cookiePolicyUri:
          type: string
          format: uri
          description: "Cookie Policy URI"
        isReadOnly:
          type: boolean
          readOnly: true
          description: "Whether the organization unit is immutable by clients."
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: "Creation timestamp in UTC."
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: "Last update timestamp in UTC."

    User:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: "Handle of the user type"
        display:
          type: string
          description: >-
            Display name of the user, resolved from the schema-configured
            display attribute. Falls back to the user ID when no display
            attribute is configured or the value cannot be resolved. Only
            included when include=display is specified.
        isOwnedByOU:
          type: boolean
          description: "Whether the organization unit owns the user rather than being shared it."

    Group:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Role:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        isReadOnly:
          type: boolean
          description: "Whether the role is read-only here: declarative, or shared with the organization unit."
        isOwnedByOU:
          type: boolean
          description: "Whether the organization unit owns the role rather than being shared it."

    Link:
      type: object
      properties:
        href:
          type: string
          example: "organization-units?offset=20&limit=10"
        rel:
          type: string
          example: "next"

    CreateOrganizationUnitByHandleRequest:
      type: object
      required: [handle, name]
      properties:
        handle:
          type: string
          description: "The unique handle for the organization unit within its parent"
          example: "frontend-dev"
        name:
          type: string
          description: "The display name of the organization unit"
          example: "Frontend Development Team"
        description:
          type: string
          description: "Optional description of the organization unit"
          example: "Team responsible for frontend development and UI/UX"
        projectId:
          type: string
          maxLength: 36
          description: |
            ID of the project the organization unit belongs to. Its parent is in the same project or is the
            system organization unit, which every project shares and which belongs to no project. On the
            Control Plane, every organization unit but the system one belongs to a project, so a create
            without `projectId` fails with `OU-1023`, and a project that does not exist fails with
            `OU-1022`. An update without `projectId` keeps the organization unit in its project, and an update
            that names another project moves the organization unit and its descendants there. A move
            that reaches a declarative descendant moves nothing and fails with `OU-1012`, and a move out of
            a project while the organization unit or a descendant holds resources fails with `OU-1027`.
            A server without projects keeps the `projectId` it receives without checking it.
        themeId:
          type: string
          format: uuid
          description: "Theme configuration ID for the organization unit"
        layoutId:
          type: string
          format: uuid
          description: "Layout configuration ID for the organization unit"
        authFlowId:
          type: string
          format: uuid
          description: "Default authentication flow ID for the organization unit"
        registrationFlowId:
          type: string
          format: uuid
          description: "Default Registration flow ID for the organization unit"
        isRegistrationFlowEnabled:
          type: boolean
          description: "Whether the registration flow is enabled for the organization unit"
        recoveryFlowId:
          type: string
          format: uuid
          description: "Default Recovery flow ID for the organization unit"
        isRecoveryFlowEnabled:
          type: boolean
          description: "Whether the recovery flow is enabled for the organization unit"
        signOutFlowId:
          type: string
          format: uuid
          description: "Sign-out flow ID for the organization unit"
        logoUrl:
          type: string
          format: uri
          description: "Logo URL for the organization unit"
        tosUri:
          type: string
          format: uri
          description: "Terms of Service URI"
        policyUri:
          type: string
          format: uri
          description: "Privacy Policy URI"
        cookiePolicyUri:
          type: string
          format: uri
          description: "Cookie Policy URI"

    UpdateOrganizationUnitByHandleRequest:
      type: object
      required: [name, handle]
      properties:
        name:
          type: string
          description: "The display name of the organization unit"
          example: "Frontend Development Team"
        handle:
          type: string
          description: "The unique handle for the organization unit within its parent"
          example: "frontend-dev"
        description:
          type: string
          description: "Optional description of the organization unit"
          example: "Team responsible for frontend development and UI/UX"
        projectId:
          type: string
          maxLength: 36
          description: |
            ID of the project the organization unit belongs to. Its parent is in the same project or is the
            system organization unit, which every project shares and which belongs to no project. On the
            Control Plane, every organization unit but the system one belongs to a project, so a create
            without `projectId` fails with `OU-1023`, and a project that does not exist fails with
            `OU-1022`. An update without `projectId` keeps the organization unit in its project, and an update
            that names another project moves the organization unit and its descendants there. A move
            that reaches a declarative descendant moves nothing and fails with `OU-1012`, and a move out of
            a project while the organization unit or a descendant holds resources fails with `OU-1027`.
            A server without projects keeps the `projectId` it receives without checking it.
        themeId:
          type: string
          format: uuid
          description: "Theme configuration ID for the organization unit"
        layoutId:
          type: string
          format: uuid
          description: "Layout configuration ID for the organization unit"
        authFlowId:
          type: string
          format: uuid
          description: "Default authentication flow ID for the organization unit"
        registrationFlowId:
          type: string
          format: uuid
          description: "Default Registration flow ID for the organization unit"
        isRegistrationFlowEnabled:
          type: boolean
          description: "Whether the registration flow is enabled for the organization unit"
        recoveryFlowId:
          type: string
          format: uuid
          description: "Recovery flow ID for the organization unit"
        isRecoveryFlowEnabled:
          type: boolean
          description: "Whether the recovery flow is enabled for the organization unit"
        signOutFlowId:
          type: string
          format: uuid
          description: "Default Sign-out flow ID for the organization unit"
        logoUrl:
          type: string
          format: uri
          description: "Logo URL for the organization unit"
        tosUri:
          type: string
          format: uri
          description: "Terms of Service URI"
        policyUri:
          type: string
          format: uri
          description: "Privacy Policy URI"
        cookiePolicyUri:
          type: string
          format: uri
          description: "Cookie Policy URI"

    CreateOrganizationUnitRequest:
      allOf:
        - $ref: '#/components/schemas/CreateOrganizationUnitByHandleRequest'
      required: [handle, name, parent]
      properties:
        parent:
          type: string
          format: uuid
          nullable: true

    UpdateOrganizationUnitRequest:
      allOf:
        - $ref: '#/components/schemas/CreateOrganizationUnitRequest'

    OrganizationUnitListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 15
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 10
        organizationUnits:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationUnitBasic'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    UserListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 25
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 10
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    GroupListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 8
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 5
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    RoleListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 3
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 2
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Error code. Codes follow the OU-XXXX convention."
          example: "OU-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).
