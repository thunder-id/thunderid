  /agents/{id}:
    get:
      tags:
        - Agents
      summary: Get an agent by id
      description: |
        Retrieve an agent. A caller confined to an organization unit other than the one that owns the
        agent reads it when the agent is shared into the caller's organization unit. The agent is then
        returned under that organization unit, with `isOwnedByOU` set to `false` and `isReadOnly` set to
        `true`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          example: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
        - $ref: '#/components/parameters/includeQueryParam'
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGetResponse'
              example:
                id: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                ouId: "456e8400-e29b-41d4-a716-446655440001"
                ouHandle: "platform/automations"
                type: "default"
                description: "Agent exposing calendar tools"
                clientId: "calendar_agent_client"
                owner:
                  id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                  idType: uuid
                  isLocal: true
                attributes:
                  name: "Calendar Agent"
                  model: "claude-3-5-sonnet"
                  modelProvider: "anthropic"
                isReadOnly: false
                isOwnedByOU: true
                authFlowId: "edc013d0-e893-4dc0-990c-3e1d203e005b"
                registrationFlowId: "f1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e"
                isRegistrationFlowEnabled: false
                themeId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                layoutId: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
                allowedUserTypes: ["employee", "contractor"]
                assertion:
                  validityPeriod: 3600
                  userAttributes: ["email", "username"]
                loginConsent:
                  validityPeriod: 86400
                inboundAuthConfig:
                  - type: "oauth2"
                    config:
                      clientId: "calendar_agent_client"
                      redirectUris:
                        - "https://calendar-agent.example.com/callback"
                      grantTypes:
                        - "authorization_code"
                        - "refresh_token"
                      responseTypes:
                        - "code"
                      tokenEndpointAuthMethod: "client_secret_basic"
                      pkceRequired: true
                      publicClient: false
                      requirePushedAuthorizationRequests: false
                      scopes:
                        - "openid"
                        - "profile"
                        - "calendar:read"
                      certificate:
                        type: "JWKS_URI"
                        value: "https://calendar-agent.example.com/.well-known/jwks"
                      token:
                        accessToken:
                          userConfig:
                            validityPeriod: 3600
                            attributes: ["email", "username"]
                        idToken:
                          validityPeriod: 1800
                          userAttributes: ["email", "name"]
                        refreshToken:
                          validityPeriod: 86400
                      userInfo:
                        responseType: "JWS"
                        signingAlg: "RS256"
                        userAttributes: ["email", "name", "given_name", "family_name"]
                      scopeClaims:
                        profile: ["name", "family_name", "given_name"]
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AGT-1004"
                message:
                  key: "error.agentservice.agent_not_found"
                  defaultValue: "Agent not found"
                description:
                  key: "error.agentservice.agent_not_found_description"
                  defaultValue: "The agent with the specified id does not exist"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          description: Internal server error

    put:
      tags:
        - Agents
      summary: Update an agent by id
      description: |
        Full replacement update. `type` is required. All inbound auth profile
        and OAuth profile fields are applied according to the same rules as
        CreateAgentRequest. Omitting an inbound auth or OAuth field clears it.

        Send the complete `attributes` object to preserve its values. The default agent schema
        requires a unique string `attributes.name`. Missing required attributes fail schema
        validation (`AGT-1015`); duplicate unique attributes produce an attribute conflict (`AGT-1014`).

        If `ouId` is provided and differs from the current value, the agent is moved to the
        new organization unit (which must exist). When the update changes the organization unit or the
        `type`, the organization unit must be the agent type's organization unit or one of its descendants;
        otherwise the request is rejected with `AGT-1053`. As on create, the caller also needs permission
        to view the agent type (`system:agenttype:view`), and an agent type that does not exist, or that the
        caller cannot read, is rejected with `AGT-1054`.

        A personal agent keeps the owner it was registered for. Leave `owner` out, or send the current owner;
        a different owner is rejected with `AGT-1064`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          example: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
            examples:
              update-name-description:
                summary: Replace agent attributes and clear omitted profile settings
                value:
                  type: "default"
                  description: "Updated agent with v2 APIs"
                  attributes:
                    name: "Calendar Agent v2"
              update-full:
                summary: Full update (all fields)
                value:
                  ouId: "456e8400-e29b-41d4-a716-446655440001"
                  type: "default"
                  description: "Agent exposing calendar tools"
                  owner:
                    id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                    idType: uuid
                    isLocal: true
                  attributes:
                    name: "Calendar Agent"
                    model: "claude-3-5-sonnet"
                    modelProvider: "anthropic"
                  authFlowId: "edc013d0-e893-4dc0-990c-3e1d203e005b"
                  registrationFlowId: "f1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e"
                  isRegistrationFlowEnabled: false
                  themeId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  layoutId: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
                  allowedUserTypes: ["employee", "contractor"]
                  assertion:
                    validityPeriod: 3600
                    userAttributes: ["email", "username"]
                  loginConsent:
                    validityPeriod: 86400
                  inboundAuthConfig:
                    - type: "oauth2"
                      config:
                        clientId: "calendar_agent_client"
                        redirectUris:
                          - "https://calendar-agent.example.com/callback"
                          - "https://calendar-agent.example.com/callback-v2"
                        grantTypes:
                          - "authorization_code"
                          - "refresh_token"
                        responseTypes:
                          - "code"
                        tokenEndpointAuthMethod: "client_secret_basic"
                        pkceRequired: true
                        publicClient: false
                        requirePushedAuthorizationRequests: false
                        scopes:
                          - "openid"
                          - "profile"
                          - "calendar:read"
                          - "calendar:write"
                        certificate:
                          type: "JWKS_URI"
                          value: "https://calendar-agent.example.com/.well-known/jwks"
                        token:
                          accessToken:
                            userConfig:
                              validityPeriod: 3600
                              attributes: ["email", "username"]
                          idToken:
                            validityPeriod: 1800
                            userAttributes: ["email", "name"]
                          refreshToken:
                            validityPeriod: 86400
                        userInfo:
                          responseType: "JWS"
                          signingAlg: "RS256"
                          userAttributes: ["email", "name", "given_name", "family_name"]
                        scopeClaims:
                          profile: ["name", "family_name", "given_name"]
      responses:
        "200":
          description: Agent updated, with its `status`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCompleteResponse'
              example:
