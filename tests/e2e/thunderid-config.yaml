---
resource_type: application
# Embedded server-side application used exclusively by E2E test infrastructure for admin API
# authentication. It has no OAuth profile, so it initiates the admin authentication flow directly
# via the Flow Execution API and is issued a Flow Secret.
id: 019e3a5c-0501-7f3e-a66e-66fc7918c3a7
ouHandle: default
name: E2E Admin Native App
description: Native application for E2E test infrastructure admin authentication
type: fullstack
# Flow Secret presented by the E2E helpers when initiating the admin authentication flow
# directly via the Flow Execution API. Test-only credential.
flowSecret: e2e-admin-native-app-secret
authFlowHandle: default-flow
# The admin user is bootstrap-provisioned as Person (see backend/cmd/server/bootstrap), which is
# also what this file can rely on existing before any sample-app config is imported.
allowedUserTypes:
  - Person
