openapi: 3.0.3

info:
  title: SCIM API
  version: "2.0"
  description: |
    System for Cross-domain Identity Management (SCIM) v2.0 API.
    Provides standardized endpoints for identity discovery and provisioning as defined by RFC 7643 and RFC 7644.

    ### Authentication and Authorization
    - **`/ServiceProviderConfig`**: Public endpoint. No authentication required.
    - **`/ResourceTypes`**: Public endpoint. No authentication required.
    - **`/Schemas`**: Protected endpoint. Requires a valid bearer token. Tenant isolation is enforced based on the authenticated context.
    - **`/Users`**, **`/Groups`**, **`/Me`**: Protected endpoints. Require a valid bearer token.

    ### Content-Type
    All write requests (`POST`, `PUT`, `PATCH`) must send `Content-Type: application/scim+json`. Requests with a missing or different Content-Type are rejected with a `400 invalidSyntax` error.

    ### Unimplemented Endpoints
    Per the SCIM specification, endpoints that are not yet implemented by the server (such as `/Bulk` and the root `/.search`) will return a **501 Not Implemented** HTTP status code rather than a generic 404. This correctly signals to SCIM clients that the feature is unsupported.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}/scim/v2
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: SCIM Discovery
    description: Endpoints for discovering supported SCIM capabilities, schemas, and resource types.
  - name: SCIM Provisioning
    description: Endpoints for provisioning and managing Users and Groups (RFC 7644).

security:
  - bearerAuth: []

paths:
  /ServiceProviderConfig:
    get:
      tags:
        - SCIM Discovery
      summary: Get Service Provider Configuration
      description: Returns the SCIM service provider configuration, including supported protocol capabilities (e.g., PATCH, Filter, ETag). This is a public endpoint that does not require authentication.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ServiceProviderConfig'
              example:
                schemas: ["urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig"]
                patch:
                  supported: false
                bulk:
                  supported: false
                  maxOperations: 0
                  maxPayloadSize: 0
                filter:
                  supported: true
                  maxResults: 100
                changePassword:
                  supported: false
                sort:
                  supported: false
                etag:
                  supported: true
                pagination:
                  cursor: false
                  index: true
                  defaultPaginationMethod: "index"
                  defaultPageSize: 30
                  maxPageSize: 100
                authenticationSchemes:
                  - type: "oauthbearertoken"
                    name: "OAuth Bearer Token"
                    description: "Authentication using an OAuth 2.0 Bearer Token"
                meta:
                  resourceType: "ServiceProviderConfig"
                  location: "https://localhost:8090/scim/v2/ServiceProviderConfig"
                  created: "2026-01-15T09:00:00Z"
                  lastModified: "2026-01-15T09:00:00Z"
                  version: 'W/"3a9f1c2b7e4d5f60"'
        '500':
          description: Internal Server Error

  /Schemas:
    get:
      tags:
        - SCIM Discovery
      summary: List Schemas
      description: Returns all supported SCIM schemas, including core schemas and any tenant-specific custom extensions. Requires authentication to ensure tenant isolation.
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SchemaListResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
                totalResults: 2
                startIndex: 1
                itemsPerPage: 2
                Resources:
                  - schemas: ["urn:ietf:params:scim:schemas:core:2.0:Schema"]
                    id: "urn:ietf:params:scim:schemas:core:2.0:User"
                    name: "User"
                    description: "User Account"
                    attributes:
                      - name: "userName"
                        type: "string"
                        multiValued: false
                        description: "Unique identifier for the User, typically used by the user to directly authenticate to the service provider."
                        required: true
                        caseExact: false
                        mutability: "readWrite"
                        returned: "default"
                        uniqueness: "server"
                      - name: "emails"
                        type: "complex"
                        multiValued: true
                        description: "Email addresses for the user."
                        required: false
                        caseExact: false
                        mutability: "readWrite"
                        returned: "default"
                        uniqueness: "none"
                    meta:
                      resourceType: "Schema"
                      location: "https://localhost:8090/scim/v2/Schemas/urn:ietf:params:scim:schemas:core:2.0:User"
                  - schemas: ["urn:ietf:params:scim:schemas:core:2.0:Schema"]
                    id: "urn:thunderid:params:scim:schemas:employee:2.0:User"
                    name: "employee"
                    description: "ThunderID extension schema for the \"employee\" user type"
                    attributes:
                      - name: "department"
                        type: "string"
                        multiValued: false
                        required: false
                        caseExact: false
                        mutability: "readWrite"
                        returned: "default"
                        uniqueness: "none"
                    meta:
                      resourceType: "Schema"
                      location: "https://localhost:8090/scim/v2/Schemas/urn:thunderid:params:scim:schemas:employee:2.0:User"
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /Schemas/{id}:
    get:
      tags:
        - SCIM Discovery
      summary: Get Schema by URN
      description: |
        Returns a specific SCIM schema by its URN. Requires authentication to ensure tenant isolation.

        The core `urn:ietf:params:scim:schemas:core:2.0:User` and `urn:ietf:params:scim:schemas:core:2.0:Group` URNs are always available. A ThunderID extension URN (`urn:thunderid:params:scim:schemas:<userType>:2.0:User`) is available for each registered user type.
      parameters:
        - name: id
          in: path
          required: true
          description: The URN of the schema to retrieve
          schema:
            type: string
          example: "urn:thunderid:params:scim:schemas:employee:2.0:User"
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/Schema'
              example:
                schemas: ["urn:ietf:params:scim:schemas:core:2.0:Schema"]
                id: "urn:thunderid:params:scim:schemas:employee:2.0:User"
                name: "employee"
                description: "ThunderID extension schema for the \"employee\" user type"
                attributes:
                  - name: "username"
                    type: "string"
                    multiValued: false
                    required: true
                    caseExact: false
                    mutability: "readWrite"
                    returned: "default"
                    uniqueness: "server"
                  - name: "given_name"
                    type: "string"
                    multiValued: false
                    required: false
                    caseExact: false
                    mutability: "readWrite"
                    returned: "default"
                    uniqueness: "none"
                  - name: "department"
                    type: "string"
                    multiValued: false
                    required: false
                    caseExact: false
                    mutability: "readWrite"
                    returned: "default"
                    uniqueness: "none"
                meta:
                  resourceType: "Schema"
                  location: "https://localhost:8090/scim/v2/Schemas/urn:thunderid:params:scim:schemas:employee:2.0:User"
        '401':
          description: Unauthorized
        '404':
          description: Schema not found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "404"
                detail: "No schema exists for the provided URN"
        '500':
          description: Internal Server Error

  /ResourceTypes:
    get:
      tags:
        - SCIM Discovery
      summary: List Resource Types
      description: Returns all supported SCIM resource types (User and Group). This endpoint is public and does not require authentication.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ResourceTypeListResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
                totalResults: 2
                startIndex: 1
                itemsPerPage: 2
                Resources:
                  - schemas: ["urn:ietf:params:scim:schemas:core:2.0:ResourceType"]
                    id: "User"
                    name: "User"
                    description: "User Account"
                    endpoint: "/Users"
                    schema: "urn:ietf:params:scim:schemas:core:2.0:User"
                    schemaExtensions:
                      - schema: "urn:thunderid:params:scim:schemas:employee:2.0:User"
                        required: false
                    meta:
                      resourceType: "ResourceType"
                      location: "https://localhost:8090/scim/v2/ResourceTypes/User"
                  - schemas: ["urn:ietf:params:scim:schemas:core:2.0:ResourceType"]
                    id: "Group"
                    name: "Group"
                    description: "Group"
                    endpoint: "/Groups"
                    schema: "urn:ietf:params:scim:schemas:core:2.0:Group"
                    schemaExtensions: []
                    meta:
                      resourceType: "ResourceType"
                      location: "https://localhost:8090/scim/v2/ResourceTypes/Group"
        '500':
          description: Internal Server Error

  /ResourceTypes/{id}:
    get:
      tags:
        - SCIM Discovery
      summary: Get Resource Type by ID
      description: Returns a specific SCIM resource type by its ID ("User" or "Group", case-insensitive). This endpoint is public and does not require authentication.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the resource type to retrieve
          schema:
            type: string
          example: "User"
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ResourceType'
              example:
                schemas: ["urn:ietf:params:scim:schemas:core:2.0:ResourceType"]
                id: "User"
                name: "User"
                description: "User Account"
                endpoint: "/Users"
                schema: "urn:ietf:params:scim:schemas:core:2.0:User"
                schemaExtensions:
                  - schema: "urn:thunderid:params:scim:schemas:employee:2.0:User"
                    required: false
                meta:
                  resourceType: "ResourceType"
                  location: "https://localhost:8090/scim/v2/ResourceTypes/User"
        '404':
          description: Resource type not found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "404"
                detail: "No resource type exists for the provided ID"
        '500':
          description: Internal Server Error

  /Users:
    get:
      tags:
        - SCIM Provisioning
      summary: List Users
      description: |
        Returns a paginated list of users. Supports `startIndex` and `count` query parameters for pagination (RFC 7644 §3.4.2).

        Supports `filter` with one or more `eq` comparisons joined by `and` (e.g. `userName eq "alice"` or `userName eq "alice" and active eq true`); `or`, `not`, grouping, and any operator other than `eq` are rejected with `400 invalidFilter`. Sorting via `sortBy`/`sortOrder` is not supported and returns `400 invalidValue` if requested.

        Supports `attributes`/`excludedAttributes` for attribute projection (RFC 7644 §3.9); the two are mutually exclusive.
      parameters:
        - name: startIndex
          in: query
          description: 1-based index of the first result (default 1).
          schema:
            type: integer
            default: 1
        - name: count
          in: query
          description: Maximum number of results per page (default 30, max 100).
          schema:
            type: integer
            default: 30
        - name: filter
          in: query
          description: 'SCIM filter expression using only "eq" comparisons optionally joined by "and" (e.g. `userName eq "alice"`).'
          schema:
            type: string
          example: 'userName eq "alice.wu"'
        - name: attributes
          in: query
          description: Comma-separated list of attribute names to return; all other attributes are omitted. Mutually exclusive with `excludedAttributes`.
          schema:
            type: string
          example: "userName,emails"
        - name: excludedAttributes
          in: query
          description: Comma-separated list of attribute names to omit from the response. Mutually exclusive with `attributes`.
          schema:
            type: string
          example: "name,emails"
        - name: sortBy
          in: query
          required: false
          description: Not supported. Providing this parameter returns `400 invalidValue`.
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          description: Not supported. Providing this parameter returns `400 invalidValue`.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
                totalResults: 1
                startIndex: 1
                itemsPerPage: 1
                Resources:
                  - schemas: ["urn:ietf:params:scim:schemas:core:2.0:User", "urn:thunderid:params:scim:schemas:employee:2.0:User"]
                    id: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                    userName: "alice.wu"
                    name:
                      givenName: "Alice"
                      familyName: "Wu"
                    emails:
                      - value: "alice.wu@company.inc"
                        primary: true
                    urn:thunderid:params:scim:schemas:employee:2.0:User:
                      username: "alice.wu"
                      given_name: "Alice"
                      family_name: "Wu"
                      email: "alice.wu@company.inc"
                      department: "Engineering"
                    meta:
                      resourceType: "User"
                      location: "https://localhost:8090/scim/v2/Users/9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                      version: 'W/"7c1a9e2fd4b6"'
        '400':
          description: Bad Request (e.g., unsupported filter operator, sortBy/sortOrder requested, or both `attributes` and `excludedAttributes` supplied)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid-filter:
                  summary: Unsupported filter syntax
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidFilter"
                    detail: "the specified filter operator is not supported; only 'eq' is supported"
                sort-not-supported:
                  summary: Sorting requested but not supported
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidValue"
                    detail: "Sorting via sortBy or sortOrder is not supported in this implementation"
                conflicting-attributes:
                  summary: Both attributes and excludedAttributes supplied
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidValue"
                    detail: '"attributes" and "excludedAttributes" are mutually exclusive; supply at most one'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
    post:
      tags:
        - SCIM Provisioning
      summary: Create User
      description: |
        Creates a new user. The request body must include the SCIM Core User schema URN (`urn:ietf:params:scim:schemas:core:2.0:User`) whenever core attributes (`userName`, `name`, `emails`, etc.) are present, and exactly one ThunderID extension URN (`urn:thunderid:params:scim:schemas:<userType>:2.0:User`) identifying the target user type (RFC 7644 §3.3).

        If exactly one user type is configured on the server, the extension URN and its object may be omitted and only core attributes supplied; the sole configured user type is used by default.

        Attributes are read from two places: SCIM core fields at the top level (`userName`, `name.givenName`, `name.familyName`, `emails[].value`, `phoneNumbers[].value`, etc., mapped to their ThunderID attribute equivalents) and the object keyed by the extension URN (mapped 1:1 to ThunderID attribute names). Supplying the same core-mapped attribute with different values in both places is rejected with `400 invalidValue`.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/UserRequest'
            example:
              schemas:
                - "urn:ietf:params:scim:schemas:core:2.0:User"
                - "urn:thunderid:params:scim:schemas:employee:2.0:User"
              userName: "alice.wu"
              name:
                givenName: "Alice"
                familyName: "Wu"
              emails:
                - value: "alice.wu@company.inc"
                  primary: true
              urn:thunderid:params:scim:schemas:employee:2.0:User:
                department: "Engineering"
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created user resource.
              schema:
                type: string
            ETag:
              description: Entity tag for the created resource version.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                schemas: ["urn:ietf:params:scim:schemas:core:2.0:User", "urn:thunderid:params:scim:schemas:employee:2.0:User"]
                id: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                userName: "alice.wu"
                name:
                  givenName: "Alice"
                  familyName: "Wu"
                emails:
                  - value: "alice.wu@company.inc"
                    primary: true
                urn:thunderid:params:scim:schemas:employee:2.0:User:
                  username: "alice.wu"
                  given_name: "Alice"
                  family_name: "Wu"
                  email: "alice.wu@company.inc"
                  department: "Engineering"
                meta:
                  resourceType: "User"
                  location: "https://localhost:8090/scim/v2/Users/9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                  version: 'W/"7c1a9e2fd4b6"'
        '400':
          description: Bad Request (e.g., missing/invalid Content-Type, missing required schema URN, duplicate schemas, invalid payload, unknown user type, schema validation failed)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid-content-type:
                  summary: Missing or invalid Content-Type header
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidSyntax"
                    detail: "Request Content-Type must be application/scim+json"
                missing-schemas:
                  summary: Missing schemas array
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidValue"
                    detail: "The request must include a schemas array"
                missing-custom-schema:
                  summary: Missing ThunderID custom schema URN
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidValue"
                    detail: "The request must include exactly one ThunderID custom user schema URN"
                unknown-user-type:
                  summary: Unknown user type
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidValue"
                    detail: "The user type derived from the custom schema URN does not exist"
                schema-validation-failed:
                  summary: Schema validation failed
                  value:
                    schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                    status: "400"
                    scimType: "invalidValue"
                    detail: 'User type "employee" requires the following attribute(s), which were not provided: username'
        '401':
          description: Unauthorized
        '409':
          description: Conflict (e.g., username already exists)
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "409"
                scimType: "uniqueness"
                detail: "A user with the same unique attribute value already exists"
        '500':
          description: Internal Server Error

  /Users/{id}:
    get:
      tags:
        - SCIM Provisioning
      summary: Get User
      description: Returns a single user by ID (RFC 7644 §3.4.1). Supports `attributes`/`excludedAttributes` for attribute projection (RFC 7644 §3.9); the two are mutually exclusive.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user.
          schema:
            type: string
          example: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
        - name: attributes
          in: query
          description: Comma-separated list of attribute names to return; all other attributes are omitted. Mutually exclusive with `excludedAttributes`.
          schema:
            type: string
        - name: excludedAttributes
          in: query
          description: Comma-separated list of attribute names to omit from the response. Mutually exclusive with `attributes`.
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Entity tag for the current resource version.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                schemas: ["urn:ietf:params:scim:schemas:core:2.0:User", "urn:thunderid:params:scim:schemas:employee:2.0:User"]
                id: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                userName: "alice.wu"
                name:
                  givenName: "Alice"
                  familyName: "Wu"
                emails:
                  - value: "alice.wu@company.inc"
                    primary: true
                urn:thunderid:params:scim:schemas:employee:2.0:User:
                  username: "alice.wu"
                  given_name: "Alice"
                  family_name: "Wu"
                  email: "alice.wu@company.inc"
                  department: "Engineering"
                meta:
                  resourceType: "User"
                  location: "https://localhost:8090/scim/v2/Users/9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                  version: 'W/"7c1a9e2fd4b6"'
        '401':
          description: Unauthorized
        '404':
          description: User not found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
                status: "404"
                detail: "The user with the specified ID does not exist"
        '500':
          description: Internal Server Error
    put:
      tags:
        - SCIM Provisioning
      summary: Replace User
      description: |
        Fully replaces a user resource (RFC 7644 §3.5.1). Supports optimistic concurrency via `If-Match`. The user type (extension URN) cannot be changed via PUT; it must match the existing resource's type, or the request is rejected with `400 mutability`.

        Supports `attributes`/`excludedAttributes` for attribute projection (RFC 7644 §3.9); the two are mutually exclusive.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user.
          schema:
            type: string
          example: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
        - name: If-Match
          in: header
          required: false
          description: ETag value from a previous GET or create response. If provided, the update is rejected with 412 if the resource has changed.
          schema:
            type: string
        - name: attributes
          in: query
          description: Comma-separated list of attribute names to return; all other attributes are omitted. Mutually exclusive with `excludedAttributes`.
          schema:
            type: string
        - name: excludedAttributes
          in: query
          description: Comma-separated list of attribute names to omit from the response. Mutually exclusive with `attributes`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/UserRequest'
            example:
              schemas:
                - "urn:ietf:params:scim:schemas:core:2.0:User"
                - "urn:thunderid:params:scim:schemas:employee:2.0:User"
              userName: "alice.wu"
              name:
                givenName: "Alice"
                familyName: "Wu"
              emails:
                - value: "alice.wu@newcompany.inc"
                  primary: true
              urn:thunderid:params:scim:schemas:employee:2.0:User:
                department: "Platform"
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Entity tag for the updated resource version.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                schemas: ["urn:ietf:params:scim:schemas:core:2.0:User", "urn:thunderid:params:scim:schemas:employee:2.0:User"]
                id: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                userName: "alice.wu"
                name:
                  givenName: "Alice"
                  familyName: "Wu"
                emails:
                  - value: "alice.wu@newcompany.inc"
                    primary: true
                urn:thunderid:params:scim:schemas:employee:2.0:User:
                  username: "alice.wu"
                  given_name: "Alice"
                  family_name: "Wu"
                  email: "alice.wu@newcompany.inc"
                  department: "Platform"
                meta:
