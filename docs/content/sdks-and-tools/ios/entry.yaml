guides:
  - id: accessing-protected-apis
    title: Accessing Protected APIs
    icon: key
    description: Make authenticated API requests from an iOS application using bearer tokens from the ThunderID SDK.
    intro: When your app needs to call a backend API that requires authentication, use `ThunderIDClient.getAccessToken()`
      to retrieve a valid access token and attach it as a Bearer token to your requests. The SDK automatically refreshes
      the token if it has expired.
    sections:
    - type: steps
      id: steps
      title: Accessing Protected APIs
      steps:
      - title: Using URLSession
        description: 'The following example calls a protected API endpoint using the standard `URLSession`:'
        code:
          file: APIClient.swift
          lang: swift
          content: |2-

            func fetchProtectedResource(state: ThunderIDState) async throws -> Data {
                let token = try await state.client.getAccessToken()

                var request = URLRequest(url: URL(string: "https://localhost:8090/api/resource")!)
                request.setValue("Bearer \(token)", forHTTPHeaderField: "Authorization")
                request.setValue("application/json", forHTTPHeaderField: "Accept")

                let (data, response) = try await URLSession.shared.data(for: request)

                guard let httpResponse = response as? HTTPURLResponse,
                      (200..<300).contains(httpResponse.statusCode) else {
                    throw URLError(.badServerResponse)
                }

                return data
            }
      - title: Token Refresh
        description: '`getAccessToken()` refreshes the access token automatically when it is expired, as long as a valid
          refresh token is available. You do not need to handle refresh manually. If the refresh token is also expired,
          `getAccessToken()` throws `IAMError` with code `.sessionExpired`. Handle this by signing the user out:'
        code:
          lang: swift
          content: |-
            do {
                let token = try await state.client.getAccessToken()
                // use token
            } catch let error as IAMError where error.code == .sessionExpired {
                _ = try? await state.client.signOut()
                await state.refresh()
            } catch {
                print("Unexpected error: \(error)")
            }
      - title: Using Alamofire
        description: 'If your project uses [Alamofire](https://github.com/Alamofire/Alamofire), create a request interceptor
          that injects the access token:'
        code:
          file: ThunderIDRequestInterceptor.swift
          lang: swift
          content: |2-

            final class ThunderIDRequestInterceptor: RequestInterceptor {
                let state: ThunderIDState

                init(state: ThunderIDState) {
                    self.state = state
                }

                func adapt(
                    _ urlRequest: URLRequest,
                    for session: Session,
                    completion: @escaping (Result<URLRequest, Error>) -> Void
                ) {
                    Task {
                        do {
                            let token = try await state.client.getAccessToken()
                            var request = urlRequest
                            request.setValue("Bearer \(token)", forHTTPHeaderField: "Authorization")
                            completion(.success(request))
                        } catch {
                            completion(.failure(error))
                        }
                    }
                }
            }
  - id: try-the-sample-app
    title: Try the iOS Sample App
    icon: terminal
    description: Run the {{ProductName}} iOS sample app to see the full authentication lifecycle end to end.
    intro: 'The SDK repository ships a sample app in [`Samples/Quickstart`](https://github.com/thunder-id/ios-sdks/tree/main/Samples/Quickstart)
      that exercises the full authentication lifecycle end to end: sign-in, sign-up, and sign-out via the SDK''s app-native
      Flow Execution. } />'
    sections:
    - type: steps
      id: steps
      title: Try the iOS Sample App
      steps:
      - title: Prerequisites
        description: '- Xcode 15+ - A running {{ProductName}} instance'
      - title: Prepare the iOS Sample
        code:
          lang: bash
          content: |-
            cd Samples/Quickstart
            cp Config.plist.example Sources/Config.plist
            # Edit Sources/Config.plist with your {{ProductName}} base URL and application ID
      - title: Attestation via Apple App Attest (optional)
        description: 'If the application enforces platform attestation, set `THUNDERID_ATTESTATION_ENABLED` to `true`
          in `Sources/Config.plist`, then rebuild. When enabled, the sample mints a token via `AppAttestTokenProvider`
          (Apple App Attest) and sends it with every native flow-initiate request. Testing this end-to-end requires:
          - A **physical device**, App Attest is unavailable in the simulator. - A signing team and the **App Attest
          capability** enabled on the target, so Xcode adds the `com.apple.developer.devicecheck.appattest-environment`
          entitlement. - The **Team ID** and **Bundle ID** registered on the {{ProductName}} application''s attestation
          settings to match the ones the app is signed with. {{ProductName}} derives the expected App ID from `.` and
          rejects a token whose attested App ID differs. The `Attestation-Token` header carries the base64-encoded App
          Attest attestation object exactly as `DCAppAttestService.attestKey` returns it, do not wrap it in a JSON envelope.
          The challenge should come from the server in production; this sample generates it locally to exercise the
          SDK hook.'
      - title: Passkeys (WebAuthn)
        description: 'Passkey registration/authentication via `ASAuthorizationPlatformPublicKeyCredentialProvider` requires
          the app''s relying party ID to be backed by a real **Associated Domain**, not `localhost`. Without this, `ASAuthorizationController`
          fails immediately with `Error Domain=com.apple.AuthenticationServices.AuthorizationError Code=1004`. This
          sample ships `Sources/Quickstart.entitlements` with a placeholder `webcredentials:your-thunderid-domain.example`
          entry. To exercise passkeys end-to-end: 1. Replace the placeholder domain in `Sources/Quickstart.entitlements`
          with the domain your {{ProductName}} server is actually reachable at (it must serve valid HTTPS, self-signed
          certs and `localhost` will not work). 2. Host an `apple-app-site-association` file at `https:///.well-known/apple-app-site-association`
          declaring this app''s Team ID and `PRODUCT_BUNDLE_IDENTIFIER` (`dev.thunderid.Quickstart`) under `webcredentials.apps`.
          3. Make sure the server''s passkey `rp.id` matches that same domain, the SDK (`PasskeyAuthSession`) passes
          whatever `rp.id` the server returns straight through to `ASAuthorizationPlatformPublicKeyCredentialProvider`.
          4. Set a `DEVELOPMENT_TEAM` and enable the **Associated Domains** capability for the target in Xcode (Signing
          & Capabilities) so the entitlement is actually applied to the build. Exposing a local {{ProductName}} instance
          under a real, HTTPS-reachable domain (e.g. via a tunnel) is left to you, this sample only wires up the entitlement/documentation,
          not the tunnel itself.'
      - title: Run
        description: Open in Xcode via `Package.swift` and run on an iOS 16+ simulator or device.
      - title: Next Steps
        description: '- [Accessing Protected APIs](../accessing-protected-apis): Make authenticated API requests from
          an iOS application using bearer tokens from the {{ProductName}} SDK'

