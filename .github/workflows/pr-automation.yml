name: "🤖 PR Automation"

# Uses pull_request_target (not pull_request) so PRs opened from forks get the
# GOOGLE_CHAT_WEBHOOK secret and a token that can comment on the PR.
# Only PR metadata is read; PR code is never checked out or run.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

jobs:
  check-size:
    name: "📏 Check PR Size"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    concurrency:
      group: pr-size-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
    outputs:
      approved_by: ${{ steps.size.outputs.approved_by }}
    steps:
      - name: Skip size check for merge queue
        if: github.event_name == 'merge_group'
        run: echo "Skipping size check for merge queue."

      - name: Fail if PR is too large
        if: github.event_name == 'pull_request_target'
        id: size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_MAINTAINERS: ${{ vars.PROJECT_MAINTAINERS }}
          PR_SIZE_LIMIT: ${{ vars.PR_SIZE_LIMIT }}
        with:
          script: |
            const MAX_LINES = parseInt(process.env.PR_SIZE_LIMIT, 10) || 3000;
            const APPROVAL_LABEL = 'large-pr-approved';

            // Files that are not counted towards the PR size: tests, docs, config,
            // generated files and API specs.
            const EXCLUDED = [
              /_test\.go$/,
              /^tests\//,
              /^backend\/tests\//,
              /\.(test|spec)\.[cm]?[jt]sx?$/,
              /\/__tests__\//,
              /\/__mocks__\//,
              /\/testdata\//,
              /^docs\//,
              /(^|\/)package\.json$/,
              /(^|\/)pnpm-lock\.yaml$/,
              /(^|\/)pnpm-workspace\.yaml$/,
              /(^|\/)go\.(mod|sum)$/,
              /(^|\/)tsconfig[^/]*\.json$/,
              /(^|\/)[^/]+\.config\.[cm]?[jt]s$/,
              /\/locales\/(?!en-US)/,
              /^api\/.*\.ya?ml$/,
            ];

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Hidden marker to find an earlier size check comment.
            const MARKER = '<!-- pr-size-check -->';
            const findComment = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              return comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(MARKER));
            };
            // Removes the earlier size check comment once the check passes.
            const removeComment = async () => {
              const comment = await findComment();
              if (comment) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            };

            if (pr.user.login === 'thunder-automation-bot') {
              core.info('PR is opened by the automation bot. Skipping.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const lines = files
              .filter(f => f.status !== 'removed' && !EXCLUDED.some(p => p.test(f.filename)))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            core.info(`Reviewable lines: ${lines} (limit ${MAX_LINES}).`);
            if (lines <= MAX_LINES) {
              await removeComment();
              return;
            }

            if (pr.labels.some(l => l.name === APPROVAL_LABEL)) {
              const maintainers = (process.env.PROJECT_MAINTAINERS || '')
                .split(',')
                .map(m => m.trim().toLowerCase())
                .filter(Boolean);
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const labeled = events
                .filter(e => e.event === 'labeled' && e.label?.name === APPROVAL_LABEL)
                .pop();
              const labeledBy = labeled?.actor?.login;
              if (labeledBy && maintainers.includes(labeledBy.toLowerCase())) {
                core.info(`${APPROVAL_LABEL} added by maintainer ${labeledBy}. Skipping.`);
                // Announce the approval only on the label event, so later pushes don't repeat it.
                const justLabeled = context.payload.action === 'labeled'
                  && context.payload.label?.name === APPROVAL_LABEL;
                if (justLabeled && await findComment()) {
                  const body = `Large PR is approved by @${labeledBy}.`;
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                  core.setOutput('approved_by', labeledBy);
                }
                return;
              }
              core.info(`Ignoring ${APPROVAL_LABEL} added by ${labeledBy}, who is not a maintainer.`);
            }

            const body = [
              MARKER,
              `Hi @${pr.user.login}, thanks for the contribution!`,
              '',
              `This PR changes ${lines} lines, above our limit of ${MAX_LINES}. Tests, docs, generated files and API specs aren't counted.`,
              'Large PRs are hard to review, so the PR size check fails and the PR can\'t be merged.',
              '',
              'Please split it into smaller PRs. Each PR should be independently mergeable: it builds, passes tests and doesn\'t break existing features.',
              'If it can\'t be split, comment with the reason and a maintainer will take a look.',
            ].join('\n');
            const comment = await findComment();
            if (comment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
            core.setFailed(`PR changes ${lines} lines, above the limit of ${MAX_LINES}.`);

  notify-google-chat:
    needs: check-size
    permissions: {}
    if: |
      !cancelled()
      && (needs.check-size.outputs.approved_by != ''
        || ((github.event.action == 'opened' || github.event.action == 'reopened')
          && !contains(format(',{0},', vars.PROJECT_MEMBERS), format(',{0},', github.actor))))
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to Google Chat
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_CREATOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_ACTION: ${{ github.event.action }}
          PR_APPROVED_BY: ${{ needs.check-size.outputs.approved_by }}
        run: |
          if [ -z "$GOOGLE_CHAT_WEBHOOK" ]; then
            echo "GOOGLE_CHAT_WEBHOOK secret is not set. Skipping notification."
            exit 1
          fi

          # Set header title based on the large PR approval and the action (opened or reopened).
          if [ -n "$PR_APPROVED_BY" ]; then
            header_title="Github PR - Large PR approved"
          elif [ "$PR_ACTION" = "reopened" ]; then
            header_title="Github PR - Reopened"
          else
            header_title="Github PR - Opened"
          fi

          jq -n \
            --arg title "$PR_TITLE" \
            --arg creator "$PR_CREATOR" \
            --arg url "$PR_URL" \
            --arg base "$PR_BASE" \
            --arg header "$header_title" \
            --arg approver "$PR_APPROVED_BY" \
            '{
              "cards": [{
                "header": {
                  "title": $header,
                  "imageUrl": "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f500.png",
                  "imageStyle": "AVATAR"
                },
                "sections": [{
                  "widgets": [
                    {
                      "keyValue": {
                        "topLabel": "Title",
                        "content": $title
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Target Branch",
                        "content": $base
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Created By",
                        "content": $creator
                      }
                    }
                  ] + (if $approver != "" then [
                    {
                      "keyValue": {
                        "topLabel": "Approved By",
                        "content": $approver
                      }
                    }
                  ] else [] end) + [
                    {
                      "buttons": [{
                        "textButton": {
                          "text": "VIEW PR",
                          "onClick": {
                            "openLink": {
                              "url": $url
                            }
                          }
                        }
                      }]
                    }
                  ]
                }]
              }]
            }' > payload.json

          curl -X POST -H "Content-Type: application/json" \
            -d @payload.json \
            "$GOOGLE_CHAT_WEBHOOK"
