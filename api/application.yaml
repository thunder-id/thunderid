    SharingPolicyRequest:
      type: object
      additionalProperties: false
      required: [targets]
      description: |
        One organization unit's decision about this application. A policy is a flat list of targets,
        and each target carries its own scope and its own exclusions. Nothing sits outside a target.
      properties:
        initiatingOuId:
          type: string
          description: |
            The organization unit whose decision this is. Omitted means the application's owner. A
            unit other than the owner may only issue a policy where the application already reached
            it and stopped there.
          example: "acme-root"
        targets:
          type: array
          minItems: 1
          description: |
            The organization unit selections. Two targets of one policy may not reach the same
            organization unit: to give one unit terms of its own, exclude it from the broader
            target and name it in a target beside it.
          items:
            $ref: '#/components/schemas/SharingTargetRequest'
        version:
          type: integer
          description: |
            The policy version the caller believes it is editing. Required on an edit, ignored on a
            create.
          example: 1

    SharingPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [targets, version]
      description: |
        A replacement for a policy's contents. It differs from a create in what its targets may say:
        a policy that already reaches every organization unit, or every root, keeps that reach here.

        An edit may not reach wider than the policy already does. The scope a blanket target names
        is fixed once the policy exists, so a deployment-wide target can be kept and its exclusions
        rewritten, but one cannot be introduced by editing a narrower policy into it.
      properties:
        initiatingOuId:
          type: string
          description: The organization unit whose decision this is. Omitted means the owner.
          example: "acme-root"
        targets:
          type: array
          minItems: 1
          description: |
            The organization unit selections, replacing the policy's current ones. Two targets of
            one policy may not reach the same organization unit.
          items:
            $ref: '#/components/schemas/SharingTarget'
        version:
          type: integer
          description: |
            The policy version the caller believes it is editing. An edit against any other version
            is refused, so a caller that has not seen the current one cannot overwrite it.
          example: 1

    SharingTargetRequest:
      description: |
        One organization unit selection a request may name. Exactly one of the patterns below.

        The `allOus` and `allRoots` scopes are not listed. A reach not bounded by the issuer's own
        position in the tree is a deployment decision, so it is written where such decisions are
        reviewed: a resource file, or a document imported from one. This endpoint is neither. A
        policy written that way still reads back through these endpoints, which is why the
        response carries two scopes a request cannot.
      oneOf:
        - $ref: '#/components/schemas/TargetAllChildren'
        - $ref: '#/components/schemas/TargetChild'
        - $ref: '#/components/schemas/TargetChildSubtree'
        - $ref: '#/components/schemas/TargetRoot'

    SharingTarget:
      description: |
        One organization unit selection as a policy carries it. Every shape a create may send, plus
        the two that only a resource file or an imported document may introduce.

        An edit sends this shape rather than the create's, because a policy that already holds a
        deployment-wide target has to be able to restate it to rewrite its exclusions.
      oneOf:
        - $ref: '#/components/schemas/TargetAllChildren'
        - $ref: '#/components/schemas/TargetChild'
        - $ref: '#/components/schemas/TargetChildSubtree'
        - $ref: '#/components/schemas/TargetRoot'
        - $ref: '#/components/schemas/TargetAllOus'
        - $ref: '#/components/schemas/TargetAllRoots'

    TargetAllOus:
      type: object
      additionalProperties: false
      required: [scope]
      description: |
        Every organization unit in the deployment, including units created later. Only a resource
        file or an imported document may declare it, so it is never sent to these endpoints.
      properties:
        scope:
          type: string
          enum: [allOus]
        excludedOuIds:
          $ref: '#/components/schemas/ExcludedOuIds'

    TargetAllRoots:
      type: object
      additionalProperties: false
      required: [scope]
      description: |
        The root organization unit of every tree. Only a resource file or an imported document may
        declare it, so it is never sent to these endpoints.
      properties:
        scope:
          type: string
          enum: [allRoots]
        excludedOuIds:
          $ref: '#/components/schemas/ExcludedOuIds'

    TargetAllChildren:
      type: object
      additionalProperties: false
      required: [scope]
      description: Everything beneath the issuing organization unit, at any depth, including units created later.
      properties:
        scope:
          type: string
          enum: [allChildren]
        excludedOuIds:
          $ref: '#/components/schemas/ExcludedOuIds'

    TargetChild:
      type: object
      additionalProperties: false
      required: [scope, ouId]
      description: One organization unit directly beneath the issuer, and nothing below it.
      properties:
        scope:
          type: string
          enum: [child]
        ouId:
          type: string
          description: A direct child of the issuing organization unit.
          example: "acme-customer-a"
        excludedOuIds:
          $ref: '#/components/schemas/ExcludedOuIds'

    TargetChildSubtree:
      type: object
      additionalProperties: false
      required: [scope, ouId]
      description: One organization unit directly beneath the issuer, and everything below it at any depth.
      properties:
        scope:
          type: string
          enum: [childSubtree]
        ouId:
          type: string
          description: A direct child of the issuing organization unit.
          example: "acme-customer-a"
        excludedOuIds:
          $ref: '#/components/schemas/ExcludedOuIds'

    TargetRoot:
      type: object
      additionalProperties: false
      required: [scope, ouId]
      description: |
        One tree root, and nothing below it. Owner only. Reaching a root outside the owner's own
        tree additionally requires `resource_sharing.allow_child_ou_cross_tree_sharing` when the
        owner sits below a root.
      properties:
        scope:
          type: string
          enum: [root]
        ouId:
          type: string
          description: A root organization unit.
          example: "partner-root"
        excludedOuIds:
          $ref: '#/components/schemas/ExcludedOuIds'

    ExcludedOuIds:
      type: array
      description: |
        Organization units carved out of this target alone, each taking its subtree with it. A
        target reaching into the issuer's own tree may only exclude organization units directly
        beneath the issuer, and may not exclude the unit it names, which would leave it reaching
        nothing.
      items:
        type: string
      example: ["acme-trial-customers"]

    SharingPolicy:
      type: object
      description: A recorded sharing policy.
      properties:
        id:
          type: string
          description: The policy's own identifier.
          example: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
        initiatingOuId:
          type: string
          description: |
            The organization unit whose decision this policy is. The owning organization unit is
            not repeated here: it belongs to the application, which this path already names.
          example: "acme-root"
        stage:
          type: string
          enum: [share, reshare]
          description: "`share` when the owner issued it, `reshare` when a sharee did."
        parentPolicyId:
          type: string
          description: The policy that made this one's issuer able to see the application. Empty for an owner-issued policy.
        isReadOnly:
          type: boolean
          readOnly: true
          description: Indicates if the policy is defined in declarative configuration and cannot be modified.
        version:
          type: integer
          description: Bumped on every edit, and carried back on the next one.
          example: 1
        targets:
          type: array
          items:
            $ref: '#/components/schemas/SharingTarget'

    SharingPolicyListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: How many policies the application has, not how many this page holds.
          example: 2
        startIndex:
          type: integer
          description: The one-based position of the first policy in this page.
          example: 1
        count:
          type: integer
          description: How many policies this page holds.
          example: 2
        policies:
          type: array
          items:
            $ref: '#/components/schemas/SharingPolicy'

    ResolvedOverlay:
      type: object
      description: What one organization unit may do with the application.
      properties:
        ouId:
          type: string
          example: "acme-customer-a"
        owned:
          type: boolean
          description: Whether the organization unit owns the application rather than being shared it.
        visible:
          type: boolean
          description: |
            Whether the organization unit can see the application at all. This is what decides
            whether it may be named as the accessing organization unit on a token request.
        policyIds:
          type: array
          description: Every policy that contributed, so an answer is traceable to its inputs.
          items:
            type: string
        rules:
          type: object
          description: |
            The effective rule per field. Always empty for an application, which declares no
            overlay fields.
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'

    OverlayRule:
      type: object
      description: What a reached organization unit may do with one field.
      properties:
        editable:
          type: boolean
        value:
          type: array
          items:
            type: string
        allowedValues:
          type: array
          items:
            type: string
        excludedValues:
          type: array
          items:
            type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Error code. Codes follow the APP-XXXX convention."
          example: "APP-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).
