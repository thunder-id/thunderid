    OIDCConnectionUpdateRequest:
      type: object
      required: [name, clientId, redirectUri, authorizationEndpoint, tokenEndpoint]
      properties:
        name: { type: string }
        description: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string }
        jwksEndpoint: { type: string }
        issuer: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        tokenExchangeEnabled: { type: boolean }
        idJagEnabled: { type: boolean, description: "Enable ID-JAG issuance for this identity provider (draft-ietf-oauth-identity-assertion-authz-grant), so that self-issued ID tokens naming it as issuer can be trusted for the jwt-bearer grant. Requires issuer and jwksEndpoint to be set." }
        trustedTokenAudience: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }
    OIDCConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/OIDCConnectionUpdateRequest'
        - type: object
          required: [clientSecret]
    OIDCConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "oidc" }
        clientId: { type: string }
        clientSecret: { type: string, example: "******" }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string }
        jwksEndpoint: { type: string }
        issuer: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        tokenExchangeEnabled: { type: boolean }
        idJagEnabled: { type: boolean, description: "Enable ID-JAG issuance for this identity provider (draft-ietf-oauth-identity-assertion-authz-grant), so that self-issued ID tokens naming it as issuer can be trusted for the jwt-bearer grant. Requires issuer and jwksEndpoint to be set." }
        trustedTokenAudience: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }

    OAuthConnectionUpdateRequest:
      type: object
      description: |
        Generic OAuth 2.0 connection (no OpenID Connect discovery, no id_token). User attributes
        come from the provider's own profile API, given as userInfoEndpoint. That endpoint is
        provider-specific rather than an OpenID Connect UserInfo endpoint, and is optional: when it
        is omitted, the subject is read from the access token if the provider issues a JWT.
      required: [name, clientId, redirectUri, authorizationEndpoint, tokenEndpoint]
      properties:
        name: { type: string }
        description: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string, description: "The provider's user profile API, called with the access token. Provider-specific, for example https://api.github.com/user. Omit it when the provider exposes no profile API and issues a JWT access token." }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }
    OAuthConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/OAuthConnectionUpdateRequest'
        - type: object
          required: [clientSecret]
    OAuthConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "oauth" }
        clientId: { type: string }
        clientSecret: { type: string, example: "******" }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }

    AuthZENPDPConnectionUpdateRequest:
      type: object
      required: [name, endpoint]
      properties:
        name: { type: string, example: "Travel Booking PDP" }
        description: { type: string }
        endpoint:
          type: string
          format: uri
          pattern: '^https?://'
          description: HTTP endpoint for a single AuthZEN access evaluation.
          example: "https://pdp.example.com/access/v1/evaluation"
        batchEndpoint:
          type: string
          format: uri
          pattern: '^https?://'
          description: Optional HTTP endpoint for batched AuthZEN access evaluations. When omitted, ThunderID sends each evaluation to endpoint.
          example: "https://pdp.example.com/access/v1/evaluations"
        timeoutMs:
          type: integer
          minimum: 1
          default: 1000
          description: Timeout for each PDP request in milliseconds.
        retryCount:
          type: integer
          minimum: 0
          default: 1
          description: Number of retries for transient PDP or network failures.
        subjectAttributeMappings:
          type: array
          items: { $ref: '#/components/schemas/AuthZENPDPSubjectAttributeMapping' }
    AuthZENPDPConnectionCreateRequest:
      $ref: '#/components/schemas/AuthZENPDPConnectionUpdateRequest'
    AuthZENPDPConnectionResponse:
      allOf:
        - $ref: '#/components/schemas/AuthZENPDPConnectionUpdateRequest'
        - type: object
          required: [id, type]
          properties:
            id: { type: string, format: uuid }
            type: { type: string, enum: [authzen-pdp] }

    AuthZENPDPSubjectAttributeMapping:
      type: object
      required: [entityType, attributes]
      properties:
        entityType:
          type: string
          description: ThunderID entity type to which this mapping applies.
        attributes:
          type: array
          items:
            type: object
            required: [attribute]
            properties:
              attribute:
                type: string
                description: ThunderID user attribute name.
              pdpAttribute:
                type: string
                description: AuthZEN PDP subject property name. Defaults to attribute when omitted.

    TwilioConnectionUpdateRequest:
      type: object
      required: [name, accountSid, senderId]
      properties:
        name: { type: string, example: "My Twilio" }
        description: { type: string }
        accountSid: { type: string, description: "Twilio Account SID (AC followed by 32 hex characters).", example: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
        authToken: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        senderId: { type: string, description: "Sender phone number or alphanumeric sender ID.", example: "+15005550006" }
    TwilioConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/TwilioConnectionUpdateRequest'
        - type: object
          required: [authToken]
    TwilioConnectionResponse:
      type: object
      properties:
