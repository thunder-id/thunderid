handle: "ciba-notification"
displayName: "CIBA Authentication Notification"
channel: "email"
content:
  subject: "{{ t(notification:template.authentication_request_subject_prefix) }} {{ctx(appName)}}"
  body: |
    <!DOCTYPE html>
    <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #181818;">
      <h2>{{ t(notification:template.authentication_request_title) }}</h2>
      <p><strong>{{ctx(appName)}}</strong> {{ t(notification:template.authentication_request_suffix) }}</p>
      <p style="padding: 12px; background-color: #f5f5f5; border-left: 4px solid #3a87ed;
        border-radius: 4px; margin: 16px 0;">{{ctx(bindingMessage)}}</p>
      <p>{{ t(notification:template.authentication_approval_instructions) }}</p>
      <p><a href="{{ctx(inviteLink)}}" style="display: inline-block; padding: 10px 20px;
        background-color: #3a87ed; color: #fff; text-decoration: none;
        border-radius: 4px;">{{ t(notification:template.approve_authentication) }}</a></p>
      <p>{{ t(notification:template.fallback_link_instructions) }}</p>
      <p><a href="{{ctx(inviteLink)}}">{{ctx(inviteLink)}}</a></p>
      <p>{{ t(notification:template.uninitiated_request_disclaimer) }}</p>
    </body>
    </html>
