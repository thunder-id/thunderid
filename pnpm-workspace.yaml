packages:
  - frontend
  - frontend/apps/*
  - frontend/packages/*
  - docs
  - samples/apps/**
  - tools/*
  - tests/e2e

strictPeerDependencies: false
autoInstallPeers: true
enablePrePostScripts: true
verifyDepsBeforeRun: false

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  core-js-pure: false
  # JUSTIFICATION: The `esbuild` package is not directly and might be coming from a transitive dependency. Not required to be built as part of the workspace.
  esbuild: false
  # JUSTIFICATION: The `sharp` package is a native module that requires platform-specific binaries. It is not suitable for inclusion in the workspace as it may cause issues during installation and usage across different environments.
  sharp: true
  unrs-resolver: false
  vue-demi: false

catalog:
  '@axe-core/playwright': 4.3.0
  '@docsearch/docusaurus-adapter': ^4.6.3
  '@codecov/vite-plugin': 2.0.1
  '@hookform/resolvers': 5.2.2
  '@monaco-editor/react': 4.7.0
  '@rolldown/plugin-babel': '0.2.3'
  '@tanstack/react-query': 5.90.5
  '@tanstack/react-query-devtools': 5.90.2
  '@testing-library/jest-dom': 6.9.1
  '@testing-library/react': 16.3.0
  '@testing-library/user-event': 14.6.1
  '@thunderid/react': 1.0.3
  '@thunderid/react-router': 1.0.3
  '@types/lodash-es': 4.17.12
  '@types/node': 24.7.2
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  '@playwright/test': 1.60.0
  '@vitejs/plugin-basic-ssl': 2.3.0
  '@vitejs/plugin-react': 6.0.2
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-istanbul': 4.1.10
  '@wso2/oxygen-ui': 0.13.1
  '@wso2/oxygen-ui-icons-react': 0.13.1
  babel-plugin-react-compiler: 19.1.0-rc.3
  clsx: 2.1.1
  dayjs: 1.11.18
  dompurify: 3.4.12
  eslint: 9.39.5
  framer-motion: 12.39.0
  globals: 16.4.0
  i18next: 25.6.0
  jsdom: 27.0.1
  lodash-es: 4.18.1
  lucide-react: 0.545.0
  next: 16.2.12
  playwright: 1.60.0
  prettier: 3.6.2
  react: 19.2.3
  react-dom: 19.2.3
  react-hook-form: 7.65.0
  react-i18next: 16.0.1
  react-router: 8.3.0
  rimraf: 6.1.3
  rolldown: 1.0.0-beta.45
  rollup-plugin-visualizer: 6.0.5
  tslib: 2.8.1
  turbo: 2.10.2
  typescript: 5.9.3
  typescript-eslint: 8.57.2
  vite: 8.0.16
  vite-plugin-svgr: 5.2.0
  vitest: 4.1.10
  zod: 4.3.6

overrides:
  # JUSTIFICATION: Fixes GHSA-w7jw-789q-3m8p and GHSA-395f-4hp3-45gv (quadratic-complexity DoS in
  # shell-quote parse()). Transitive via docusaurus dev server (launch-editor), so overridden globally.
  shell-quote: '>=1.8.5'
  # JUSTIFICATION: The `ws` package is a transitive dependency of `docusaurus/core -> webpack-bundle-analyzer` and it requires a major version bump.
  ws: '>=8.21.0'
  # JUSTIFICATION: Fixes GHSA-xv26-6w52-cph6 — websocket-driver message corruption via protocol length headers, transitive via Docusaurus dev server sockjs/faye-websocket.
  websocket-driver: '>=0.7.5'
  # JUSTIFICATION: Packed through next@15.5.18. Could be resolved once next is updated to 16 versions.
  # Bumped to 8.5.23 to fix GHSA-fxqj-rqcc-2cmp — arbitrary .map file read via sourceMappingURL.
  postcss: 8.5.23
  openapi-to-postmanv2>ajv: 8.18.0
  ajv-draft-04>ajv: 8.18.0
  ajv-formats>ajv: 8.18.0
  flatted: 3.4.2
  vite: 'catalog:'
  # JUSTIFICATION: Fixes GHSA-fx2h-pf6j-xcff — vite `server.fs.deny` bypass on Windows alternate paths.
  vite@>=8.0.0 <=8.0.15: '>=8.0.16'
  vue: 3.5.34
  defu: 6.1.5
  # JUSTIFICATION: i18next 26 breaks compatibility, gives a white screen issue on Console when navigating with "TypeError: n.getResourceBundle"
  i18next: '25.6.0'
  dompurify: '>=3.4.13'
  follow-redirects: 1.16.0
  unhead: 2.1.13
  minimatch@>=5.0.0 <5.1.8: '>=5.1.8'
  minimatch@<3.1.4: '>=3.1.4'
  # ESLint plugin packages still require CJS-style minimatch resolution from the 3.x line.
  eslint-plugin-react>minimatch: '3.1.5'
  eslint-plugin-jsx-a11y>minimatch: '3.1.5'
  serialize-javascript: '>=7.0.5'
  webpack: '5.105.0'
  yaml: 2.8.3
  path-to-regexp: 0.1.13
  # JUSTIFICATION: Fixes GHSA-2p49-hgcm-8545 — SVGO removeScripts plugin leaves some executable
  # content in place. Transitive via docs and icon tooling.
  svgo: 3.3.4
  # JUSTIFICATION: Fixes GHSA-v56q-mh7h-f735 (List 32-bit trie overflow DoS) and
  # GHSA-xvcm-6775-5m9r (hash-collision algorithmic complexity DoS). Transitive via sass under
  # the @codecov/vite-plugin chain; bounded to the vulnerable 5.x range.
  immutable@>=5.0.0-beta.1 <5.1.8: 5.1.8
  # JUSTIFICATION: Fixes GHSA-3jxr-9vmj-r5cp — DoS via exponential-time expansion of consecutive
  # non-expanding {} groups, and GHSA-mh99-v99m-4gvg — DoS via unbounded expansion length. The
  # advisory range covers every major (<5.0.8); only 5.0.8 is patched. Force every transitive
  # brace-expansion to 5.0.8, and route minimatch@3.1.5 (used by @eslint/config-array,
  # @eslint/eslintrc, and eslint itself, which do CJS `require('brace-expansion')`) through the
  # `patches/minimatch@3.1.5.patch` shim so the switch to the 5.x `{ expand }` API is transparent.
  # 5.0.9 additionally fixes GHSA-rgw5-rvv9-x895 — DoS via unbounded intermediate arrays.
  brace-expansion: 5.0.9
  lodash: 4.18.1
  # JUSTIFICATION: Fixes GHSA-52cp-r559-cp3m — YAML merge-key chains forcing quadratic CPU consumption,
  # and GHSA-5p4m-2wfm-xmqj (CVE-2026-59870) — quadratic CPU consumption in !!omap resolution.
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  # JUSTIFICATION: Fixes GHSA-h67p-54hq-rp68 — quadratic-complexity DoS in js-yaml merge key handling,
  # and GHSA-5p4m-2wfm-xmqj (CVE-2026-59870) — quadratic CPU consumption in !!omap resolution.
  js-yaml@<3.15.1: 3.15.1
  # JUSTIFICATION: Fixes GHSA-64mm-vxmg-q3vj — http-proxy-middleware router host+path substring match bypass.
  http-proxy-middleware: 2.0.10
  # TODO: Remove once `nuxt` bumps `devalue` to 5.8.1 or later.
  devalue: 5.8.1
  # JUSTIFICATION: Fixes CVE-2026-44705 (GHSA-ph9p-34f9-6g65) — Path Traversal via unsanitized prefix/postfix in tmp,
  # and GHSA-7c78-jf6q-g5cm — type-confusion bypass of _assertPath (vulnerable in <0.2.7).
  tmp: '>=0.2.7'
  # JUSTIFICATION: Transitive dep via js-beautify. Fixes CVE-2026-46625 (GHSA-qjx8-664m-686j) — prototype hijack in assign() allows cookie-attribute injection.
  js-cookie: 3.0.7
  # JUSTIFICATION: @langchain/langgraph requires uuid@^10.0.0 (not yet bumped upstream to v11). Fixes predictable RNG vulnerability in uuid < 11.1.1.
  uuid: 11.1.1
  # JUSTIFICATION: Fixes GHSA-r7qp-cfhv-p84w — node-tar applies PAX size override to intermediary GNU long-name/link headers causing tar parser interpretation differential (file smuggling).
  tar: '>=7.5.16'
  # JUSTIFICATION: Fixes GHSA-9cwx-2883-4wfx — launch-editor NTLMv2 hash disclosure via UNC path handling on Windows (transitive via vite and other tooling).
  launch-editor: '>=2.14.1'
  # JUSTIFICATION: Fixes GHSA-86vr-4h7v-f9x9 — @babel/core arbitrary file read via sourceMappingURL comment.
  # Bounded to <8 so it stays on the patched 7.x line: @docusaurus/core and @vitest/coverage-istanbul
  # require Babel 7 and break on the 8.x ESM export changes.
  '@babel/core': '>=7.29.6 <8'
  # JUSTIFICATION: Transitive dep via docusaurus. Fixes CVE-2026-48038 (GHSA-q7cg-457f-vx79) — uncaught RangeError DoS in joi on deeply nested input through recursive link() schemas.
  joi: '>=18.2.1'
  # JUSTIFICATION: Fixes GHSA-gv7w-rqvm-qjhr — esbuild Deno module downloads native binaries without integrity verification, enabling RCE via NPM_CONFIG_REGISTRY.
  esbuild: '>=0.28.1'
  # JUSTIFICATION: Fixes GHSA-vxpw-j846-p89q (high DoS), GHSA-p88m-4jfj-68fv (HTTP header injection),
  # GHSA-35p6-xmwp-9g52 and GHSA-g8m3-5g58-fq7m — transitive via @codecov/vite-plugin chain. The only
  # consumers (@actions/http-client 3.x/4.x) declare undici ^6.23.0, so pin to the patched 6.x line:
  # >=6.27.0 clears the CVEs above and, by staying off the 8.x line, also avoids GHSA-4cwx-7wf7-3272
  # (8.0.0-8.8.x cross-user info disclosure). 6.x keeps Node 18 support; 8.x requires Node >=22.19.0.
  undici: '^6.27.0'
  # JUSTIFICATION: Fixes entity encoding bypass and RCE vulnerabilities in fast-xml-parser.
  fast-xml-parser: '>=5.3.6'
  # JUSTIFICATION: Fixes arbitrary file read vulnerability in Vitest UI server.
  vitest: '>=4.1.0'
  # JUSTIFICATION: Fixes command injection vulnerability via -c/--cmd flag in glob CLI.
  glob: '>=11.1.0'
  # JUSTIFICATION: Fixes environment variable exposure in Storybook manager bundle.
  storybook: '>=10.1.10'
  # JUSTIFICATION: Fixes ReDoS vulnerabilities in minimatch.
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  # JUSTIFICATION: Fixes path traversal vulnerability in rollup.
  rollup: '>=4.59.0'
  # JUSTIFICATION: Fixes prototype pollution and other vulnerabilities in axios.
  axios: '>=1.16.0'
  # JUSTIFICATION: Fixes form-data vulnerability.
  form-data: '>=4.0.6'
  # JUSTIFICATION: Fixes picomatch ReDoS vulnerability.
  picomatch: '>=2.3.2'
  # JUSTIFICATION: Fixes body-parser denial of service vulnerabilities. Covers 1.x <1.20.6 and 2.x <2.3.0 vulnerable ranges.
  body-parser: '>=2.3.0'
  # JUSTIFICATION: Fixes webpack-dev-server CSRF and DoS vulnerabilities. Pinned to 5.2.6 to address <=5.2.5 vulnerability (5.3.0 introduces breaking changes).
  webpack-dev-server: '5.2.6'
  '@hono/node-server': '>=2.0.5'
  # JUSTIFICATION: Fixes GHSA-f88m-g3jw-g9cj (CVE-2026-33327, CVE-2026-33328, CVE-2026-35590,
  # CVE-2026-35591) — libvips vulnerabilities inherited by sharp. Transitive via next's optional
  # image-optimization dependency, which pins sharp to the vulnerable <0.35.0 range.
  sharp: '>=0.35.3'
  # JUSTIFICATION: Fixes GHSA-28wg-ghj8-5hjv — nanoid non-secure generators can loop indefinitely
  # with negative size. Transitive via @scalar packages, which use the nanoid 5.x line. Pinned
  # exact (not an open range) so the resolver can't dedupe this edge onto an untested major.
  nanoid@>=4.0.0 <5.1.16: 5.1.16
  # JUSTIFICATION: Fixes GHSA-2v37-7h3g-55p8 — nanoid custom generators can loop indefinitely when
  # size is zero. Transitive via postcss, which requires the nanoid 3.x (CJS) line — an open-ended
  # target here previously let the resolver dedupe postcss onto ESM-only nanoid 5.x and broke it.
  nanoid@<3.3.17: 3.3.18
  # JUSTIFICATION: Fixes GHSA-w9m9-85wc-3x92 — DoS via uncontrolled AST recursion in
  # postcss-selector-parser. Transitive via Docusaurus css-loader and postcss-preset-env chains.
  postcss-selector-parser@>=6.1.0 <6.1.3: '>=6.1.3'
  postcss-selector-parser@>=7.0.0 <7.1.3: '>=7.1.3'
  postcss-discard-unused>postcss-selector-parser: '>=7.1.3'
  # JUSTIFICATION: Fixes GHSA-c83g-rgw3-j3cx (unbounded memory growth / OOM via distinct query
  # results) and GHSA-73wf-gq98-2v4g (uncaught crash / prototype write via untrusted custom stats).
  # Transitive via @babel/helper-compilation-targets in the Docusaurus build chain.
  browserslist: '>=4.28.7'
  # JUSTIFICATION: Fixes GHSA-6x64-9x62-f9x9 (CSS injection on sibling elements),
  # GHSA-3rrr-jr9j-h3q3 (prototype pollution in architecture diagrams), and GHSA XY chart
  # infinite-loop DoS. Transitive via @docusaurus/theme-mermaid.
  mermaid: '>=11.16.1'
  # JUSTIFICATION: Fixes GHSA-5jgf-p345-68v8 (host confusion via skipped IDN canonicalization on
  # scheme-relative references), GHSA-f65p-4m7j-42xc (SSRF via malformed IPv6 normalization),
  # GHSA-fph4-wmhf-6fwf (SSRF via repeated hostname percent-decoding) and GHSA-jqff-g426-hqxp
  # (host confusion via percent-encoded scheme normalization). Transitive via the Docusaurus
  # webpack -> schema-utils -> ajv chain (100+ paths), so overridden globally. Constrained to the
  # 3.x line: the consumers here (ajv) declare fast-uri ^3.0.1, and an open-ended '>=3.1.6' lets
  # the resolver dedupe this edge onto the 4.x major, which those consumers were never tested
  # against. 3.1.6 is a patch release on the 3.1.x line already resolved here (3.1.5), so no API
  # change.
  fast-uri: '>=3.1.6 <4'

packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: '*'

peerDependencyRules:
  allowedVersions:
    # JUSTIFICATION: @codecov/vite-plugin@2.0.1 declares a vite peer range of
    # 4.x || 5.x || 6.x, but this workspace pins vite to 8.0.16. Bundle analysis
    # was verified to run correctly against this build (the plugin collects stats
    # during the build and uploads via OIDC in CI), so Vite 8 is explicitly
    # allowed for this plugin's vite peer.
    '@codecov/vite-plugin>vite': '8'

auditConfig:
  ignoreGhsas:
    # JUSTIFICATION: image-size ICNS parser infinite-loop DoS, transitive via docusaurus mdx-loader.
    # No patched release exists on npm yet (advisory lists "Patched: None"); revisit and add an
    # override once image-size ships a fix.
    - GHSA-w3rx-r6r6-pgpr
    # JUSTIFICATION: image-size JXL/HEIF parser infinite-loop DoS, transitive via docusaurus
    # mdx-loader. No patched release exists on npm yet (advisory lists "Patched: None"); revisit
    # and add an override once image-size ships a fix.
    - GHSA-5p2g-fcmc-qvqq
    # JUSTIFICATION: GHSA-qxc2-j82w-r537 — arbitrary code execution via faker's `helpers.fake`.
    # Transitive via docs -> openapi-to-postmanv2 -> postman-collection, which depends on the
    # deprecated @faker-js/faker@5.5.3. Not overridable: the fix landed in faker 10.5.0 (the
    # advisory names 10.4.1, which was never published to npm), and faker 8 renamed the modules
    # postman-collection binds at require time (`faker.address.*` -> `faker.location.*`). Forcing
    # any >=8 release makes postman-collection throw on import, breaking
    # `pnpm --dir docs generate:postman-collections`. Upstream has not migrated — the latest
    # postman-collection (5.3.1) still pins 5.5.3 — so there is no upgrade path today.
    # Not exploitable here: the advisory requires attacker-controlled input reaching
    # `helpers.fake`, and postman-collection never calls it (it only binds individual generators
    # such as `faker.address.city` for dynamic-variable substitution). The code is also
    # build-time only, run against this repo's own OpenAPI specs. Revisit once postman-collection
    # upgrades its faker dependency.
    - GHSA-qxc2-j82w-r537

# JUSTIFICATION: Delays installation of newly published versions per the pnpm supply chain
# security guidelines (https://pnpm.io/supply-chain-security#delay-dependency-updates), so a
# compromised release has a window to be caught and yanked before it reaches this workspace.
# Setting this explicitly also switches pnpm from its default lenient behavior (silently
# auto-excluding an immature package and proceeding) to strict enforcement (failing the
# install unless the package is listed in minimumReleaseAgeExclude below).
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@thunderid/*'
  - nanoid@3.3.18

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
