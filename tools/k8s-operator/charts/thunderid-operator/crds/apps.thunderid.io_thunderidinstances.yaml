    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ThunderIDInstance is the Schema for the thunderidinstances API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ThunderIDInstance
            properties:
              adminPasswordSecret:
                description: |-
                  AdminPasswordSecret names the Secret+key holding the bootstrap admin password to use,
                  instead of letting the operator generate a random one. Only consulted when SecuritySecret
                  is unset (the operator still generates every other key itself); set both and reconciliation
                  is rejected, since SecuritySecret already fully owns admin-password in that case. Like the
                  rest of the generated security Secret, this is only read on first create, not reapplied on
                  later reconciles - change the password afterwards via ThunderID's own
                  POST /users/me/update-credentials instead.
                properties:
                  key:
                    description: Key within the Secret holding the value.
                    type: string
                  name:
                    description: Name of the Secret, in the same namespace as the
                      ThunderIDInstance.
                    type: string
                required:
                - key
                - name
                type: object
              autoScaling:
                description: AutoScalingSpec configures a HorizontalPodAutoscaler
                  for the Deployment - see reconcileHPA.
                properties:
                  maxReplicas:
                    format: int32
                    type: integer
                  minReplicas:
                    format: int32
                    type: integer
                  targetCPUUtilizationPercentage:
                    format: int32
                    type: integer
                  targetMemoryUtilizationPercentage:
                    format: int32
                    type: integer
                required:
                - maxReplicas
                - minReplicas
                type: object
              config:
                description: |-
                  Config groups every field that maps directly into ThunderID's own deployment.yaml — see
                  AppConfigSpec. Kept separate from this struct's other, Kubernetes/operator-level fields.
                properties:
                  database:
                    description: |-
                      Database mirrors ThunderID's own "database:" section — see DatabaseSpec. Unset means the
                      image's built-in sqlite default stands untouched. When unset, or set but not every scope
                      resolves to postgres, spec.dataVolumeSize must be set (at least one local sqlite file needs
                      somewhere to persist).
                    properties:
                      config:
                        description: |-
                          DatabaseBackendSpec is one database scope. ThunderID has four (config, runtime_transient,
                          entity, runtime_persistent), each independently typed — see DatabaseSpec.
                        properties:
                          postgres:
                            description: Set when type is "postgres".
                            properties:
                              connMaxLifetime:
                                format: int32
                                type: integer
                              hostname:
                                type: string
                              maxIdleConns:
                                format: int32
                                type: integer
                              maxOpenConns:
                                format: int32
                                type: integer
                              name:
                                type: string
                              passwordRef:
                                description: |-
                                  PasswordRef names the Secret+key holding this scope's PostgreSQL password. Required (this scope's
                                  DatabaseBackendSpec.Type is "postgres" whenever Postgres itself is set). K8s-only glue, not
                                  a ThunderID field. Scopes are independent: point two scopes' PasswordRef at the same Secret with
                                  different Key values to give each its own password out of one Secret object, or at the same
                                  Secret+Key to share one password across them — the operator mounts exactly what each scope's
                                  PasswordRef says, nothing more.
                                properties:
                                  key:
                                    description: Key within the Secret holding the
                                      value.
                                    type: string
                                  name:
                                    description: Name of the Secret, in the same namespace
                                      as the ThunderIDInstance.
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                              port:
                                type: string
                              sslmode:
                                enum:
                                - require
                                - verify-full
                                - verify-ca
                                - disable
                                type: string
                              username:
                                type: string
                            type: object
                          sqlite:
                            description: Set when type is "sqlite" (or unset).
                            properties:
                              connMaxLifetime:
                                format: int32
                                type: integer
                              maxIdleConns:
                                format: int32
                                type: integer
                              maxOpenConns:
                                format: int32
                                type: integer
                              options:
                                type: string
                              path:
                                type: string
                            type: object
                          type:
                            enum:
                            - sqlite
                            - postgres
                            type: string
                        type: object
                      entity:
                        description: |-
                          DatabaseBackendSpec is one database scope. ThunderID has four (config, runtime_transient,
                          entity, runtime_persistent), each independently typed — see DatabaseSpec.
                        properties:
                          postgres:
                            description: Set when type is "postgres".
                            properties:
                              connMaxLifetime:
                                format: int32
                                type: integer
                              hostname:
                                type: string
                              maxIdleConns:
                                format: int32
                                type: integer
                              maxOpenConns:
                                format: int32
                                type: integer
                              name:
                                type: string
                              passwordRef:
                                description: |-
                                  PasswordRef names the Secret+key holding this scope's PostgreSQL password. Required (this scope's
                                  DatabaseBackendSpec.Type is "postgres" whenever Postgres itself is set). K8s-only glue, not
                                  a ThunderID field. Scopes are independent: point two scopes' PasswordRef at the same Secret with
                                  different Key values to give each its own password out of one Secret object, or at the same
                                  Secret+Key to share one password across them — the operator mounts exactly what each scope's
                                  PasswordRef says, nothing more.
                                properties:
                                  key:
                                    description: Key within the Secret holding the
