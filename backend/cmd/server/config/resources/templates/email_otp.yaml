handle: "email-otp"
displayName: "Email OTP Verification"
channel: "email"
content:
  subject: "{{ t(notification:template.verification_code_title) }}"
  body: |
    <!DOCTYPE html>
    <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #181818;">
      <h2>{{ t(notification:template.verification_code_title) }}</h2>
      <p>{{ t(notification:template.verification_code_instructions) }}</p>
      <table cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #3a87ed; background: #f0f4ff; border: 1px solid #c0d0f0; border-radius: 6px; padding: 12px 24px;">{{ctx(otpCode)}}</td>
        </tr>
      </table>
      <p>{{ t(notification:template.verification_code_expiry_prefix) }} {{ctx(expiryTime)}}.</p>
      <p>{{ t(notification:template.unrequested_email_disclaimer) }}</p>
    </body>
    </html>
