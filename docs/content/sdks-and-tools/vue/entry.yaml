guides:
  - id: accessing-protected-apis
    title: Accessing Protected APIs
    icon: key
    description: Make authenticated HTTP requests from a Vue application using the Browser SDK's built-in HTTP client.
    intro: When building applications with {{ProductName}}, you'll often need to call protected APIs that require authentication.
      This guide shows you how to make authenticated HTTP requests using the {{ProductName}} Vue SDK.
    sections:
    - type: steps
      id: steps
      title: Accessing Protected APIs
      steps:
      - title: Using SDK Built-in HTTP Client
        description: 'When your application is wrapped with ``, you can use the `useThunderID` composable to access
          the authenticated `http` module. This module has the following features: - Includes the necessary authentication
          headers (Bearer token) - Handles token refresh when tokens expire - Provides methods like `request()` and
          `requestAll()` for making API calls Accessing the HTTP Client You can access the `http` client in two ways:
          1. **Inside a component**: Use the `useThunderID` composable to get the `http` instance'
        code:
          lang: ts
          content: '   const { http } = useThunderID()'
      - title: Using a GraphQL Client
        description: 'If you are not using `webWorker` as the storage type, use the `getAccessToken` function to fetch
          the access token. Then manually attach the token to the GraphQL client''s authentication headers. Storage
          Type Limitation This approach is not available when the storage type is set to `webWorker`. The SDK automatically
          manages the access token and does not expose it to the main thread. The following example shows how to configure
          a GraphQL client with authentication using the access token:'
        code:
          file: src/graphql/client.ts
          lang: ts
          content: |2-

            export function createAuthenticatedClient(accessToken: string) {
              const httpLink = createHttpLink({
                uri: 'https://localhost:8090/graphql',
              })

              const authLink = setContext((_, { headers }) => ({
                headers: {
                  ...headers,
                  authorization: accessToken ? `Bearer ${accessToken}` : '',
                },
              }))

              return new ApolloClient({
                link: authLink.concat(httpLink),
                cache: new InMemoryCache(),
              })
            }
  - id: protecting-routes
    title: Protecting Routes
    icon: shield
    description: Secure routes in a Vue application by requiring authentication before rendering protected views.
    intro: In a Vue app, routes define the paths within the application that users can navigate to, linking URLs to
      specific components. Securing routes is essential to protect sensitive data, prevent unauthorized access, and
      ensure that only authenticated users can access certain parts of the application. The {{ProductName}} SDK provides
      multiple approaches to secure routes in your application. This guide demonstrates how to secure routes in a Vue
      3 single-page app using the navigation guard helper shipped with `@thunderid/vue`.
    sections:
    - type: steps
      id: steps
      title: Protecting Routes
      tabs:
      - label: Custom Implementation
        steps:
        - title: Basic Custom Route Guard With `<SignedIn />`
          description: 'The simplest approach is to wrap the protected page content with the `` component and render
            a fallback for unauthenticated users:'
          code:
            file: src/pages/Contact.vue
            lang: vue
            content: |-
              <script setup>
              </script>

              <template>
                <SignedIn>
                  <ContactDetails />
                </SignedIn>
                <SignedOut>
                  <p>You must sign in to view this page.</p>
                </SignedOut>
              </template>
        - title: Custom Composable Using `useThunderID`
          description: 'For more advanced control, such as role-based protection or a redirect, use `useThunderID()`
            together with Vue Router''s `useRouter`:'
          code:
            file: src/composables/useRequireAuth.ts
            lang: ts
            content: |2-

              export interface RequireAuthOptions {
                redirectTo?: string
                requireRole?: string
              }

              export function useRequireAuth(options: RequireAuthOptions = {}) {
                const { redirectTo = '/signin', requireRole } = options
                const { isInitialized, isSignedIn, user } = useThunderID()
                const router = useRouter()

                watchEffect(() => {
                  if (!isInitialized.value) return

                  if (!isSignedIn.value) {
                    router.replace(redirectTo)
                    return
                  }

                  if (requireRole && !user.value?.roles?.includes(requireRole)) {
                    router.replace('/forbidden')
                  }
                })
              }
        - title: Custom Navigation Guard
          description: You can also build a Vue Router navigation guard from scratch using the SDK's `inject` key directly.
            This is essentially what `createThunderIDGuard` does internally, and you can fork it to add custom logic.
          code:
            file: src/router/guards.ts
            lang: ts
            content: |2-

              export const requireAuth: NavigationGuard = async (to, from, next) => {
                const ctx = inject<ThunderIDContext>(THUNDERID_KEY)

                if (!ctx) {
                  return next({ path: '/signin' })
                }

                // Wait for initialization
                while (!ctx.isInitialized.value) {
                  await new Promise((resolve) => requestAnimationFrame(resolve))
                }

                if (!ctx.isSignedIn.value) {
                  return next({ path: '/signin', query: { redirect: to.fullPath } })
                }

                // Add any custom role / permission checks here

                return next()
              }
        blurb: If you prefer full control over how app routes are secured, you can build a custom solution using the
          primitives provided by the {{ProductName}} Vue SDK. This helps when you need to run custom application logic
          before enabling or disabling a route.
      - label: Vue Router
        steps:
        - title: '`beforeEnter` Route Guard'
          description: Apply the guard to a single route using `beforeEnter`. This is the most common pattern when only
            a few routes need protection.
          code:
            file: src/router/index.ts
            lang: ts
            content: |2-

              const router = createRouter({
                history: createWebHistory(),
                routes: [
                  { path: '/', component: Home },
                  { path: '/signin', component: SignIn },
                  {
                    path: '/dashboard',
                    component: Dashboard,
                    beforeEnter: createThunderIDGuard({ redirectTo: '/signin' }),
                  },
                  createCallbackRoute({ path: '/callback' }),
                ],
              })

              export default router
        - title: Global Guard with `router.beforeEach`
          description: Apply the guard to every route at once using `router.beforeEach`. Combine this with per-route
            `meta` flags if you want to opt specific routes out of the check.
          code:
            file: src/router/index.ts
            lang: ts
            content: |2-

              const router = createRouter({
                history: createWebHistory(),
                routes: [
                  { path: '/', component: Home, meta: { public: true } },
                  { path: '/signin', component: SignIn, meta: { public: true } },
                  { path: '/dashboard', component: Dashboard },
                ],
              })

              const requireAuth = createThunderIDGuard({ redirectTo: '/signin' })

              router.beforeEach((to, from, next) => {
                if (to.meta.public) {
                  return next()
                }
                return requireAuth(to, from, next)
              })

              export default router
        - title: Customizing the Guard
          description: 'The guard accepts the following options: | Option | Type | Default | Description | | :--- |
            :--- | :--- | :--- | | `redirectTo` | `string` | `''/''` | Path to redirect unauthenticated users to | |
            `waitForInit` | `boolean` | `true` | Wait for the SDK to finish initializing before evaluating the auth
            state | | `initTimeout` | `number` | `10000` | Maximum time (in ms) to wait for SDK initialization before
            redirecting | For example, to reject immediately when the SDK is not yet initialized (without waiting):'
          code:
            file: src/router/index.ts
            lang: ts
            content: |-
              const guard = createThunderIDGuard({
                redirectTo: '/signin',
                waitForInit: false,
              })
        - title: Using the Callback Route Helper
          description: '`createCallbackRoute` returns a route record that renders the SDK''s built-in `` component,
            which extracts OAuth parameters from the URL and finalises the sign-in.'
          code:
            file: src/router/index.ts
            lang: ts
            content: |2-

              const router = createRouter({
                history: createWebHistory(),
                routes: [
                  { path: '/', component: Home },
                  createCallbackRoute({
                    path: '/auth/callback',
                    name: 'oauth-callback',
                    onError: (error) => console.error('OAuth error:', error),
                  }),
                ],
              })
        blurb: '`@thunderid/vue` ships with `createThunderIDGuard`, a navigation-guard factory that integrates with
          [Vue Router](https://router.vuejs.org/). The guard checks the user''s authentication state and redirects unauthenticated
          users to a fallback route. It also waits for the SDK to finish initializing on first load so that protected
          routes are not falsely treated as unauthenticated during the initial bootstrap. `createCallbackRoute` is a
          companion helper that returns a route record for the OAuth2 callback, useful when you want a dedicated `/callback`
          route instead of relying on the redirect landing on `/`. Requires Vue Router These helpers expect `vue-router`
          to be installed as a peer dependency:'

