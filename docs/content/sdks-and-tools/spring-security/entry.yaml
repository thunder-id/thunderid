sections:
  - type: steps
    id: setup
    title: Handling authentication
    meta: "~8 min"
    intro: >-
      Five steps, all standard Spring Security: login flow, token validation, scope-based access control, and
      back-channel logout.
      Spring Security is maintained by the Spring team; {{ProductName}} maintains this guide and the
      configuration below.
    steps:
      - title: Add Spring's OAuth2 starters
        description: >-
          Both are Spring Boot artifacts: client for browser login, resource-server for bearer-token APIs.
          Versions come from the Spring Boot BOM. Drop whichever you do not need.
        code:
          file: build.gradle.kts
          lang: kotlin
          content: |-
            implementation("org.springframework.boot:spring-boot-starter-oauth2-client")
            implementation("org.springframework.boot:spring-boot-starter-oauth2-resource-server")
      - title: Point the app at your {{ProductName}} issuer
        description: >-
          These are Spring's standard OIDC properties. There are no {{ProductName}}-specific configuration keys
          to learn.
        code:
          file: application.yml
          lang: yaml
          content: |-
            spring:
              security:
                oauth2:
                  client:
                    registration:
                      thunderid:
                        client-id: ${THUNDERID_CLIENT_ID}
                        client-secret: ${THUNDERID_CLIENT_SECRET}
                        scope: openid, profile, email
                    provider:
                      thunderid:
                        issuer-uri: https://acme.thunderid.dev
                  resourceserver:
                    jwt:
                      issuer-uri: https://acme.thunderid.dev
        note: >-
          Declaring both client and resourceserver lets one application serve browser sessions and bearer-token
          API calls. Omit either block if you only need one.
      - title: Secure your endpoints
        description: >-
          An ordinary SecurityFilterChain bean. Scopes from the {{ProductName}} token arrive prefixed with
          SCOPE_.
        code:
          file: SecurityConfig.java
          lang: java
          content: |-
            @Configuration
            @EnableWebSecurity
            public class SecurityConfig {

              @Bean
              SecurityFilterChain filterChain(HttpSecurity http) throws Exception {
                return http
                  .authorizeHttpRequests(auth -> auth
                    .requestMatchers("/actuator/health").permitAll()
                    .requestMatchers("/api/billing/**").hasAuthority("SCOPE_billing:read")
                    .anyRequest().authenticated())
                  .oauth2Login(Customizer.withDefaults())
                  .oauth2ResourceServer(rs -> rs.jwt(Customizer.withDefaults()))
                  .build();
              }
            }
      - title: Read the authenticated principal
        description: >-
          Inject Spring's own OidcUser for session-based flows, or Jwt for bearer-token requests. Claims map
          straight through.
        code:
          file: ProfileController.java
          lang: java
          content: |-
            @RestController
            public class ProfileController {

              @GetMapping("/me")
              public Map<String, Object> me(@AuthenticationPrincipal OidcUser user) {
                return Map.of(
                  "sub", user.getSubject(),
                  "email", user.getEmail(),
                  "org", user.getClaimAsString("org_id")
                );
              }

              @PreAuthorize("hasAuthority('SCOPE_billing:read')")
              @GetMapping("/api/billing")
              public Invoice billing(@AuthenticationPrincipal Jwt jwt) {
                return service.forTenant(jwt.getClaimAsString("org_id"));
              }
            }
        note: Enable @PreAuthorize with @EnableMethodSecurity on any configuration class.
      - title: Receive back-channel logout
        description: >-
          Spring Security implements OpenID Connect Back-Channel Logout. These additions to the configuration above
          stand up the receiving endpoint and end the matching Spring session when {{ProductName}} posts a logout
          token. Register the endpoint URL as the application's back-channel logout URI in {{ProductName}}. They need
          Spring Security 6.4 or later, which Spring Boot 3.4 ships.
        code:
          file: SecurityConfig.java
          lang: java
          content: |-
            @Bean
            OidcSessionRegistry oidcSessionRegistry() {
              return new InMemoryOidcSessionRegistry();
            }

            @Bean
            OidcBackChannelLogoutHandler oidcLogoutHandler(OidcSessionRegistry oidcSessionRegistry) {
              return new OidcBackChannelLogoutHandler(oidcSessionRegistry);
            }

            // Removes a registry entry when its servlet session ends
            @Bean
            HttpSessionEventPublisher sessionEventPublisher() {
              return new HttpSessionEventPublisher();
            }

            // In the SecurityFilterChain, next to oauth2Login(...):
            .oidcLogout(logout -> logout.backChannel(Customizer.withDefaults()))
        note: >-
          The endpoint is /logout/connect/back-channel/thunderid, where thunderid is the registration id. Spring
          correlates each login's sid to the servlet session in the OidcSessionRegistry, which this example keeps in
          memory. Several instances need a shared OidcSessionRegistry and a shared servlet session store, such as
          Spring Session, since the notification can reach an instance that does not hold the session. The handler
          sends the JSESSIONID cookie by default; with Spring Session's SESSION cookie, call
          setSessionCookieName("SESSION") on the handler.

  - type: table
    id: mapping
    title: Claim mapping
    intro: >-
      How {{ProductName}} token claims arrive on the Spring side. This is the reference you will actually reach
      for, since there is no separate {{ProductName}} API surface to learn.
    showHeader: true
    columns:
      - {label: "{{ProductName}} claim", style: accent}
      - {label: Spring accessor, style: code}
      - {label: Notes, style: text}
    rows:
      - cells: ["sub", "user.getSubject()", "Stable {{ProductName}} user identifier."]
      - cells: ["email", "user.getEmail()", "Present when the email scope is granted."]
      - cells: ["scope", "getAuthorities()", "Each scope becomes a SCOPE_ authority."]
      - cells: ["org_id", 'getClaimAsString("org_id")', "Tenant context for multi-org applications."]
      - cells: ["act", 'getClaimAsMap("act")', "Present on agent tokens; identifies the acting agent."]

