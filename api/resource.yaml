  /resource-servers/{id}/sharing-policies:
    post:
      tags:
        - Sharing Policies
      summary: Record a sharing policy
      description: |
        Records one organization unit's decision about this resource server: which organization
        units it reaches, and on what terms. Exactly one policy exists per resource server per
        initiating organization unit; a second create is refused with RES-1026 naming the policy to
        edit instead.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingPolicyRequest'
            examples:
              wholeTree:
                summary: Share everything with one root organization unit
                description: No overlay rule, so the sharee receives the server's whole permission tree.
                value:
                  targetOuScope:
                    rootOuIds: ["a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"]
              withholdOneBranch:
                summary: Everything except refunds
                description: |
                  editable false with no value means the owner's own value, minus the excluded
                  paths and everything beneath them. No wildcard is needed.
                value:
                  targetOuScope:
                    rootOuIds: ["a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"]
                  overlayRules:
                    resources:
                      editable: false
                      excludedValues: ["bookings:refund", "billing:approve"]
              explicitIncludeList:
                summary: An explicit include list
                value:
                  targetOuScope:
                    rootOuIds: ["a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"]
                  overlayRules:
                    resources:
                      editable: false
                      value: ["bookings", "billing:invoice"]
              reshare:
                summary: A sharee passing the server on to its own child
                description: |
                  Bounded by what the initiating organization unit itself holds. Named targets must
                  be direct children of the initiator; depth comes from allChildren, never from
                  naming a grandchild.
                value:
                  initiatingOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                  targetOuScope:
                    ouIds:
                      - ouId: "c1e4b0a2-7d3f-4a91-9f22-5b8e6d0c3a41"
                        allChildren: true
                  overlayRules:
                    resources:
                      editable: false
                      value: ["bookings"]
      responses:
        "201":
          description: Sharing policy recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        "400":
          description: |
            The request is malformed, names a field the resource server does not expose, names a
            permission it does not define, breaks the one-hop rule, or asks for more than the
            initiating organization unit itself holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1030"
                message:
                  key: "error.resourceservice.invalid_sharing_policy"
                  defaultValue: "Invalid sharing policy"
                description:
                  key: "error.resourceservice.invalid_sharing_policy_description"
                  defaultValue: "The sharing policy is not valid for this resource server: an overlay rule may only narrow what the initiating organization unit itself holds"
        "403":
          description: |
            The initiating organization unit cannot see this resource server, or the target leaves
            its tree while cross-tree sharing is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: |
            A policy already exists for this initiating organization unit. The refusal names it, so
            the caller can edit that policy instead of creating a second one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1026"
                message:
                  key: "error.resourceservice.sharing_policy_exists"
                  defaultValue: "A sharing policy already exists for this organization unit"
                description:
                  key: "error.resourceservice.sharing_policy_exists_description"
                  defaultValue: "Exactly one sharing policy exists per organization unit; edit the existing one"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Sharing Policies
      summary: List sharing policies
      description: Returns every sharing policy recorded for this resource server, declared ones included.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sharing policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicyList'
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /resource-servers/{id}/sharing-policies/{policyId}:
    get:
      tags:
        - Sharing Policies
      summary: Get a sharing policy
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: policyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sharing policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        "404":
          description: |
            Resource server or policy not found. A policy recorded against a different resource is
            reported as not found here, so an id cannot be read through another server's path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Sharing Policies
      summary: Replace a sharing policy
      description: |
        Replaces the policy's contents. A policy is edited rather than re-issued, so changing who a
        resource server is shared with is a PUT on the existing policy.

        A blanket policy (allOus, allRoots, allChildren) may only be narrowed, and only by adding
        exclusions; a selective policy may grow within the one-hop rule. Converting between the two
        families is never an edit. A policy defined in a resource file cannot be edited at all.

        Editing cascades: every reshare beneath this policy is recomputed in the same transaction,
        so a descendant can never be left holding rules wider than its ancestor allows.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: policyId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: false
          description: |
            The version the caller believes it is editing, as returned in the policy's version
            field. An edit built on a stale version is refused, so two administrators cannot
            silently overwrite one another's carve-outs. Clients that cannot set headers may send
            the same value in the body's version field instead.
          schema:
            type: string
            example: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingPolicyRequest'
            examples:
              addATarget:
                summary: Reach a second organization unit
                value:
                  targetOuScope:
                    rootOuIds:
                      - "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                      - "c1e4b0a2-7d3f-4a91-9f22-5b8e6d0c3a41"
              narrowByExclusion:
                summary: Withhold a branch
                value:
                  targetOuScope:
                    rootOuIds: ["a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"]
                  overlayRules:
                    resources:
                      editable: false
                      excludedValues: ["bookings:refund"]
      responses:
        "200":
          description: Sharing policy replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        "400":
          description: |
            The request is malformed, changes a blanket policy by more than adding exclusions,
            converts between scope families, or asks for more than the initiator holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: The policy is defined in a resource file and cannot be edited through the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1028"
                message:
                  key: "error.resourceservice.sharing_policy_immutable"
                  defaultValue: "This sharing policy is defined in a resource file"
                description:
                  key: "error.resourceservice.sharing_policy_immutable_description"
                  defaultValue: "A sharing policy a resource file declares can only be removed in that file"
        "404":
          description: Resource server or policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "412":
          description: |
            The edit was built on a stale version. Re-read the policy and reapply the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1027"
                message:
                  key: "error.resourceservice.sharing_policy_version_mismatch"
                  defaultValue: "Sharing policy version mismatch"
                description:
                  key: "error.resourceservice.sharing_policy_version_mismatch_description"
                  defaultValue: "The sharing policy changed since it was read; re-read it and retry"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Sharing Policies
      summary: Delete a sharing policy
      description: |
        Removes the policy and cleans up the per-organization-unit state of every unit that loses
        visibility as a result. Visibility chains, so removing a policy also takes the resource
        server away from anything reachable only through it.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: policyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Sharing policy deleted
        "403":
          description: The policy is defined in a resource file and cannot be deleted through the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Resource server or policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /resource-servers/{id}/overlay-rules:
    get:
      tags:
        - Sharing Policies
      summary: Resolve what an organization unit may do
      description: |
        Returns the effective rule per field for one organization unit.

        An organization unit can be reached by more than one policy at once. The rules of all of
        them are intersected rather than the nearest one winning, which is what keeps resolution
        monotone: adding a policy can never widen the result, and removing one can never widen it
        either.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: ouId
          required: true
          description: The organization unit to resolve for.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resolved rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingOverlay'
              examples:
                shared:
                  summary: An organization unit the server was shared to
                  value:
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    origin: "shared"
                    policyIds: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
                    rules:
                      resources:
                        editable: false
                        excludedValues: ["bookings:refund"]
                        source: "policy"
                owned:
                  summary: The organization unit that owns the resource server
                  value:
                    ouId: "c1e4b0a2-7d3f-4a91-9f22-5b8e6d0c3a41"
                    origin: "owned"
                    policyIds: []
                    rules:
                      resources:
                        editable: false
                        source: "default"
        "400":
          description: ouId is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: |
            The resource server does not exist, or no policy reaches the named organization unit.
            Both are the same answer on purpose: a withheld resource server must not be described to
            the organization unit it was withheld from, and an empty rule set would still describe
            it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs

  parameters:
    limitQueryParam:
      in: query
      name: limit
      required: false
      description: Maximum number of records to return
      schema:
        type: integer
        minimum: 1
        default: 30
    offsetQueryParam:
      in: query
      name: offset
      required: false
      description: Number of records to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    ResourceServer:
      type: object
      required: [id, name, identifier, type, ouId, delimiter]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the resource server
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          nullable: true
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute URI, the resource server is used in RFC 8707 resource indicator flows and the identifier is used as the access token audience claim value.
        type:
          type: string
          enum: [API, MCP, CUSTOM]
          description: Immutable type of the resource server (metadata only). Defaults to CUSTOM when not provided at creation.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to
        origin:
          type: string
          enum: [owned, shared]
          description: |
            How the answering organization unit holds this server: owned when it is the server's own
            organization unit, shared when a sharing policy reaches it. Absent when the request was
            not bounded to an organization unit, because there is then nobody for it to be relative
            to.
        delimiter:
          type: string
          description: Character used to separate permission hierarchy levels (immutable after creation)
        isReadOnly:
          type: boolean
          description: Whether the resource server is read-only (system-managed)

    CreateResourceServerRequest:
      type: object
      required: [name, ouId, identifier]
      properties:
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute URI, the resource server is used in RFC 8707 resource indicator flows and clients can use this value in the resource parameter to request audience-restricted access tokens.
        type:
          type: string
          enum: [API, MCP, CUSTOM]
          description: Optional immutable type of the resource server (metadata only). Defaults to CUSTOM when not provided.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to
        delimiter:
          type: string
          description: Optional delimiter character for permission hierarchy (defaults to ":", immutable after creation)

    UpdateResourceServerRequest:
      type: object
      required: [name, ouId]
      properties:
        name:
          type: string
          description: Name of the resource server
        description:
          type: string
          description: Optional description of the resource server
        identifier:
          type: string
          description: Unique identifier for this resource server. When set to an absolute URI, the resource server is used in RFC 8707 resource indicator flows.
        ouId:
          type: string
          format: uuid
          description: ID of the organization unit this resource server belongs to

    Resource:
      type: object
      required: [id, name, handle, permission]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the resource
        name:
          type: string
          description: Display name of the resource
        handle:
          type: string
          description: Immutable and unique under resource server or parent resource. Identifier used for permission derivation
        description:
          type: string
          nullable: true
          description: Optional description of the resource
        parent:
          type: string
          format: uuid
          description: Parent resource ID. Absent for top-level resources (immutable after creation)
        permission:
          type: string
          description: Derived permission string based on handle hierarchy

    CreateResourceRequest:
      type: object
      required: [name, handle]
      properties:
        name:
          type: string
          description: Display name of the resource
        handle:
          type: string
          description: Immutable and unique under resource server or parent resource. Identifier used for permission derivation
        description:
          type: string
          description: Optional description of the resource
        parent:
          type: string
          format: uuid
          nullable: true
          description: Parent resource ID (null for top-level resources, immutable after creation)

    UpdateResourceRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name of the resource (mutable)
        description:
          type: string
          description: Optional description of the resource

    Action:
      type: object
      required: [id, name, handle, permission]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the action
        name:
          type: string
          description: Display name of the action
        handle:
          type: string
          description: Immutable and unique under resource server or resource. Identifier used for permission derivation
        description:
          type: string
          nullable: true
          description: Optional description of the action
        permission:
          type: string
          description: Derived permission string based on handle hierarchy
        kind:
          type: string
          enum: [tool, resource]
          description: >
            MCP primitive kind. "tool" represents a callable MCP tool (model-controlled); "resource"
            represents a read-only MCP resource (application-controlled). Always present for type=MCP
            actions (defaults to "tool" when omitted on create). For API and CUSTOM resource server
            actions it is present only when a kind was provided on create, otherwise omitted.
            Immutable after creation.

    CreateActionRequest:
      type: object
      required: [name, handle]
      properties:
        name:
          type: string
          description: Display name of the action
        handle:
          type: string
          maxLength: 100
          description: Immutable and unique under resource server or resource. Identifier used for permission derivation. Maximum length is 100 characters.
        description:
          type: string
          description: Optional description of the action
        kind:
          type: string
          enum: [tool, resource]
          description: >
            MCP primitive kind. Optional for all resource server types; when provided it must be
            "tool" or "resource". For type=MCP it defaults to "tool" when omitted. For API and
            CUSTOM resource servers it is optional and, when omitted, stays empty. Immutable after
            creation; omit on update requests (kind cannot be changed).

    UpdateActionRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name of the action
        description:
          type: string
          description: Optional description of the action

    ResourceServerListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 8
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 5
        resourceServers:
          type: array
          items:
            $ref: '#/components/schemas/ResourceServer'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    ResourceListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 15
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 10
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    ActionListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation
          example: 12
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page
          example: 10
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Link:
      type: object
      properties:
        href:
          type: string
          example: "resource-servers?offset=20&limit=10"
        rel:
          type: string
          example: "next"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Error code, following the RES-XXXX convention. Sharing failures are reported in the
            resource server's own codes; the sharing framework's internal codes are never returned.
          example: "RES-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).

    SharingPolicyRequest:
      type: object
      required: [targetOuScope]
      description: The body of a sharing-policy create or replace.
      properties:
        initiatingOuId:
          type: string
          format: uuid
          description: |
            The organization unit making the decision. Omit for the resource server's owner. A
            non-owner must already be able to see the server, and may only reach organization units
            directly beneath itself.
        targetOuScope:
          $ref: '#/components/schemas/TargetOuScope'
        overlayRules:
          type: object
          description: |
            The terms, keyed by field. A resource server exposes one field, resources. Naming any
            other key is refused rather than stored and ignored.
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'
        version:
          type: integer
          description: |
            The version the caller believes it is editing, for clients that cannot set If-Match.
            Ignored on create.

    TargetOuScope:
      type: object
      description: |
        Which organization units a policy reaches. Exactly one of the three modes may be populated:
        the blanket mode (allOus), the root mode (allRoots or rootOuIds), or the children mode
        (allChildren or ouIds).

        A target names an anchor, not a membership list. ouId with allChildren reaches everything
        beneath that unit, and allChildren on its own reaches everything beneath the initiator but
        not the initiator itself.
      properties:
        allOus:
          type: boolean
          description: Reaches every organization unit in the deployment. Owner only, first hop only.
        allRoots:
          type: boolean
          description: Reaches every tree's root organization unit. Owner only.
        rootOuIds:
          type: array
          description: Reaches the named root organization units. Owner only.
          items:
            type: string
            format: uuid
        excludedRootOuIds:
          type: array
          description: Carves roots out of an allRoots selection.
          items:
            type: string
            format: uuid
        allChildren:
          type: boolean
          description: Reaches everything beneath the initiating organization unit, at any depth.
        ouIds:
          type: array
          description: Names organization units directly beneath the initiator.
          items:
            $ref: '#/components/schemas/TargetEntry'
        excludedOuIds:
          type: array
          description: Carves organization units, and their subtrees, out of the selection.
          items:
            type: string
            format: uuid

    TargetEntry:
      type: object
      required: [ouId]
      description: One organization unit a policy reaches.
      properties:
        ouId:
          type: string
          format: uuid
          description: Must be a direct child of the initiating organization unit.
        allChildren:
          type: boolean
          description: Additionally reaches everything beneath ouId, at any depth.
        overlayRules:
          type: object
          description: Overrides the policy-level rules for this target alone.
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'

    OverlayRule:
      type: object
      description: |
        What a policy says a target organization unit may do with one field.

        For a resource server's resources field the members are permission strings in the server's
        own delimiter, and a path denotes itself and everything beneath it: naming "bookings" also
        names "bookings:create" and anything added under it later.

        Omitted and empty are opposites. An omitted allowedValues leaves the field unconstrained;
        an explicitly empty one permits nothing.
      properties:
        editable:
          type: boolean
          description: |
            Whether the target organization unit may write the field. A resource server's permission
            tree is not editable by a sharee, so this is false for resources.
        value:
          type: array
          description: |
            What the target holds, or is pinned to when the field is not editable. Omitted with
            editable false means the owner's own value, which is how "everything except these" is
            expressed with no wildcard.
          items:
            type: string
        allowedValues:
          type: array
          description: |
            Bounds what the target may choose from. Combining this with editable false is an error
            (RES-1030), because a menu nobody may choose from means the author misunderstood the shape.
          items:
            type: string
        excludedValues:
          type: array
          description: Subtracted from both value and allowedValues, last.
          items:
            type: string

    SharingPolicy:
      type: object
      description: One organization unit's standing decision about a resource server.
      properties:
        id:
          type: string
          format: uuid
        resourceType:
          type: string
          description: Always resource_server here; reported so a client handling several shareable types can treat the bodies uniformly.
          example: "resource_server"
        resourceId:
          type: string
          format: uuid
        owningOuId:
          type: string
          format: uuid
          description: The organization unit that owns the resource server.
        initiatingOuId:
          type: string
          format: uuid
          description: The organization unit whose decision this policy is.
        stage:
          type: string
          enum: [share, reshare]
          description: share when the owner issued the policy, reshare when a sharee did.
        targetOuScope:
          $ref: '#/components/schemas/TargetOuScope'
        overlayRules:
          type: object
          description: The resolved rules, after narrowing against what the initiator itself holds.
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'
        declared:
          type: boolean
          description: A policy defined in a resource file, which cannot be edited or deleted through the API.
        version:
          type: integer
          description: Send this back in If-Match when editing.

    SharingPolicyList:
      type: object
      properties:
        totalResults:
          type: integer
        policies:
          type: array
          items:
            $ref: '#/components/schemas/SharingPolicy'

    SharingOverlay:
      type: object
      description: What one organization unit may do with a resource server.
      properties:
        ouId:
          type: string
          format: uuid
          description: The organization unit the rules were resolved for.
        origin:
          type: string
          enum: [owned, shared]
          description: |
            owned when the organization unit owns the resource server, shared when a policy reaches
            it. An organization unit no policy reaches gets no overlay at all: the endpoint reports
            the resource server as not found.
        policyIds:
          type: array
          description: |
            Every policy that contributed, so an intersection is traceable to its inputs. Empty for
            the owner, which holds the resource server without any policy saying so.
          items:
            type: string
            format: uuid
        rules:
          type: object
          description: The effective rule per field.
          additionalProperties:
            $ref: '#/components/schemas/SharingOverlayRule'

    SharingOverlayRule:
      type: object
      description: One resolved rule, carrying where it came from.
      properties:
        editable:
          type: boolean
        value:
          type: array
          items:
            type: string
        allowedValues:
          type: array
          items:
            type: string
        excludedValues:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [policy, default]
          description: |
            policy when some policy named the field, default when none did and the resource type's
            declared default applied. This separates "the owner decided this" from "nobody said anything".
