    delete:
      tags:
        - Agents
      summary: Delete an agent by id
      description: >
        Deletes the agent, its inbound auth profile, and its OAuth client
        profile. Group

        memberships and role assignments are automatically removed by cascade.
        The delete is

        fail-closed and retriable: if dependency cleanup fails, the agent is
        left intact and the

        operation can be retried.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          example: 9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3
      responses:
        "204":
          description: Agent deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
