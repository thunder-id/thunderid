resource_type: agent
id: decl-agent-credentials-1
ouId: decl-ou-1
type: declarative-agents
description: A declarative test agent that signs in with a password and a client secret
inboundAuthConfig:
  - type: "oauth2"
    config:
      clientId: "decl-agent-cred-client-1"
      clientSecret: "decl-agent-cred-secret-1"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      publicClient: false
attributes:
  name: Declarative Credential Test Agent
credentials:
  password: "Decl-Agent-Pass1!"
# Shared, by its own file, into the root of another tree, so its client may ask for a token there.
sharingPolicies:
  - id: decl-agent-credentials-1-policy-1
    otherTreeRoots:
      mode: selected
      units:
        - ouId: decl-m2m-root
