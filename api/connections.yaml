          required: [ouId, clientSecret]
    OAuthConnectionResponse:
      type: object
      required: [ouId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ouId:
          type: string
          description: >-
            ID of the organization unit that owns the connection.
          example: "01900000-0000-7000-8000-000000000001"
        type: { type: string, example: "oauth" }
        clientId: { type: string }
        clientSecret: { type: string, example: "******" }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }

    AuthZENPDPConnectionUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AuthZENPDPConnectionConfiguration'
        - type: object
          properties:
            authentication:
              $ref: '#/components/schemas/OutboundAuthentication'
    AuthZENPDPConnectionConfiguration:
      type: object
      required: [name, endpoint]
      properties:
        name: { type: string, example: "Travel Booking PDP" }
        description: { type: string }
        ouId:
          type: string
          description: >-
            ID of the organization unit that owns the connection. Required when the connection is created, and the
            organization unit has to exist. It cannot be changed afterwards: on an update, leave it out to keep the
            owner, or give the one the connection has.
          example: "01900000-0000-7000-8000-000000000001"
        endpoint:
          type: string
          format: uri
          pattern: '^https?://'
          description: HTTP endpoint for a single AuthZEN access evaluation.
          example: "https://pdp.example.com/access/v1/evaluation"
        batchEndpoint:
          type: string
          format: uri
          pattern: '^https?://'
          description: Optional HTTP endpoint for batched AuthZEN access evaluations. When omitted, ThunderID sends each evaluation to endpoint.
          example: "https://pdp.example.com/access/v1/evaluations"
        timeoutMs:
          type: integer
          minimum: 1
          default: 1000
          description: Timeout for each PDP request in milliseconds.
        retryCount:
          type: integer
          minimum: 0
          default: 1
          description: Number of retries for transient PDP or network failures.
        subjectAttributeMappings:
          type: array
          items: { $ref: '#/components/schemas/AuthZENPDPSubjectAttributeMapping' }
    AuthZENPDPConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AuthZENPDPConnectionUpdateRequest'
        - type: object
          required: [ouId]
    AuthZENPDPConnectionResponse:
      allOf:
        - type: object
          required: [id, ouId, type]
          properties:
            id: { type: string, format: uuid }
            ouId:
              type: string
              description: >-
                ID of the organization unit that owns the connection.
              example: "01900000-0000-7000-8000-000000000001"
            type: { type: string, enum: [authzen-pdp] }
            authentication:
              $ref: '#/components/schemas/OutboundAuthentication'
        - $ref: '#/components/schemas/AuthZENPDPConnectionConfiguration'

    AuthZENPDPSubjectAttributeMapping:
      type: object
      required: [entityType, attributes]
      properties:
        entityType:
          type: string
          description: Handle of the user type or agent type to which this mapping applies.
        attributes:
          type: array
          items:
            type: object
            required: [attribute]
            properties:
              attribute:
                type: string
                description: ThunderID user attribute name.
              pdpAttribute:
                type: string
                description: AuthZEN PDP subject property name. Defaults to attribute when omitted.

    HTTPConnectionUpdateRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          maxLength: 255
          description: Unique per deployment.
          example: "Risk Engine"
        description: { type: string, maxLength: 500 }
        ouId:
          type: string
          description: >-
            ID of the organization unit that owns the connection. Required when the connection is created, and the
            organization unit has to exist. It cannot be changed afterwards: on an update, leave it out to keep the
            owner, or give the one the connection has.
          example: "01900000-0000-7000-8000-000000000001"
        url:
          type: string
          format: uri
          pattern: '^https?://'
          description: >-
            Absolute `http` or `https` URL of the endpoint, with a DNS name or IP literal host, a
            port from 1 to 65535 and no user name or password; credentials go in `authentication`.
            Must be `https` when `authentication.type` is not `none`, so a stored credential never
            crosses the network in clear. Stored with a lower-case scheme and host and without a
            default port.
          example: "https://risk.example.com/evaluate"
        timeoutMs:
          type: integer
          minimum: 0
          maximum: 20000
          default: 10000
          description: Timeout of each call in milliseconds. `0` or omitted means 10000.
        headers:
          type: array
          description: >-
            Plain headers sent on every call. Names are unique, case-insensitively, and values have
            no line breaks. A PUT replaces the whole list, so omitted means none. Names are
            compared case-insensitively. Headers that commonly carry credentials (`Authorization`,
            `Proxy-Authorization`, `Cookie`, `X-Api-Key`, `Api-Key`, `X-Auth-Token`,
            `X-Access-Token`), headers the HTTP client manages (`Host`, `Content-Length`,
            `Content-Type`, `Transfer-Encoding`, `Connection`, `TE`, `Trailer`, `Upgrade`,
            `Keep-Alive`, `Expect`) and any header the `api_key` authentication sets are refused
            with `CON-1020`.
          items: { $ref: '#/components/schemas/HTTPConnectionHeader' }
        authentication:
          allOf:
            - $ref: '#/components/schemas/OutboundAuthentication'
          description: |
            How ThunderID authenticates to the endpoint: `none`, `basic` (`username`, `password`),
            `bearer` (`token`) or `api_key` (one property per header, the header name as the key).
            Omit it to send no credentials, on update as much as on create. Call
            `GET /connections/meta?vendor=http` for the methods this deployment supports and the
            fields each one takes.

            Secrets (the password, the token and every `api_key` header value) are stored
            encrypted and returned as `"******"`; `api_key` header names are returned in clear.
            On update, an omitted password or token keeps the stored one only while the
            authentication type, the username and the URL origin (scheme, host and port) are
            unchanged; otherwise the update fails with `CON-1021`. Unlike the shared rule, a
            password or token sent as `"******"` is refused with `CON-1021`, on create and on
            update, and the stored secret is unchanged. An `api_key` header sent as `"******"`
            keeps that header's stored value under the same rule; on create it is refused.
          example:
            type: "api_key"
            properties:
              X-Tenant-Key: "<tenant_key>"
    HTTPConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/HTTPConnectionUpdateRequest'
        - type: object
          required: [ouId]
    HTTPConnectionResponse:
      type: object
      required: [ouId, id, name, type, url, timeoutMs, headers, authentication]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Risk Engine" }
        description: { type: string }
        ouId:
          type: string
          description: >-
            ID of the organization unit that owns the connection.
          example: "01900000-0000-7000-8000-000000000001"
        type: { type: string, enum: [http] }
        url: { type: string, example: "https://risk.example.com/evaluate" }
        timeoutMs: { type: integer, example: 10000 }
        headers:
          type: array
          items: { $ref: '#/components/schemas/HTTPConnectionHeader' }
        authentication: { $ref: '#/components/schemas/OutboundAuthentication' }
      example:
        id: "0199d1f4-6a1e-7c3b-9f2a-1b2c3d4e5f60"
        name: "Risk Engine"
        ouId: "01900000-0000-7000-8000-000000000001"
        type: "http"
        url: "https://risk.example.com/evaluate"
        timeoutMs: 5000
        headers:
          - name: "X-Tenant"
            value: "acme"
        authentication:
          type: "api_key"
          properties:
            X-Tenant-Key: "******"
    HTTPConnectionHeader:
      type: object
      required: [name, value]
      properties:
        name: { type: string, example: "X-Tenant" }
        value: { type: string, example: "acme" }

    TwilioConnectionUpdateRequest:
