name: '📚 Deploy Documentation to GitHub Pages'
description: 'Deploy documentation to GitHub Pages'
author: 'The ThunderID Authors'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: 'lts/*'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: 'latest'
  docs-artifact-name:
    description: 'Name of the artifact containing built docs (optional if docs need to be built)'
    required: false
    default: ''
  build-docs:
    description: 'Whether to build the docs from source'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for deployment'
    required: true
  commit-message:
    description: 'Commit message for the deployment'
    required: false
    default: '📚 Deploy documentation'
  site-url:
    description: 'Override the site URL used during the Docusaurus build (e.g. https://owner.github.io)'
    required: false
    default: ''
  site-base-url:
    description: 'Override the base URL used during the Docusaurus build (e.g. /repo-name/)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: ⚙️ Set up Node.js
      if: inputs.build-docs == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: 📦 Install pnpm
      if: inputs.build-docs == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false
        version: ${{ inputs.pnpm-version }}

    - name: 🛠️ Build Documentation
      if: inputs.build-docs == 'true'
      shell: bash
      run: |
        make build_docs
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DOCUSAURUS_URL: ${{ inputs.site-url }}
        DOCUSAURUS_BASE_URL: ${{ inputs.site-base-url }}

    - name: 📥 Download Docs Artifact
      if: inputs.docs-artifact-name != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.docs-artifact-name }}
        path: docs/build

    - name: 📋 Verify Build Output
      shell: bash
      run: |
        if [ ! -d "docs/build" ]; then
          echo "❌ Error: docs/build directory not found"
          exit 1
        fi
        echo "✅ Documentation build directory found"
        echo "📂 Contents:"
        ls -la docs/build

    - name: � Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./docs/build

    - name: 🔥 Deploy to GitHub Pages
      id: deploy-gh-pages
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
