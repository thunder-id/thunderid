openapi: 3.0.3

info:
  title: Flow Management API
  version: "1.0"
  description: |
    Flows in ThunderID are node-graph definitions that orchestrate authentication and registration sessions; use this API to create, version, and activate flow definitions that the execution engine steps through at runtime.
    
    Flows are defined using a **node-based graph representation** where each node represents 
    a specific action or interaction in the flow. Nodes are connected through explicit 
    references (actions, onSuccess, onFailure) to define the flow logic.
    
    ## Flow Types
    - **AUTHENTICATION**: User login flows
    - **REGISTRATION**: User registration/signup flows
    
    ## Node Types
    - **START**: Initial node indicating the starting point of the flow. Must be present in all flows.
    - **PROMPT**: Interactive UI node that displays components and collects user input.
      Contains optional UI metadata for rendering (verbose mode).
    - **TASK_EXECUTION**: Background executor node that performs server-side operations
      (authentication, authorization, provisioning, etc.). Uses onSuccess/onFailure for navigation.
      Can optionally have inputs for executors that need user input references.
    - **CALL**: Invokes another flow by reference. Requires a `flow.ref` pointing to the target
      flow handle and `onSuccess` for the return path.
    - **VARIABLES**: Declares the flow's variables in `inputs` and resolves them, showing nothing to the user.
    - **END**: Terminal node indicating the end of the flow.
    
    ## Variables
    A step can use a variable declared on a `VARIABLES` node as `{{var(identifier)}}` in the string values of its `properties`.
    A `VARIABLES` node needs an `OUResolverExecutor` step before it on every route, and resolves the values of the unit that step picks.

    ## Representation Modes
    - **Verbose Mode**: Includes full UI metadata (components, layouts, labels) for visual flow composer and runtime rendering
    - **Non-Verbose Mode**: Contains only logical flow structure without UI metadata
    
    ## Internationalization
    User-facing text (labels, placeholders, hints, button text, etc.) can be:
    - **i18n keys**: Use the format `{{ t(namespace:key) }}` (e.g., `{{ t(signin:heading.label) }}`)
    - **Plain text**: Any string without the `{{ t() }}` wrapper is treated as literal text
    
    The frontend resolves i18n keys from language-specific resource bundles based on the 
    namespace and key structure.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Flow Management
    description: CRUD operations for flow definitions.
  - name: Flow Versioning
    description: Operations for listing and activating flow versions.
  - name: Flow Sharing
    description: Share a flow with child organization units, and see what was shared.
  - name: Flow Variables
    description: Read and override the variables of a flow for an organization unit.

security:
  - OAuth2: [system]

paths:
  /flows:
    get:
      tags:
        - Flow Management
      summary: List all flows
      description: Retrieves a paginated list of all flow definitions
      operationId: listFlows
      parameters:
        - name: flowType
          in: query
          description: Filter by flow type
          required: false
          schema:
            type: string
            enum:
              - AUTHENTICATION
              - REGISTRATION
        - name: limit
          in: query
          description: Maximum number of flows to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: offset
          in: query
          description: Number of flows to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/FlowFilter'
      responses:
        '200':
          description: List of flows retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowListResponse'
              example:
                totalResults: 2
                startIndex: 1
                count: 2
                flows:
                  - id: 0193b0a1-1001-7000-8000-000000000042
                    handle: acme-login
                    name: Acme Login Flow
                    flowType: AUTHENTICATION
                    ouId: 0193b0a1-2001-7000-8000-000000000001
                    isOwnedByOU: false
                    isReadOnly: true
                    activeVersion: 2
                    createdAt: '2026-08-20T09:00:00Z'
                    updatedAt: '2026-09-30T16:05:42Z'
                  - id: 0193b0a1-1001-7000-8000-000000000077
                    handle: emea-registration
                    name: EMEA Registration Flow
                    flowType: REGISTRATION
                    ouId: 0193b0a1-2001-7000-8000-000000000002
                    isOwnedByOU: true
                    isReadOnly: false
                    activeVersion: 3
                    createdAt: '2026-09-02T08:15:00Z'
                    updatedAt: '2026-10-11T12:40:10Z'
                links: []
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1006"
                message:
                  key: "error.flowmgtservice.invalid_limit_parameter"
                  defaultValue: "Invalid pagination parameter"
                description:
                  key: "error.flowmgtservice.invalid_limit_parameter_description"
                  defaultValue: "The limit parameter must be a positive integer"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Flow Management
      summary: Create a new flow
      description: |
        Creates a new flow definition
      operationId: createFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowDefinitionCreateRequest'
            examples:
              acmeLogin:
                summary: A login flow in the parent organization unit, with variables
                value:
                  handle: acme-login
                  name: Acme Login Flow
                  flowType: AUTHENTICATION
                  ouId: 0193b0a1-2001-7000-8000-000000000001
                  nodes:
                    - id: start
                      type: START
                      onSuccess: resolve_ou
                    - id: resolve_ou
                      type: TASK_EXECUTION
                      executor:
                        name: OUResolverExecutor
                      properties:
                        resolveFrom: prompt
                        parentOuId: 0193b0a1-2001-7000-8000-000000000001
                      onSuccess: resolve_variables
                    - id: resolve_variables
                      type: VARIABLES
                      inputs:
                        - identifier: supportEmail
                          type: EMAIL_INPUT
                          label: Support email
                          description: Shown to users who cannot sign in
                          defaultValue: support@example.com
                        - identifier: otpValiditySeconds
                          type: NUMBER_INPUT
                          label: OTP validity in seconds
                          defaultValue: 120
                          min: 30
                          max: 600
                        - identifier: mfaMode
                          type: SELECT
                          label: Second factor
                          options:
                            - NONE
                            - SMS_OTP
                            - EMAIL_OTP
                          defaultValue: NONE
                        - identifier: showRegistrationLink
                          type: BOOLEAN_INPUT
                          label: Show the sign-up link
                          defaultValue: true
                        - identifier: socialLogin
                          type: CONNECTION_SELECT
                          label: Social sign-in provider
                          category: IDENTITY_PROVIDER
                          connectionTypes:
                            - google
                            - github
                          defaultValue: 019e201d-5634-7533-a971-538b66914721
                      onSuccess: prompt_credentials
                    - id: prompt_credentials
                      type: PROMPT
                      meta:
                        components:
                          - type: TEXT
                            id: heading
                            label: Sign in
                            variant: HEADING_1
                          - type: TEXT
                            id: help
                            label: Trouble signing in? Write to {{var(supportEmail)}}
                            variant: BODY_1
                      prompts:
                        - inputs:
                            - ref: input_username
                              identifier: username
                              type: TEXT_INPUT
                              required: true
                            - ref: input_password
                              identifier: password
                              type: PASSWORD_INPUT
                              required: true
                          action:
                            ref: action_signin
                            nextNode: basic_auth
                    - id: basic_auth
                      type: TASK_EXECUTION
                      executor:
                        name: CredentialsAuthExecutor
                      onSuccess: send_otp
                      onFailure: prompt_credentials
                    - id: send_otp
                      type: TASK_EXECUTION
                      properties:
                        validitySeconds: '{{var(otpValiditySeconds)}}'
                        channel: '{{var(mfaMode)}}'
                      executor:
                        name: SMSOTPAuthExecutor
                      onSuccess: end
                    - id: end
                      type: END
      responses:
        '201':
          description: Flow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDefinitionResponse'
        '400':
          description: Invalid flow definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1001"
                message:
                  key: "error.flowmgtservice.invalid_request_format"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.flowmgtservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed or contains invalid data"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flows/{flowId}:
    get:
      tags:
        - Flow Management
      summary: Get flow by ID
      description: Retrieves a specific flow definition by its unique identifier
      operationId: getFlow
      parameters:
        - name: flowId
          in: path
          required: true
          description: Unique identifier of the flow
          schema:
            type: string
        - name: ouId
          in: query
          required: false
          description: The organization unit to see the flow as. A flow it owns comes back whole, one shared with it comes back as its variables only. Leave it out for the whole definition.
          schema:
            type: string
          example: 0193b0a1-2001-7000-8000-000000000002
      responses:
        '200':
          description: Flow retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FlowDefinitionResponse'
                  - $ref: '#/components/schemas/SharedFlowResponse'
              examples:
                owned:
                  summary: A flow the requested organization unit owns (the whole definition)
                  value:
                    id: 0193b0a1-1001-7000-8000-000000000042
                    handle: acme-login
                    name: Acme Login Flow
                    flowType: AUTHENTICATION
                    ouId: 0193b0a1-2001-7000-8000-000000000001
                    isOwnedByOU: true
                    isReadOnly: false
                    activeVersion: 3
                    createdAt: '2026-09-02T08:15:00Z'
                    updatedAt: '2026-10-11T12:40:10Z'
                    nodes:
                      - id: start
                        type: START
                        onSuccess: resolve_ou
                      - id: resolve_ou
                        type: TASK_EXECUTION
                        executor:
                          name: OUResolverExecutor
                        properties:
                          resolveFrom: prompt
                          parentOuId: 0193b0a1-2001-7000-8000-000000000001
                        onSuccess: resolve_variables
                      - id: resolve_variables
                        type: VARIABLES
                        inputs:
                          - identifier: supportEmail
                            type: EMAIL_INPUT
                            label: Support email
                            description: Shown to users who cannot sign in
                            defaultValue: support@example.com
                          - identifier: mfaMode
                            type: SELECT
                            label: Second factor
                            options:
                              - NONE
                              - SMS_OTP
                              - EMAIL_OTP
                            defaultValue: NONE
                        onSuccess: prompt_credentials
                      - id: prompt_credentials
                        type: PROMPT
                        meta:
                          components:
                            - type: TEXT
                              id: help
                              label: Trouble signing in? Write to {{var(supportEmail)}}
                              variant: BODY_1
                        prompts:
                          - inputs:
                              - ref: input_username
                                identifier: username
                                type: TEXT_INPUT
                                required: true
                              - ref: input_password
                                identifier: password
                                type: PASSWORD_INPUT
                                required: true
                            action:
                              ref: action_signin
                              nextNode: basic_auth
                      - id: basic_auth
                        type: TASK_EXECUTION
                        executor:
                          name: CredentialsAuthExecutor
                        onSuccess: end
                        onFailure: prompt_credentials
                      - id: end
                        type: END
                shared:
                  summary: A flow shared with the requested organization unit (the variables only)
                  value:
                    id: 0193b0a1-1001-7000-8000-000000000042
                    handle: acme-login
                    name: Acme Login Flow
                    flowType: AUTHENTICATION
                    ouId: 0193b0a1-2001-7000-8000-000000000001
                    isOwnedByOU: false
                    isReadOnly: true
                    variables:
                      - identifier: supportEmail
                        type: EMAIL_INPUT
                        label: Support email
                        description: Shown to users who cannot sign in
                        defaultValue: support@example.com
                      - identifier: mfaMode
                        type: SELECT
                        label: Second factor
                        options:
                          - SMS_OTP
                          - EMAIL_OTP
                        defaultValue: EMAIL_OTP
        '404':
          description: Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1003"
                message:
                  key: "error.flowmgtservice.flow_not_found"
                  defaultValue: "Flow not found"
                description:
                  key: "error.flowmgtservice.flow_not_found_description"
                  defaultValue: "The flow with the specified ID does not exist"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Flow Management
      summary: Update flow
      description: |
        Updates an existing flow definition by its unique identifier
      operationId: updateFlow
      parameters:
        - name: flowId
          in: path
          required: true
          description: Unique identifier of the flow to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowDefinitionUpdateRequest'
      responses:
        '200':
          description: Flow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDefinitionResponse'
        '400':
          description: Invalid flow definition or update not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1001"
                message:
                  key: "error.flowmgtservice.invalid_request_format"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.flowmgtservice.invalid_request_format_description"
                  defaultValue: "The request body is malformed or contains invalid data"
        '404':
          description: Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1003"
                message:
                  key: "error.flowmgtservice.flow_not_found"
                  defaultValue: "Flow not found"
                description:
                  key: "error.flowmgtservice.flow_not_found_description"
                  defaultValue: "The flow with the specified ID does not exist"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller does not act for the organization unit that owns the flow, as is the case for a flow that was only shared with it, so it cannot be changed (FLM-1039)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FLM-1039
                message:
                  key: error.flowmgtservice.shared_flow_read_only
                  defaultValue: Shared flow cannot be modified
                description:
                  key: error.flowmgtservice.shared_flow_read_only_description
                  defaultValue: The flow is owned by another organization unit and can only be configured through its variables
        '409':
          description: The new definition breaks a sharing policy of a variable it keeps (FLM-1041) or invalidates a value an organization unit saved (FLM-1042)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sharing-policy:
                  summary: A variable that is kept no longer fits a sharing policy
                  value:
                    code: FLM-1041
                    message:
                      key: error.flowmgtservice.flow_conflicts_with_sharing_policy
                      defaultValue: Flow conflicts with a sharing policy
                    description:
                      key: error.flowmgtservice.flow_conflicts_with_sharing_policy_description
                      defaultValue: The change breaks a sharing policy of the flow. Update or delete the policy first
                saved-values:
                  summary: A value an organization unit saved is no longer valid
                  value:
                    code: FLM-1042
                    message:
                      key: error.flowmgtservice.flow_conflicts_with_saved_values
                      defaultValue: Flow conflicts with saved values
                    description:
                      key: error.flowmgtservice.flow_conflicts_with_saved_values_description
                      defaultValue: The change invalidates values that organization units saved for the variables. Ask them to change those values, or update or delete the sharing policy that reaches them, first
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Flow Management
      summary: Delete flow
      description: Deletes an existing flow definition by its unique identifier
      operationId: deleteFlow
      parameters:
        - name: flowId
          in: path
          required: true
          description: Unique identifier of the flow to delete
          schema:
            type: string
        - $ref: '#/components/parameters/OptionalOuId'
      responses:
        '204':
          description: Flow deleted successfully
        '400':
          description: Bad request — missing/invalid flow ID or attempting to delete a declarative (read-only) flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-id:
                  summary: Flow ID not provided
                  value:
                    code: "FLM-1002"
                    message:
                      key: "error.flowmgtservice.invalid_flow_id"
                      defaultValue: "Invalid flow ID"
                    description:
                      key: "error.flowmgtservice.invalid_flow_id_description"
                      defaultValue: "The flow ID must be provided"
                immutable-flow:
                  summary: Declarative flow cannot be deleted
                  value:
                    code: "FLM-1017"
                    message:
                      key: "error.flowmgtservice.flow_is_immutable"
                      defaultValue: "Flow is immutable"
                    description:
                      key: "error.flowmgtservice.flow_is_immutable_description"
                      defaultValue: "Declarative flows cannot be modified or deleted"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller may not delete the flow. With `ouId` naming an organization unit the flow was only shared with, FLM-1039.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flow not found (FLM-1003), or with `ouId`, not owned by that organization unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flows/{flowId}/versions:
    get:
      tags:
        - Flow Versioning
      summary: Get flow version history
      description: |
        Retrieves the complete version history of a specific flow.
      operationId: getFlowVersions
      parameters:
        - name: flowId
          in: path
          required: true
          description: Unique identifier of the flow
          schema:
            type: string
        - $ref: '#/components/parameters/OptionalOuId'
      responses:
        '200':
          description: Flow version history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowVersionListResponse'
        '404':
          description: Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1003"
                message:
                  key: "error.flowmgtservice.flow_not_found"
                  defaultValue: "Flow not found"
                description:
                  key: "error.flowmgtservice.flow_not_found_description"
                  defaultValue: "The flow with the specified ID does not exist"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flows/{flowId}/usages:
    get:
      tags:
        - Flow Management
      summary: Get flow usages
      description: |
        Returns the resources that reference this flow (through its authentication,
        registration, or recovery flow slots), aggregated across all resource types.
        This endpoint is informational only — it drives the pre-delete confirmation
        dialog in the UI and does not gate deletion on the server.

        When usage data is unavailable (e.g. the server has not fully initialised),
        `totalResults` and `summary` are `null` rather than `0`/empty.
        Consumers must treat `null` as "unknown" and `0` as "confirmed empty".
      operationId: getFlowUsages
      parameters:
        - name: flowId
          in: path
          required: true
          description: Unique identifier of the flow
          schema:
            type: string
        - $ref: '#/components/parameters/OptionalOuId'
      responses:
        '200':
          description: Resources that reference this flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUsagesResponse'
              example:
                totalResults: 2
                count: 2
                summary:
                  application: 1
                  agent: 1
                usages:
                  - resourceType: application
                    id: "a1b2c3d4-0000-0000-0000-000000000001"
                    displayName: "Customer Portal"
                    behaviorOnDelete: fallback
                  - resourceType: agent
                    id: "a1b2c3d4-0000-0000-0000-000000000002"
                    displayName: "Support Agent"
                    behaviorOnDelete: fallback
        '404':
          description: Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1003"
                message:
                  key: "error.flowmgtservice.flow_not_found"
                  defaultValue: "Flow not found"
                description:
                  key: "error.flowmgtservice.flow_not_found_description"
                  defaultValue: "The flow with the specified ID does not exist"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flows/{flowId}/versions/{version}:
    get:
      tags:
        - Flow Versioning
      summary: Get specific flow version
      description: Retrieves a specific version of a flow by version number
      operationId: getFlowVersion
      parameters:
        - name: flowId
          in: path
          required: true
          description: Unique identifier of the flow
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: Version number to retrieve
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/OptionalOuId'
      responses:
        '200':
          description: Flow version retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowVersionResponse'
        '404':
          description: Flow or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1008"
                message:
                  key: "error.flowmgtservice.flow_version_not_found"
                  defaultValue: "Flow version not found"
                description:
                  key: "error.flowmgtservice.flow_version_not_found_description"
                  defaultValue: "The requested flow version does not exist"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flows/{flowId}/restore:
    post:
      tags:
        - Flow Versioning
      summary: Restore flow to a previous version
      description: |
        Restores a flow to a specific previous version. This creates a new version 
        with the content from the specified version.
      operationId: restoreFlowVersion
      parameters:
        - name: flowId
          in: path
          required: true
          description: Unique identifier of the flow
          schema:
            type: string
        - $ref: '#/components/parameters/OptionalOuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreVersionRequest'
      responses:
        '200':
          description: Flow restored successfully — returns the updated flow definition with the new active version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDefinitionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1009"
                message:
                  key: "error.flowmgtservice.invalid_flow_version"
                  defaultValue: "Invalid flow version"
                description:
                  key: "error.flowmgtservice.invalid_flow_version_description"
                  defaultValue: "The specified flow version is invalid"
        '404':
          description: Flow or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "FLM-1008"
                message:
                  key: "error.flowmgtservice.flow_version_not_found"
                  defaultValue: "Flow version not found"
                description:
                  key: "error.flowmgtservice.flow_version_not_found_description"
                  defaultValue: "The requested flow version does not exist"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The version breaks a sharing policy of a variable it keeps (FLM-1041) or invalidates a value an organization unit saved (FLM-1042)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sharing-policy:
                  summary: A variable that is kept no longer fits a sharing policy
                  value:
                    code: FLM-1041
                    message:
                      key: error.flowmgtservice.flow_conflicts_with_sharing_policy
                      defaultValue: Flow conflicts with a sharing policy
                    description:
                      key: error.flowmgtservice.flow_conflicts_with_sharing_policy_description
                      defaultValue: The change breaks a sharing policy of the flow. Update or delete the policy first
                saved-values:
                  summary: A value an organization unit saved is no longer valid
                  value:
                    code: FLM-1042
                    message:
                      key: error.flowmgtservice.flow_conflicts_with_saved_values
                      defaultValue: Flow conflicts with saved values
                    description:
                      key: error.flowmgtservice.flow_conflicts_with_saved_values_description
                      defaultValue: The change invalidates values that organization units saved for the variables. Ask them to change those values, or update or delete the sharing policy that reaches them, first
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flows/{flowId}/sharing-policies:
    parameters:
      - $ref: '#/components/parameters/FlowId'
    post:
      tags:
        - Flow Sharing
      summary: Share a flow with child organization units
      operationId: createFlowSharingPolicy
      description: 'Records how the flow is shared: the organization units it reaches and, per variable (`variables.<identifier>`), the terms each holds it on. There is one policy per flow per initiating organization unit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingPolicyRequest'
            examples:
              allChildren:
                summary: Every unit beneath the owner, on common terms
                value:
                  childUnits:
                    mode: all
                    excludedOuIds:
                      - 0193b0a1-2001-7000-8000-0000000000ff
                    overlayRules:
                      variables.supportEmail:
                        editable: true
                      variables.otpValiditySeconds:
                        editable: true
                        allowedValues:
                          - '60'
                          - '120'
                          - '300'
                      variables.mfaMode:
                        editable: false
                        value:
                          - SMS_OTP
                      variables.showRegistrationLink:
                        editable: true
                        value:
                          - 'false'
                      variables.socialLogin:
                        editable: true
                        allowedValues:
                          - 019e201d-5634-7533-a971-538b66914721
                          - 019e3a5e-2ff3-7bfb-ae19-27aada871b80
              selectedChild:
                summary: One child, on its own terms, free to pass the flow on
                value:
                  childUnits:
                    mode: selected
                    units:
                      - ouId: 0193b0a1-2001-7000-8000-000000000002
                        reach: unit
                        overlayRules:
                          variables.supportEmail:
                            editable: true
                          variables.mfaMode:
                            editable: false
                            value:
                              - SMS_OTP
              reshare:
                summary: A child that received the flow passes it to one of its own children, narrowing it
                value:
                  initiatingOuId: 0193b0a1-2001-7000-8000-000000000002
                  childUnits:
                    mode: selected
                    units:
                      - ouId: 0193b0a1-2001-7000-8000-000000000011
                        reach: subtree
                        overlayRules:
                          variables.otpValiditySeconds:
                            editable: false
                            value:
                              - '60'
      responses:
        '201':
          description: Sharing policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        '400':
          description: 'Invalid policy (FLM-1034), or a policy reaching every unit or every other tree, which only a resource file or an import may create (FLM-1043).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Flow not found (FLM-1003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The issuing organization unit already has a policy for this flow (FLM-1031). Edit it instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Flow Sharing
      summary: List how a flow is shared
      operationId: listFlowSharingPolicies
      description: 'Lists the flow''s sharing policies, for the owner and for a unit that re-shared it. A unit the flow was shared with reads its own terms from `GET /flows/{flowId}/overlay-rules`.'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicyListResponse'
        '400':
          description: The limit or offset is invalid (FLM-1006, FLM-1007)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Flow not found (FLM-1003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flows/{flowId}/sharing-policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/FlowId'
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags:
        - Flow Sharing
      summary: Get a sharing policy of a flow
      operationId: getFlowSharingPolicy
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Flow or policy not found (FLM-1003, FLM-1030)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Flow Sharing
      summary: Replace a sharing policy of a flow
      operationId: updateFlowSharingPolicy
      description: 'Replaces the policy''s sections, with the `version` the caller read, and refuses any other version. A unit the policy no longer reaches loses the flow and the values it held.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingPolicyUpdateRequest'
      responses:
        '200':
          description: The updated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
        '400':
          description: Invalid policy (FLM-1034)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Flow or policy not found (FLM-1003, FLM-1030)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The policy changed since it was read (FLM-1032)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Flow Sharing
      summary: Remove a sharing policy of a flow
      operationId: deleteFlowSharingPolicy
      description: 'Removes the policy and what depended on it, including policies issued by units it reached. Deleting a policy that is already gone succeeds.'
      responses:
        '204':
          description: Policy removed
        '400':
          description: The policy is declared in a resource file and cannot be removed here (FLM-1033)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /flows/{flowId}/overlay-rules:
    parameters:
      - $ref: '#/components/parameters/FlowId'
    get:
      tags:
        - Flow Sharing
      summary: See what was shared with an organization unit
      operationId: getFlowOverlayRules
      description: 'Returns, for the organization unit in `ouId`, whether it owns or can see the flow and the effective rule for each variable. It is the same `ResolvedOverlay` answer as `GET /applications/{id}/overlay-rules`, and a unit no policy reaches gets `404`.'
      parameters:
        - name: ouId
          in: query
          required: true
          description: The organization unit to resolve for.
          schema:
            type: string
          example: 0193b0a1-2001-7000-8000-000000000002
      responses:
        '200':
          description: The resolved overlay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedOverlay'
              examples:
                shared:
                  summary: An organization unit the flow was shared with
                  value:
                    ouId: 0193b0a1-2001-7000-8000-000000000002
                    owned: false
                    visible: true
                    policyIds:
                      - 0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10
                    rules:
                      variables.supportEmail:
                        editable: true
                      variables.otpValiditySeconds:
                        editable: true
                        allowedValues:
                          - '60'
                          - '120'
                          - '300'
                      variables.mfaMode:
                        editable: false
                        value:
                          - SMS_OTP
                owner:
                  summary: The organization unit that owns the flow
                  value:
                    ouId: 0193b0a1-2001-7000-8000-000000000001
                    owned: true
                    visible: true
                    policyIds: []
                    rules: {}
        '400':
          description: The `ouId` is missing (FLM-1038)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The flow does not exist, or no policy reaches the organization unit. The two answer alike (FLM-1003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flows/{flowId}/variables:
    parameters:
      - $ref: '#/components/parameters/FlowId'
    get:
      tags:
        - Flow Variables
      summary: Get the variables of a flow for an organization unit
      operationId: getFlowVariables
      parameters:
        - $ref: '#/components/parameters/OuId'
      description: 'Returns the values the organization unit in `ouId` has set for the flow''s variables, in the shape `PUT` takes. The value in force is this override, or else the `defaultValue` from `GET /flows/{flowId}`.'
      responses:
        '200':
          description: The flow's variables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesResponse'
        '400':
          description: The `ouId` is missing (FLM-1038)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The flow does not exist, or is neither owned by nor shared with the organization unit. The two answer alike (FLM-1003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Flow Variables
      summary: Override the variables of a flow for an organization unit
      operationId: setFlowVariables
      description: 'Sets the values the organization unit named in the `ouId` of the body holds for the flow''s variables, replacing what it held, so a variable left out returns to its default. Every value is validated before any is written (FLM-1035, FLM-1036, FLM-1037), and a connection must be one the unit owns or was shared.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetVariablesRequest'
      responses:
        '200':
          description: The flow's variables after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesResponse'
        '400':
          description: The `ouId` is missing (FLM-1038), a variable the flow does not declare, or that no policy names for the unit (FLM-1035), or a value that is not valid (FLM-1036)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FLM-1036
                message:
                  key: error.flowmgtservice.invalid_variable_value
                  defaultValue: Invalid variable value
                description:
                  key: error.flowmgtservice.invalid_variable_value_description
                  defaultValue: The value of 'otpValiditySeconds' is not among the values the flow's owner allows
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The organization unit may not set the variable (FLM-1037)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The flow does not exist, or is neither owned by nor shared with the organization unit. The two answer alike (FLM-1003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs

  parameters:
    FlowId:
      name: flowId
      in: path
      required: true
      description: Unique identifier of the flow
      schema:
        type: string
      example: 0193b0a1-1001-7000-8000-000000000042
    PolicyId:
      name: policyId
      in: path
      required: true
      description: Unique identifier of the sharing policy
      schema:
        type: string
      example: 0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10
    OuId:
      name: ouId
      in: query
      required: true
      description: The organization unit to act for. It decides how the flow is seen (owned or shared) and whose values are read or written.
      schema:
        type: string
      example: 0193b0a1-2001-7000-8000-000000000002
    FlowFilter:
      name: filter
      in: query
      required: false
      description: 'Filter flows by organization unit with `ouId eq "<id>"`, the only supported expression. A list shows the flows the unit owns, then the flows shared with it.'
      schema:
        type: string
      examples:
        organization-unit:
          summary: Flows owned by or shared with an organization unit
          value: 'ouId eq "0193b0a1-2001-7000-8000-000000000002"'
    OptionalOuId:
      name: ouId
      in: query
      required: false
      description: The organization unit the call is made for. When given, only the organization unit that owns the flow may read its definition and change it. Leave it out for a call that is not made for an organization unit.
      schema:
        type: string
      example: 0193b0a1-2001-7000-8000-000000000001
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "AUTH-4010"
            message:
              key: "error.unauthorized"
              defaultValue: "Unauthorized"
            description:
              key: "error.unauthorized_description"
              defaultValue: "Authentication is required to access this resource"
    Forbidden:
      description: Forbidden - insufficient permissions to perform this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "AUTH-4030"
            message:
              key: "error.forbidden"
              defaultValue: "Forbidden"
            description:
              key: "error.forbidden_description"
              defaultValue: "You do not have sufficient permissions to access this resource"

  schemas:
    ResourceUsage:
      type: object
      description: A single resource that references the target resource.
      required:
        - resourceType
        - id
        - displayName
        - behaviorOnDelete
      properties:
        resourceType:
          type: string
          description: Type of the referencing resource.
          enum: [application, agent]
          example: application
        id:
          type: string
          format: uuid
          description: Identifier of the referencing resource.
          example: "a1b2c3d4-0000-0000-0000-000000000001"
        displayName:
          type: string
          description: Human-readable name of the referencing resource.
          example: "Customer Portal"
        behaviorOnDelete:
          type: string
          description: |
            What happens to this resource when the target resource is deleted.
            - `fallback`: the reference is kept and resolved to the system default at read time.
            - `cascade`: the resource is permanently deleted.
          enum: [fallback, cascade]
          example: fallback

    ResourceUsagesSummary:
      type: object
      nullable: true
      description: |
        Per-resource-type count of usages, keyed by resource type
        (e.g. `application`, `agent`). Null when the counts could not be determined.
      additionalProperties:
        type: integer
      example:
        application: 1
        agent: 1

    ResourceUsagesResponse:
      type: object
      description: |
        Resources that reference a target resource, aggregated across all resource types.
        Drives pre-delete confirmation dialogs; informational only.
      properties:
        totalResults:
          type: integer
          nullable: true
          description: |
            Total number of resources that reference the target resource.
            Null when usage data is unavailable; 0 means confirmed empty.
          example: 2
        count:
          type: integer
          description: Number of results returned.
          example: 2
        summary:
          $ref: '#/components/schemas/ResourceUsagesSummary'
        usages:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUsage'

    FlowListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 5
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 3
        flows:
          type: array
          items:
            $ref: '#/components/schemas/BasicFlowDefinitionResponse'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: "Navigation links for pagination."
      example:
        totalResults: 5
        startIndex: 1
        count: 3
        flows:
          - id: "641af221-75ff-4247-ab1f-ff139040a91b"
            flowType: "AUTHENTICATION"
            name: "Basic Authentication Flow"
            handle: "default-flow"
            activeVersion: 2
            isReadOnly: true
            ouId: "01900000-0000-7000-8000-000000000001"
            createdAt: "2024-01-15T10:20:30Z"
            updatedAt: "2024-02-20T14:25:35Z"
          - id: "2sd4f6g7-h8i9-0j1k-2l3m-4n5o6p7q8r9s"
            flowType: "REGISTRATION"
            name: "Basic Registration Flow"
            handle: "basic-registration-flow"
            activeVersion: 7
            isReadOnly: false
            ouId: "01900000-0000-7000-8000-000000000001"
            createdAt: "2024-03-10T09:15:25Z"
            updatedAt: "2024-04-12T11:30:40Z"
          - id: "b12c3d45-6789-4e0f-9abc-def123456789"
            flowType: "REGISTRATION"
            name: "Google Registration Flow"
            handle: "google-registration-flow"
            activeVersion: 1
            isReadOnly: false
            ouId: "01900000-0000-7000-8000-000000000001"
            createdAt: "2024-05-05T08:10:20Z"
            updatedAt: "2024-06-01T12:00:00Z"
        links:
          - href: "/flows?offset=3&limit=3"
            rel: "next"
      description: One page of the flows the requested organization unit owns or has been shared.

    FlowVersionListResponse:
      type: object
      properties:
        totalVersions:
          type: integer
          description: Total number of versions available for this flow
          example: 8
        versions:
          type: array
          items:
            $ref: '#/components/schemas/FlowVersionInfo'
          description: List of flow versions (most recent first)
      example:
        totalVersions: 8
        versions:
          - version: 8
            createdAt: "2024-12-01T15:30:00Z"
            isActive: true
          - version: 7
            createdAt: "2024-11-25T10:15:00Z"
            isActive: false
          - version: 6
            createdAt: "2024-11-20T14:20:00Z"
            isActive: false

    FlowVersionInfo:
      type: object
      required:
        - version
        - createdAt
        - isActive
      properties:
        version:
          type: integer
          description: Version number
          example: 5
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this specific version was created
        isActive:
          type: boolean
          description: Indicates if this is the currently active version
          example: false

    RestoreVersionRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Version number to restore to
          minimum: 1
          example: 5
      example:
        version: 5

    Link:
      type: object
      required:
        - href
        - rel
      properties:
        href:
          type: string
          description: The URI of the link
          example: "/flows?offset=1&limit=30"
        rel:
          type: string
          description: The link relation type (first, next, previous, last)
          example: "next"
    
    BasicFlowDefinitionResponse:
      type: object
      required:
        - id
        - flowType
        - name
        - handle
        - activeVersion
        - isReadOnly
        - ouId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier for the flow
        flowType:
          type: string
          enum:
            - AUTHENTICATION
            - REGISTRATION
        name:
          type: string
          description: Name of the flow
          example: "Basic Authentication Flow"
        handle:
          type: string
          description: |
            URL-friendly handle for the flow (lowercase letters, numbers, hyphens, and underscores only)
            Once set, the handle cannot be changed.
          pattern: '^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$'
          example: "default-flow"
        activeVersion:
          type: integer
          description: The version number that is currently active
          example: 5
        isReadOnly:
          type: boolean
          description: Whether this flow is immutable (declarative resource — cannot be modified or deleted)
          example: false
        isOwnedByOU:
          type: boolean
          description: With an `ouId` filter or query parameter, whether that organization unit owns the flow. `false` means it was shared with it. An unfiltered list says `true`.
        ouId:
          type: string
          description: |
            ID of the organization unit that owns the flow.
          example: "01900000-0000-7000-8000-000000000001"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the flow was initially created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the flow was last modified
      description: 'A flow in a listing. A flow shared with the requested organization unit is listed as one it owns is, with `isOwnedByOU` false and `isReadOnly` true.'

    FlowDefinitionUpdateRequest:
      type: object
      required:
        - name
        - flowType
        - handle
        - nodes
      properties:
        name:
          type: string
          description: Name of the flow
          example: "Basic Authentication Flow"
        handle:
          type: string
          description: |
            URL-friendly handle for the flow (lowercase letters, numbers, hyphens, and underscores only)
            Once set, the handle cannot be changed.
          pattern: '^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$'
          example: "default-flow"
        flowType:
          type: string
          enum:
            - AUTHENTICATION
            - REGISTRATION
          description: |
            Type of flow
          example: AUTHENTICATION
        nodes:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Node'
          description: List of nodes that define the flow graph
        ouId:
          type: string
          description: |
            ID of the organization unit that owns the flow. Required on create, and the organization unit has to
            exist. It cannot change afterwards: an update can leave it out to keep the current owner, or send the id
            the flow already has.
          example: "01900000-0000-7000-8000-000000000001"
      example:
        name: Basic Authentication Flow
        handle: default-flow
        flowType: AUTHENTICATION
        ouId: "01900000-0000-7000-8000-000000000001"
        nodes: &authFlowNodes
          - id: node_000
            type: START
            layout:
              size:
                width: 180
                height: 80
              position:
                x: 50
                y: 50
            onSuccess: node_001
          - id: node_001
            type: PROMPT
            layout:
              size:
                width: 320
                height: 450
              position:
                x: 50
                y: 180
            meta:
              components:
                - type: TEXT
                  id: text_001
                  label: "{{ t(signin:heading.label) }}"
                  variant: HEADING_01
                - type: BLOCK
                  id: block_001
                  components:
                    - type: TEXT_INPUT
                      id: input_001
                      label: "{{ t(signin:fields.username.label) }}"
                      required: true
                      placeholder: "{{ t(signin:fields.username.placeholder) }}"
                    - type: PASSWORD_INPUT
                      id: input_002
                      label: "{{ t(signin:fields.password.label) }}"
                      required: true
                      placeholder: "{{ t(signin:fields.password.placeholder) }}"
                    - type: ACTION
                      id: action_001
                      label: "{{ t(signin:buttons.submit) }}"
                - type: DIVIDER
                  id: divider_001
                  label: "{{ t(signin:divider.or.label) }}"
                - type: ACTION
                  id: action_002
                  label: "{{ t(signin:buttons.continue.with.sms.otp.label) }}"
            prompts:
              - inputs:
                  - ref: input_001
                    type: TEXT_INPUT
                    identifier: username
                    required: true
                  - ref: input_002
                    type: PASSWORD_INPUT
                    identifier: password
                    required: true
                action:
                  ref: action_001
                  nextNode: node_004
              - action:
                  ref: action_002
                  nextNode: node_002
          - id: node_002
            type: TASK_EXECUTION
            layout:
              size:
                width: 200
                height: 120
              position:
                x: 450
                y: 300
            executor:
              name: SendSMSExecutor
            properties:
              senderId: "<SENDER_ID>"
            onSuccess: node_003
            onFailure: node_007
          - id: node_003
            type: PROMPT
            layout:
              size:
                width: 320
                height: 380
              position:
                x: 700
                y: 280
            meta:
              components:
                - type: HEADING
                  id: heading_003
                  label: "{{ t(sms.otp:verify.heading) }}"
                - type: TEXT
                  id: text_003
                  label: "{{ t(sms.otp:verify.heading.label) }}"
                  variant: HEADING_01
                - type: OTP_INPUT
                  id: otp_001
                  label: "{{ t(sms.otp:verify.otp.input.label) }}"
                  length: 6
                  required: true
                - type: ACTION
                  id: action_003
                  label: "{{ t(sms.otp:verify.buttons.submit) }}"
                - type: ACTION
                  id: action_004
                  label: "{{ t(sms.otp:verify.buttons.resend) }}"
            prompts:
              - inputs:
                  - ref: otp_001
                    type: OTP_INPUT
                    identifier: otp
                    required: true
                action:
                  ref: action_003
                  nextNode: node_005
              - action:
                  ref: action_004
                  nextNode: node_002
          - id: node_004
            type: TASK_EXECUTION
            layout:
              size:
                width: 200
                height: 140
              position:
                x: 450
                y: 100
            executor:
              name: CredentialsAuthExecutor
              inputs:
                - ref: input_001
                  identifier: username
                  type: TEXT_INPUT
                  required: true
                - ref: input_002
                  identifier: password
                  type: PASSWORD_INPUT
                  required: true
            onSuccess: node_008
          - id: node_005
            type: TASK_EXECUTION
            layout:
              size:
                width: 200
                height: 140
              position:
                x: 1100
                y: 320
            executor:
              name: VerifyOTPExecutor
              inputs:
                - ref: otp_001
                  identifier: otp
                  type: OTP_INPUT
                  required: true
            properties:
              senderId: "<SENDER_ID>"
            onSuccess: node_008
          - id: node_007
            type: PROMPT
            layout:
              size:
                width: 300
                height: 280
              position:
                x: 450
                y: 480
            meta:
              components:
                - type: HEADING
                  id: heading_007
                  label: "{{ t(sms.otp:error.heading) }}"
                - type: TEXT
                  id: text_007
                  label: "{{ t(sms.otp:error.message) }}"
                - type: ACTION
                  id: action_007
                  label: "{{ t(sms.otp:error.buttons.retry) }}"
            prompts:
              - action:
                  ref: action_007
                  nextNode: node_002
          - id: node_008
            type: END
            layout:
              size:
                width: 180
                height: 80
              position:
                x: 1400
                y: 200

    FlowDefinitionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/FlowDefinitionUpdateRequest'
        - type: object
          required:
            - ouId
      example:
        name: Basic Authentication Flow
        handle: default-flow
        flowType: AUTHENTICATION
        ouId: "01900000-0000-7000-8000-000000000001"
        nodes: *authFlowNodes

    FlowDefinitionResponse:
      type: object
      required:
        - id
        - name
        - flowType
        - handle
        - activeVersion
        - isReadOnly
        - ouId
        - nodes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier for the flow
          example: a23b45c6-d7e8-90f1-2345-6789abcdef01
        name:
          type: string
          description: Name of the flow
          example: "Basic Authentication Flow"
        flowType:
          type: string
          enum:
            - AUTHENTICATION
            - REGISTRATION
          description: |
            Type of flow
          example: AUTHENTICATION
        handle:
          type: string
          description: |
            URL-friendly handle for the flow (lowercase letters, numbers, hyphens, and underscores only)
            Once set, the handle cannot be changed.
          pattern: '^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$'
          example: "default-flow"
        activeVersion:
          type: integer
          description: The version number that is currently active
          example: 5
        isReadOnly:
          type: boolean
          description: Whether this flow is immutable (declarative resource — cannot be modified or deleted)
          example: false
        isOwnedByOU:
          type: boolean
          enum:
            - true
          description: With `ouId` in the request, always `true`, as the organization unit owns the flow.
        ouId:
          type: string
          description: |
            ID of the organization unit that owns the flow.
          example: "01900000-0000-7000-8000-000000000001"
        nodes:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Node'
          description: List of nodes that define the flow graph
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the flow was initially created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the flow was last modified
      example:
        id: a23b45c6-d7e8-90f1-2345-6789abcdef01
        name: Basic Authentication Flow
        flowType: AUTHENTICATION
        handle: default-flow
        activeVersion: 5
        isReadOnly: false
        ouId: "01900000-0000-7000-8000-000000000001"
        nodes: *authFlowNodes
        createdAt: "2024-06-15T10:20:30Z"
        updatedAt: "2024-06-20T14:25:35Z"
      description: 'A flow as the organization unit that owns it sees it: the whole definition, the variables included.'

    FlowVersionResponse:
      type: object
      required:
        - id
        - name
        - flowType
        - handle
        - version
        - isActive
        - nodes
        - createdAt
      properties:
        id:
          type: string
          description: Unique identifier for the flow
          example: a23b45c6-d7e8-90f1-2345-6789abcdef01
        name:
          type: string
          description: Name of the flow
          example: "Basic Authentication Flow"
        flowType:
          type: string
          enum:
            - AUTHENTICATION
            - REGISTRATION
          description: |
            Type of flow
          example: AUTHENTICATION
        handle:
          type: string
          description: |
            URL-friendly handle for the flow (lowercase letters, numbers, hyphens, and underscores only)
            Once set, the handle cannot be changed.
          pattern: '^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$'
          example: "default-flow"
        version:
          type: integer
          description: Version number of this flow snapshot
          example: 3
        isActive:
          type: boolean
          description: Indicates if this is the currently active version of the flow
          example: false
        nodes:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Node'
          description: List of nodes that define the flow graph
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this specific version was created
      example:
        id: a23b45c6-d7e8-90f1-2345-6789abcdef01
        name: Basic Authentication Flow
        flowType: AUTHENTICATION
        handle: default-flow
        version: 3
        isActive: false
        nodes: *authFlowNodes
        createdAt: "2024-06-15T10:20:30Z"

    Node:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Unique identifier for the node within the flow
          example: node_001
        type:
          type: string
          enum:
            - START
            - PROMPT
            - TASK_EXECUTION
            - CALL
            - VARIABLES
            - END
          description: |
            Type of node
          example: PROMPT
        layout:
          allOf:
            - $ref: '#/components/schemas/NodeLayout'
        meta:
          description: Optional UI metadata for PROMPT nodes (verbose mode)
          allOf:
            - $ref: '#/components/schemas/NodeMeta'
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/PromptDefinition'
          description: |
            Prompt groups for PROMPT nodes. Each entry pairs a set of inputs with a single
            action (navigation target). Mutually exclusive with `next`.
        variant:
          type: string
          description: |
            Optional PROMPT node sub-type. Use `LOGIN_OPTIONS` to activate login method
            filtering on this node.
          enum:
            - LOGIN_OPTIONS
          example: LOGIN_OPTIONS
        inputs:
          type: array
          description: Only on a `VARIABLES` node. The variables the node declares.
          items:
            $ref: '#/components/schemas/VariableDefinition'
        condition:
          description: Optional condition that gates whether this node executes
          allOf:
            - $ref: '#/components/schemas/ConditionDefinition'
        properties:
          type: object
          additionalProperties: true
          description: |
            Node-level properties for configuration (e.g., senderId for notification executors,
            idpId for social login executors).
          example:
            senderId: "<SENDER_ID>"
        executor:
          description: Executor configuration for TASK_EXECUTION nodes (required)
          allOf:
            - $ref: '#/components/schemas/Executor'
        flow:
          description: Flow reference for CALL nodes (required)
          allOf:
            - $ref: '#/components/schemas/FlowReference'
        onSuccess:
          type: string
          description: Next node ID on successful execution (START, TASK_EXECUTION, CALL, and VARIABLES nodes)
          example: node_003
        onFailure:
          type: string
          description: Next node ID on failed execution (TASK_EXECUTION nodes)
          example: node_007
        onIncomplete:
          type: string
          description: |
            For TASK_EXECUTION nodes: ID of the PROMPT node to transition to when user input
            is required to complete the task.
          example: node_003
        next:
          type: string
          description: |
            For display-only PROMPT nodes: ID of the next node to automatically transition to
            after the display content is rendered. Mutually exclusive with `prompts`.
          example: node_005
        message:
          type: string
          description: |
            For display-only PROMPT nodes: a plain-text message returned in non-verbose mode
            alongside the flow status, intended for lightweight clients that do not process
            the full meta/components payload.
          example: "Registration complete. You may now sign in."

    VariableDefinition:
      type: object
      description: One variable of a flow, with a type and a default.
      required:
        - identifier
        - type
        - defaultValue
      properties:
        identifier:
          type: string
          description: Name of the variable. Starts with a letter and holds letters, digits and underscores.
          example: supportEmail
        type:
          type: string
          enum:
            - TEXT_INPUT
            - EMAIL_INPUT
            - PHONE_INPUT
            - NUMBER_INPUT
            - DATE_INPUT
            - BOOLEAN_INPUT
            - SELECT
            - CONNECTION_SELECT
          description: How the value is entered and checked
        label:
          type: string
        description:
          type: string
        defaultValue:
          description: The value the variable has until another is set
        validation:
          type: array
          description: Rules a text, email or phone value has to meet
          items:
            type: object
            required:
              - type
              - value
            properties:
              type:
                type: string
                enum:
                  - regex
                  - minLength
                  - maxLength
              value: {}
              message:
                type: string
        options:
          type: array
          description: For a `SELECT`, the values it can take
          items: {}
        min:
          type: number
        max:
          type: number
        category:
          type: string
          enum:
            - IDENTITY_PROVIDER
          description: For a `CONNECTION_SELECT`, the kind of connection it takes
        connectionTypes:
          type: array
          description: For a `CONNECTION_SELECT`, limits it to these vendors
          items:
            type: string
      example:
        identifier: supportEmail
        type: EMAIL_INPUT
        label: Support email
        description: Shown to users who cannot sign in
        defaultValue: support@example.com

    NodeLayout:
      type: object
      description: |
        Layout information for the flow composer UI. This metadata is used 
        only by the visual flow composer to position and size nodes on the canvas. 
      properties:
        size:
          type: object
          description: Dimensions of the node in the flow composer canvas
          required:
            - width
            - height
          properties:
            width:
              type: number
              description: Width of the node in pixels
              example: 200
            height:
              type: number
              description: Height of the node in pixels
              example: 150
        position:
          type: object
          description: Position of the node in the flow composer canvas
          required:
            - x
            - y
          properties:
            x:
              type: number
              description: X-coordinate of the node
              example: 100
            y:
              type: number
              description: Y-coordinate of the node
              example: 100
      example:
        size:
          width: 200
          height: 150
        position:
          x: 100
          y: 100

    NodeMeta:
      type: object
      description: UI metadata for rendering PROMPT nodes in verbose mode
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
          description: UI components to render (headings, inputs, buttons, etc.)

    NodeInput:
      type: object
      required:
        - type
        - identifier
        - required
      properties:
        ref:
          type: string
          description: |
            Reference to the input component ID. For PROMPT nodes, this refers to components
            in meta.components. Optional but recommended for better
            flow visualization and debugging.
          example: input_001
        type:
          type: string
          description: Input type (TEXT_INPUT, PASSWORD_INPUT, OTP_INPUT, etc.)
          example: TEXT_INPUT
        identifier:
          type: string
          description: The mapped attribute identifier (e.g., username, password, otp)
          example: username
        required:
          type: boolean
          description: Whether this input is required
          example: true

    NodeAction:
      type: object
      required:
        - ref
        - nextNode
      properties:
        ref:
          type: string
          description: Reference to the action component ID in meta.components
          example: action_001
        type:
          type: string
          description: |
            Optional action type forwarded to the next node's executor so it can determine which
            processing path to take. The value is an opaque string: the flow author and the
            executor that consumes it agree on the vocabulary, so the recognized values are
            documented by that executor rather than fixed here. If omitted, no action-type hint
            is forwarded.
          example: SUBMIT
        nextNode:
          type: string
          description: ID of the next node to navigate to when this action is triggered
          example: node_004

    Executor:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the registered executor
          example: CredentialsAuthExecutor
        mode:
          type: string
          description: Optional execution mode or configuration hint for the executor
          example: "default"
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/NodeInput'
          description: |
            Input references the executor should read from the accumulated user inputs.
            Each entry maps a flow input (by ref/identifier) to the executor's expected parameter.

    Component:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Unique identifier for the component
          example: input_001
        type:
          type: string
          description: |
            Component type. Common types:
            - TEXT, HEADING: Display text elements
            - TEXT_INPUT, PASSWORD_INPUT, OTP_INPUT: Input fields
            - ACTION: Buttons and clickable elements
            - BLOCK: Container for grouping components
            - DIVIDER: Visual separator
          example: TEXT_INPUT
        label:
          type: string
          description: Display label or text content (use {{ t(namespace:key) }} for i18n or plain text)
          example: "{{ t(signin:fields.username.label) }}"
        variant:
          type: string
          description: Component style variant (e.g., HEADING_01, PRIMARY, etc.)
          example: HEADING_01
        required:
          type: boolean
          description: Whether the component is required (for input fields)
          example: true
        placeholder:
          type: string
          description: Placeholder text for input fields (use {{ t(namespace:key) }} for i18n or plain text)
          example: "{{ t(signin:fields.username.placeholder) }}"
        length:
          type: integer
          description: Length specification (e.g., for OTP_INPUT)
          example: 6
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
          description: Nested child components (for BLOCK type)


    PromptDefinition:
      type: object
      description: |
        Groups a set of inputs with the action taken when the user submits them.
        A PROMPT node may have multiple prompt groups — one per available action path.
      properties:
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/NodeInput'
          description: Input fields presented to the user for this prompt group
        action:
          description: The action triggered when the user submits this prompt group
          allOf:
            - $ref: '#/components/schemas/NodeAction'

    ConditionDefinition:
      type: object
      description: |
        Optional condition that determines whether a node should execute.
        If the condition is not met, the engine skips the node and transitions to `onSkip`.
      required:
        - key
        - value
        - onSkip
      properties:
        key:
          type: string
          description: Runtime data key to evaluate
          example: "userAutoProvisioned"
        value:
          type: string
          description: Expected value to match against the runtime key
          example: "true"
        onSkip:
          type: string
          description: ID of the node to transition to when the condition is not met
          example: node_005

    FlowReference:
      type: object
      description: Reference to another flow, used by CALL nodes.
      required:
        - ref
      properties:
        ref:
          type: string
          description: Handle of the target flow to invoke
          example: "mfa-flow"

    Error:
      type: object
      description: |
        Error response. Validation errors (FLM-1020 through FLM-1024) use consolidated
        error codes; the `description.defaultValue` field carries context-specific details
        (e.g., which node or input caused the failure).
      properties:
        code:
          type: string
          description: "Error code. Client errors follow the FLM-XXXX convention; server errors use SSE-XXXX."
          example: "FLM-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).

    SharedFlowResponse:
      type: object
      description: 'A flow as an organization unit it was shared with sees it. It holds the variables that apply to that unit and nothing else of the definition: no nodes, no interceptors, no layout, no versions and no timestamps. What it shows of each variable is resolved for the unit from the owner''s flow and the sharing policy, so the unit sees only what applies to it. The unit''s own overrides are read from `GET /flows/{flowId}/variables`.'
      required:
        - id
        - handle
        - name
        - flowType
        - ouId
        - isOwnedByOU
        - isReadOnly
        - variables
      properties:
        id:
          type: string
          example: 0193b0a1-1001-7000-8000-000000000042
        handle:
          type: string
          example: acme-login
        name:
          type: string
          example: Acme Login Flow
        flowType:
          type: string
          enum:
            - AUTHENTICATION
            - REGISTRATION
          example: AUTHENTICATION
        ouId:
          type: string
          description: ID of the organization unit that owns the flow, not the one in the request's `ouId`.
          example: 0193b0a1-2001-7000-8000-000000000001
        isOwnedByOU:
          type: boolean
          enum:
            - false
          description: Always `false`, as the flow is owned by another organization unit and was shared with the organization unit in the request's `ouId`.
        isReadOnly:
          type: boolean
          enum:
            - true
          description: 'Always true: a shared flow cannot be changed or deleted by the organization unit it is shared with.'
        variables:
          type: array
          description: The variables the sharing policy names for the organization unit, each resolved for it. `defaultValue` is the value the policy sets for the unit, or the owner's `defaultValue` when the policy sets none, and a `SELECT` lists only the `options` the unit may choose from. A variable no policy names for the unit is not listed, and nothing the owner holds beyond this is shown.
          items:
            $ref: '#/components/schemas/VariableDefinition'

    SharingPolicyRequest:
      type: object
      additionalProperties: false
      description: 'One organization unit''s decision about this flow: a `childUnits` and `otherTreeRoots` section, at least one, each reaching a whole group or naming units, never both.'
      anyOf:
        - required:
            - childUnits
        - required:
            - otherTreeRoots
      properties:
        initiatingOuId:
          type: string
          description: 'The organization unit whose decision this is. Omitted means the flow''s owner. A unit other than the owner may only issue a `childUnits` policy where the flow reached it and stopped.'
          example: acme-root
        childUnits:
          $ref: '#/components/schemas/ChildUnits'
        otherTreeRoots:
          $ref: '#/components/schemas/OtherTreeRootsSelected'
        version:
          type: integer
          description: 'The policy version the caller believes it is editing. Required on an edit, ignored on a create.'
          example: 1

    SharingPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - version
      description: 'A replacement for a policy''s sections. It names no `initiatingOuId`, and a section that already reaches a whole group keeps that reach but cannot be introduced by editing.'
      anyOf:
        - required:
            - allUnits
        - required:
            - childUnits
        - required:
            - otherTreeRoots
      properties:
        allUnits:
          $ref: '#/components/schemas/AllUnits'
        childUnits:
          $ref: '#/components/schemas/ChildUnits'
        otherTreeRoots:
          $ref: '#/components/schemas/OtherTreeRoots'
        version:
          type: integer
          description: 'The policy version the caller believes it is editing. An edit against any other version is refused.'
          example: 1

    AllUnits:
      type: object
      additionalProperties: false
      description: 'Every organization unit in the deployment, at any depth, including later ones. It stands alone, and only a resource file or an import may create it.'
      properties:
        excludedOuIds:
          type: array
          description: 'Organization units withheld from the section, each taking everything beneath it out of reach as well. Any organization unit may be excluded.'
          items:
            type: string
          example:
            - acme-trial-customers
        overlayRules:
          type: object
          description: 'The terms the organization units reached hold the flow on, keyed by field. For a flow the field is a variable: `variables.<identifier>`. A variable no rule names is not editable by the organization unit and keeps the owner''s default.'
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'
          example:
            variables.supportEmail:
              editable: true
            variables.mfaMode:
              editable: false
              value:
                - SMS_OTP

    ChildUnits:
      description: 'The organization units beneath the issuer, in one of the two shapes below, chosen by `mode`.'
      oneOf:
        - $ref: '#/components/schemas/ChildUnitsAll'
        - $ref: '#/components/schemas/ChildUnitsSelected'
      discriminator:
        propertyName: mode
        mapping:
          all: '#/components/schemas/ChildUnitsAll'
          selected: '#/components/schemas/ChildUnitsSelected'

    ChildUnitsAll:
      type: object
      additionalProperties: false
      required:
        - mode
      description: Everything beneath the issuing organization unit, at any depth, including units created later.
      properties:
        mode:
          type: string
          enum:
            - all
        excludedOuIds:
          type: array
          description: 'Organization units withheld from the section, with everything beneath each. Only units directly beneath the issuer may be excluded.'
          items:
            type: string
          example:
            - acme-trial-customers
        overlayRules:
          type: object
          description: 'The terms the organization units reached hold the flow on, keyed by field. For a flow the field is a variable: `variables.<identifier>`. A variable no rule names is not editable by the organization unit and keeps the owner''s default.'
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'
          example:
            variables.supportEmail:
              editable: true
            variables.mfaMode:
              editable: false
              value:
                - SMS_OTP

    ChildUnitsSelected:
      type: object
      additionalProperties: false
      required:
        - mode
        - units
      description: 'Named organization units directly beneath the issuer. It takes no `excludedOuIds`: leave a unit out of `units` to withhold it.'
      properties:
        mode:
          type: string
          enum:
            - selected
        units:
          type: array
          minItems: 1
          description: The organization units reached. An organization unit is listed only once in a policy.
          items:
            $ref: '#/components/schemas/ChildUnit'

    ChildUnit:
      type: object
      additionalProperties: false
      required:
        - ouId
        - reach
      properties:
        ouId:
          type: string
          description: A direct child of the issuing organization unit.
          example: acme-customer-a
        reach:
          type: string
          enum:
            - unit
            - subtree
          description: 'How far the flow carries from the named unit: `unit` reaches it alone, leaving it free to pass the flow on, and `subtree` reaches it and everything below.'
          example: unit
        overlayRules:
          type: object
          description: 'The terms the organization units reached hold the flow on, keyed by field. For a flow the field is a variable: `variables.<identifier>`. A variable no rule names is not editable by the organization unit and keeps the owner''s default.'
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'
          example:
            variables.supportEmail:
              editable: true
            variables.mfaMode:
              editable: false
              value:
                - SMS_OTP

    OtherTreeRoots:
      description: 'The roots of other trees. A create may send the named shape only, while a policy that reaches every other tree keeps that reach on an edit.'
      oneOf:
        - $ref: '#/components/schemas/OtherTreeRootsSelected'
        - $ref: '#/components/schemas/OtherTreeRootsAll'
      discriminator:
        propertyName: mode
        mapping:
          selected: '#/components/schemas/OtherTreeRootsSelected'
          all: '#/components/schemas/OtherTreeRootsAll'

    OtherTreeRootsSelected:
      type: object
      additionalProperties: false
      required:
        - mode
        - units
      description: 'Named root organization units of other trees, and nothing below them. Owner only, and below a root it also needs `resource_sharing.allow_child_ou_cross_tree_sharing`.'
      properties:
        mode:
          type: string
          enum:
            - selected
        units:
          type: array
          minItems: 1
          description: The root organization units reached. An organization unit is listed only once in a policy.
          items:
            $ref: '#/components/schemas/RootUnit'

    OtherTreeRootsAll:
      type: object
      additionalProperties: false
      required:
        - mode
      description: 'The root of every other tree, including later ones. Only a resource file or an import may introduce it.'
      properties:
        mode:
          type: string
          enum:
            - all
        excludedOuIds:
          type: array
          description: Root organization units withheld from the section, and with them their trees.
          items:
            type: string
          example:
            - partner-root
        overlayRules:
          type: object
          description: 'The terms the organization units reached hold the flow on, keyed by field. For a flow the field is a variable: `variables.<identifier>`. A variable no rule names is not editable by the organization unit and keeps the owner''s default.'
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'
          example:
            variables.supportEmail:
              editable: true
            variables.mfaMode:
              editable: false
              value:
                - SMS_OTP

    RootUnit:
      type: object
      additionalProperties: false
      required:
        - ouId
      properties:
        ouId:
          type: string
          description: The root organization unit of another tree.
          example: partner-root
        overlayRules:
          type: object
          description: 'The terms the organization units reached hold the flow on, keyed by field. For a flow the field is a variable: `variables.<identifier>`. A variable no rule names is not editable by the organization unit and keeps the owner''s default.'
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'
          example:
            variables.supportEmail:
              editable: true
            variables.mfaMode:
              editable: false
              value:
                - SMS_OTP

    SharingPolicy:
      type: object
      description: 'A recorded sharing policy, with its sections in the shape a request states them, so an edit can copy them with `version` into a `SharingPolicyUpdateRequest`. Other fields are set by the server.'
      properties:
        id:
          type: string
          description: The policy's own identifier.
          example: 0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10
        initiatingOuId:
          type: string
          description: 'The organization unit whose decision this policy is. The owning unit belongs to the flow and is not repeated.'
          example: acme-root
        stage:
          type: string
          enum:
            - share
            - reshare
          description: '`share` when the owner issued it, `reshare` when a sharee did.'
        parentPolicyId:
          type: string
          description: The policy that made this one's issuer able to see the flow. Empty for an owner-issued policy.
        isReadOnly:
          type: boolean
          readOnly: true
          description: Indicates if the policy is defined in declarative configuration and cannot be modified.
        version:
          type: integer
          description: Bumped on every edit, and carried back on the next one.
          example: 1
        allUnits:
          $ref: '#/components/schemas/AllUnits'
        childUnits:
          $ref: '#/components/schemas/ChildUnits'
        otherTreeRoots:
          $ref: '#/components/schemas/OtherTreeRoots'

    SharingPolicyListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: How many policies the flow has, not how many this page holds.
          example: 2
        startIndex:
          type: integer
          description: The one-based position of the first policy in this page.
          example: 1
        count:
          type: integer
          description: How many policies this page holds.
          example: 2
        policies:
          type: array
          items:
            $ref: '#/components/schemas/SharingPolicy'
        links:
          type: array
          description: Links to the first, previous, next and last pages, where they exist.
          items:
            $ref: '#/components/schemas/Link'
          example:
            - href: /flows/0193b0a1-1001-7000-8000-000000000042/sharing-policies?offset=30&limit=30
              rel: next

    ResolvedOverlay:
      type: object
      description: 'What one organization unit may do with the flow: whether it owns it or was shared it, which policies reached it, and the effective rule for each variable a policy named.'
      properties:
        ouId:
          type: string
          example: acme-customer-a
        owned:
          type: boolean
          description: Whether the organization unit owns the flow rather than being shared it.
        visible:
          type: boolean
          description: 'Whether the organization unit can see the flow at all, which decides whether it may be named as the accessing unit on a token request.'
        policyIds:
          type: array
          description: Every policy that contributed, so an answer is traceable to its inputs.
          items:
            type: string
        rules:
          type: object
          description: 'The effective rule per variable, keyed `variables.<identifier>`, after every policy that reached the organization unit has been combined and each narrowed by the unit above it. A variable no policy named has no entry: the organization unit cannot edit it and it keeps the owner''s default.'
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'
      example:
        ouId: 0193b0a1-2001-7000-8000-000000000002
        owned: false
        visible: true
        policyIds:
          - 0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10
        rules:
          variables.supportEmail:
            editable: true
          variables.otpValiditySeconds:
            editable: true
            allowedValues:
              - '60'
              - '120'
              - '300'
          variables.mfaMode:
            editable: false
            value:
              - SMS_OTP

    OverlayRule:
      type: object
      description: What an organization unit may do with one variable of a flow.
      properties:
        editable:
          type: boolean
          default: false
          description: Whether the organization unit may set its own value for the variable.
        value:
          type: array
          items:
            type: string
          description: 'The value the organization unit starts with, or is pinned to when `editable` is false. A variable holds one value, written in its raw string form: `"true"`, `"120"`, an option, or a connection id.'
          example:
            - SMS_OTP
        allowedValues:
          type: array
          items:
            type: string
          description: The values the organization unit may choose from. Absent means anything the variable accepts. Empty permits nothing.
          example:
            - '60'
            - '120'
            - '300'
        excludedValues:
          type: array
          items:
            type: string
          description: Values taken out of `value` and `allowedValues`, last.

    VariablesResponse:
      type: object
      description: 'The values an organization unit has set for the flow''s variables: its overrides, keyed by variable identifier. The organization unit is the one named in the request.'
      required:
        - values
      properties:
        values:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
          description: The unit's own overrides, in the variable's own type. A variable the unit has not set is absent, and the value from `GET /flows/{flowId}` applies to it. An empty object means the unit has set nothing.
          example:
            supportEmail: help@emea.acme.example
            showRegistrationLink: true
            socialLogin: 019e3a5e-2ff3-7bfb-ae19-27aada871b80
      example:
        values:
          supportEmail: help@emea.acme.example
          showRegistrationLink: true
          socialLogin: 019e3a5e-2ff3-7bfb-ae19-27aada871b80

    SetVariablesRequest:
      type: object
      required:
        - ouId
        - values
      properties:
        ouId:
          type: string
          description: The organization unit whose values are set. The flow has to be owned by, or shared with, it.
          example: 0193b0a1-2001-7000-8000-000000000002
        values:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
          description: 'The value of each variable to set, keyed by identifier, in the variable''s own type: a string, a number or a boolean. A value is never null.'
      description: The organization unit and the values to set for its variables, keyed by identifier, in the same shape as the `values` that `GET /flows/{flowId}/variables` returns. Each is stored as the unit's own override. A value is never null.
      example:
        ouId: 0193b0a1-2001-7000-8000-000000000002
        values:
          supportEmail: help@emea.acme.example
          showRegistrationLink: true
          socialLogin: 019e3a5e-2ff3-7bfb-ae19-27aada871b80
