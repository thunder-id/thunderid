  /.well-known/authzen-configuration:
    get:
      summary: Get AuthZEN PDP metadata
      description: Returns metadata for the AuthZEN policy decision point and the
        supported access API endpoints.
      tags:
        - AuthZEN
      security: []
      responses:
        "200":
          description: AuthZEN metadata response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthZENMetadataResponse"
  /access/v1/evaluation:
    post:
      summary: Evaluate access
      description: >
        Evaluates whether a subject can perform an action on a resource.


        The resource `type` maps to a ThunderID resource server identifier. The
        action `name`

        maps to a permission registered under that resource server. If the
        subject type is

        omitted, subject type validation is skipped. Unknown resources and
        unregistered actions

        are returned as denied decisions with an error context instead of
        transport errors.
      tags:
        - AuthZEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessEvaluationRequest"
            examples:
              bookingRead:
                summary: Evaluate booking read access
                value:
                  subject:
                    type: user
                    id: user1
                  resource:
                    type: https://api.example.com/booking
                    id: booking123
                  action:
                    name: booking:read
      responses:
        "200":
          description: Access evaluation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEvaluationResponse"
        "400":
          $ref: "#/components/responses/AuthZENClientError"
        "401":
          $ref: "#/components/responses/DirectAuthError"
        "500":
          $ref: "#/components/responses/AuthZENServerError"
      security: &a4
        - DirectAuthSecret: []
  /access/v1/evaluations:
    post:
      summary: Evaluate access in batch
      description: >
        Evaluates multiple access requests and preserves the request order in
        the response.

        Item-level validation failures are returned as denied decisions with an
        explanatory

        context where possible. An empty `evaluations` array returns a transport
        error.
      tags:
        - AuthZEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessEvaluationsRequest"
            examples:
              bookingActions:
                summary: Evaluate multiple booking actions
                value:
                  evaluations:
                    - subject:
                        type: user
                        id: user1
                      resource:
                        type: https://api.example.com/booking
                        id: booking123
                      action:
                        name: booking:read
                    - subject:
                        type: user
                        id: user1
                      resource:
                        type: https://api.example.com/booking
                        id: booking123
                      action:
                        name: booking:delete
      responses:
        "200":
          description: Batched access evaluation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEvaluationsResponse"
        "400":
          $ref: "#/components/responses/AuthZENClientError"
        "401":
          $ref: "#/components/responses/DirectAuthError"
        "500":
          $ref: "#/components/responses/AuthZENServerError"
      security: *a4
  /access/v1/search/action:
    post:
