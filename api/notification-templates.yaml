openapi: 3.0.3
info:
  title: Notification Templates API
  version: "1.0"
  description: >
    Manage the notifications ThunderID sends. Templates are defined per channel. Content can embed placeholders resolved at render time: translations ({{t(key)}}) for the recipient’s language and context values ({{ctx(var)}}) for both channels, plus design tokens ({{design(token)}}) in the email body only. All operations require the system OAuth2 scope; within it, list and read require the notification-template view permission while create, update, and delete require the notification-template manage permission.

  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Templates
    description: List, create, update, and delete notification templates.

security:
  - OAuth2: [system]

paths:
  /notification-templates/{channel}/templates:
    get:
      tags:
        - Templates
      summary: List templates
      parameters:
        - $ref: '#/components/parameters/channelPathParam'
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
              example:
                totalResults: 2
                startIndex: 1
                count: 2
                templates:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    handle: otp-verification
                    displayName: OTP Verification
                    description: One-time passcode sent to verify a user's email address.
                    self: /notification-templates/email/templates/3fa85f64-5717-4562-b3fc-2c963f66afa6
                  - id: 0db4e64e-57aa-49cb-9b8e-1f3044ed5e17
                    handle: password-reset
                    displayName: Password Reset
                    description: Link sent to let a user reset their password.
                    self: /notification-templates/email/templates/0db4e64e-57aa-49cb-9b8e-1f3044ed5e17
                links:
                  - href: /notification-templates/email/templates?offset=2&limit=2
                    rel: next
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Templates
      summary: Create a template
      description: Create a template with the provided content. The content must match the shape for the given channel. The handle is immutable and unique within the channel; a duplicate handle is rejected with 409.
      parameters:
        - $ref: '#/components/parameters/channelPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
            examples:
              email:
                summary: Email template
                value:
                  handle: otp-verification
                  displayName: OTP Verification
                  description: One-time passcode sent to verify a user's email address.
                  design:
                    colorScheme: light
                  content:
                    subject: "{{t(notification.otp.email.subject)}}"
                    body: "<p>{{t(notification.otp.email.message)}}</p><p>{{ctx(otp)}}</p>"
              sms:
                summary: SMS template
                value:
                  handle: otp-verification
                  displayName: OTP Verification
                  description: One-time passcode sent to verify a user's phone number.
                  content:
                    body: "{{t(notification.otp.sms.message)}} {{ctx(otp)}}"
      responses:
        "201":
          description: Template created
          headers:
            Location:
              description: Location of the created template.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
              examples:
                email:
                  $ref: '#/components/examples/EmailTemplateResponse'
                sms:
                  $ref: '#/components/examples/SmsTemplateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: 'Conflict: a template with the same handle already exists in the channel.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NTM-1009"
                message:
                  key: "error.notificationtemplateservice.handle_conflict"
                  defaultValue: "Template handle already exists"
                description:
                  key: "error.notificationtemplateservice.handle_conflict_description"
                  defaultValue: "A template with the same handle already exists in this channel"
        "500":
          $ref: '#/components/responses/InternalServerError'

  /notification-templates/{channel}/templates/{id}:
    get:
      tags:
        - Templates
      summary: Get a template
      parameters:
        - $ref: '#/components/parameters/channelPathParam'
        - $ref: '#/components/parameters/templatePathParam'
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
              examples:
                email:
                  $ref: '#/components/examples/EmailTemplateResponse'
                sms:
                  $ref: '#/components/examples/SmsTemplateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Templates
      summary: Update a template
      description: Updates the template's displayName, description, content, and design configuration. The content must match the shape for the given channel.
      parameters:
        - $ref: '#/components/parameters/channelPathParam'
        - $ref: '#/components/parameters/templatePathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
            examples:
              email:
                summary: Email template
                value:
                  displayName: OTP Verification
                  description: One-time passcode sent to verify a user's email address.
                  design:
                    colorScheme: light
                  content:
                    subject: "{{t(notification.otp.email.subject)}}"
                    body: "<p>{{t(notification.otp.email.message)}}</p><p>{{ctx(otp)}}</p>"
              sms:
                summary: SMS template
                value:
                  displayName: OTP Verification
                  description: One-time passcode sent to verify a user's phone number.
                  content:
                    body: "{{t(notification.otp.sms.message)}} {{ctx(otp)}}"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
              examples:
                email:
                  $ref: '#/components/examples/EmailTemplateResponse'
                sms:
                  $ref: '#/components/examples/SmsTemplateResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: 'Forbidden: insufficient permissions, or the template is declared in a file and is read-only (NTM-1022).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NTM-1022"
                message:
                  key: "error.notificationtemplateservice.read_only"
                  defaultValue: "Template is read-only"
                description:
                  key: "error.notificationtemplateservice.read_only_description"
                  defaultValue: "The template is declared in a file and cannot be modified through the API"
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Templates
      summary: Delete a template
      description: Deletes the template. Idempotent, so deleting a template that does not exist also returns 204. Rejected with 409 if a flow references the template.
      parameters:
        - $ref: '#/components/parameters/channelPathParam'
        - $ref: '#/components/parameters/templatePathParam'
      responses:
        "204":
          description: Template deleted, or already absent.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: 'Forbidden: insufficient permissions, or the template is declared in a file and is read-only (NTM-1022).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NTM-1022"
                message:
                  key: "error.notificationtemplateservice.read_only"
                  defaultValue: "Template is read-only"
                description:
                  key: "error.notificationtemplateservice.read_only_description"
                  defaultValue: "The template is declared in a file and cannot be modified through the API"
        "409":
          description: 'Conflict: the template is referenced by a flow and cannot be deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "NTM-1010"
                message:
                  key: "error.notificationtemplateservice.template_in_use"
                  defaultValue: "Template in use"
                description:
                  key: "error.notificationtemplateservice.template_in_use_description"
                  defaultValue: "The template is referenced by a flow and cannot be deleted"
        "500":
          $ref: '#/components/responses/InternalServerError'

components:
  examples:
    EmailTemplateResponse:
      summary: Email template
      value:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        handle: otp-verification
        displayName: OTP Verification
        description: One-time passcode sent to verify a user's email address.
        design:
          colorScheme: light
        content:
          subject: "{{t(notification.otp.email.subject)}}"
          body: "<p>{{t(notification.otp.email.message)}}</p><p>{{ctx(otp)}}</p>"
    SmsTemplateResponse:
      summary: SMS template
      value:
        id: 0db4e64e-57aa-49cb-9b8e-1f3044ed5e17
        handle: otp-verification
        displayName: OTP Verification
        description: One-time passcode sent to verify a user's phone number.
        content:
          body: "{{t(notification.otp.sms.message)}} {{ctx(otp)}}"

  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            system: Access to system management APIs

  parameters:
    channelPathParam:
      name: channel
      in: path
      description: Notification channel supported by this API version.
      required: true
      schema:
        type: string
        enum: [email, sms]
    templatePathParam:
      name: id
      in: path
      description: Unique identifier of the template.
      required: true
      schema:
        type: string
        format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    limitQueryParam:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    offsetQueryParam:
      name: offset
      in: query
      required: false
      description: Number of records to skip for pagination.
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    TemplateListResponse:
      type: object
      description: A page of template summaries in the requested channel.
      required: [templates]
      properties:
        totalResults:
          type: integer
          description: Number of results that match the listing operation.
          example: 15
        startIndex:
          type: integer
          description: Index of the first element of the page, which will be equal to offset + 1.
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page.
          example: 10
        templates:
          type: array
          description: Templates available in the requested channel.
          items:
            $ref: '#/components/schemas/TemplateSummary'
        links:
          type: array
          description: Pagination links (for example next and previous pages). Empty when there are no further pages.
          items:
            $ref: '#/components/schemas/Link'

    Link:
      type: object
      description: A pagination link.
      properties:
        href:
          type: string
          example: /notification-templates/email/templates?offset=30&limit=30
        rel:
          type: string
          example: next

    TemplateSummary:
      type: object
      description: Basic template details and a link to the full template.
      required: [id, handle, displayName, self]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the template. Used as the {id} path parameter.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        handle:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$"
          description: Immutable, unique identifier for the template within its channel. Used to reference the template (for example from a flow) instead of the id.
          example: otp-verification
        displayName:
          type: string
          maxLength: 255
          description: Human-readable name of the template.
          example: OTP Verification
        description:
          type: string
          maxLength: 512
          description: Optional human-readable description of what this template is for.
          example: One-time passcode sent to verify a user's email address.
        self:
          type: string
          description: Relative URL of this template.
          example: /notification-templates/email/templates/3fa85f64-5717-4562-b3fc-2c963f66afa6

    Template:
      description: >
        A notification template. The shape matches the channel in the path (the channel is not repeated in the payload): the email channel returns an EmailTemplate and the sms channel returns an SmsTemplate.
      oneOf:
        - $ref: '#/components/schemas/EmailTemplate'
        - $ref: '#/components/schemas/SmsTemplate'

    EmailTemplate:
      description: Email template with content and optional design references.
      type: object
      required: [id, handle, displayName, content]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the template. Used as the {id} path parameter.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        handle:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$"
          description: Immutable, unique kebab-case identifier for the template within its channel. Used to reference the template (for example from a flow) instead of the id.
          example: otp-verification
        displayName:
          type: string
          maxLength: 255
          description: Human-readable name of the template.
          example: OTP Verification
        description:
          type: string
          maxLength: 512
          description: Optional human-readable description of what this template is for.
          example: One-time passcode sent to verify a user's email address.
        design:
          allOf:
            - $ref: '#/components/schemas/TemplateDesign'
          description: Design references for this template.
        content:
          allOf:
            - $ref: '#/components/schemas/EmailTemplateContent'
          description: Email content that may include translations and context placeholders.

    SmsTemplate:
      description: SMS template.
      type: object
      required: [id, handle, displayName, content]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the template. Used as the {id} path parameter.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        handle:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$"
          description: Immutable, unique kebab-case identifier for the template within its channel. Used to reference the template (for example from a flow) instead of the id.
          example: otp-verification
        displayName:
          type: string
          maxLength: 255
          description: Human-readable name of the template.
          example: OTP Verification
        description:
          type: string
          maxLength: 512
          description: Optional human-readable description of what this template is for.
          example: One-time passcode sent to verify a user's email address.
        content:
          allOf:
            - $ref: '#/components/schemas/SmsTemplateContent'
          description: SMS content that may include translations and context placeholders.

    CreateTemplateRequest:
      description: >
        Create payload. The body must use the shape for the channel in the path:
        CreateEmailTemplateRequest for the email channel and CreateSmsTemplateRequest for the sms
        channel. OpenAPI cannot bind a request body to a path parameter value, so this is expressed as a
        oneOf and the server rejects a body whose shape does not match the path channel with 400.
      oneOf:
        - $ref: '#/components/schemas/CreateEmailTemplateRequest'
        - $ref: '#/components/schemas/CreateSmsTemplateRequest'

    UpdateTemplateRequest:
      description: >
        Update payload. The handle is immutable and is not part of this body; the template is identified
        by the id in the path. The body must use the shape for the channel in the path:
        UpdateEmailTemplateRequest for the email channel and UpdateSmsTemplateRequest for the sms
        channel. The server rejects a body whose shape does not match the path channel with 400.
      oneOf:
        - $ref: '#/components/schemas/UpdateEmailTemplateRequest'
        - $ref: '#/components/schemas/UpdateSmsTemplateRequest'

    CreateEmailTemplateRequest:
      type: object
      description: Create payload for an email template.
      required: [handle, displayName, content]
      additionalProperties: false
      properties:
        handle:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$"
          description: Immutable, unique kebab-case identifier for the template within its channel. Set at creation and used to reference the template (for example from a flow).
          example: otp-verification
        displayName:
          type: string
          maxLength: 255
          description: Human-readable name of the template.
          example: OTP Verification
        description:
          type: string
          maxLength: 512
          description: Optional human-readable description of what this template is for.
          example: One-time passcode sent to verify a user's email address.
        design:
          allOf:
            - $ref: '#/components/schemas/TemplateDesign'
          description: Optional design references applied when the email is rendered.
        content:
          allOf:
            - $ref: '#/components/schemas/EmailTemplateContent'
          description: Email content, which may include translations and context placeholders.

    UpdateEmailTemplateRequest:
      type: object
      description: Update payload for an email template. The handle cannot be changed and is not included.
      required: [displayName, content]
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 255
          description: Human-readable name of the template.
          example: OTP Verification
        description:
          type: string
          maxLength: 512
          description: Optional human-readable description of what this template is for.
          example: One-time passcode sent to verify a user's email address.
        design:
          allOf:
            - $ref: '#/components/schemas/TemplateDesign'
          description: Optional design references applied when the email is rendered.
        content:
          allOf:
            - $ref: '#/components/schemas/EmailTemplateContent'
          description: Email content, which may include translations and context placeholders.

    CreateSmsTemplateRequest:
      type: object
      description: Create payload for an SMS template.
      required: [handle, displayName, content]
      additionalProperties: false
      properties:
        handle:
          type: string
          maxLength: 255
          pattern: "^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$"
          description: Immutable, unique kebab-case identifier for the template within its channel. Set at creation and used to reference the template (for example from a flow).
          example: otp-verification
        displayName:
          type: string
          maxLength: 255
          description: Human-readable name of the template.
          example: OTP Verification
        description:
          type: string
          maxLength: 512
          description: Optional human-readable description of what this template is for.
          example: One-time passcode sent to verify a user's phone number.
        content:
          allOf:
            - $ref: '#/components/schemas/SmsTemplateContent'
          description: SMS content, which may include translations and context placeholders.

    UpdateSmsTemplateRequest:
      type: object
      description: Update payload for an SMS template. The handle cannot be changed and is not included.
      required: [displayName, content]
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 255
          description: Human-readable name of the template.
          example: OTP Verification
        description:
          type: string
          maxLength: 512
          description: Optional human-readable description of what this template is for.
          example: One-time passcode sent to verify a user's phone number.
        content:
          allOf:
            - $ref: '#/components/schemas/SmsTemplateContent'
          description: SMS content, which may include translations and context placeholders.

    EmailTemplateContent:
      type: object
      required: [subject, body]
      additionalProperties: false
      description: >
        Email content. Placeholders are resolved at render time: {{t(key)}} (localized text) and
        {{ctx(var)}} (context values) are allowed in both the subject and the body, while
        {{design(token)}} (design tokens, e.g. palette.primary.main) is allowed only in the body. The
        subject is required and must be non-blank.
      properties:
        subject:
          type: string
          description: >
            Subject line, optionally containing translation ({{t(key)}}) and context ({{ctx(var)}})
            placeholders. Design-token placeholders are not allowed in the subject.
          example: "{{t(notification.otp.email.subject)}}"
        body:
          type: string
          description: >
            Body, optionally containing translation ({{t(key)}}), context ({{ctx(var)}}), and
            design-token ({{design(token)}}) placeholders.
          example: "<p>{{t(notification.otp.email.message)}}</p><p>{{ctx(otp)}}</p><span style=\"color:{{design(palette.primary.main)}}\">{{ctx(expiryTime)}}</span>"

    SmsTemplateContent:
      type: object
      required: [body]
      additionalProperties: false
      description: >
        SMS content (plain text). A subject and a design are not allowed for the SMS channel and are
        rejected with 400.
      properties:
        body:
          type: string
          description: >
            Body, optionally containing translation ({{t(key)}}) and context ({{ctx(var)}})
            placeholders. Design-token placeholders are not supported for SMS.
          example: "{{t(notification.otp.sms.message)}} {{ctx(otp)}}"

    TemplateDesign:
      type: object
      description: Per-template design references composed on top of the content at render time. Email only.
      properties:
        colorScheme:
          type: string
          enum: [light, dark]
          description: Color theme variant of the application's branding to apply at render.
          example: light

    Error:
      type: object
      description: Error code and localized details for a failed request.
      required: [code, message, description]
      properties:
        code:
          type: string
          description: "Error code. Template-specific errors use the NTM-10xx family (NTM-1001 through NTM-1021); shared errors keep their own prefix (AUTH-, SSE-)."
          example: "NTM-1003"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "NTM-1001"
            message:
              key: "error.notificationtemplateservice.invalid_request"
              defaultValue: "Invalid request format"
            description:
              key: "error.notificationtemplateservice.invalid_request_description"
              defaultValue: "The request contains invalid parameters"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "AUTH-4010"
            message:
              key: "error.unauthorized"
              defaultValue: "Unauthorized"
            description:
              key: "error.unauthorized_description"
              defaultValue: "Authentication is required to access this resource"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "AUTH-4030"
            message:
              key: "error.forbidden"
              defaultValue: "Forbidden"
            description:
              key: "error.forbidden_description"
              defaultValue: "You do not have permission to perform this operation"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "NTM-1004"
            message:
              key: "error.notificationtemplateservice.not_found"
              defaultValue: "Template not found"
            description:
              key: "error.notificationtemplateservice.not_found_description"
              defaultValue: "The requested notification template does not exist"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "SSE-5000"
            message:
              key: "error.internal_server_error"
              defaultValue: "Internal server error"
            description:
              key: "error.internal_server_error_description"
              defaultValue: "An unexpected error occurred while processing the request"
