        authentication,

        registration, or recovery flow slots), aggregated across all resource
        types.

        This endpoint is informational only — it drives the pre-delete
        confirmation

        dialog in the UI and does not gate deletion on the server.


        When usage data is unavailable (e.g. the server has not fully
        initialised),

        `totalResults` and `summary` are `null` rather than `0`/empty.

        Consumers must treat `null` as "unknown" and `0` as "confirmed empty".
