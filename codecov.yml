codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
    # Wait for exactly 7 coverage uploads before reporting status:
    #   1. backend-unit (from build job)
    #   2. backend-integration-sqlite (from test-integration matrix)
    #   3. backend-integration-postgres (from test-integration matrix)
    #   4. backend-integration-redis (from test-integration matrix)
    #   5. frontend-apps-console-unit (from upload-frontend-coverage)
    #   6. frontend-apps-gate-unit (from upload-frontend-coverage)
    #   7. frontend-packages-unit (from upload-frontend-coverage)
    # Without this, Codecov status checks can intermittently hang at
    # "Expected — Waiting for status to be reported" when CI signal is delayed.
    # See: https://about.codecov.io/blog/delay-notifications-for-flags-with-after_n_builds/
    #
    # REQUIRED_SESSIONS in .github/actions/patch-coverage-gate/check-codecov-api.sh
    # mirrors this number; change both together or the gate reads a partial comparison.
    after_n_builds: 7

flags:
  backend-unit:
    carryforward: false
    paths:
      - backend/
  backend-integration-sqlite:
    carryforward: false
    paths:
      - backend/
  backend-integration-postgres:
    carryforward: false
    paths:
      - backend/
  backend-integration-redis:
    carryforward: false
    paths:
      - backend/
  frontend-apps-console-unit:
    carryforward: false
    paths:
      - frontend/apps/console/
  frontend-apps-gate-unit:
    carryforward: false
    paths:
      - frontend/apps/gate/
  frontend-packages-unit:
    carryforward: false
    paths:
      - frontend/packages/

coverage:
  status:
    project:
      default:
        enabled: true
        target: 60%
        threshold: 1%
        informational: false
      backend-unit:
        flags:
          - backend-unit
        target: 60%
        threshold: 1%
        informational: false
      backend-integration:
        flags:
          - backend-integration-sqlite
          - backend-integration-postgres
        target: 60%
        threshold: 1%
        informational: false
      backend-combined:
        flags:
          - backend-unit
          - backend-integration-sqlite
          - backend-integration-postgres
          - backend-integration-redis
        target: auto
        threshold: 1%
        informational: false
      combined:
        flags:
          - backend-unit
          - backend-integration-sqlite
          - backend-integration-postgres
          - backend-integration-redis
          - frontend-apps-console-unit
          - frontend-apps-gate-unit
          - frontend-packages-unit
        target: auto
        threshold: 1%
        informational: false
      frontend-apps-console-unit:
        flags:
          - frontend-apps-console-unit
        target: 60%
        threshold: 1%
        informational: false
      frontend-apps-gate-unit:
        flags:
          - frontend-apps-gate-unit
        target: 60%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 80%
        threshold: 1%
        informational: false

bundle_analysis:
  # Comment-only: post an informational status and PR comment showing bundle-size
  # changes for the gate and console apps, but never fail/block a PR.
  # To start blocking later, set `status: true` and add a `bundle_change_threshold`.
  status: informational
  # Flag the comment with a warning when a bundle grows by more than 5%.
  warning_threshold: "5%"

ignore:
  # The Control Plane entry point. Startup wiring that only a booted binary executes, and the
  # integration suite boots the all-in-one server from cmd/server, never this one. It is excluded
  # from coverage instrumentation in backend/.excludecoverage for the same reason; naming it here
  # keeps it out of the patch denominator explicitly rather than by absence of data. Its testable
  # helpers are covered by cmd/cpserver's own tests.
  # TODO: remove if the integration suite ever boots the Control Plane.
  - "backend/cmd/cpserver/**"
  - "backend/tests/**"
  - "**/*_test.go"
  - "tests/**"
  - "samples/**"
  - "docs/**"
  - "api/**"
