sections:
  - type: api
    id: api
    title: API reference
    intro: Every export is fully typed. The signatures and props below come from the package's own reference documentation,
      so what is listed here is what the installed version ships.
    kindTones:
      function: accent
    exports:
    - group: Functions
      kind: function
      name: Configuration
      description: The `initialize()` method accepts a configuration object that controls how the SDK connects to your
        {{ProductName}} instance and manages authentication.
      example: |-
        import { ThunderIDBrowserClient } from '@thunderid/browser'

        const auth = new ThunderIDBrowserClient()

        await auth.initialize({
          clientId: '<your-client-id>',
          baseUrl: 'https://localhost:8090',
        })
    - group: Functions
      kind: function
      name: Event Hooks
      description: The Browser SDK provides an event-driven system for reacting to authentication lifecycle events.
        Register callbacks using the `on()` method to respond to sign-in, sign-out, HTTP request events, and more.
      example: |-
        import { Hooks } from '@thunderid/browser'

        auth.on(Hooks.SignIn, (user) => {
          console.log('User signed in:', user.displayName)
        })

        auth.on(Hooks.SignOut, () => {
          console.log('User signed out')
          window.location.href = '/'
        })
    - group: Functions
      kind: function
      name: ThunderIDBrowserClient
      description: The `ThunderIDBrowserClient` is the core class of the `@thunderid/browser` SDK. It manages the full
        authentication lifecycle for browser-based applications, including sign-in, sign-out, token management, and
        authenticated HTTP requests.
      example: |-
        import { ThunderIDBrowserClient } from '@thunderid/browser'

        const auth = new ThunderIDBrowserClient()

        await auth.initialize({
          clientId: '<your-client-id>',
          baseUrl: 'https://localhost:8090',
          afterSignInUrl: window.location.origin,
          afterSignOutUrl: window.location.origin,
        })

        export default auth

