          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Not Found: The layout could not be found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: LAY-1003
                message:
                  key: layout.error.not_found
                  defaultValue: Layout not found
                description:
                  key: layout.error.not_found_description
                  defaultValue: The requested layout configuration was not found
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: *a6
  /design/layouts/{id}/usages:
    get:
      tags:
        - Layouts
      summary: Get layout usages
      description: >
        Returns the resources that reference this layout, aggregated across all

        resource types. This endpoint is informational only — it drives the

        pre-delete confirmation dialog in the UI and does not gate deletion on
        the server.


        Each usage entry includes a `behaviorOnDelete` field describing what
        happens

        to the referencing resource if the layout is deleted:

        - `fallback`: the reference is kept as-is and resolved to the system
        default layout at read time.

        - `cascade`: the resource is permanently deleted along with the layout.


        When usage data is unavailable (e.g. the server has not fully
        initialised),

        `totalResults` and `summary` are `null` rather than `0`/empty.

        Consumers must treat `null` as "unknown" and `0` as "confirmed empty".
      parameters:
        - $ref: "#/components/parameters/idPathParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Resources that reference this layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceUsagesResponse"
              example:
                totalResults: 2
                count: 2
                summary:
                  application: 2
                usages:
                  - resourceType: application
                    id: a1b2c3d4-0000-0000-0000-000000000001
                    displayName: Customer Portal
                    behaviorOnDelete: fallback
                  - resourceType: application
                    id: a1b2c3d4-0000-0000-0000-000000000002
                    displayName: Admin Console
                    behaviorOnDelete: fallback
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Not Found: The layout could not be found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: LAY-1003
                message:
                  key: layout.error.not_found
                  defaultValue: Layout not found
                description:
                  key: layout.error.not_found_description
                  defaultValue: The requested layout configuration was not found
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: *a6
  /design/resolve:
    get:
      tags:
        - design-resolve
      summary: Resolve design configuration
      description: >
        Resolves and retrieves the complete design configuration (theme +
        layout) for a given entity.

        This endpoint merges theme and layout preferences, with layout
        preferences taking precedence over theme preferences when there are
        conflicts.
      security: []
      parameters:
        - name: type
          in: query
          description: The type of entity to resolve design for
          required: true
          schema:
            type: string
            enum:
              - APP
              - OU
          example: APP
        - name: id
          in: query
          description: The ID of the entity (application ID or organization unit ID)
          required: true
          schema:
            type: string
            format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "200":
          description: Resolved design configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignResolveResponse"
              example:
                theme:
                  direction: ltr
                  defaultColorScheme: dark
                  colorSchemes:
                    dark:
                      palette:
                        primary:
                          main: "#BD93F9"
                layout:
                  header:
                    logo:
                      url: https://example.com/logo.png
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Entity not found or has no design configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: DSR-1004
                message:
                  key: design.resolve.error.app_not_found
                  defaultValue: Application not found
                description:
                  key: design.resolve.error.app_not_found_description
                  defaultValue: The application with the specified id does not exist
        "500":
          $ref: "#/components/responses/InternalServerError"
  /.well-known/oauth-authorization-server:
    get:
      summary: OAuth 2.0 Authorization Server Metadata
      description: >
        Returns metadata describing the authorization server's configuration per
        RFC 8414.

        This includes the supported endpoints, grant types, scopes, and signing
        algorithms.
      tags:
        - Discovery
      responses:
        "200":
          description: Authorization server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2AuthorizationServerMetadata"
              example:
                issuer: https://server.example.com
                authorization_endpoint: https://server.example.com/oauth2/authorize
                token_endpoint: https://server.example.com/oauth2/token
                jwks_uri: https://server.example.com/oauth2/jwks
                introspection_endpoint: https://server.example.com/oauth2/introspect
                pushed_authorization_request_endpoint: https://server.example.com/oauth2/par
                registration_endpoint: https://server.example.com/oauth2/dcr/register
                scopes_supported:
                  - openid
                  - profile
                  - email
                response_types_supported:
                  - code
                grant_types_supported:
                  - authorization_code
                  - client_credentials
                  - refresh_token
                  - urn:ietf:params:oauth:grant-type:jwt-bearer
                token_endpoint_auth_methods_supported:
                  - client_secret_basic
                  - client_secret_post
                  - private_key_jwt
                code_challenge_methods_supported:
                  - S256
                authorization_response_iss_parameter_supported: true
      security: &a7 []
  /.well-known/openid-configuration:
    get:
      summary: OpenID Connect Provider Metadata
      description: >
        Returns OpenID Provider metadata per OIDC Discovery 1.0. Extends the
        OAuth 2.0

        Authorization Server Metadata with OIDC-specific fields such as
        supported subject

        types, ID token signing algorithms, UserInfo endpoint, and supported
        claims.
      tags:
        - Discovery
      responses:
        "200":
          description: OIDC provider metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCProviderMetadata"
              example:
                issuer: https://server.example.com
                authorization_endpoint: https://server.example.com/oauth2/authorize
                token_endpoint: https://server.example.com/oauth2/token
                userinfo_endpoint: https://server.example.com/oauth2/userinfo
                jwks_uri: https://server.example.com/oauth2/jwks
                introspection_endpoint: https://server.example.com/oauth2/introspect
                pushed_authorization_request_endpoint: https://server.example.com/oauth2/par
                registration_endpoint: https://server.example.com/oauth2/dcr/register
                scopes_supported:
                  - openid
                  - profile
                  - email
                response_types_supported:
                  - code
                grant_types_supported:
                  - authorization_code
                  - client_credentials
                  - refresh_token
                  - urn:ietf:params:oauth:grant-type:jwt-bearer
                token_endpoint_auth_methods_supported:
                  - client_secret_basic
                  - client_secret_post
                  - private_key_jwt
                subject_types_supported:
                  - public
                id_token_signing_alg_values_supported:
                  - RS256
                claims_supported:
                  - sub
                  - name
                  - email
                  - email_verified
                claims_parameter_supported: true
                authorization_response_iss_parameter_supported: true
        "500":
          description: Internal server error — metadata could not be generated.
      security: *a7
  /export:
