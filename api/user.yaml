  /users/me/agents/{id}:
    get:
      tags:
        - Self
      summary: Read one of the caller's personal agents
      description: |
        Returns a personal agent the signed-in user owns, as the same object `GET /agents/{id}` returns. An
        agent that does not exist, is not a personal agent, or belongs to another user is not found, or refused
        when the caller may not read it. The token must be the user's own: a delegated token is refused.
      security:
        - OAuth2: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "The agent ID"
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedAgentDetails'
        "401":
          description: No user access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AGT-1052"
                message:
                  key: "error.agentservice.authentication_required"
                  defaultValue: "Authentication required"
                description:
                  key: "error.agentservice.authentication_required_description"
                  defaultValue: "The request needs a user access token"
        "403":
          description: |
            A delegated token, one issued to a client acting for the user (it carries an `act` claim), such
            as an agent's own token for its owner (`AGT-1053`); or an agent the caller may not read, such as
            another user's agent (`SSE-4030`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AGT-1053"
                message:
                  key: "error.agentservice.delegated_token_not_allowed"
                  defaultValue: "Delegated token not allowed"
                description:
                  key: "error.agentservice.delegated_token_not_allowed_description"
                  defaultValue: "A token issued to a client acting for the user cannot manage the user's agents"
        "404":
          description: Not one of the caller's personal agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AGT-1004"
                message:
                  key: "error.agentservice.agent_not_found"
                  defaultValue: "Agent not found"
                description:
                  key: "error.agentservice.agent_not_found_description"
                  defaultValue: "The agent with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    put:
      tags:
        - Self
      summary: Update one of the caller's personal agents
      description: |
        Replaces the part of a personal agent its owner may change: the description, the schema attributes
        (including the name), the grant types and the redirect URIs. `attributes`, `grantTypes` and
        `redirectUris` are required; a `description` left out is cleared. Any other field is refused, so no flow
        setting, owner or credential can be changed here. Read the agent first and send these fields back with
        the changes.

        Grant types must be a subset of `authorization_code`, `urn:openid:params:grant-type:ciba` and
        `refresh_token`. An empty list removes every grant, so the agent gets no tokens until one is added.
        With `authorization_code`, the agent uses response type `code` and PKCE, and needs at least one redirect
        URI; without it, both are removed. A grant the owner removes is refused from then on, including for
        outstanding refresh tokens.
      security:
        - OAuth2: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "The agent ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnedAgentUpdateRequest'
            example:
              description: "Answers questions about my spending"
              attributes:
                name: "Spending assistant"
              grantTypes: ["authorization_code", "refresh_token"]
              redirectUris: ["https://assistant.example.com/callback"]
      responses:
        "200":
          description: The updated agent, as the same object `PUT /agents/{id}` returns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedAgentUpdateResponse'
        "400":
          description: |
            A required field missing, a field outside the editable set, a grant type outside the personal set, or a
            combination the OAuth client rules refuse (for example the authorization code grant without a
            redirect URI).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AGT-1048"
                message:
                  key: "error.agentservice.grant_type_not_allowed_for_personal_agent"
                  defaultValue: "Grant type not allowed"
                description:
                  key: "error.agentservice.grant_type_not_allowed_for_personal_agent_description"
                  defaultValue: "A personal agent can only use the authorization code, CIBA, and refresh token grants"
        "401":
          description: No user access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AGT-1052"
                message:
                  key: "error.agentservice.authentication_required"
                  defaultValue: "Authentication required"
                description:
                  key: "error.agentservice.authentication_required_description"
                  defaultValue: "The request needs a user access token"
        "403":
          description: |
            A delegated token (one carrying an `act` claim, such as an agent's own token for its owner), or a
            declarative agent, which cannot be changed at runtime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                delegated-token:
                  summary: A delegated token
                  value:
                    code: "AGT-1053"
                    message:
                      key: "error.agentservice.delegated_token_not_allowed"
                      defaultValue: "Delegated token not allowed"
                    description:
                      key: "error.agentservice.delegated_token_not_allowed_description"
                      defaultValue: "A token issued to a client acting for the user cannot manage the user's agents"
                declarative-agent:
                  summary: A declarative agent
                  value:
                    code: "AGT-1027"
                    message:
                      key: "error.agentservice.cannot_modify_declarative_resource"
                      defaultValue: "Cannot modify declarative resource"
                    description:
                      key: "error.agentservice.cannot_modify_declarative_resource_description"
                      defaultValue: "Declaratively managed agents cannot be modified via the API"
        "404":
          description: Not one of the caller's personal agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AGT-1004"
                message:
                  key: "error.agentservice.agent_not_found"
                  defaultValue: "Agent not found"
                description:
                  key: "error.agentservice.agent_not_found_description"
                  defaultValue: "The agent with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"
    delete:
      tags:
        - Self
      summary: Delete one of the caller's personal agents
      security:
        - OAuth2: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "The agent ID"
      responses:
        "204":
          description: The agent was deleted
        "401":
          description: No user access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AGT-1052"
                message:
                  key: "error.agentservice.authentication_required"
                  defaultValue: "Authentication required"
                description:
