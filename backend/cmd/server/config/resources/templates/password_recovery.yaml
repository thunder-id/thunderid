handle: "password-recovery"
displayName: "Password Recovery Email"
channel: "email"
content:
  subject: "{{ t(notification:template.password_reset_title) }}"
  body: |
    <!DOCTYPE html>
    <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #181818;">
      <h2>{{ t(notification:template.password_reset_title) }}</h2>
      <p>{{ t(notification:template.greeting) }}</p>
      <p>{{ t(notification:template.password_reset_intro_prefix) }} {{ctx(appName)}}. {{ t(notification:template.password_reset_instructions) }}</p>
      <p>
        <a href="{{ctx(inviteLink)}}" style="display: inline-block; padding: 12px 24px;
        background-color: #3a87ed; color: #ffffff; text-decoration: none;
        border-radius: 4px; font-weight: bold;">
          {{ t(notification:template.reset_password) }}
        </a>
      </p>
      <p>{{ t(notification:template.password_reset_fallback_link_instructions) }}</p>
      <p style="word-break: break-all;">
        <a href="{{ctx(inviteLink)}}">{{ctx(inviteLink)}}</a>
      </p>
      <p>{{ t(notification:template.password_reset_expiry_prefix) }} <strong>30 minutes</strong> {{ t(notification:template.password_reset_expiry_suffix) }}</p>
      <p>{{ t(notification:template.unrequested_password_reset_disclaimer) }}</p>
    </body>
    </html>
