    OAuthConnectionUpdateRequest:
      type: object
      description: |
        Generic OAuth 2.0 connection (no OpenID Connect discovery, no id_token). User attributes
        come from the provider's own profile API, given as userInfoEndpoint. That endpoint is
        provider-specific rather than an OpenID Connect UserInfo endpoint, and is optional: when it
        is omitted, the subject is read from the access token if the provider issues a JWT.
      required: [name, clientId, redirectUri, authorizationEndpoint, tokenEndpoint]
      properties:
        name: { type: string }
        description: { type: string }
        ouId:
          type: string
