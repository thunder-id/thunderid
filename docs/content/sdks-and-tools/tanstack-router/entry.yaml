# SDKs & tools registry entry. Schema: docs/src/types/ecosystem.ts
# Metadata for one entry. Its pages, when it has any, sit beside this file or
# under another content tree; `docs:` below says where.
id: tanstack-router
name: TanStack Router
icon: TanStackLogo
category: fullstack
type: sdk
origin: official
status: ga
package:
  name: "@thunderid/tanstack-router"
  manager: npm
description: Type-safe authentication for TanStack Router applications.
docs:
  overview: /docs/next/sdks-and-tools/tanstack-router/overview
  apiReference: /docs/next/sdks-and-tools/tanstack-router/apis
links:
  github: https://github.com/thunder-id/javascript-sdks
  package: https://www.npmjs.com/package/@thunderid/tanstack-router
apiReference:
  source: typedoc

sections:
  - type: api
    id: api
    title: API reference
    intro: Every export is fully typed. The signatures and props below come from the package's own reference documentation,
      so what is listed here is what the installed version ships.
    kindTones:
      function: accent
    exports:
    - group: Functions
      kind: function
      name: <CallbackRoute />
      description: 'The `CallbackRoute` component handles the OAuth 2.0 authorization code callback. Mount it at your
        application''s redirect URI path. It processes the authorization code, validates the CSRF state parameter, exchanges
        the code for tokens, and navigates the user back to their original destination. :::note `CallbackRoute` must
        be rendered inside a `ThunderIDProvider` and a TanStack Router context. :::'
      rowsLabel: Props
      rows:
      - name: onError
        type: '(error: Error) => void'
        tag: optional
        description: Called when callback processing fails (e.g., invalid state, token exchange error)
      - name: onNavigate
        type: '(path: string) => void'
        tag: optional
        description: Override the default post-callback navigation. Receives the resolved destination path. Defaults
          to TanStack Router's `router.navigate()`
      example: |-
        import { createRoute } from '@tanstack/react-router'
        import { CallbackRoute } from '@thunderid/tanstack-router'

        const callbackRoute = createRoute({
          getParentRoute: () => rootRoute,
          path: '/callback',
          component: CallbackRoute,
        })
    - group: Functions
      kind: function
      name: <ProtectedRoute />
      description: 'The `ProtectedRoute` component wraps a route component and enforces authentication. When the user
        is not signed in it either redirects to a specified URL or renders a fallback element. While authentication
        state is being resolved it shows a loading state. :::note `ProtectedRoute` must be rendered inside a `ThunderIDProvider`.
        It also requires TanStack Router''s router context: wrap your application with `RouterProvider`. :::'
      rowsLabel: Props
      rows:
      - name: children
        type: ReactElement
        tag: required
        description: The element to render when the user is authenticated
      - name: redirectTo
        type: string
        tag: optional
        description: Path to redirect unauthenticated users to. Either `redirectTo` or `fallback` must be provided
      - name: fallback
        type: ReactElement
        tag: optional
        description: Element to render when the user is not authenticated. Either `redirectTo` or `fallback` must be
          provided
      - name: loader
        type: ReactNode
        tag: optional
        description: Element to render while authentication state is being resolved. Defaults to `null`
      example: |-
        import { createRoute } from '@tanstack/react-router'
        import { ProtectedRoute } from '@thunderid/tanstack-router'
        import Dashboard from './pages/Dashboard'

        export const dashboardRoute = createRoute({
          getParentRoute: () => rootRoute,
          path: '/dashboard',
          component: () => (
            <ProtectedRoute redirectTo="/signin">
              <Dashboard />
            </ProtectedRoute>
          ),
        })
