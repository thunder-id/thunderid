# Control Plane deployment configuration for Kubernetes.
#
# Mount this as the deployment.yaml a Control Plane pod reads, at /opt/thunderid/deployment.yaml.
# See ../README.md for the ConfigMap and Secret wiring.
#
# The template placeholders below, such as DB_CONFIG_PASSWORD, are replaced from the pod's
# environment when the server loads this file. Every one present must be set, or the server refuses
# to start. That is deliberate: a missing credential fails at startup rather than at the first
# request that needs it.
#
# Note that substitution scans this whole file, comments included, so a placeholder written in a
# comment demands an environment variable just as a real setting does.
#
# The Control Plane is where configuration is authored, versioned, and promoted between
# environments. It serves no runtime traffic: no OAuth2 flows, no logins, no tokens. It also holds
# no secrets at rest, which is why there is no secret_provider section here. A credential captured
# on this side is forwarded to the Data Plane that needs it, and what stays behind is a reference.

server:
  mode: "cp"
  # Bind on every interface. The address a caller reaches this on is public_url.
  hostname: "0.0.0.0"
  port: 8095
  public_url: "https://cp.example.com"

  # Each tenant is one organization's environment, identified as "<org>:<env>", for example
  # "org1:dev". The identifier comes from a claim in the caller's token rather than from the
  # request, so a caller cannot address a tenant it holds no token for.
  deployment_id_source: "token"
  deployment_id_claim: "deploymentId"
  # The tenant owning the Control Plane's own resources, as opposed to any customer's.
  system_deployment_id: "root"

  security:
    # Permissions this plane's management APIs require, prefixed. A token from the trusted issuer
    # carries "tenant_instance:system" rather than a bare "system", because the scope names the
    # instance it grants against, so the permissions checked here have to match it.
    #
    # Every system permission takes the prefix: tenant_instance:system, tenant_instance:system:ou,
    # tenant_instance:system:user, and so on. Leaving it unset keeps the unprefixed names.
    system_permission_prefix: "tenant_instance"

    # The identity provider whose tokens are accepted for the management APIs.
    trusted_issuer:
      issuer: "https://idp.example.com/oauth2/token"
      jwks_url: "https://idp.example.com/oauth2/jwks"
      audience: "thunderid-cp"

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

# The channel every Data Plane dials in on. The Data Plane always dials out, so the Control Plane
# needs no route to it and holds no credential for its management API. The Service in front of this
# must allow WebSocket upgrades and a long idle timeout: the connection is held open, not polled.
#
# Each Data Plane authenticates with a token this server issued and holds encrypted, so no token is
# configured here. channel.server.auth_token is only a shared fallback for a deployment that issues
# none; leaving it unset is what you want.
channel:
  server:
    enabled: true
    path: "/cp/connect"
    read_limit_bytes: 8388608
    rpc_timeout_seconds: 120

# Postgres rather than SQLite: several pods share one database, which SQLite cannot do.
database:
  config:
    type: "postgres"
    postgres:
      hostname: "postgres.example.com"
      port: 5432
      name: "configdb"
      username: "dbuser"
      password: "{{.DB_CONFIG_PASSWORD}}"
      sslmode: "require"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_transient:
    type: "postgres"
    postgres:
      hostname: "postgres.example.com"
      port: 5432
      name: "runtime_transient"
      username: "dbuser"
      password: "{{.DB_RUNTIME_TRANSIENT_PASSWORD}}"
      sslmode: "require"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  entity:
    type: "postgres"
    postgres:
      hostname: "postgres.example.com"
      port: 5432
      name: "entitydb"
      username: "dbuser"
      password: "{{.DB_ENTITY_PASSWORD}}"
      sslmode: "require"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_persistent:
    type: "postgres"
    postgres:
      hostname: "postgres.example.com"
      port: 5432
      name: "runtime_persistent"
      username: "dbuser"
      password: "{{.DB_RUNTIME_PERSISTENT_PASSWORD}}"
      sslmode: "require"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  # The environment manager's own datasource: environments and the captured versions promotion
  # compares against. It is shared state, which is what lets more than one replica serve promotion.
  # A Data Plane has no equivalent and configures none.
  environment:
    type: "postgres"
    postgres:
      hostname: "postgres.example.com"
      port: 5432
      name: "environmentdb"
      username: "dbuser"
      password: "{{.DB_ENVIRONMENT_PASSWORD}}"
      sslmode: "require"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

# Key material is generated per deployment by the setup job and mounted in. None of it is baked
# into the image.
crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
  preferred_key_id: "default-key"
