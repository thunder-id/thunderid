openapi: 3.0.3
info:
  title: Agent Management API
  version: "1.0"
  description: Manage agent identities, OAuth profiles, and the agent type schema. Direct agent creation uses the management service and does not run the Console onboarding flow.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Agents
    description: CRUD operations for agent instances.
  - name: Agent Types
    description: Read agent type schemas to understand available configuration options.

security:
  - OAuth2: [system]

paths:
  /agents:
    get:
      tags:
        - Agents
      summary: List agents
      description: |
        Retrieve a paginated list of agents. An `ouId` filter lists the agents the organization unit
        owns, followed by the agents shared into it. A caller that may list agents in one organization
        unit only gets the same list without a filter. A filter on other attributes narrows that
        caller's list to the agents the organization unit owns. A `projectId` lists the project's
        agents, narrowed to the organization unit in the `ouId` filter when one is given.
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
        - $ref: '#/components/parameters/agentFilterParam'
        - $ref: '#/components/parameters/includeQueryParam'
        - $ref: '#/components/parameters/projectIdQueryParam'
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
              example:
                totalResults: 3
                startIndex: 1
                count: 2
                agents:
                  - id: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                    ouId: "456e8400-e29b-41d4-a716-446655440001"
                    ouHandle: "platform/automations"
                    type: "default"
                    description: "Runs nightly data sync jobs"
                    owner:
                      id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                      idType: uuid
                      isLocal: true
                    attributes:
                      name: "Nightly Sync Worker"
                      model: "claude-3-5-sonnet"
                      modelProvider: "anthropic"
                    isOwnedByOU: true
                  - id: "039bda67-a80d-4b7b-ac0f-36db85332089"
                    ouId: "456e8400-e29b-41d4-a716-446655440001"
                    ouHandle: "platform/automations"
                    type: "default"
                    description: "Agent exposing calendar tools"
                    clientId: "calendar_agent_client"
                    owner:
                      id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                      idType: uuid
                      isLocal: true
                    attributes:
                      name: "Calendar Agent"
                      model: "claude-3-5-sonnet"
                      modelProvider: "anthropic"
                    isOwnedByOU: true
                links:
                  - href: "agents?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "AGT-1011"
                    message:
                      key: "error.agentservice.invalid_limit"
                      defaultValue: "Invalid pagination parameter"
                    description:
                      key: "error.agentservice.invalid_limit_description"
                      defaultValue: "The limit parameter must be between 1 and 100"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "AGT-1012"
                    message:
                      key: "error.agentservice.invalid_offset"
                      defaultValue: "Invalid pagination parameter"
                    description:
                      key: "error.agentservice.invalid_offset_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
                invalid-filter:
                  summary: Invalid filter parameter
                  value:
                    code: "AGT-1020"
                    message:
                      key: "error.agentservice.invalid_filter"
                      defaultValue: "Invalid filter parameter"
                    description:
                      key: "error.agentservice.invalid_filter_description"
                      defaultValue: "The filter format is invalid"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Internal server error

    post:
      tags:
        - Agents
      summary: Create a new agent
      description: |
        Creates a new agent. At minimum, an entity is created with the provided identity fields.
        An inbound auth profile is created when any inbound auth config fields are supplied.
        An OAuth profile is created when `inboundAuthConfig` is supplied.

        Send the name inside `attributes.name`. The default agent schema defines it as a required,
        unique string. Missing required attributes fail schema validation (`AGT-1015`); duplicate
        unique attributes produce an attribute conflict (`AGT-1014`).
        This endpoint does not execute the Console's configured agent onboarding flow.

        The agent's organization unit must be the organization unit of its agent type (`type`) or one of
        its descendants; otherwise the request is rejected with `AGT-1053`. The check reads the agent type,
        so the caller also needs permission to view it (`system:agenttype:view`). An agent type that does
        not exist, or that the caller cannot read, is rejected with `AGT-1054`.

        When an OAuth client secret is generated, `clientSecret` is returned in this response only. Store it securely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            examples:
              entity-only:
                summary: Entity only (minimal)
                value:
                  ouId: "456e8400-e29b-41d4-a716-446655440001"
                  projectId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  type: "default"
                  description: "Runs nightly data sync jobs"
                  owner:
                    id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                    idType: uuid
                    isLocal: true
                  attributes:
                    name: "Nightly Sync Worker"
                    model: "claude-3-5-sonnet"
                    modelProvider: "anthropic"
              entity-and-inbound:
                summary: Entity + inbound auth profile (no OAuth)
                value:
                  ouId: "456e8400-e29b-41d4-a716-446655440001"
                  projectId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  type: "default"
                  description: "Agent exposing calendar tools"
                  owner:
                    id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                    idType: uuid
                    isLocal: true
                  attributes:
                    name: "Calendar Agent"
                    model: "claude-3-5-sonnet"
                    modelProvider: "anthropic"
                  authFlowId: "edc013d0-e893-4dc0-990c-3e1d203e005b"
                  registrationFlowId: "f1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e"
                  isRegistrationFlowEnabled: false
                  themeId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  layoutId: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
                  allowedUserTypes: ["employee", "contractor"]
                  assertion:
                    validityPeriod: 3600
                    userAttributes: ["email", "username"]
                  loginConsent:
                    validityPeriod: 86400
              agent-cc-oauth:
                summary: Agent with client_credentials OAuth (M2M)
                value:
                  ouId: "456e8400-e29b-41d4-a716-446655440001"
                  projectId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  type: "default"
                  description: "Processes ETL jobs"
                  owner:
                    id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                    idType: uuid
                    isLocal: true
                  attributes:
                    name: "Data Pipeline Worker"
                    function: "task-automation"
                    modelProvider: "custom"
                  authFlowId: "edc013d0-e893-4dc0-990c-3e1d203e005b"
                  inboundAuthConfig:
                    - type: "oauth2"
                      config:
                        clientId: "etl_worker_client"
                        grantTypes:
                          - "client_credentials"
                        tokenEndpointAuthMethod: "client_secret_basic"
                        scopes:
                          - "data:read"
                          - "data:write"
              agent-authcode-oauth-full:
                summary: Agent with authorization_code OAuth (all fields)
                value:
                  ouId: "456e8400-e29b-41d4-a716-446655440001"
                  projectId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  type: "default"
                  description: "Agent exposing calendar tools"
                  owner:
                    id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                    idType: uuid
                    isLocal: true
                  attributes:
                    name: "Calendar Agent"
                    model: "claude-3-5-sonnet"
                    modelProvider: "anthropic"
                  authFlowId: "edc013d0-e893-4dc0-990c-3e1d203e005b"
                  registrationFlowId: "f1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e"
                  isRegistrationFlowEnabled: false
                  themeId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  layoutId: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
                  allowedUserTypes: ["employee", "contractor"]
                  assertion:
                    validityPeriod: 3600
                    userAttributes: ["email", "username"]
                  loginConsent:
                    validityPeriod: 86400
                  inboundAuthConfig:
                    - type: "oauth2"
                      config:
                        clientId: "calendar_agent_client"
                        redirectUris:
                          - "https://calendar-agent.example.com/callback"
                        grantTypes:
                          - "authorization_code"
                          - "refresh_token"
                        responseTypes:
                          - "code"
                        tokenEndpointAuthMethod: "client_secret_basic"
                        pkceRequired: true
                        publicClient: false
                        requirePushedAuthorizationRequests: false
                        scopes:
                          - "openid"
                          - "profile"
                          - "calendar:read"
                        certificate:
                          type: "JWKS_URI"
                          value: "https://calendar-agent.example.com/.well-known/jwks"
                        token:
                          accessToken:
                            userConfig:
                              validityPeriod: 3600
                              attributes: ["email", "username"]
                          idToken:
                            validityPeriod: 1800
                            userAttributes: ["email", "name"]
                          refreshToken:
                            validityPeriod: 86400
                        userInfo:
                          responseType: "JWS"
                          signingAlg: "RS256"
                          userAttributes: ["email", "name", "given_name", "family_name"]
                        scopeClaims:
                          profile: ["name", "family_name", "given_name"]
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCompleteResponse'
              example:
                id: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
                ouId: "456e8400-e29b-41d4-a716-446655440001"
                ouHandle: "platform/automations"
                type: "default"
                description: "Agent exposing calendar tools"
                owner:
                  id: "e1b6ba6c-deb2-4d24-87b0-bbf79fa4487c"
                  idType: uuid
                  isLocal: true
                attributes:
                  name: "Calendar Agent"
                  model: "claude-3-5-sonnet"
                  modelProvider: "anthropic"
                authFlowId: "edc013d0-e893-4dc0-990c-3e1d203e005b"
                registrationFlowId: "f1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e"
                isRegistrationFlowEnabled: false
                themeId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                layoutId: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
                allowedUserTypes: ["employee", "contractor"]
                assertion:
                  validityPeriod: 3600
                  userAttributes: ["email", "username"]
                loginConsent:
                  validityPeriod: 86400
                inboundAuthConfig:
                  - type: "oauth2"
                    config:
                      clientId: "calendar_agent_client"
                      clientSecret: "s3cr3t_only_shown_once"
                      redirectUris:
                        - "https://calendar-agent.example.com/callback"
                      grantTypes:
                        - "authorization_code"
                        - "refresh_token"
                      responseTypes:
                        - "code"
                      tokenEndpointAuthMethod: "client_secret_basic"
                      pkceRequired: true
                      publicClient: false
                      requirePushedAuthorizationRequests: false
                      scopes:
                        - "openid"
                        - "profile"
                        - "calendar:read"
                      certificate:
                        type: "JWKS_URI"
                        value: "https://calendar-agent.example.com/.well-known/jwks"
                      token:
                        accessToken:
                          userConfig:
                            validityPeriod: 3600
                            attributes: ["email", "username"]
                        idToken:
                          validityPeriod: 1800
                          userAttributes: ["email", "name"]
                        refreshToken:
                          validityPeriod: 86400
                      userInfo:
                        responseType: "JWS"
                        signingAlg: "RS256"
                        userAttributes: ["email", "name", "given_name", "family_name"]
                      scopeClaims:
                        profile: ["name", "family_name", "given_name"]
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-lifespan:
                  summary: validUntil is not an RFC 3339 date and time
                  value:
                    code: "AGT-1045"
                    message:
                      key: "error.agentservice.invalid_lifespan"
                      defaultValue: "Invalid lifespan"
                    description:
                      key: "error.agentservice.invalid_lifespan_description"
                      defaultValue: "validUntil must be an RFC 3339 date and time, or null for an agent that does not expire"
                lifespan-not-in-future:
                  summary: validUntil is not later than the current time
                  value:
                    code: "AGT-1046"
                    message:
                      key: "error.agentservice.lifespan_not_in_future"
                      defaultValue: "Lifespan must end in the future"
                    description:
                      key: "error.agentservice.lifespan_not_in_future_description"
                      defaultValue: "validUntil must be later than the current time"
                invalid-request-format:
                  summary: Malformed request body
                  value:
                    code: "AGT-1001"
                    message:
                      key: "error.agentservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.agentservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-redirect-uri:
                  summary: Invalid redirect URI
                  value:
                    code: "AGT-1002"
                    message:
                      key: "error.agentservice.invalid_redirect_uri"
                      defaultValue: "Invalid redirect URI"
                    description:
                      key: "error.agentservice.invalid_redirect_uri_description"
                      defaultValue: "One or more redirect URIs are not valid"
                invalid-grant-type:
                  summary: Invalid grant type
                  value:
                    code: "AGT-1003"
                    message:
                      key: "error.agentservice.invalid_grant_type"
                      defaultValue: "Invalid grant type"
                    description:
                      key: "error.agentservice.invalid_grant_type_description"
                      defaultValue: "One or more grant types are not supported"
                missing-delegation-grant-type:
                  summary: A delegated agent has no grant type that lets it act for a user
                  value:
                    code: "AGT-1044"
                    message:
                      key: "error.agentservice.missing_delegation_grant_type"
                      defaultValue: "Missing required grant types for a delegated agent"
                    description:
                      key: "error.agentservice.missing_delegation_grant_type_description"
                      defaultValue: "A delegated agent needs at least one of these grant types: {{param(grantTypes)}}"
                device-grant-flow-required:
                  summary: Device Code is enabled without a Device Grant flow
                  value:
                    code: "AGT-1065"
                    message:
                      key: "error.agentservice.device_grant_flow_required"
                      defaultValue: "Device Grant flow is required"
                    description:
                      key: "error.agentservice.device_grant_flow_required_description"
                      defaultValue: "Assign a Device Grant flow before enabling the Device Code grant type"
                invalid-device-grant-flow:
                  summary: The assigned flow is invalid
                  value:
                    code: "AGT-1066"
                    message:
                      key: "error.agentservice.invalid_device_grant_flow_id"
                      defaultValue: "Invalid Device Grant flow ID"
                    description:
                      key: "error.agentservice.invalid_device_grant_flow_id_description"
                      defaultValue: "The assigned flow must be a valid Device Grant flow"
                conflicting-flow-references:
                  summary: A configured flow invokes a different flow than the agent assignment
                  value:
                    code: "AGT-1067"
                    message:
                      key: "error.agentservice.agent_flow_mismatch"
                      defaultValue: "Conflicting flow references"
                    description:
                      key: "error.agentservice.agent_flow_mismatch_description"
                      defaultValue: "The {{param(sourceFlowType)}} flow references a different {{param(flowType)}} flow than the one configured on the agent. Both must point to the same {{param(flowType)}} flow."
                invalid-project:
                  summary: The project does not exist
                  value:
                    code: "AGT-1047"
                    message:
                      key: "error.agentservice.invalid_project"
                      defaultValue: "Invalid project"
                    description:
                      key: "error.agentservice.invalid_project_description"
                      defaultValue: "No project exists with the given project ID"
                ou-not-in-project:
                  summary: The organization unit is outside the project
                  value:
                    code: "AGT-1048"
                    message:
                      key: "error.agentservice.ou_not_in_project"
                      defaultValue: "Organization unit not in project"
                    description:
                      key: "error.agentservice.ou_not_in_project_description"
                      defaultValue: "The organization unit must belong to the project"
                ou-mismatch:
                  summary: The organization unit is outside the agent type's organization unit tree
                  value:
                    code: "AGT-1053"
                    message:
                      key: "error.agentservice.organization_unit_mismatch"
                      defaultValue: "Organization unit mismatch"
                    description:
                      key: "error.agentservice.organization_unit_mismatch_description"
                      defaultValue: "The organization unit does not match the agent type configuration: it must be the agent type's organization unit or one of its descendants"
                agent-type-not-found:
                  summary: The agent type does not exist, or the caller cannot read it
                  value:
                    code: "AGT-1054"
                    message:
                      key: "error.agentservice.agent_type_not_found"
                      defaultValue: "Agent type not found"
                    description:
                      key: "error.agentservice.agent_type_not_found_description"
                      defaultValue: "No agent type with that handle exists, or the caller cannot view it"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "AGT-1005"
                    message:
                      key: "error.agentservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.agentservice.organization_unit_not_found_description"
                      defaultValue: "The specified organization unit does not exist"
                invalid-agent-type:
                  summary: Missing agent type
                  value:
                    code: "AGT-1010"
                    message:
                      key: "error.agentservice.invalid_agent_type"
                      defaultValue: "Invalid agent type"
                    description:
                      key: "error.agentservice.invalid_agent_type_description"
                      defaultValue: "The agent type must be provided"
                invalid-auth-flow-id:
                  summary: Referenced auth flow does not exist
                  value:
                    code: "AGT-1028"
                    message:
                      key: "error.agentservice.invalid_auth_flow_id"
                      defaultValue: "Invalid auth flow ID"
                    description:
                      key: "error.agentservice.invalid_auth_flow_id_description"
                      defaultValue: "The provided authentication flow ID is invalid"
                invalid-oauth-configuration:
                  summary: OAuth config constraint violation
                  value:
                    code: "AGT-1021"
                    message:
                      key: "error.agentservice.invalid_oauth_configuration"
                      defaultValue: "Invalid OAuth configuration"
                    description:
                      key: "error.agentservice.invalid_oauth_configuration_description"
                      defaultValue: "The provided OAuth configuration is invalid"
                invalid-token-endpoint-auth-method:
                  summary: Unsupported token endpoint auth method
                  value:
                    code: "AGT-1022"
                    message:
                      key: "error.agentservice.invalid_token_endpoint_auth_method"
                      defaultValue: "Invalid token endpoint authentication method"
                    description:
                      key: "error.agentservice.invalid_token_endpoint_auth_method_description"
                      defaultValue: "The provided token endpoint authentication method is not supported"
                invalid-public-client:
                  summary: Public client misconfiguration
                  value:
                    code: "AGT-1023"
                    message:
                      key: "error.agentservice.invalid_public_client_configuration"
                      defaultValue: "Invalid public client configuration"
                    description:
                      key: "error.agentservice.invalid_public_client_configuration_description"
                      defaultValue: "The public client configuration is invalid"
                invalid-certificate-type:
                  summary: Unsupported certificate type
                  value:
                    code: "AGT-1024"
                    message:
                      key: "error.agentservice.invalid_certificate_type"
                      defaultValue: "Invalid certificate type"
                    description:
                      key: "error.agentservice.invalid_certificate_type_description"
                      defaultValue: "The provided certificate type is not supported"
                invalid-certificate-value:
                  summary: Missing or malformed certificate value
                  value:
                    code: "AGT-1025"
                    message:
                      key: "error.agentservice.invalid_certificate_value"
                      defaultValue: "Invalid certificate value"
                    description:
                      key: "error.agentservice.invalid_certificate_value_description"
                      defaultValue: "The provided certificate value is invalid or missing"
                invalid-jwks-uri:
                  summary: JWKS URI is not SSRF-safe
                  value:
                    code: "AGT-1026"
                    message:
                      key: "error.agentservice.invalid_jwks_uri"
                      defaultValue: "Invalid JWKS URI"
                    description:
                      key: "error.agentservice.invalid_jwks_uri_description"
                      defaultValue: "The JWKS URI must be a publicly reachable HTTPS URL"
                schema-validation-failed:
                  summary: Attribute schema validation failed
                  value:
                    code: "AGT-1015"
                    message:
                      key: "error.agentservice.schema_validation_failed"
                      defaultValue: "Schema validation failed"
                    description:
                      key: "error.agentservice.schema_validation_failed_description"
                      defaultValue: "The provided attributes failed schema validation"
                invalid-credential:
                  summary: Invalid credential value
                  value:
                    code: "AGT-1016"
                    message:
                      key: "error.agentservice.invalid_credential"
                      defaultValue: "Invalid credential"
                    description:
                      key: "error.agentservice.invalid_credential_description"
                      defaultValue: "The provided credential is invalid"
                invalid-registration-flow-id:
                  summary: Referenced registration flow does not exist
                  value:
                    code: "AGT-1029"
                    message:
                      key: "error.agentservice.invalid_registration_flow_id"
                      defaultValue: "Invalid registration flow ID"
                    description:
                      key: "error.agentservice.invalid_registration_flow_id_description"
                      defaultValue: "The provided registration flow ID is invalid"
                error-retrieving-flow-definition:
                  summary: Flow definition could not be fetched
                  value:
                    code: "AGT-1030"
                    message:
                      key: "error.agentservice.error_retrieving_flow_definition"
                      defaultValue: "Error retrieving flow definition"
                    description:
                      key: "error.agentservice.error_retrieving_flow_definition_description"
                      defaultValue: "An error occurred while retrieving the flow definition"
                invalid-user-type:
                  summary: Allowed user type does not exist
                  value:
                    code: "AGT-1031"
                    message:
                      key: "error.agentservice.invalid_user_type"
                      defaultValue: "Invalid user type"
                    description:
                      key: "error.agentservice.invalid_user_type_description"
                      defaultValue: "One or more specified allowed user types are invalid"
                theme-not-found:
                  summary: Referenced theme does not exist
                  value:
                    code: "AGT-1032"
                    message:
                      key: "error.agentservice.theme_not_found"
                      defaultValue: "Theme not found"
                    description:
                      key: "error.agentservice.theme_not_found_description"
                      defaultValue: "The specified theme does not exist"
                layout-not-found:
                  summary: Referenced layout does not exist
                  value:
                    code: "AGT-1033"
                    message:
                      key: "error.agentservice.layout_not_found"
                      defaultValue: "Layout not found"
                    description:
                      key: "error.agentservice.layout_not_found_description"
                      defaultValue: "The specified layout does not exist"
                invalid-response-type:
                  summary: Unsupported response type
                  value:
                    code: "AGT-1034"
                    message:
                      key: "error.agentservice.invalid_response_type"
                      defaultValue: "Invalid response type"
                    description:
                      key: "error.agentservice.invalid_response_type_description"
                      defaultValue: "One or more provided response types are invalid"
                certificate-client-error:
                  summary: Certificate operation failed due to invalid input
                  value:
                    code: "AGT-1036"
                    message:
                      key: "error.agentservice.certificate_operation_failed"
                      defaultValue: "Certificate operation failed"
                    description:
                      key: "error.agentservice.certificate_operation_failed_description"
                      defaultValue: "A certificate operation failed due to invalid input"
                multiple-oauth-configs:
                  summary: More than one OAuth inbound auth config supplied
                  value:
                    code: "AGT-1038"
                    message:
                      key: "error.agentservice.multiple_oauth_configs"
                      defaultValue: "Multiple OAuth inbound auth configs are not allowed"
                    description:
                      key: "error.agentservice.multiple_oauth_configs_description"
                      defaultValue: "An entity may have at most one inbound auth config per protocol"
                owner-not-found:
                  summary: Owner does not resolve to an existing entity
                  value:
                    code: "AGT-1039"
                    message:
                      key: "error.agentservice.owner_not_found"
