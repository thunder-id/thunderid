guides:
  - id: protecting-routes
    title: Protecting routes
    icon: shield
    description: Guard a route tree so unauthenticated visitors are sent through sign-in, covering React Router, TanStack
      Router, and a hand-rolled guard.
    intro: Securing routes protects sensitive data and keeps parts of the application to signed-in users. Pick the router
      your application uses, or build your own guard from the SDK primitives.
    sections:
    - type: steps
      id: setup
      title: Set up route protection
      tabs:
      - label: React Router
        blurb: The official `@thunderid/react-router` package provides a `ProtectedRoute` component that guards a route
          and sends unauthenticated visitors to sign-in.
        steps:
        - title: Installation
          code:
            lang: bash
            content: npm install @thunderid/react-router
        - title: Basic Setup with ProtectedRoute
          code:
            file: src/App.tsx
            lang: tsx
            content: |2-

              function App() {
                return (
                  <ThunderIDProvider
                    baseUrl="https://localhost:8090"
                    clientId="your-client-id"
                  >
                    <BrowserRouter>
                      <Routes>
                        <Route path="/" element={<div>Public Home Page</div>} />
                        <Route path="/signin" element={<SignIn />} />
                        <Route
                          path="/dashboard"
                          element={
                            <ProtectedRoute redirectTo="/signin">
                              <Dashboard />
                            </ProtectedRoute>
                          }
                        />
                        <Route
                          path="/profile"
                          element={
                            <ProtectedRoute redirectTo="/signin">
                              <Profile />
                            </ProtectedRoute>
                          }
                        />
                      </Routes>
                    </BrowserRouter>
                  </ThunderIDProvider>
                )
              }

              export default App
        - title: Custom Fallback and Loading States
          description: 'You can customize the behavior of `ProtectedRoute` with custom fallback components and loading
            states:'
          code:
            file: src/App.tsx
            lang: tsx
            content: |2-

              // Redirect to custom login page
              <Route
                path="/dashboard"
                element={
                  <ProtectedRoute redirectTo="/login">
                    <Dashboard />
                  </ProtectedRoute>
                }
              />

              // Custom fallback component
              <Route
                path="/dashboard"
                element={
                  <ProtectedRoute
                    fallback={
                      <div className="auth-required">
                        <h2>Please sign in</h2>
                        <p>You need to be signed in to access this page.</p>
                      </div>
                    }
                  >
                    <Dashboard />
                  </ProtectedRoute>
                }
              />

              // Custom loading state
              <Route
                path="/dashboard"
                element={
                  <ProtectedRoute redirectTo="/signin" loader={<div className="spinner">Loading...</div>}>
                    <Dashboard />
                  </ProtectedRoute>
                }
              />
        - title: Integration with Layouts
          description: 'Protect multiple routes using a shared layout:'
          code:
            file: src/App.tsx
            lang: tsx
            content: |2-

              function App() {
                return (
                  <BrowserRouter>
                    <Routes>
                      {/* Public routes */}
                      <Route path="/" element={<Home />} />
                      <Route path="/about" element={<About />} />
                      <Route path="/signin" element={<SignIn />} />

                      {/* Protected routes with layout */}
                      <Route path="/app" element={<AppLayout />}>
                        <Route
                          path="dashboard"
                          element={
                            <ProtectedRoute redirectTo="/signin">
                              <Dashboard />
                            </ProtectedRoute>
                          }
                        />
                        <Route
                          path="profile"
                          element={
                            <ProtectedRoute redirectTo="/signin">
                              <Profile />
                            </ProtectedRoute>
                          }
                        />
                        <Route
                          path="settings"
                          element={
                            <ProtectedRoute redirectTo="/signin">
                              <Settings />
                            </ProtectedRoute>
                          }
                        />
                      </Route>
                    </Routes>
                  </BrowserRouter>
                )
              }
      - label: TanStack Router
        blurb: The official `@thunderid/tanstack-router` package provides the same `ProtectedRoute` component for TanStack
          Router applications.
        steps:
        - title: Installation
          code:
            lang: bash
            content: npm install @thunderid/tanstack-router
        - title: Basic Setup with ProtectedRoute
          code:
            file: src/App.tsx
            lang: tsx
            content: |2-

              const rootRoute = createRootRoute({
                component: () => <div>Root Layout</div>,
              })

              const indexRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/',
                component: () => <div>Public Home Page</div>,
              })

              const signinRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/signin',
                component: SignIn,
              })

              const dashboardRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/dashboard',
                component: () => (
                  <ProtectedRoute redirectTo="/signin">
                    <Dashboard />
                  </ProtectedRoute>
                ),
              })

              const profileRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/profile',
                component: () => (
                  <ProtectedRoute redirectTo="/signin">
                    <Profile />
                  </ProtectedRoute>
                ),
              })

              const routeTree = rootRoute.addChildren([indexRoute, signinRoute, dashboardRoute, profileRoute])

              const router = createRouter({ routeTree })

              function App() {
                return (
                  <ThunderIDProvider
                    baseUrl="https://localhost:8090"
                    clientId="your-client-id"
                  >
                    <RouterProvider router={router} />
                  </ThunderIDProvider>
                )
              }

              export default App
        - title: Custom Fallback and Loading States
          code:
            file: src/routes.tsx
            lang: tsx
            content: |2-

              // Redirect to custom login page
              const dashboardRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/dashboard',
                component: () => (
                  <ProtectedRoute redirectTo="/login">
                    <Dashboard />
                  </ProtectedRoute>
                ),
              })

              // Custom fallback component
              const dashboardRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/dashboard',
                component: () => (
                  <ProtectedRoute
                    fallback={
                      <div className="auth-required">
                        <h2>Please sign in</h2>
                        <p>You need to be signed in to access this page.</p>
                      </div>
                    }
                  >
                    <Dashboard />
                  </ProtectedRoute>
                ),
              })

              // Custom loading state
              const dashboardRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/dashboard',
                component: () => (
                  <ProtectedRoute redirectTo="/signin" loader={<div className="spinner">Loading...</div>}>
                    <Dashboard />
                  </ProtectedRoute>
                ),
              })
        - title: Integration with Layouts
          code:
            file: src/App.tsx
            lang: tsx
            content: |2-

              const rootRoute = createRootRoute({
                component: () => <div>Root Layout</div>,
              })

              // Public routes
              const indexRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/',
                component: Home,
              })

              const aboutRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/about',
                component: About,
              })

              const signinRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/signin',
                component: SignIn,
              })

              // Protected routes with layout
              const appLayoutRoute = createRoute({
                getParentRoute: () => rootRoute,
                path: '/app',
                component: AppLayout,
              })

              const appDashboardRoute = createRoute({
                getParentRoute: () => appLayoutRoute,
                path: '/dashboard',
                component: () => (
                  <ProtectedRoute redirectTo="/signin">
                    <Dashboard />
                  </ProtectedRoute>
                ),
              })

              const appProfileRoute = createRoute({
                getParentRoute: () => appLayoutRoute,
                path: '/profile',
                component: () => (
                  <ProtectedRoute redirectTo="/signin">
                    <Profile />
                  </ProtectedRoute>
                ),
              })

              const appSettingsRoute = createRoute({
                getParentRoute: () => appLayoutRoute,
                path: '/settings',
                component: () => (
                  <ProtectedRoute redirectTo="/signin">
                    <Settings />
                  </ProtectedRoute>
                ),
              })

              const routeTree = rootRoute.addChildren([
                indexRoute,
                aboutRoute,
                signinRoute,
                appLayoutRoute.addChildren([appDashboardRoute, appProfileRoute, appSettingsRoute]),
              ])

              const router = createRouter({ routeTree })

              function App() {
                return (
                  <ThunderIDProvider
                    baseUrl="https://localhost:8090"
                    clientId="your-client-id"
                  >
                    <RouterProvider router={router} />
                  </ThunderIDProvider>
                )
              }

              export default App
      - label: Custom implementation
        blurb: Prefer full control? Build a guard from the SDK primitives so you can run your own logic before a route
          renders.
        steps:
        - title: Basic Custom Route Guard
          code:
            file: src/App.tsx
            lang: tsx
            content: |2-

              const ProtectedRoute = ({ children }: { children: ReactNode }) => {
                const { isSignedIn } = useThunderID()

                if (!isSignedIn) {
                  return <Unauthenticated />
                }

                return children
              }

              const App = () => {
                return (
                  <Routes>
                    <Route
                      path="/contact"
                      element={
                        <ProtectedRoute>
                          <Contact />
                        </ProtectedRoute>
                      }
                    />
                    <Route path="/" element={<Home />} />
                    <Route path="*" element={<PageNotFound />} />
                  </Routes>
                )
              }

              export default App
        - title: Advanced Custom Implementation
          description: 'You can extend the basic pattern to include loading states, redirects, and custom logic:'
          code:
            file: src/components/ProtectedRoute.tsx
            lang: tsx
            content: |2-

              interface ProtectedRouteProps {
                children: ReactNode
                redirectTo?: string
                fallback?: ReactNode
                requireRole?: string
              }

              export const ProtectedRoute = ({
                children,
                redirectTo = '/signin',
                fallback,
                requireRole,
              }: ProtectedRouteProps) => {
                const { isSignedIn, user, loading } = useThunderID()

                // Show loading state while authentication is being checked
                if (loading) {
                  return <div>Loading...</div>
                }

                // Redirect to sign-in if not authenticated
                if (!isSignedIn) {
                  if (fallback) {
                    return <>{fallback}</>
                  }
                  return <Navigate to={redirectTo} replace />
                }

                // Check for required role if specified
                if (requireRole && user?.roles && !user.roles.includes(requireRole)) {
                  return <div>You don't have permission to access this page</div>
                }

                return <>{children}</>
              }

  - id: accessing-protected-apis
    title: Accessing protected APIs
    icon: key
    description: Attach an access token to requests against your own resource server.
    intro: Once a user is signed in, calls to your own APIs need the access token attached. Pick the client you use.
    sections:
    - type: steps
      id: calling-apis
      title: Call a protected API
      tabs:
      - label: Using SDK Built-in HTTP Client
        blurb: 'When your application is wrapped with `ThunderIDProvider`, you can use the `useThunderID` hook to access
          the authenticated `http` module. This module has the following features: - Includes the necessary authentication
          headers (Bearer token) - Handles token refresh when tokens expire - Provides methods like `request()` and
          `requestAll()` for making API calls :::tip Accessing the HTTP Client You can access the `http` client in two
          ways: 1. **Inside a component**: Use the `useThunderID` hook to get the `http` instance 2. **Outside a component**
          (e.g., in utility functions or services): Import `http` directly :::'
        steps:
        - title: Basic API Request
          description: 'The following examples show how to use the {{ProductName}} SDK''s `http` module to call a protected
            API endpoint. #### Using the Hook Inside a Component'
          code:
            file: src/UserProfile.jsx
            lang: jsx
            content: |-
              import React, { useEffect, useState } from 'react'
              import { useThunderID } from '@thunderid/react'

              export default function UserProfile() {
                const { http, isSignedIn } = useThunderID()
                const [userData, setUserData] = useState(null)

                useEffect(() => {
                  if (!isSignedIn) {
                    return
                  }

                  (async () => {
                    try {
                      const response = await http.request({
                        url: 'https://localhost:8090/users/<user_id>',
                        headers: {
                          Accept: 'application/json',
                          'Content-Type': 'application/json',
                        },
                        method: 'GET',
                      })

                      setUserData(response.data)
                    } catch (error) {
                      console.error('Error fetching user data:', error)
                    }
                  })()
                }, [http, isSignedIn])

                if (!isSignedIn) {
                  return <div>Please sign in to view your profile.</div>
                }

                return (
                  <div>
                    <h2>User Profile</h2>
                    {userData && <pre>{JSON.stringify(userData, null, 2)}</pre>}
                  </div>
                )
              }
        - title: Parallel API Requests
          description: 'To send multiple API requests in parallel, use the `httpRequestAll` function. It triggers parallel
            network requests and returns responses after all requests are completed. The following code snippet shows
            how to send multiple network requests in parallel:'
          code:
            file: src/UserProfile.jsx
            lang: jsx
            content: |-
              import React, { useEffect, useState } from 'react'
              import { useThunderID } from '@thunderid/react'

              export default function UserProfile() {
                const { http, isSignedIn } = useThunderID()
                const [ userData, setUserData ] = useState({
                  profile: null,
                  applications: [],
                })

                useEffect(() => {
                  if (!isSignedIn) {
                    return
                  }

                  const requests = []

                  requests.push({
                    headers: {
                      Accept: 'application/json',
                      'Content-Type': 'application/json',
                    },
                    method: 'GET',
                    url: 'https://localhost:8090/users/<user_id>',
                  })

                  requests.push({
                    headers: {
                      Accept: 'application/json',
                      'Content-Type': 'application/json',
                    },
                    method: 'GET',
                    url: 'https://localhost:8090/applications',
                  })

                  (async () => {
                    try {
                      const response = await http.requestAll(requests)

                      setUserData({
                        profile: response[0].data,
                        applications: response[1].data,
                      })
                    } catch (error) {
                      console.error('Error fetching data:', error)
                    }
                  })()
                }, [http, isSignedIn])

                return <pre>{JSON.stringify(userData, null, 4)}</pre>
              }
      - label: Using a GraphQL Client
        blurb: 'If you are not using `webWorker` as the storage type, use the `getAccessToken` function to fetch the
          access token. Then manually attach the token to the GraphQL client''s authentication headers. :::note Storage
          Type Limitation This approach is not available when the storage type is set to `webWorker`. The SDK automatically
          manages the access token and does not expose it to the main thread. ::: The following example shows how to
          configure a GraphQL client with authentication using the access token: :::tip Replace `` with the actual user
          ID you want to fetch. This example uses Apollo Client, but you can apply the same pattern with other GraphQL
          clients like urql or graphql-request. :::'
        steps:
        - title: Set it up
          description: 'If you are not using `webWorker` as the storage type, use the `getAccessToken` function to fetch
            the access token. Then manually attach the token to the GraphQL client''s authentication headers. :::note
            Storage Type Limitation This approach is not available when the storage type is set to `webWorker`. The
            SDK automatically manages the access token and does not expose it to the main thread. ::: The following
            example shows how to configure a GraphQL client with authentication using the access token:'
          code:
            file: src/graphql/client.js
            lang: jsx
            content: |-
              import { ApolloClient, InMemoryCache, createHttpLink } from '@apollo/client'
              import { setContext } from '@apollo/client/link/context'

              export function createAuthenticatedClient(accessToken) {
                const httpLink = createHttpLink({
                  uri: 'https://localhost:8090/graphql',
                })

                const authLink = setContext((_, { headers }) => {
                  return {
                    headers: {
                      ...headers,
                      authorization: accessToken ? `Bearer ${accessToken}` : '',
                    },
                  }
                })

                return new ApolloClient({
                  link: authLink.concat(httpLink),
                  cache: new InMemoryCache(),
                })
              }

