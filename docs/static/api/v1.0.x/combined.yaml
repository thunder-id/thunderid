        flowStatus:
          type: string
          description: Status of the flow execution
          enum:
            - ERROR
          example: ERROR
        error:
          $ref: "#/components/schemas/Error"
    Data:
      type: object
      properties:
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/Input"
          description: Required input data for the next flow step
        redirectURL:
          type: string
          description: Redirect URL for the next step in the flow if applicable
          example: https://example.com/redirect
        additionalData:
          type: object
          additionalProperties:
            type: string
          description: Additional information provided by the flow step
          example:
            idpName: <idp_name>
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
          description: Available actions for the current flow step
        meta:
          type: object
          description: >
            UI rendering metadata for display-only PROMPT nodes, returned when
            executing in verbose mode.

            Contains a `components` array describing the elements to render
            (headings, body text, images, etc.).
          example:
            components:
              - id: heading_001
                type: TEXT
                category: DISPLAY
                variant: HEADING_3
                label: You're All Set
              - id: body_001
                type: TEXT
                category: DISPLAY
                variant: BODY_1
                label: You have successfully completed the registration.
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          description: Per-field validation failures returned when one or more submitted
            values violate the rules declared on `data.inputs[].validation`.
            Each failing rule produces a separate entry. The server discards the
            submitted values for the failing fields and re-presents the same
            step (`inputs` and `actions` arrays remain populated) so the client
            can re-render the form and the user can resubmit corrected values.
          example:
            - identifier: username
              message: "{{i18n(validation:email.invalid)}}"
            - identifier: password
              message: "{{i18n(validation:password.minLength.invalid)}}"
    Input:
      type: object
      properties:
        ref:
          type: string
          description: Reference name of the input field, used for mapping user inputs to
            the meta components
          example: input_username
        identifier:
          type: string
          description: Name of the input field
          example: username
        type:
          type: string
          description: Type of the input field
          example: TEXT_INPUT
        required:
          type: boolean
          description: Whether the input is required
          example: true
        options:
          type: array
          items:
            type: string
          description: Allowed values for SELECT-type inputs
          example:
            - option1
            - option2
        validation:
          type: array
          items:
            $ref: "#/components/schemas/ValidationRule"
          description: "Server-enforced validation rules applied to the submitted value
            after the required-input presence check. When any rule fails, the
            response returns `flowStatus: INCOMPLETE` with the failing rules
            listed under `data.fieldErrors`."
    ValidationRule:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Constraint type. Each rule object carries exactly one constraint.
          enum:
            - regex
            - minLength
            - maxLength
          example: regex
        value:
          description: >
            Constraint parameter. `regex` takes a regex pattern string.
            `minLength` and

            `maxLength` take a non-negative integer applied to the Unicode code
            point

            count of the submitted value.
          oneOf:
            - type: string
            - type: integer
              minimum: 0
          example: ^[0-9]{10}$
        message:
          type: string
          description: >
            Message returned in `data.fieldErrors` when the rule fails. Accepts
            a

            literal string or an i18n key (for example,

            `{{i18n(validation:phone.pattern.invalid)}}`). The server returns
            the

            value as is. When omitted, the server returns a default key for the

            rule type (`validation.pattern.invalid`,
            `validation.minLength.invalid`,

            or `validation.maxLength.invalid`).
          example: "{{i18n(validation:phone.pattern.invalid)}}"
    FieldError:
      type: object
      required:
        - identifier
        - message
      properties:
        identifier:
          type: string
          description: Identifier of the input field whose validation rule failed
          example: username
        message:
          type: string
          description: |
            Message from the failing validation rule, returned as is from the
            rule's `message` field or the default i18n key for the rule type.
          example: "{{i18n(validation:email.invalid)}}"
    FlowListResponse:
