sections:
  - type: api
    id: api
    title: API reference
    intro: Every export is fully typed. The signatures and props below come from the package's own reference documentation,
      so what is listed here is what the installed version ships.
    kindTones:
      export: neutral
    exports:
    - group: Clients
      kind: export
      name: ThunderIDNodeClient
      description: '`ThunderIDNodeClient` is an abstract base class that extends `ThunderIDJavaScriptClient` with Node.js-specific
        configuration. Use this class as the foundation when building a new framework-specific authentication client
        for a Node.js runtime. Examples include adapters for other Node.js server frameworks.'
      example: |-
        import { ThunderIDNodeClient, ThunderIDNodeConfig } from '@thunderid/node'

        interface MyFrameworkConfig extends ThunderIDNodeConfig {
          customOption?: string
        }

        class MyFrameworkClient extends ThunderIDNodeClient<MyFrameworkConfig> {
          // Add framework-specific methods or override inherited ones here
        }

        export default MyFrameworkClient
    - group: Config
      kind: export
      name: ThunderIDNodeConfig
      description: '`ThunderIDNodeConfig` is the configuration type for the {{ProductName}} Node.js SDK. The type extends
        the base `Config` from `@thunderid/javascript` and adds a Node.js-specific option for controlling session cookie
        lifetime.'
      example: |-
        import { ThunderIDNodeConfig } from '@thunderid/node'

        const config: ThunderIDNodeConfig = {
          clientId: '<your-client-id>',
          serverOrigin: 'https://localhost:8090',
          afterSignInUrl: 'http://localhost:3000/callback',
          afterSignOutUrl: 'http://localhost:3000',
          sessionCookieExpiryTime: 28800, // 8 hours
        }
    - group: Utilities
      kind: export
      name: CookieConfig
      description: '`CookieConfig` is a constants class that exposes the default values used for session cookie configuration
        in the {{ProductName}} Node.js SDK. Use these constants when setting cookies for session management or when
        passing options to `getSessionCookieOptions`.'
      example: |-
        import { CookieConfig } from '@thunderid/node'

        // Use the default session cookie name
        res.cookie(CookieConfig.SESSION_COOKIE_NAME, sessionId, {
          httpOnly: CookieConfig.DEFAULT_HTTP_ONLY,
          maxAge: CookieConfig.DEFAULT_MAX_AGE * 1000, // convert to milliseconds
          sameSite: CookieConfig.DEFAULT_SAME_SITE,
          secure: CookieConfig.DEFAULT_SECURE,
        })
    - group: Utilities
      kind: export
      name: CookieOptions
      description: '`CookieOptions` defines the shape of cookie configuration options used in the {{ProductName}} Node.js
        SDK. Pass a `CookieOptions` object to `getSessionCookieOptions` to override the default cookie settings.'
      example: |-
        interface CookieOptions {
          httpOnly?: boolean
          maxAge?: number
          sameSite?: boolean | 'lax' | 'strict' | 'none'
          secure?: boolean
        }
    - group: Utilities
      kind: export
      name: generateSessionId()
      description: '`generateSessionId` generates a unique session identifier string. Use this utility to create a new
        session ID when a user signs in and store the value in a cookie or server-side session store.'
      example: |-
        import { generateSessionId, CookieConfig, getSessionCookieOptions } from '@thunderid/node'

        app.get('/sign-in', (req, res) => {
          const sessionId = generateSessionId()

          res.cookie(
            CookieConfig.SESSION_COOKIE_NAME,
            sessionId,
            getSessionCookieOptions({ maxAge: 3600 }),
          )

          auth.signIn(
            (authUrl) => res.redirect(authUrl),
            sessionId,
          )
        })
    - group: Utilities
      kind: export
      name: getSessionCookieOptions()
      description: '`getSessionCookieOptions` merges the provided partial `CookieOptions` with the default values from
        `CookieConfig`. Any property you omit falls back to its default.'
      rowsLabel: Parameters
      rows:
      - name: options
        type: Partial
        tag: required
        description: Cookie options to apply. Unspecified properties use the defaults from `CookieConfig`.
      example: |-
        import { getSessionCookieOptions } from '@thunderid/node'

        // Override only maxAge; all other properties use defaults
        const options = getSessionCookieOptions({ maxAge: 86400 }) // 24 hours

  - type: quickstart
    id: quickstart
    title: Get started
    intro: Provider, session, and a protected route, start to finish.
    label: Connect your application
