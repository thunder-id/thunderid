openapi: 3.0.3
info:
  title: Resource Server Management API
  version: "1.0"
  description: |
    Resource servers in ThunderID define the permission namespace for a protected API or service; resources and actions nested within them form the permission strings used in role assignments.
    Resources can be nested hierarchically, and permissions are derived from the handle-based path structure.
    Resource Server identifier is required and must be unique within the system. Identifiers that are URLs with a host are compared for uniqueness after RFC 3986 normalization: scheme and host are case-insensitive, and an http or https URL that ends at the host is the same as one ending in "/". Ports, paths, queries, and all other identifiers are compared exactly. An MCP resource server's identifier must be an http or https URL with no fragment.
    Resource, and Action handles are unique under it's parent and are immutable after creation and used directly for permission derivation.
    Resource parent hierarchy is immutable after creation.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Resource Servers
    description: Register and manage resource servers that define OAuth2 permission scopes.
  - name: Resources
    description: Manage hierarchical resources within a resource server.
  - name: Actions
    description: Define actions on resources; actions map directly to OAuth2 scopes used in permission grants.
  - name: Permissions
    description: Preview and retrieve derived permissions based on the resource handle hierarchy.
  - name: Resource Server Sharing
    description: |
      Share a resource server with other organization units. A reached organization unit gets the whole
      resource server: every resource, sub-resource and action it defines. A policy cannot yet grant or
      withhold part of it, so its only overlay rule is `permissions` with `editable: false`, the same as
      stating no rule.

security:
  - OAuth2: [system]

paths:
  /resource-servers:
    get:
      tags:
        - Resource Servers
      summary: List resource servers
      description: |
        Lists the resource servers the caller may read. A caller confined to an organization unit lists the
        resource servers that organization unit owns, followed by the ones shared with it, as a list filtered
        by that organization unit does.
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
        - $ref: '#/components/parameters/resourceServerProjectIdQueryParam'
        - $ref: '#/components/parameters/resourceServerFilterQueryParam'
      responses:
        "200":
          description: List of resource servers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServerListResponse'
              example:
                totalResults: 5
                startIndex: 1
                count: 2
                resourceServers:
                  - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Booking System"
                    description: "Handles all booking operations"
                    identifier: "https://api.example.com/booking"
                    type: "API"
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    delimiter: ":"
                  - id: "257e528f-eb24-48b6-884d-20460e190957"
                    name: "Property Management"
                    description: "Property and facility management"
                    identifier: "https://api.example.com/property"
                    type: "CUSTOM"
                    ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    delimiter: ":"
                links:
                  - href: "resource-servers?offset=2&limit=2"
                    rel: "next"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "RES-1011"
                    message:
                      key: "error.resourceservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.resourceservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "RES-1012"
                    message:
                      key: "error.resourceservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.resourceservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
                invalid-filter:
                  summary: Invalid filter parameter
                  value:
                    code: "RES-1027"
                    message:
                      key: "error.resourceservice.invalid_filter_parameter"
                      defaultValue: "Invalid filter parameter"
                    description:
                      key: "error.resourceservice.invalid_filter_parameter_description"
                      defaultValue: "The filter must be a single ouId eq expression with a quoted organization unit ID"
                result-limit-exceeded:
                  summary: Result limit exceeded in composite mode
                  value:
                    code: "RES-1021"
                    message:
                      key: "error.resourceservice.result_limit_exceeded_in_composite_mode"
                      defaultValue: "Result limit exceeded in composite mode"
                    description:
                      key: "error.resourceservice.result_limit_exceeded_in_composite_mode_description"
                      defaultValue: "The total number of records exceeds the maximum limit in composite mode"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    post:
      tags:
        - Resource Servers
      summary: Create a new resource server
      description: Creates a new resource server with the specified details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceServerRequest'
            example:
              name: "Booking System"
              description: "Handles all booking operations"
              identifier: "https://api.example.com/booking"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
      responses:
        "201":
          description: Resource server created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System"
                description: "Handles all booking operations"
                identifier: "https://api.example.com/booking"
                type: "CUSTOM"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "RES-1001"
                    message:
                      key: "error.resourceservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "RES-1010"
                    message:
                      key: "error.resourceservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.resourceservice.organization_unit_not_found_description"
                      defaultValue: "The specified organization unit does not exist"
                invalid-delimiter:
                  summary: Invalid delimiter
                  value:
                    code: "RES-1015"
                    message:
                      key: "error.resourceservice.invalid_delimiter"
                      defaultValue: "Invalid delimiter"
                    description:
                      key: "error.resourceservice.invalid_delimiter_description"
                      defaultValue: "Delimiter must be a single character from: a-z A-Z 0-9 . _ : - /"
                invalid-mcp-identifier:
                  summary: MCP server identifier is not an http or https URL
                  value:
                    code: "RES-1024"
                    message:
                      key: "error.resourceservice.invalid_mcp_identifier"
                      defaultValue: "Invalid MCP server identifier"
                    description:
                      key: "error.resourceservice.invalid_mcp_identifier_description"
                      defaultValue: "Use an http or https URL with no fragment, such as https://mcp.example.com/mcp"
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Name conflict
                  value:
                    code: "RES-1004"
                    message:
                      key: "error.resourceservice.name_conflict"
                      defaultValue: "Name conflict"
                    description:
                      key: "error.resourceservice.name_conflict_description"
                      defaultValue: "A resource server with the same name already exists"
                identifier-conflict:
                  summary: Identifier conflict
                  value:
                    code: "RES-1013"
                    message:
                      key: "error.resourceservice.identifier_conflict"
                      defaultValue: "Identifier conflict"
                    description:
                      key: "error.resourceservice.identifier_conflict_description"
                      defaultValue: "A resource server with the same identifier already exists"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /resource-servers/{id}:
    get:
      tags:
        - Resource Servers
      summary: Get resource server details
      description: |
        Returns resource server metadata. A caller confined to an organization unit the resource server is
        shared with reads it under that organization unit, with `isOwnedByOU` set to false and `isReadOnly`
        set to true, and reads its resources and actions too. It cannot change them.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System"
                description: "Handles all booking operations"
                identifier: "https://api.example.com/booking"
                type: "API"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1002"
                message:
                  key: "error.resourceservice.missing_id"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.resourceservice.missing_id_description"
                  defaultValue: "Resource server ID is required"
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1003"
                message:
                  key: "error.resourceservice.resource_server_not_found"
                  defaultValue: "Resource server not found"
                description:
                  key: "error.resourceservice.resource_server_not_found_description"
                  defaultValue: "The resource server with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    put:
      tags:
        - Resource Servers
      summary: Update resource server
      description: |
        Updates resource server name, description, identifier, and organization unit. A resource server
        with sharing policies stays in its organization unit and project: delete its policies before moving
        it.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceServerRequest'
            example:
              name: "Booking System Updated"
              description: "Updated description for booking operations"
              identifier: "https://api.example.com/booking/v2"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
              authorizationEngine:
                type: authzen_pdp
                properties:
                  pdpConnectionId: "05d6e254-a3ca-49dd-89b7-2cf78fee6b23"
      responses:
        "200":
          description: Resource server updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "Booking System Updated"
                description: "Updated description for booking operations"
                identifier: "https://api.example.com/booking/v2"
                type: "API"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                delimiter: ":"
                authorizationEngine:
                  type: authzen_pdp
                  properties:
                    pdpConnectionId: "05d6e254-a3ca-49dd-89b7-2cf78fee6b23"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-id:
                  summary: Missing resource server ID
                  value:
                    code: "RES-1002"
                    message:
                      key: "error.resourceservice.missing_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.missing_id_description"
                      defaultValue: "Resource server ID is required"
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "RES-1001"
                    message:
                      key: "error.resourceservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "RES-1010"
                    message:
                      key: "error.resourceservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.resourceservice.organization_unit_not_found_description"
                      defaultValue: "The specified organization unit does not exist"
                immutable-resource-server:
                  summary: Cannot modify declarative resource server
                  value:
                    code: "RES-1018"
                    message:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server"
                      defaultValue: "Cannot modify declarative resource server"
                    description:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server_description"
                      defaultValue: "Resource server is defined in declarative configuration and cannot be modified"
                shared-resource-server-cannot-move:
                  summary: A shared resource server moved to another organization unit or project
                  value:
                    code: "RES-1037"
                    message:
                      key: "error.resourceservice.shared_resource_server_cannot_move"
                      defaultValue: "Resource server with sharing policies cannot be moved"
                    description:
                      key: "error.resourceservice.shared_resource_server_cannot_move_description"
                      defaultValue: "The resource server is shared into other organization units. Delete its sharing policies before moving it to another organization unit or project"
                resource-server-used-in-ou:
                  summary: A move away from an organization unit whose roles use the resource server
                  value:
                    code: "RES-1039"
                    message:
                      key: "error.resourceservice.resource_server_used_in_ou"
                      defaultValue: "Resource server is used in an organization unit"
                    description:
                      key: "error.resourceservice.resource_server_used_in_ou_description"
                      defaultValue: "Roles of an organization unit this change takes the resource server from still hold its permissions. Remove those permissions from the roles first"
                invalid-mcp-identifier:
                  summary: MCP server identifier is not an http or https URL
                  value:
                    code: "RES-1024"
                    message:
                      key: "error.resourceservice.invalid_mcp_identifier"
                      defaultValue: "Invalid MCP server identifier"
                    description:
                      key: "error.resourceservice.invalid_mcp_identifier_description"
                      defaultValue: "Use an http or https URL with no fragment, such as https://mcp.example.com/mcp"
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Resource server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RES-1003"
                message:
                  key: "error.resourceservice.resource_server_not_found"
                  defaultValue: "Resource server not found"
                description:
                  key: "error.resourceservice.resource_server_not_found_description"
                  defaultValue: "The resource server with the specified id does not exist"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name-conflict:
                  summary: Name conflict
                  value:
                    code: "RES-1004"
                    message:
                      key: "error.resourceservice.name_conflict"
                      defaultValue: "Name conflict"
                    description:
                      key: "error.resourceservice.name_conflict_description"
                      defaultValue: "A resource server with the same name already exists"
                identifier-conflict:
                  summary: Identifier conflict
                  value:
                    code: "RES-1013"
                    message:
                      key: "error.resourceservice.identifier_conflict"
                      defaultValue: "Identifier conflict"
                    description:
                      key: "error.resourceservice.identifier_conflict_description"
                      defaultValue: "A resource server with the same identifier already exists"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    delete:
      tags:
        - Resource Servers
      summary: Delete a resource server by id
      description: |
        Deletes a resource server. Cannot delete if it has resources or actions. The sharing policies
        recorded for the resource server are deleted with it.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Resource server deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-id:
                  summary: Missing resource server ID
                  value:
                    code: "RES-1002"
                    message:
                      key: "error.resourceservice.missing_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.resourceservice.missing_id_description"
                      defaultValue: "Resource server ID is required"
                cannot-delete:
                  summary: Cannot delete resource server
                  value:
                    code: "RES-1006"
                    message:
                      key: "error.resourceservice.cannot_delete"
                      defaultValue: "Cannot delete resource server"
                    description:
                      key: "error.resourceservice.cannot_delete_description"
                      defaultValue: "Cannot delete resource server that has resources or actions"
                immutable-resource-server:
                  summary: Cannot delete declarative resource server
                  value:
                    code: "RES-1018"
                    message:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server"
                      defaultValue: "Cannot modify declarative resource server"
                    description:
                      key: "error.resourceservice.cannot_modify_declarative_resource_server_description"
                      defaultValue: "Resource server is defined in declarative configuration and cannot be modified"
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SSE-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /resource-servers/{id}/sharing-policies:
    parameters:
      - $ref: '#/components/parameters/resourceServerIdPathParam'
    post:
      tags:
        - Resource Server Sharing
      summary: Create a sharing policy
      description: |
        Records one organization unit's decision about which other organization units this resource server
        is shared with. Exactly one policy exists per resource server per initiating organization unit; a
        second create is refused.

        A resource server declared in a resource file, or deployed from the control plane, carries its
        owner's policy with it, so this endpoint refuses one for it. An organization unit that policy shares
        with can still record its own reshare here, unless resource servers are configured to load from
        resource files only: then all of their sharing, reshares included, is declared, and this endpoint
        refuses every policy.
      requestBody:
        $ref: '#/components/requestBodies/ResourceServerSharingPolicyCreate'
      responses:
        "201":
          $ref: '#/components/responses/ResourceServerSharingPolicyCreated'
        "400":
          $ref: '#/components/responses/ResourceServerSharingPolicyCreateBadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceServerSharingNotFound'
        "409":
          $ref: '#/components/responses/ResourceServerSharingPolicyConflict'
        "500":
          $ref: '#/components/responses/ResourceServerSharingServerError'
    get:
      tags:
        - Resource Server Sharing
      summary: List sharing policies
      description: |
        Returns the resource server's sharing policies, declared ones included. A policy a resource file
        declares is listed with `isReadOnly` set to true and cannot be edited or deleted here. A caller who
        may read resource servers in the owning organization unit sees every policy; any other caller sees
        the ones its own organization units issued.
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          $ref: '#/components/responses/ResourceServerSharingPolicyList'
        "400":
          $ref: '#/components/responses/ResourceServerSharingPolicyListBadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceServerSharingNotFound'
        "500":
          $ref: '#/components/responses/ResourceServerSharingServerError'

  /resource-servers/{id}/sharing-policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/resourceServerIdPathParam'
      - $ref: '#/components/parameters/resourceServerSharingPolicyIdPathParam'
    get:
      tags:
        - Resource Server Sharing
      summary: Get a sharing policy
      responses:
        "200":
          $ref: '#/components/responses/ResourceServerSharingPolicyReturned'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceServerSharingPolicyNotFound'
        "500":
          $ref: '#/components/responses/ResourceServerSharingServerError'
    put:
      tags:
        - Resource Server Sharing
      summary: Replace a sharing policy
      description: |
        Replaces the policy's sections. `version` must be the policy's current version; a stale one is
        refused.

        A section reaching a whole group (`mode: all`, or `allUnits`) keeps that reach and can only change
        its `excludedOuIds`. A section naming units can add or drop them, but cannot become one that reaches
        a whole group.

        Refused for resource servers that load from resource files only.
      requestBody:
        $ref: '#/components/requestBodies/ResourceServerSharingPolicyUpdate'
      responses:
        "200":
          $ref: '#/components/responses/ResourceServerSharingPolicyReturned'
        "400":
          $ref: '#/components/responses/ResourceServerSharingPolicyUpdateBadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceServerSharingPolicyNotFound'
        "409":
          $ref: '#/components/responses/ResourceServerSharingPolicyConflict'
        "500":
          $ref: '#/components/responses/ResourceServerSharingServerError'
    delete:
      tags:
        - Resource Server Sharing
      summary: Delete a sharing policy
      description: |
        Removes the policy and the policies its sharees issued beneath it.

        A declared policy cannot be deleted here. Its existence belongs to the resource file that declares
        it, so it goes away by being removed from that file. Where resource servers load from resource files
        only, no policy is deleted here.
      responses:
        "204":
          description: Sharing policy deleted, or the resource server holds no policy under that id.
        "400":
          $ref: '#/components/responses/ResourceServerSharingPolicyDeleteBadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceServerSharingNotFound'
        "500":
          $ref: '#/components/responses/ResourceServerSharingServerError'

  /resource-servers/{id}/overlay-rules:
    parameters:
      - $ref: '#/components/parameters/resourceServerIdPathParam'
    get:
      tags:
        - Resource Server Sharing
      summary: Overlay rules for an organization unit
      description: |
        Answers for one organization unit, named in the `ouId` query parameter: whether it owns the
        resource server, which policies reached it, and the permissions it holds there. `rules.permissions`
        lists every permission the resource server defines, with `editable: false`: a reached organization
        unit gets the whole resource server and cannot choose its own permissions.

        An organization unit no policy reaches answers `404`, because the resource server is not available
        there.
      parameters:
        - in: query
          name: ouId
          required: true
          description: The organization unit to resolve for.
          schema:
            type: string
          example: "acme-customer-a"
      responses:
        "200":
          $ref: '#/components/responses/ResourceServerOverlayRules'
        "400":
          $ref: '#/components/responses/ResourceServerOverlayRulesBadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceServerOverlayNotResolvable'
        "500":
          $ref: '#/components/responses/ResourceServerSharingServerError'

