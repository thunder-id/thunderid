guides:
  - id: accessing-protected-apis
    title: Accessing Protected APIs
    icon: key
    description: Make authenticated API requests from an Android application using OkHttp with automatic bearer token
      injection.
    intro: When your app needs to call a backend API that requires authentication, use `ThunderIDClient.getAccessToken()`
      to retrieve a valid access token and attach it as a Bearer token to your requests. The SDK automatically refreshes
      the token if it has expired.
    sections:
    - type: steps
      id: steps
      title: Accessing Protected APIs
      steps:
      - title: Using HttpURLConnection
        description: 'The following example calls a protected API endpoint using the standard Android `HttpURLConnection`:'
        code:
          file: ApiClient.kt
          lang: kotlin
          content: |2-

            suspend fun fetchProtectedResource(thunder: ThunderIDState): String {
                val token = thunder.client.getAccessToken()

                return withContext(Dispatchers.IO) {
                    val connection = URL("https://localhost:8090/api/resource").openConnection() as HttpURLConnection
                    connection.setRequestProperty("Authorization", "Bearer $token")
                    connection.setRequestProperty("Accept", "application/json")

                    check(connection.responseCode in 200..299) {
                        "Request failed: ${connection.responseCode}"
                    }

                    connection.inputStream.bufferedReader().readText()
                }
            }
      - title: Token Refresh
        description: '`getAccessToken()` refreshes the access token automatically when it is expired, as long as a valid
          refresh token is available. You do not need to handle refresh manually. If the refresh token is also expired,
          `getAccessToken()` throws `IAMException` with code `SESSION_EXPIRED`. Handle this by signing the user out:'
        code:
          lang: kotlin
          content: |-
            try {
                val token = thunder.client.getAccessToken()
                // use token
            } catch (e: IAMException) {
                if (e.code == IAMErrorCode.SESSION_EXPIRED) {
                    runCatching { thunder.client.signOut() }
                    thunder.refresh()
                } else {
                    println("Unexpected error: $e")
                }
            }
      - title: Using OkHttp
        description: 'If your project uses [OkHttp](https://square.github.io/okhttp/), create an `Interceptor` that
          injects the access token:'
        code:
          file: ThunderIDInterceptor.kt
          lang: kotlin
          content: |2-

            class ThunderIDInterceptor(private val thunder: ThunderIDState) : Interceptor {
                override fun intercept(chain: Interceptor.Chain): Response {
                    val token = runBlocking { thunder.client.getAccessToken() }
                    val request = chain.request().newBuilder()
                        .addHeader("Authorization", "Bearer $token")
                        .build()
                    return chain.proceed(request)
                }
            }
      - title: Using Retrofit
        description: 'If your project uses [Retrofit](https://square.github.io/retrofit/), combine it with the OkHttp
          interceptor above:'
        code:
          lang: kotlin
          content: |-
            val retrofit = Retrofit.Builder()
                .baseUrl("https://localhost:8090/")
                .client(
                    OkHttpClient.Builder()
                        .addInterceptor(ThunderIDInterceptor(thunder))
                        .build()
                )
                .addConverterFactory(GsonConverterFactory.create())
                .build()

            val api = retrofit.create(MyApiService::class.java)
  - id: try-the-sample-app
    title: Try the Android Sample App
    icon: terminal
    description: Run the {{ProductName}} Android sample app to see the full authentication lifecycle end to end.
    intro: 'The SDK repository ships a sample app in [`samples/quickstart`](https://github.com/thunder-id/android-sdks/tree/main/samples/quickstart)
      that exercises the full authentication lifecycle end to end: sign-in, sign-up, and sign-out via the SDK''s app-native
      Flow Execution. } />'
    sections:
    - type: steps
      id: steps
      title: Try the Android Sample App
      steps:
      - title: Prerequisites
        description: '- Android Studio 2022.3+ - A running {{ProductName}} instance'
      - title: Prepare the Android Sample
        code:
          lang: bash
          content: |-
            cd samples/quickstart
            cp config.properties.example config.properties
      - title: Configure the Android Sample
        description: 'This sample uses app-native authentication (Flow Execution API), so only the base URL and application
          ID are required, no OAuth2 client ID or redirect URIs. | Variable | Description | |----------|-------------|
          | `THUNDERID_BASE_URL` | Base URL of your {{ProductName}} server (HTTPS) | | `THUNDERID_APPLICATION_ID` |
          Application UUID from {{ProductName}} console | `config.properties` is gitignored. Never commit real credentials.
          If your {{ProductName}} server is running on `localhost`, don''t use `localhost` in `THUNDERID_BASE_URL` directly:
          - **Emulator**: use `https://10.0.2.2:8090`, the emulator''s alias for your host machine''s loopback. - **Physical
          device**: run `adb reverse tcp:8090 tcp:8090` to forward the port over USB and keep using `https://localhost:8090`,
          or point the URL at your host machine''s LAN IP.'
      - title: Attestation via Google Play Integrity (optional)
        description: 'If the application enforces Google Play Integrity attestation, set `THUNDERID_ATTESTATION_ENABLED=true`
          and `THUNDERID_CLOUD_PROJECT_NUMBER` to the number (not the ID) of the Google Cloud project linked to your
          Play Console app, then rebuild. When enabled, the sample mints a token via `PlayIntegrityTokenProvider` (Play
          Integrity Standard API) and sends it with every native flow-initiate request. Testing this end-to-end requires:
          - The app uploaded to a Play Console listing (an internal testing track is enough) with your test device''s
          Google account added as a tester, so Play recognizes the package name and signing certificate. - The Play
          Integrity API enabled on the linked Google Cloud project. - A release build signed with the certificate registered
          on the {{ProductName}} application''s attestation config (`certificateSha256Digests`), a debug-signed APK
          will fail the signing-identity check.'
      - title: Passkeys (WebAuthn)
        description: 'Passkey registration/authentication via Jetpack Credential Manager (`CreatePublicKeyCredentialRequest`/`GetPublicKeyCredentialOption`
          in `PasskeyClient`) requires the server''s passkey relying party (`rp.id`) to be a real HTTPS domain, not
          `localhost` or `10.0.2.2`. Android verifies the caller is allowed to use that `rp.id` via **Digital Asset
          Links**: the domain must serve `https:///.well-known/assetlinks.json` declaring this app''s package name and
          signing certificate SHA-256 fingerprint(s) under `delegate_permission/common.get_login_creds`. Without this,
          Credential Manager rejects the ceremony. This sample ships `assetlinks.json.example` with a placeholder `sha256_cert_fingerprints`
          entry for the sample''s `applicationId` (`dev.thunderid.Quickstart`). To exercise passkeys end-to-end: 1.
          Rename/copy `assetlinks.json.example` to `assetlinks.json` and replace `` with the SHA-256 fingerprint of
          the signing certificate for the build you''ll test with (get it via `keytool -list -v -keystore -alias ` or
          `./gradlew signingReport` for a debug build). 2. Host that file at `https:///.well-known/assetlinks.json`,
          the domain must serve valid HTTPS (self-signed certs will not work). 3. Make sure the server''s passkey `rp.id`
          matches that same domain, the SDK''s `PasskeyClient` passes whatever `rp.id`/relying-party options the server
          returns straight through to Credential Manager. 4. No `AndroidManifest.xml` change is required for this, unlike
          iOS''s Associated Domains entitlement, Digital Asset Links verification is purely a server-hosted file requirement
          and does not need an App Links intent filter (this sample doesn''t declare one). Exposing a local {{ProductName}}
          instance under a real, HTTPS-reachable domain (e.g. via a tunnel) is left to you, this sample only wires up
          the template file/documentation, not the tunnel itself.'
      - title: Run
        description: Open in Android Studio, sync Gradle, and run on an API 24+ emulator or device.
      - title: Next Steps
        description: '- [Accessing Protected APIs](../accessing-protected-apis): Make authenticated API requests from
          an Android application using OkHttp with automatic bearer token injection'

