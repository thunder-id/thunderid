status: ga
package:
  name: "@thunderid/nextjs"
  manager: npm
description: Authentication for Next.js with full App Router and server-component support.
docs:
  overview: /docs/next/sdks-and-tools/nextjs/overview
  apiReference: /docs/next/sdks-and-tools/nextjs/apis
