resource_type: application
id: decl-m2m-selected
name: M2M Service (Selected Children)
description: Backend service usable on behalf of named child organization units only
ouId: decl-m2m-root
type: fullstack
template: web
url: https://example.com
# Children named one by one. Each target reaches the unit it names and stops there, so a sibling
# nobody named is not reached and neither is anything beneath a named one.
sharingPolicies:
  - id: decl-m2m-selected-policy-1
    targets:
      - scope: child
        ouId: decl-m2m-child-a
      - scope: child
        ouId: decl-m2m-child-b
inboundAuthConfig:
  - type: "oauth2"
    config:
      clientId: "decl-m2m-selected-client"
      clientSecret: "decl-m2m-selected-secret"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            # Opt in to the organization unit claims so the token states which organization it was
            # issued for. On an /ou/{ouId} request these resolve to the accessing OU, not the owner.
            attributes:
              - ouId
              - ouName
              - ouHandle
