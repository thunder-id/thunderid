                readOnly: true
                description: "Indicates whether the user type is defined declaratively and cannot be modified through the API"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    CreateUserTypeRequest:
      type: object
      required: [handle, displayName, ouId, schema]
      properties:
        handle:
          type: string
          description: |
            Unique handle for the user type (lowercase letters, numbers, hyphens, and underscores only).
            The handle must be unique among user types. Once set, the handle cannot be changed.
          pattern: '^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$'
          maxLength: 100
          example: "partner"
        displayName:
          type: string
          description: "Human-readable name of the user type. It does not need to be unique."
          minLength: 1
          maxLength: 100
          example: "Partner"
        ouId:
          type: string
          format: uuid
          description: "The organization unit ID where this user type schema is applicable"
        allowSelfRegistration:
          type: boolean
          description: "Whether the user type supports user-initiated registration"
          default: false
        systemAttributes:
          $ref: "#/components/schemas/UserType/properties/systemAttributes"
        schema:
          type: object
          description: "JSON Schema definition for the user type"
          additionalProperties:
            $ref: "#/components/schemas/UserType/properties/schema/additionalProperties"

    UpdateUserTypeRequest:
      type: object
      required: [displayName, ouId, schema]
      properties:
        handle:
          type: string
          description: |
            Optional. The handle cannot be changed, so when provided it must match the handle the user
            type was created with. When omitted, the existing handle is kept.
          pattern: '^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$'
          maxLength: 100
          example: "customer"
        displayName:
          type: string
          description: "Human-readable name of the user type. It does not need to be unique."
          minLength: 1
          maxLength: 100
          example: "Customer"
        ouId:
          type: string
          format: uuid
          description: "The root organization unit ID where this user type schema is applicable"
        allowSelfRegistration:
          type: boolean
          description: "Whether the user type supports user-initiated registration"
          default: false
        systemAttributes:
          $ref: "#/components/schemas/UserType/properties/systemAttributes"
        schema:
          type: object
          description: "JSON Schema definition for the user type"
          additionalProperties:
            $ref: "#/components/schemas/UserType/properties/schema/additionalProperties"

    SharingPolicyRequest:
      type: object
      additionalProperties: false
      description: |
        One organization unit's decision about this user. A policy states up to two
        sections through this endpoint, and at least one: `childUnits` for the organization units
        beneath the issuer, and `otherTreeRoots` for the roots of other trees. Each section either
        reaches a whole group or names the organization units it reaches, never both.

        A user shared with nobody has no policy at all.
      anyOf:
        - required: [childUnits]
        - required: [otherTreeRoots]
      properties:
        initiatingOuId:
          type: string
          description: |
            The organization unit whose decision this is. Omitted means the user's owner. A
            unit other than the owner may only issue a policy where the user already reached
            it and stopped there, and such a policy may state `childUnits` only.
          example: "acme-root"
        childUnits:
          $ref: '#/components/schemas/ChildUnits'
        otherTreeRoots:
          $ref: '#/components/schemas/OtherTreeRootsSelected'
        version:
          type: integer
          description: |
            The policy version the caller believes it is editing. Required on an edit, ignored on a
            create.
          example: 1

    SharingPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: |
        A replacement for a policy's sections. Whose decision the policy is cannot change, so an
        edit names no `initiatingOuId`. It is held to the rules of a create, with these differences.

        Each section keeps its kind. A section that reaches a whole group (`mode: all`, or
        `allUnits`) stays one: its `excludedOuIds` can be added to or removed from, but the section
        cannot be dropped or turned into one that names units. That is also how a policy that
        already reaches every organization unit, or the root of every other tree, keeps that reach
        here although a create may not state it. A section that names units may add or drop units,
        change a unit's `reach`, or be removed, but cannot become one that reaches a whole group.

        An edit cannot reach past an organization unit that has already shared the user on. Widening
        that unit from `unit` to `subtree` is refused until the policy it issued is removed.
      anyOf:
        - required: [allUnits]
        - required: [childUnits]
        - required: [otherTreeRoots]
      properties:
        allUnits:
          $ref: '#/components/schemas/AllUnits'
        childUnits:
          $ref: '#/components/schemas/ChildUnits'
        otherTreeRoots:
          $ref: '#/components/schemas/OtherTreeRoots'
        version:
          type: integer
          description: |
            The policy version the caller believes it is editing. An edit against any other version
            is refused, so a caller that has not seen the current one cannot overwrite it.
          example: 1

    AllUnits:
      type: object
      additionalProperties: false
      description: |
        Every organization unit in the deployment, at any depth, including units created later. It
        stands alone: a policy that states it states neither `childUnits` nor `otherTreeRoots`.

        A reach not bounded by the issuer's own position in the tree is a deployment decision, so
        it is written where such decisions are reviewed: a resource file, or a document imported
        from one. A create through this API may not state it. A policy written that way still
        reads back through these endpoints, and an edit restates it to rewrite its exclusions.
      properties:
        excludedOuIds:
          type: array
          description: |
            Organization units withheld from the section, each taking everything beneath it out of
            reach as well. Any organization unit may be excluded.
          items:
            type: string
          example: ["acme-trial-customers"]

    ChildUnits:
      description: |
        The organization units beneath the issuer. Exactly one of the two shapes below, chosen by
        `mode`.
      oneOf:
        - $ref: '#/components/schemas/ChildUnitsAll'
        - $ref: '#/components/schemas/ChildUnitsSelected'
      discriminator:
        propertyName: mode
        mapping:
          all: '#/components/schemas/ChildUnitsAll'
          selected: '#/components/schemas/ChildUnitsSelected'

    ChildUnitsAll:
      type: object
      additionalProperties: false
      required: [mode]
      description: Everything beneath the issuing organization unit, at any depth, including units created later.
      properties:
        mode:
          type: string
          enum: [all]
        excludedOuIds:
          type: array
          description: |
            Organization units withheld from the section, each taking everything beneath it out of
            reach as well. Only organization units directly beneath the issuer may be excluded.
          items:
            type: string
          example: ["acme-trial-customers"]

    ChildUnitsSelected:
      type: object
      additionalProperties: false
      required: [mode, units]
      description: |
        Named organization units directly beneath the issuer. It takes no `excludedOuIds`: an
        organization unit is withheld by leaving it out of `units`.
      properties:
        mode:
          type: string
          enum: [selected]
        units:
          type: array
          minItems: 1
          description: The organization units reached. An organization unit is listed only once in a policy.
          items:
            $ref: '#/components/schemas/ChildUnit'

    ChildUnit:
      type: object
      additionalProperties: false
      required: [ouId, reach]
      properties:
        ouId:
          type: string
          description: A direct child of the issuing organization unit.
          example: "acme-customer-a"
        reach:
          type: string
          enum: [unit, subtree]
          description: |
            How far the user carries from the named organization unit. `unit` reaches it and
            nothing below it, which leaves it free to pass the user on itself. `subtree`
            reaches it and everything below it at any depth.
          example: unit

    OtherTreeRoots:
      description: |
        The root organization units of other trees, as a policy carries them. Every shape a create
        may send, plus the one that only a resource file or an imported document may introduce.

        An edit sends this shape rather than the create's, because a policy that already reaches
        the root of every other tree has to be able to restate that to rewrite its exclusions.
      oneOf:
        - $ref: '#/components/schemas/OtherTreeRootsSelected'
        - $ref: '#/components/schemas/OtherTreeRootsAll'
      discriminator:
        propertyName: mode
        mapping:
          selected: '#/components/schemas/OtherTreeRootsSelected'
          all: '#/components/schemas/OtherTreeRootsAll'

    OtherTreeRootsSelected:
      type: object
      additionalProperties: false
      required: [mode, units]
      description: |
        Named root organization units of other trees, and nothing below them. Owner only. Another
        tree is reached at its root alone; that root passes the user on within its own tree.
        The root of the owner's own tree is not another tree and cannot be named.

        When the owner sits below a root, this additionally requires
        `resource_sharing.allow_child_ou_cross_tree_sharing`.
      properties:
        mode:
          type: string
          enum: [selected]
        units:
          type: array
          minItems: 1
          description: The root organization units reached. An organization unit is listed only once in a policy.
          items:
            $ref: '#/components/schemas/RootUnit'

    OtherTreeRootsAll:
      type: object
      additionalProperties: false
      required: [mode]
      description: |
        The root organization unit of every other tree, including trees created later. Only a
        resource file or an imported document may introduce it, so a create never sends it.
      properties:
        mode:
          type: string
          enum: [all]
        excludedOuIds:
          type: array
          description: Root organization units withheld from the section, and with them their trees.
          items:
            type: string
          example: ["partner-root"]

    RootUnit:
      type: object
      additionalProperties: false
      required: [ouId]
      properties:
        ouId:
          type: string
          description: The root organization unit of another tree.
          example: "partner-root"

    SharingPolicy:
      type: object
      description: |
        A recorded sharing policy. Its sections come back in the shape a request states them in, so
        an edit copies them, with `version`, into a `SharingPolicyUpdateRequest`. The other fields
        are set by the server and are refused in a request body. A section the policy does not state
        is left out.
      properties:
        id:
          type: string
          description: The policy's own identifier.
          example: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
        initiatingOuId:
          type: string
          description: |
            The organization unit whose decision this policy is. The owning organization unit is
            not repeated here: it belongs to the user, which this path already names.
          example: "acme-root"
        stage:
          type: string
          enum: [share, reshare]
          description: "`share` when the owner issued it, `reshare` when a sharee did."
        parentPolicyId:
          type: string
          description: The policy that made this one's issuer able to see the user. Empty for an owner-issued policy.
        isReadOnly:
          type: boolean
          readOnly: true
          description: Indicates if the policy is defined in declarative configuration and cannot be modified.
        version:
          type: integer
          description: Bumped on every edit, and carried back on the next one.
          example: 1
        allUnits:
          $ref: '#/components/schemas/AllUnits'
        childUnits:
          $ref: '#/components/schemas/ChildUnits'
        otherTreeRoots:
          $ref: '#/components/schemas/OtherTreeRoots'

    SharingPolicyListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: How many policies the user has, not how many this page holds.
          example: 2
        startIndex:
          type: integer
          description: The one-based position of the first policy in this page.
          example: 1
        count:
          type: integer
          description: How many policies this page holds.
          example: 2
        policies:
          type: array
          items:
            $ref: '#/components/schemas/SharingPolicy'
        links:
          type: array
          description: Links to the first, previous, next and last pages, where they exist.
          items:
            $ref: '#/components/schemas/Link'
          example:
            - href: "/users/0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10/sharing-policies?offset=30&limit=30"
              rel: "next"

    ResolvedOverlay:
      type: object
      description: What one organization unit may do with the user.
      properties:
        ouId:
          type: string
          example: "acme-customer-a"
        owned:
          type: boolean
          description: Whether the organization unit owns the user rather than being shared it.
        visible:
          type: boolean
          description: |
            Whether the organization unit can see the user at all. This is what decides
            whether it may be named as the accessing organization unit on a token request.
        policyIds:
          type: array
          description: Every policy that contributed, so an answer is traceable to its inputs.
          items:
            type: string
        rules:
          type: object
          description: |
            The effective rule per templated field: which of the user's fields the
            organization unit may override, and on what terms. Always empty for now, because a
            user declares no templated fields yet.
          additionalProperties:
            $ref: '#/components/schemas/OverlayRule'

    OverlayRule:
      type: object
      description: What a reached organization unit may do with one field.
      properties:
        editable:
          type: boolean
        value:
          type: array
          items:
            type: string
        allowedValues:
          type: array
          items:
            type: string
        excludedValues:
          type: array
          items:
            type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Error code. Codes follow the USR-XXXX convention."
          example: "USR-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).
