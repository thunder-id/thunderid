sections:
  - type: api
    id: api
    title: API reference
    intro: Every export is fully typed. The signatures and props below come from the package's own reference documentation,
      so what is listed here is what the installed version ships.
    kindTones:
      export: neutral
      function: accent
    exports:
    - group: Flows
      kind: export
      name: Embedded Recovery Flow (V2)
      description: '`executeEmbeddedRecoveryFlowV2` drives a step-by-step account recovery flow (e.g., password reset)
        without a browser redirect.'
      rowsLabel: Parameters
      rows:
      - name: config.url
        type: string
        tag: required
        description: Full endpoint URL. Mutually exclusive with `baseUrl`
      - name: config.baseUrl
        type: string
        tag: required
        description: '{{ProductName}} base URL'
      - name: config.payload
        type: EmbeddedRecoveryFlowRequestV2
        tag: required
        description: Flow request body
      - name: config.payload.applicationId
        type: string
        tag: optional
        description: Application ID. Required for the first step
      - name: config.payload.flowType
        type: string
        tag: optional
        description: Recovery flow type (e.g., `'PASSWORD_RECOVERY'`). Required for first step
      - name: config.payload.executionId
        type: string
        tag: optional
        description: Execution ID from a prior response
      - name: config.payload.action
        type: string
        tag: optional
        description: Action to take at the current step
      - name: config.payload.inputs
        type: Record
        tag: optional
        description: Step input fields
      - name: config.payload.challengeToken
        type: string
        tag: optional
        description: Challenge token from a prior step
      example: |-
        import { executeEmbeddedRecoveryFlowV2, EmbeddedRecoveryFlowStatusV2 } from '@thunderid/javascript'

        // Step 1 — Initiate recovery
        const step1 = await executeEmbeddedRecoveryFlowV2({
          baseUrl: 'https://localhost:8090',
          payload: {
            applicationId: '<your-app-id>',
            flowType: 'PASSWORD_RECOVERY',
          },
        })

        // Step 2 — Provide the username/email to recover
        const step2 = await executeEmbeddedRecoveryFlowV2({
          baseUrl: 'https://localhost:8090',
          payload: {
            executionId: step1.executionId,
            inputs: {
              username: 'user@example.com',
            },
          },
        })

        // Step 3 — Submit the OTP/token received by email
        const step3 = await executeEmbeddedRecoveryFlowV2({
          baseUrl: 'https://localhost:8090',
          payload: {
            executionId: step2.executionId,
            inputs: {
              otp: '123456',
            },
            challengeToken: step2.challengeToken,
          },
        })

        if (step3.flowStatus === EmbeddedRecoveryFlowStatusV2.Complete) {
          // Recovery complete — prompt user for new password
        }
    - group: Flows
      kind: export
      name: Embedded Sign-In Flow (V1)
      description: 'These functions implement app-native (embedded) sign-in for the V1 flow protocol. They allow you
        to drive the authentication sequence step-by-step without a browser redirect to the identity provider. Used
        internally by `ThunderIDJavaScriptClient.getAgentToken()`. :::note For new integrations, prefer the V2 flow
        functions, which offer a richer response model and better error handling. :::'
      example: |-
        import { initializeEmbeddedSignInFlow } from '@thunderid/javascript'

        const response = await initializeEmbeddedSignInFlow({
          url: 'https://localhost:8090/oauth2/authorize',
          payload: {
            response_type: 'code',
            client_id: '<your-client-id>',
            redirect_uri: 'http://localhost:3000',
            scope: 'openid profile',
            state: '<random-state>',
            code_challenge: '<pkce-code-challenge>',
            code_challenge_method: 'S256',
            response_mode: 'direct',
          },
        })
    - group: Flows
      kind: export
      name: Embedded Sign-In Flow (V2)
      description: '`executeEmbeddedSignInFlowV2` drives a step-by-step sign-in sequence using the V2 flow protocol.
        It supports a richer response model with explicit error states, challenge tokens for multi-factor flows, and
        assertion-based completion.'
      rowsLabel: Parameters
      rows:
      - name: config.url
        type: string
        tag: required
        description: Full endpoint URL. Mutually exclusive with `baseUrl`
      - name: config.baseUrl
        type: string
        tag: required
        description: '{{ProductName}} base URL'
      - name: config.payload
        type: EmbeddedSignInFlowRequestV2
        tag: required
        description: Flow request body
      - name: config.payload.applicationId
        type: string
        tag: optional
        description: Application ID. Required for the first step
      - name: config.payload.flowType
        type: string
        tag: optional
        description: Flow type. Required for the first step (e.g., `'SIGN_IN'`)
      - name: config.payload.executionId
        type: string
        tag: optional
        description: Execution ID from a prior response. Required for subsequent steps
      - name: config.payload.action
        type: string
        tag: optional
        description: Action to take at the current step
      - name: config.payload.inputs
        type: Record
        tag: optional
        description: Step-specific input fields (e.g., credentials)
      - name: config.payload.challengeToken
        type: string
        tag: optional
        description: Challenge token from a prior step (e.g., for MFA)
      - name: config.authId
        type: string
        tag: optional
        description: Optional authentication context ID
      example: |-
        import { executeEmbeddedSignInFlowV2, EmbeddedSignInFlowStatusV2 } from '@thunderid/javascript'

        // Step 1 — Initiate the flow
        const step1 = await executeEmbeddedSignInFlowV2({
          baseUrl: 'https://localhost:8090',
          payload: {
            applicationId: '<your-app-id>',
            flowType: 'SIGN_IN',
          },
        })

        // Step 2 — Submit credentials
        const step2 = await executeEmbeddedSignInFlowV2({
          baseUrl: 'https://localhost:8090',
          payload: {
            executionId: step1.executionId,
            inputs: {
              username: 'user@example.com',
              password: 'password123',
            },
          },
        })

        if (step2.flowStatus === EmbeddedSignInFlowStatusV2.Complete) {
          const assertion = step2.assertion // Use to complete the OAuth code exchange
        }
