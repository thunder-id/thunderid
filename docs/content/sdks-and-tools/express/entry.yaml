sections:
  - type: api
    id: api
    title: API reference
    intro: Every export is fully typed. The signatures and props below come from the package's own reference documentation,
      so what is listed here is what the installed version ships.
    kindTones:
      middleware: primary
      class: purple
      export: neutral
    exports:
    - group: Middleware
      kind: middleware
      name: ThunderID Middleware
      description: The `thunderID()` function returns Express middleware that initializes a `ThunderIDExpressClient`
        and attaches it to both `req.thunderIDAuth` and `res.thunderIDAuth`.
      example: |-
        const express = require('express');
        const cookieParser = require('cookie-parser');
        const {thunderID, handleSignIn, handleSignOut} = require('@thunderid/express');

        const app = express();

        app.use(cookieParser());
        app.use(express.json());
        app.use(
          thunderID({
            baseUrl: 'https://localhost:8090',
            clientId: '<your-client-id>',
            clientSecret: '<your-client-secret>',
          }),
        );

        app.get('/login', handleSignIn());
        app.get('/logout', handleSignOut());
    - group: Middleware
      kind: middleware
      name: handleFlow()
      description: The `handleFlow()` function returns an Express route handler that advances the embedded sign-in flow
        and responds with JSON.
      example: |-
        const express = require('express');
        const cookieParser = require('cookie-parser');
        const {thunderID, handleFlow, handleSignIn, handleSignOut} = require('@thunderid/express');

        const app = express();

        app.use(cookieParser());
        app.use(express.json());
        app.use(
          thunderID({
            baseUrl: 'https://localhost:8090',
            clientId: '<your-client-id>',
            clientSecret: '<your-client-secret>',
            mode: 'embedded',
          }),
        );

        app.post('/flow/sign-in', handleFlow());
        app.get('/login', handleSignIn());
        app.get('/logout', handleSignOut());
    - group: Middleware
      kind: middleware
      name: handleSignIn()
      description: The `handleSignIn()` function returns an Express route handler for the sign-in path.
      example: |-
        const express = require('express');
        const cookieParser = require('cookie-parser');
        const {thunderID, handleSignIn} = require('@thunderid/express');

        const app = express();

        app.use(cookieParser());
        app.use(
          thunderID({
            baseUrl: 'https://localhost:8090',
            clientId: '<your-client-id>',
            clientSecret: '<your-client-secret>',
            afterSignInUrl: 'http://localhost:3000/login',
          }),
        );

        app.get('/login', handleSignIn());
    - group: Middleware
      kind: middleware
      name: handleSignOut()
      description: The `handleSignOut()` function returns an Express route handler for the sign-out path.
      example: |-
        const express = require('express');
        const cookieParser = require('cookie-parser');
        const {thunderID, handleSignOut} = require('@thunderid/express');

        const app = express();

        app.use(cookieParser());
        app.use(
          thunderID({
            baseUrl: 'https://localhost:8090',
            clientId: '<your-client-id>',
            clientSecret: '<your-client-secret>',
            afterSignOutUrl: 'http://localhost:3000/logout',
          }),
        );

        app.get('/logout', handleSignOut());
    - group: Middleware
      kind: middleware
      name: protect()
      description: The `protect()` function returns Express middleware that blocks unauthenticated requests.
      example: |-
        const {protect} = require('@thunderid/express');

        app.get('/protected', protect(), (_req, res) => {
          res.send('Protected content');
        });
    - group: Client
      kind: class
      name: ThunderIDExpressClient
      description: '`ThunderIDExpressClient` is the Express-aware client class exported by `@thunderid/express`. It
        extends `ThunderIDNodeClient` and adds Express-specific request and configuration access.'
      example: const {ThunderIDExpressClient} = require('@thunderid/express');
    - group: Configuration
      kind: export
      name: ExpressClientConfig
      description: '`ExpressClientConfig` is the main configuration type for `@thunderid/express`.'
      example: |-
        const {thunderID} = require('@thunderid/express');

        app.use(
          thunderID({
            baseUrl: 'https://localhost:8090',
            clientId: '<your-client-id>',
            clientSecret: '<your-client-secret>',
            afterSignInUrl: 'http://localhost:3000/login',
            afterSignOutUrl: 'http://localhost:3000/logout',
            sessionCookie: {
              expiryTime: 28800,
              httpOnly: true,
              sameSite: 'lax',
              secure: false,
            },
          }),
        );
    - group: Constants
      kind: export
      name: CookieConfig
      description: The Express SDK exports `CookieConfig` and `SESSION_COOKIE_NAME` for the session cookie behavior
        used by the SDK.
      example: |-
        const {SESSION_COOKIE_NAME} = require('@thunderid/express');

        app.get('/session-id', (req, res) => {
          res.json({sessionId: req.cookies?.[SESSION_COOKIE_NAME] ?? null});
        });

