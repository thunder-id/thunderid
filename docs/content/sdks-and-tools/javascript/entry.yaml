          },
        })
    - group: Flows
      kind: export
      name: Embedded Sign-Up Flow (V2)
      description: '`executeEmbeddedSignUpFlowV2` drives a step-by-step user registration flow using the V2 protocol.'
      rowsLabel: Parameters
      rows:
      - name: config.url
        type: string
        tag: required
        description: Full endpoint URL. Mutually exclusive with `baseUrl`
      - name: config.baseUrl
        type: string
        tag: required
        description: '{{ProductName}} base URL'
      - name: config.payload
        type: EmbeddedSignUpFlowRequestV2
        tag: required
        description: Flow request body
      - name: config.payload.applicationId
        type: string
        tag: optional
        description: Application ID. Required for the first step
      - name: config.payload.flowType
        type: string
        tag: optional
        description: Flow type. Required for the first step (e.g., `'REGISTRATION'`)
      - name: config.payload.executionId
        type: string
        tag: optional
        description: Execution ID from a prior response
      - name: config.payload.action
        type: string
        tag: optional
        description: Action to perform at the current step
      - name: config.payload.inputs
        type: Record
        tag: optional
        description: Registration field values
      - name: config.payload.challengeToken
        type: string
        tag: optional
        description: Challenge token for verification steps
      - name: config.authId
        type: string
        tag: optional
        description: Optional authentication context ID
      example: |-
        import { executeEmbeddedSignUpFlowV2, EmbeddedSignUpFlowStatusV2 } from '@thunderid/javascript'

        // Step 1 — Initiate
        const step1 = await executeEmbeddedSignUpFlowV2({
          baseUrl: 'https://localhost:8090',
          payload: {
            applicationId: '<your-app-id>',
            flowType: 'REGISTRATION',
          },
        })

        // Step 2 — Provide registration details
        const step2 = await executeEmbeddedSignUpFlowV2({
          baseUrl: 'https://localhost:8090',
          payload: {
            executionId: step1.executionId,
            inputs: {
              username: 'newuser@example.com',
              password: 'SecurePass123!',
              'http://wso2.org/claims/givenname': 'New',
              'http://wso2.org/claims/lastname': 'User',
            },
          },
        })

        if (step2.flowStatus === EmbeddedSignUpFlowStatusV2.Complete) {
          // Registration complete — redirect or sign in
        }
    - group: Flows
      kind: export
      name: Flow Meta (V2)
      description: '`getFlowMetaV2` fetches aggregated metadata for a V2 flow context, including application branding,
        organization unit details, theme configuration, and available translations. Use it to pre-load everything needed
        to render a custom sign-in or sign-up UI.'
      rowsLabel: Parameters
      rows:
      - name: config.url
        type: string
        tag: required
        description: Full endpoint URL. Mutually exclusive with `baseUrl`
      - name: config.baseUrl
        type: string
        tag: required
        description: '{{ProductName}} base URL'
      - name: config.type
        type: FlowMetaType
        tag: optional
        description: Scope the metadata to an application (`App`) or organization unit (`Ou`)
      - name: config.id
        type: string
        tag: optional
        description: Application ID or OU ID, depending on `type`
      - name: config.language
        type: string
        tag: optional
        description: BCP 47 language tag for the i18n metadata (e.g., `'en-US'`)
      - name: config.namespace
        type: string
        tag: optional
        description: Translation namespace filter
      example: |-
        import { getFlowMetaV2, FlowMetaType } from '@thunderid/javascript'

        const meta = await getFlowMetaV2({
          baseUrl: 'https://localhost:8090',
          type: FlowMetaType.App,
          id: '<your-app-id>',
          language: 'en-US',
        })

        console.log(meta.application?.name)
        console.log(meta.design.theme.colorSchemes)
        console.log(meta.i18n.translations)
    - group: Flows
