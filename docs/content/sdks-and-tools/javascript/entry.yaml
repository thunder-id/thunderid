# SDKs & tools registry entry. Schema: docs/src/types/ecosystem.ts
# Metadata for one entry. Its pages, when it has any, sit beside this file or
# under another content tree; `docs:` below says where.
id: javascript
name: JavaScript
icon: JavaScriptLogo
category: spa
type: sdk
origin: official
status: ga
package:
  name: "@thunderid/javascript"
  manager: npm
description: Framework-agnostic core that powers the browser, Node, and platform SDKs.
docs:
  overview: /docs/next/sdks-and-tools/javascript/overview
links:
  github: https://github.com/thunder-id/javascript-sdks
  package: https://www.npmjs.com/package/@thunderid/javascript
apiReference:
