<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" width="720" height="454" role="img"
     aria-label="Link Prompt View: a sign-in card asking the user to link this sign-in to an account it matched">
  <title>Link Prompt View</title>
  <desc>Mockup of the linking prompt: heading, explanatory line, the values the sign-in matched on as
  label and value rows, and two submit buttons carrying the CONFIRM and REJECT action types.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h3   { font-size: 20px; font-weight: 600; fill: #101828; }
      .body { font-size: 14px; fill: #475467; }
      .kvk  { font-size: 13px; fill: #475467; }
      .kvv  { font-size: 13px; font-weight: 500; fill: #101828; }
      .btn  { font-size: 14px; font-weight: 600; }
    </style>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#101828" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="720" height="454" fill="#f2f4f7"/>

  <!-- card -->
  <rect x="160" y="48" width="400" height="358" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#cardShadow)"/>

  <!-- TEXT, HEADING_3, forms.link_prompt.title -->
  <text x="192" y="92" class="sans h3">Link your account</text>

  <!-- TEXT, BODY_1, forms.link_prompt.description -->
  <text x="192" y="122" class="sans body">Your details matched the account below. Do you want to</text>
  <text x="192" y="142" class="sans body">link to it permanently?</text>

  <!-- KEY_VALUE_LIST, source: linkingPromptDetails. One row per matched local attribute, ordered by
       name, labelled with its schema display name, valued with what the federated identity supplied. -->
  <rect x="192" y="166" width="336" height="84" rx="8" fill="#f9fafb" stroke="#e4e7ec"/>
  <text x="208" y="196" class="sans kvk">Email</text>
  <text x="294" y="196" class="sans kvv">alex@example.com</text>
  <text x="208" y="228" class="sans kvk">Username</text>
  <text x="294" y="228" class="sans kvv">alex@example.com</text>

  <!-- ACTION, PRIMARY, submit, actionType CONFIRM, forms.link_prompt.actions.confirm.label -->
  <rect x="192" y="274" width="336" height="44" rx="8" fill="#1976d2"/>
  <text x="360" y="301" class="sans btn" fill="#ffffff" text-anchor="middle">Link account</text>

  <!-- ACTION, SECONDARY, submit, actionType REJECT, forms.link_prompt.actions.reject.label -->
  <rect x="192" y="330" width="336" height="44" rx="8" fill="#ffffff" stroke="#1976d2"/>
  <text x="360" y="357" class="sans btn" fill="#1976d2" text-anchor="middle">No, I want a separate account</text>
</svg>
