  /users/{id}/usages:
    get:
      tags:
        - Users
      summary: Get user usages
      description: |
        Returns the resources that reference this user, aggregated across all resource types.
        For example, agents that list this user as their owner. This endpoint is informational
        only — it drives the pre-delete confirmation dialog in the UI and does not gate deletion
        on the server.

        Each usage entry includes a `behaviorOnDelete` field describing what happens to the
        referencing resource if the user is deleted:
        - `fallback`: the reference is kept as-is.
        - `cascade`: the resource is permanently deleted along with the user.

        When usage data is unavailable (e.g. the server has not fully initialised),
        `totalResults` and `summary` are `null` rather than `0`/empty. Consumers must treat
        `null` as "unknown" and `0` as "confirmed empty".
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "The unique identifier of the user"
          example: "9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3"
      responses:
        "200":
          description: Resources that reference this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUsagesResponse'
              example:
                totalResults: 2
                count: 2
                summary:
                  agent: 2
                usages:
                  - resourceType: agent
                    id: "a1b2c3d4-0000-0000-0000-000000000001"
                    displayName: "Support Agent"
                    behaviorOnDelete: fallback
                  - resourceType: agent
                    id: "a1b2c3d4-0000-0000-0000-000000000002"
                    displayName: "Billing Agent"
                    behaviorOnDelete: fallback
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "USR-1003"
                message:
                  key: "error.userservice.user_not_found"
                  defaultValue: "User not found"
                description:
                  key: "error.userservice.user_not_found_description"
                  defaultValue: "The user with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "USR-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /users/{id}/sharing-policies:
    parameters:
      - $ref: '#/components/parameters/userIdPathParam'
    post:
      tags:
        - User Sharing
      summary: Create a sharing policy
      description: |
        Records one organization unit's decision about which other organization units this user is
        shared into. The user is not copied: the same identity becomes visible in the organization
        units the policy reaches, and keeps living in its own. Exactly one policy exists per user per
        initiating organization unit; a second create is refused.

        The caller must be allowed to update users in the initiating organization unit: the user's
        own unit for a share, or, for a reshare, a unit the user was already shared into. A user
        cannot share itself.

        A user declared in a resource file declares its owner's policy there too, so this endpoint
        refuses one for it. An organization unit the declared policy shares with can still record
        its own reshare here, unless users are configured to load from resource files only: then all
        of their sharing, reshares included, is declared, and this endpoint refuses every policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingPolicyRequest'
            examples:
              allChildUnits:
                summary: Every organization unit beneath the issuer
                value:
                  childUnits:
                    mode: all
              allChildUnitsWithExclusion:
                summary: Every organization unit beneath the issuer except one branch
                value:
                  childUnits:
                    mode: all
                    excludedOuIds: ["acme-trial-customers"]
              selectedChildUnits:
                summary: Named children, one at a time
                value:
                  childUnits:
                    mode: selected
                    units:
                      - ouId: "acme-customer-a"
                        reach: unit
                      - ouId: "acme-customer-b"
                        reach: unit
              childAndItsSubtree:
                summary: One direct child and everything beneath it
                value:
                  childUnits:
                    mode: selected
                    units:
                      - ouId: "acme-customer-a"
                        reach: subtree
              selectedRoots:
                summary: Named roots of other trees, owner only
                value:
                  otherTreeRoots:
                    mode: selected
                    units:
                      - ouId: "partner-root"
              childUnitsAndRoots:
                summary: Child units and roots of other trees together, owner only
                value:
                  childUnits:
                    mode: all
                  otherTreeRoots:
                    mode: selected
                    units:
                      - ouId: "partner-root"
              reshare:
                summary: A reshare issued by a sharee
                value:
                  initiatingOuId: "acme-customer-a"
                  childUnits:
                    mode: selected
                    units:
                      - ouId: "acme-customer-a-eu"
                        reach: unit
      responses:
        "201":
          description: Sharing policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
              example:
                id: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
                initiatingOuId: "acme-root"
                stage: share
                isReadOnly: false
                version: 1
                childUnits:
                  mode: all
                  excludedOuIds: ["acme-trial-customers"]
        "400":
          $ref: '#/components/responses/SharingPolicyCreateBadRequest'
        "404":
          $ref: '#/components/responses/SharingUserNotFound'
        "409":
          $ref: '#/components/responses/SharingPolicyConflict'
        "403":
          $ref: '#/components/responses/SharingForbidden'
        "500":
          $ref: '#/components/responses/SharingServerError'

    get:
      tags:
        - User Sharing
      summary: List sharing policies
      description: |
        Returns the user's sharing policies. A caller allowed to read users in the user's own
        organization unit sees every policy; any other caller sees only the policies its own
        organization units issued.
      parameters:
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: Sharing policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicyListResponse'
              example:
                totalResults: 2
                startIndex: 1
                count: 2
                policies:
                  # The owner's decision: customer A on its own, and customer B with
                  # everything beneath it.
                  - id: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
                    initiatingOuId: "acme-root"
                    stage: share
                    isReadOnly: false
                    version: 2
                    childUnits:
                      mode: selected
                      units:
                        - ouId: "acme-customer-a"
                          reach: unit
                        - ouId: "acme-customer-b"
                          reach: subtree
                  # Customer A carrying the user one hop further, which only a unit the
                  # owner's grant stops at may do. It names the policy that reached it.
                  - id: "0195a2c0-7b41-7c66-8f03-9d1e6a2b4c57"
                    initiatingOuId: "acme-customer-a"
                    stage: reshare
                    parentPolicyId: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
                    isReadOnly: false
                    version: 1
                    childUnits:
                      mode: selected
                      units:
                        - ouId: "acme-customer-a-eu"
                          reach: unit
        "400":
          $ref: '#/components/responses/SharingPolicyListBadRequest'
        "404":
          $ref: '#/components/responses/SharingUserNotFound'
        "403":
          $ref: '#/components/responses/SharingForbidden'
        "500":
          $ref: '#/components/responses/SharingServerError'


  /users/{id}/sharing-policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/userIdPathParam'
      - $ref: '#/components/parameters/sharingPolicyIdPathParam'
    get:
      tags:
        - User Sharing
      summary: Get a sharing policy
      responses:
        "200":
          description: Sharing policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
              example:
                id: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
                initiatingOuId: "acme-root"
                stage: share
                isReadOnly: false
                version: 2
                childUnits:
                  mode: all
                  excludedOuIds: ["acme-trial-customers"]
        "404":
          $ref: '#/components/responses/SharingPolicyNotFound'
        "403":
          $ref: '#/components/responses/SharingForbidden'
        "500":
          $ref: '#/components/responses/SharingServerError'

    put:
      tags:
        - User Sharing
      summary: Replace a sharing policy
      description: |
        Replaces the policy's sections. The request carries the `version` the caller believes it is
        editing; an edit against a stale version is refused rather than silently flattening another
        write.

        Each section is held to the rule on its own. A section that reaches a whole group (`mode:
        all`, or `allUnits`) keeps that reach: its exclusions can be added or removed, but it cannot
        be dropped or turned into one that names units. A section that names units may add or drop
        them or change their `reach`, and cannot become one that reaches a whole group. No edit may
        reach past an organization unit that has already shared the user on.

        This holds for `allUnits` and for `otherTreeRoots` with `mode: all` too, which a create may
        not state. A policy that was imported with one keeps it: restate the section here and
        rewrite its `excludedOuIds` to withhold units from it or hand them back. Editing a narrower
        policy into one of those is refused, so the edit cannot reach where the create could not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingPolicyUpdateRequest'
            examples:
              addAnExclusion:
                summary: Exclude one organization unit from every child unit
                value:
                  version: 1
                  childUnits:
                    mode: all
                    excludedOuIds: ["acme-trial-customers"]
              widenANamedUnit:
                summary: Carry the user on beneath a named child
                value:
                  version: 1
                  childUnits:
                    mode: selected
                    units:
                      - ouId: "acme-customer-a"
                        reach: subtree
              excludeFromAllUnits:
                summary: Rewrite the exclusions on an imported deployment-wide policy
                description: |
                  The section is restated, which is what lets its exclusions move. A create may not
                  state `allUnits`, and an edit may not introduce it.
                value:
                  version: 2
                  allUnits:
                    excludedOuIds: ["acme-trial-customers", "partner-sandbox"]
      responses:
        "200":
          description: Sharing policy replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingPolicy'
              example:
                id: "0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"
                initiatingOuId: "acme-root"
                stage: share
                isReadOnly: false
                version: 2
                childUnits:
                  mode: all
                  excludedOuIds: ["acme-trial-customers"]
        "400":
          $ref: '#/components/responses/SharingPolicyUpdateBadRequest'
        "404":
          $ref: '#/components/responses/SharingPolicyNotFound'
        "409":
          $ref: '#/components/responses/SharingPolicyConflict'
        "403":
          $ref: '#/components/responses/SharingForbidden'
        "500":
          $ref: '#/components/responses/SharingServerError'

    delete:
      tags:
        - User Sharing
      summary: Delete a sharing policy
      description: |
        Removes the policy and everything that depended on it: the policies its sharees issued, and
        the per-organization-unit state of every unit that loses sight of the user.

        A declared policy cannot be deleted here. Its existence belongs to the resource file that
        declares it, so it goes away by being removed from that file.
      responses:
        "204":
          description: |
            Sharing policy deleted, or the user holds no policy under that id.
        "400":
          $ref: '#/components/responses/SharingPolicyDeleteBadRequest'
        "404":
          $ref: '#/components/responses/SharingUserNotFound'
        "403":
          $ref: '#/components/responses/SharingForbidden'
        "500":
          $ref: '#/components/responses/SharingServerError'


  /users/{id}/overlay-rules:
    parameters:
      - $ref: '#/components/parameters/userIdPathParam'
    get:
      tags:
        - User Sharing
      summary: Overlay rules for an organization unit
      description: |
        Answers for one organization unit, named in the `ouId` query parameter: whether it owns the
        user, and which policies reached it.

        An organization unit no policy reaches answers `404`, because the user is not
        available there and so has no terms to resolve.
      parameters:
        - in: query
          name: ouId
          required: true
          description: The organization unit to resolve for.
          schema:
            type: string
          example: "acme-customer-a"
      responses:
        "200":
          description: Resolved overlay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedOverlay'
              examples:
                reached:
                  summary: An organization unit a policy reached
                  value:
                    ouId: "acme-customer-a"
                    owned: false
                    visible: true
                    policyIds: ["0195a2c0-6f3e-7a21-9f2a-2c4f8f1d9a10"]
                    rules: {}
                owner:
                  summary: The organization unit that owns the user
                  value:
                    ouId: "acme-root"
                    owned: true
                    visible: true
                    policyIds: []
                    rules: {}
        "400":
          $ref: '#/components/responses/OverlayRulesBadRequest'
        "404":
          $ref: '#/components/responses/OverlayNotResolvable'
        "403":
          $ref: '#/components/responses/SharingForbidden'
        "500":
          $ref: '#/components/responses/SharingServerError'

