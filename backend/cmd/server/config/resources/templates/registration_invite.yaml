handle: "self-registration-invite"
displayName: "Self Registration Invite Email"
channel: "email"
content:
  subject: "{{ t(notification:template.registration_title_prefix) }} {{ctx(appName)}}"
  body: |
    <!DOCTYPE html>
    <html>
    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #181818;">
      <h2>{{ t(notification:template.registration_title_prefix) }} {{ctx(appName)}}</h2>
      <p>{{ t(notification:template.registration_intro_prefix) }} <strong>{{ctx(appName)}}</strong>. {{ t(notification:template.registration_instructions) }}</p>
      <p><a href="{{ctx(inviteLink)}}" style="display: inline-block; padding: 10px 20px;
        background-color: #3a87ed; color: #fff; text-decoration: none;
        border-radius: 4px;">{{ t(notification:template.complete_registration) }}</a></p>
      <p>{{ t(notification:template.fallback_link_instructions) }}</p>
      <p><a href="{{ctx(inviteLink)}}">{{ctx(inviteLink)}}</a></p>
      <p>{{ t(notification:template.uninitiated_request_disclaimer) }}</p>
    </body>
    </html>
