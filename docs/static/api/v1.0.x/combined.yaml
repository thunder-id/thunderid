        group and role APIs

        to add the agent to groups or assign roles directly.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the agent
          example: 9a475e1e-b0cb-4b29-8df5-2e5b24fb0ed3
